services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: voip
      POSTGRES_USER: voip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ${VOIP_DATA_ROOT:-/data/voip}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voip -d voip"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${VOIP_DATA_ROOT:-/data/voip}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - ${VOIP_DATA_ROOT:-/data/voip}/minio:/data
    ports:
      - "9001:9001"

  backend:
    build:
      context: ./backend
    env_file: ${VOIP_APP_ENV_FILE:-.env}
    command: >-
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${VOIP_BACKEND_BIND:-0.0.0.0}:${VOIP_BACKEND_PORT:-8000}:8000"
    volumes:
      - ./profiles:/app/profiles:ro
      - ./rules:/app/rules:ro
      - ./knowledge:/app/knowledge:ro
      - ./tools:/tools:ro
      - /home/dev/secret.yaml:/home/dev/secret.yaml:ro
      - ${REPRODUCTION_CAPTURE_ROOT:-/tmp/voip-reproduction-capture}:/tmp/voip-reproduction-capture
      - ${REPRODUCTION_OBJECT_ROOT:-/tmp/voip-reproduction-objects}:/tmp/voip-reproduction-objects
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  collector-worker:
    build:
      context: ./backend
    env_file: ${VOIP_APP_ENV_FILE:-.env}
    command: celery -A app.workers.celery_app:celery_app worker -Q collector --loglevel=INFO --concurrency=4
    volumes:
      - ./profiles:/app/profiles:ro
      - ./rules:/app/rules:ro
      - ./knowledge:/app/knowledge:ro
      - /home/dev/secret.yaml:/home/dev/secret.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  packet-worker:
    build:
      context: ./backend
    env_file: ${VOIP_APP_ENV_FILE:-.env}
    command: celery -A app.workers.celery_app:celery_app worker -Q packet --loglevel=INFO --concurrency=2
    volumes:
      - ./profiles:/app/profiles:ro
      - ./rules:/app/rules:ro
      - ./knowledge:/app/knowledge:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  pcm-worker:
    build:
      context: ./backend
    env_file: ${VOIP_APP_ENV_FILE:-.env}
    command: celery -A app.workers.celery_app:celery_app worker -Q pcm --loglevel=INFO --concurrency=2
    volumes:
      - ./profiles:/app/profiles:ro
      - ./rules:/app/rules:ro
      - ./knowledge:/app/knowledge:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started


  media-worker:
    build:
      context: ./backend
    env_file: ${VOIP_APP_ENV_FILE:-.env}
    command: celery -A app.workers.celery_app:celery_app worker -Q media --loglevel=INFO --concurrency=2
    volumes:
      - ./profiles:/app/profiles:ro
      - ./rules:/app/rules:ro
      - ./knowledge:/app/knowledge:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started


  diagnosis-worker:
    build:
      context: ./backend
    env_file: ${VOIP_APP_ENV_FILE:-.env}
    command: celery -A app.workers.celery_app:celery_app worker -Q diagnosis --loglevel=INFO --concurrency=2
    volumes:
      - ./profiles:/app/profiles:ro
      - ./rules:/app/rules:ro
      - ./knowledge:/app/knowledge:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  reproduction-worker:
    build:
      context: ./backend
    env_file: ${VOIP_APP_ENV_FILE:-.env}
    command: >-
      sh -c "ln -sfn /app/profiles /profiles &&
      celery -A app.workers.celery_app:celery_app worker -Q reproduction --loglevel=INFO --concurrency=2"
    volumes:
      - ./profiles:/app/profiles:ro
      - ./rules:/app/rules:ro
      - ./knowledge:/app/knowledge:ro
      - /home/dev/secret.yaml:/home/dev/secret.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    ports:
      - "${VOIP_FRONTEND_BIND:-0.0.0.0}:${VOIP_FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
