name: TEMP Production Runtime Readonly Verify

on:
  push:
    branches:
      - ops/deploy-eb26f18-20260902

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, linux]
    timeout-minutes: 2
    steps:
      - name: Inspect live runtime revisions
        shell: bash
        run: |
          set -euo pipefail
          echo "BACKEND_READY=$(curl -fsS http://127.0.0.1:18001/health/ready)"
          for svc in backend diagnosis-worker media-worker packet-worker pcm-worker feishu-long-connection; do
            cid="$(docker ps -q \
              --filter 'label=com.docker.compose.project=aivoip' \
              --filter "label=com.docker.compose.service=$svc" | head -n1)"
            test -n "$cid"
            rev="$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$cid" \
              | awk -F= '$1=="BUILD_REVISION"{print substr($0,index($0,"=")+1);exit}')"
            health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$cid")"
            echo "$svc revision=$rev health=$health"
          done
          echo "RUNTIME_READONLY_VERIFY_DONE=1"
