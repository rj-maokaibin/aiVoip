name: TEMP Production ACL Tool Probe

on:
  push:
    branches:
      - ops/deploy-eb26f18-20260902

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, linux]
    timeout-minutes: 2
    steps:
      - name: Probe ACL tooling
        shell: bash
        run: |
          set +e
          echo "RUNNER=$(id -un)"
          command -v setfacl; echo "SETFACL_RC=$?"
          command -v getfacl; echo "GETFACL_RC=$?"
          test -r /etc/voip-ai/production.env; echo "PROD_ENV_READ_RC=$?"
          test -w /etc/voip-ai/production.env; echo "PROD_ENV_WRITE_RC=$?"
          test -w /data/voip/release; echo "RELEASE_WRITE_RC=$?"
          test -w /data/voip/backups; echo "BACKUP_WRITE_RC=$?"
          docker ps >/dev/null 2>&1; echo "DOCKER_RC=$?"
          exit 0
