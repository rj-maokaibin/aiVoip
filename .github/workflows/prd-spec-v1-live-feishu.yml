name: Grant Feishu Reader Access
on:
  pull_request:
    branches: [feat/prd-spec-v1-alignment]
permissions:
  contents: read
jobs:
  grant-reader:
    runs-on: [self-hosted, linux, x64, voip-controlled-linux]
    timeout-minutes: 10
    env:
      DOCUMENT_TOKEN: RFtmdjLNRo1SaBxXBugcpLgdnvb
    steps:
      - name: Grant configured reader view access and verify
        shell: bash
        run: |
          set -euo pipefail
          test -f /home/github-runner/.config/voip-ai/.env
          test -f /home/github-runner/.config/voip-ai/feishu_app_secret
          set -a; source /home/github-runner/.config/voip-ai/.env; set +a
          export FEISHU_APP_SECRET_FILE=/home/github-runner/.config/voip-ai/feishu_app_secret
          reader="${FEISHU_READER_OPEN_ID:-${FEISHU_TEST_READER_OPEN_ID:-${FEISHU_VIEWER_OPEN_ID:-}}}"
          if [ -z "$reader" ] && [ -f /home/github-runner/.config/voip-ai/feishu_reader_open_id ]; then reader="$(tr -d '\r\n ' < /home/github-runner/.config/voip-ai/feishu_reader_open_id)"; fi
          test -n "$reader" || { echo FEISHU_READER_ID_NOT_CONFIGURED; exit 2; }
          export FEISHU_PERMISSION_READER="$reader"
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          base=os.environ.get('FEISHU_BASE_URL','https://open.feishu.cn/open-apis').rstrip('/')
          with open(os.environ['FEISHU_APP_SECRET_FILE'],'r',encoding='utf-8') as f: secret=f.read().strip()
          def call(method,url,payload=None,token=None):
              data=None if payload is None else json.dumps(payload).encode()
              headers={'Content-Type':'application/json'}
              if token: headers['Authorization']='Bearer '+token
              with urllib.request.urlopen(urllib.request.Request(url,data=data,headers=headers,method=method),timeout=30) as r:
                  raw=r.read()
              return json.loads(raw.decode()) if raw else {}
          auth=call('POST',base+'/auth/v3/tenant_access_token/internal',{'app_id':os.environ['FEISHU_APP_ID'],'app_secret':secret})
          token=auth['tenant_access_token']; reader=os.environ['FEISHU_PERMISSION_READER']; doc=os.environ['DOCUMENT_TOKEN']
          call('POST',base+'/drive/v1/permissions/'+urllib.parse.quote(doc,safe='')+'/members?type=docx&need_notification=false',{'member_type':'openid','member_id':reader,'perm':'view'},token)
          data=call('GET',base+'/drive/v1/permissions/'+urllib.parse.quote(doc,safe='')+'/members?type=docx',token=token)
          items=(data.get('data') or {}).get('items') or []
          assert any(str(x.get('member_id') or '')==reader and str(x.get('perm') or '').lower() in {'view','edit','full_access'} for x in items), 'READER_PERMISSION_VERIFY_FAILED'
          print('DOCUMENT_READER_ACCESS=PASS')
          PY
