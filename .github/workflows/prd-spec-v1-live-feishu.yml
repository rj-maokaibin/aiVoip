name: PRD SPEC V1 Live Feishu Living Document

on:
  pull_request:
    branches:
      - feat/prd-spec-v1-alignment

permissions:
  contents: read

jobs:
  live-feishu-living-document:
    runs-on: [self-hosted, linux, x64, voip-controlled-linux]
    timeout-minutes: 45
    env:
      PRODUCT_HEAD: fdf8781876e7c247d2c33b7569bfc64d5531fddc
      OFFLINE_GOLDEN_PCAP: /tmp/tcpdump-2026-08-14.pcap
      OFFLINE_GOLDEN_SHA256: b038aa7c9a0644581f2815f654fcdee4620860796382265b178823fccba2e3f0
    steps:
      - name: Checkout exact accepted product head
        uses: actions/checkout@v4
        with:
          ref: fdf8781876e7c247d2c33b7569bfc64d5531fddc
          fetch-depth: 1

      - name: Stage prepared PCAP and exact TShark 4.2.2
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_HEAD"
          fixture="$OFFLINE_GOLDEN_PCAP"
          if [ ! -r "$fixture" ]; then
            fixture="$RUNNER_TEMP/offline-e2e-prepared.pcap"
            rm -f "$fixture"
            docker run --rm -v /tmp:/source:ro -v "$RUNNER_TEMP":/output --entrypoint sh postgres:16 \
              -c "cp /source/tcpdump-2026-08-14.pcap /output/offline-e2e-prepared.pcap && chmod 0644 /output/offline-e2e-prepared.pcap"
          fi
          test -r "$fixture"
          test "$(sha256sum "$fixture" | awk '{print $1}')" = "$OFFLINE_GOLDEN_SHA256"
          echo "OFFLINE_GOLDEN_PCAP=$fixture" >> "$GITHUB_ENV"

          root="$RUNNER_TEMP/tshark-root"; debs="$RUNNER_TEMP/tshark-debs"
          rm -rf "$root" "$debs"; mkdir -p "$root" "$debs"; cd "$debs"
          mapfile -t pkgs < <(apt-cache depends --recurse --no-recommends --no-suggests --no-conflicts --no-breaks --no-replaces --no-enhances tshark | awk '/^[^ <][^:]*$/ {print $1}' | sort -u)
          miss=(); for p in "${pkgs[@]}"; do dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -q 'install ok installed' || miss+=("$p"); done
          [ ${#miss[@]} -eq 0 ] || apt-get download "${miss[@]}"
          shopt -s nullglob; for d in ./*.deb; do dpkg-deb -x "$d" "$root"; done
          tshark_bin="$RUNNER_TEMP/tshark-userspace"
          printf '#!/bin/bash\nexport LD_LIBRARY_PATH="%s/usr/lib/x86_64-linux-gnu:%s/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"\nexport WIRESHARK_DATA_DIR="%s/usr/share/wireshark"\nexec "%s/usr/bin/tshark" "$@"\n' "$root" "$root" "$root" "$root" > "$tshark_bin"
          chmod +x "$tshark_bin"
          version="$($tshark_bin -v | head -n1)"; printf 'TSHARK=%s\n' "$version"; [[ "$version" == *"4.2.2"* ]]
          echo "TSHARK_BINARY=$tshark_bin" >> "$GITHUB_ENV"

          cd "$GITHUB_WORKSPACE"
          venv="$RUNNER_TEMP/voip-ai-live-feishu-v1"; rm -rf "$venv"; python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -r backend/requirements.txt >/dev/null
          echo "LIVE_FEISHU_VENV=$venv" >> "$GITHUB_ENV"

      - name: Live Feishu two-projection replacement and media byte verification
        shell: bash
        run: |
          set -euo pipefail
          test -f /home/github-runner/.config/voip-ai/.env
          test -f /home/github-runner/.config/voip-ai/feishu_app_secret
          set -a; source /home/github-runner/.config/voip-ai/.env; set +a
          export FEISHU_APP_SECRET_FILE=/home/github-runner/.config/voip-ai/feishu_app_secret
          export PYTHONPATH=backend
          "$LIVE_FEISHU_VENV/bin/python" - <<'PY'
          import asyncio, hashlib, json, os, uuid
          from dataclasses import dataclass
          from datetime import datetime, timezone
          from pathlib import Path
          from types import SimpleNamespace
          from urllib.parse import quote
          import httpx

          import app.integrations.feishu.evidence_document as edm
          from app.core.config import settings
          from app.db.evidence_report_models import FeishuEvidenceDocumentBinding
          from app.golden.offline_analysis_e2e import build_offline_analysis_bundle
          from app.integrations.feishu.evidence_document import FeishuEvidenceDocumentService
          from app.integrations.feishu.transport import FeishuLiveTransport

          HEAD=os.environ['PRODUCT_HEAD']; PCAP=Path(os.environ['OFFLINE_GOLDEN_PCAP']); TSHARK=os.environ['TSHARK_BINARY']
          OUT=Path('validation/live_feishu_living_document'); OUT.mkdir(parents=True,exist_ok=True)
          RESULT=OUT/'live_feishu_living_validation.json'
          assert settings.feishu_app_id
          print('FEISHU_CREDENTIAL_REFERENCE=AVAILABLE')

          bundle=build_offline_analysis_bundle(pcap_path=PCAP,pcm_profile_path='profiles/pcm/ruijie_aim_diag_v1.yaml',output_dir=OUT/'analysis',tshark_binary=TSHARK)
          assert bundle['source']['sha256']==os.environ['OFFLINE_GOLDEN_SHA256']
          pngs=sorted((OUT/'analysis').rglob('*.png')); wavs=sorted((OUT/'analysis').rglob('*.wav'))
          print(f'PRODUCTION_GENERATED_MEDIA=PNG:{len(pngs)} WAV:{len(wavs)}')
          assert len(pngs)>=2, [str(x) for x in pngs]
          assert len(wavs)>=3, [str(x) for x in wavs]
          selected=pngs[:2]+wavs[:3]
          for p in selected:
              data=p.read_bytes(); assert len(data)>1000,(p.name,len(data))
              if p.suffix.lower()=='.wav': assert data[:4]==b'RIFF' and data[8:12]==b'WAVE',p.name

          @dataclass
          class Artifact:
              id:str; type:str; filename:str; object_key:str; size_bytes:int; content_type:str; created_at:datetime
          blob={}; artifacts=[]
          for i,p in enumerate(selected):
              data=p.read_bytes(); key=f'live/{i}/{p.name}'; blob[key]=data
              if p.suffix.lower()=='.png':
                  atype='SPECTROGRAM_PNG' if 'spectrogram' in p.name.lower() else 'WAVEFORM_PNG'; ctype='image/png'
              else: atype='AUDIO_CLIP'; ctype='audio/wav'
              artifacts.append(Artifact(f'LIVE-ART-{i}',atype,p.name,key,len(data),ctype,datetime.now(timezone.utc)))
          class Storage:
              def get_bytes(self,key): return blob[key]

          case_id=f'live-case-{uuid.uuid4().hex[:12]}'; report_id=f'live-report-{uuid.uuid4().hex[:12]}'
          case=SimpleNamespace(id=case_id,case_no=f'LIVE-FEISHU-{uuid.uuid4().hex[:8].upper()}')
          payload=bundle['report']; payload['generated_at']=datetime.now(timezone.utc).isoformat()
          report=SimpleNamespace(id=report_id,case_id=case_id,snapshot_json=payload,version=1,status='COMPLETE',scope_type='CASE',scope_id=case_id,created_at=datetime.now(timezone.utc))

          class DB:
              def __init__(self): self.binding=None; self.rows=[]
              def get(self,model,key):
                  n=getattr(model,'__name__','')
                  if n=='Case' and key==case_id:return case
                  if n=='PreliminaryEvidenceReport' and key==report_id:return report
              def scalar(self,_): return self.binding
              def scalars(self,_): return []
              def add(self,row):
                  self.rows.append(row)
                  if isinstance(row,FeishuEvidenceDocumentBinding):
                      self.binding=row; row.id=row.id or str(uuid.uuid4()); row.projection_version=0 if row.projection_version is None else row.projection_version
              def flush(self):
                  if self.binding:
                      self.binding.id=self.binding.id or str(uuid.uuid4()); self.binding.projection_version=0 if self.binding.projection_version is None else self.binding.projection_version
          edm.report_artifacts=lambda _db,_rid:artifacts

          class Service(FeishuEvidenceDocumentService):
              def __init__(self,**kw): super().__init__(**kw); self.uploads=[]
              async def _upload_media(self,*,block_id,filename,data,parent_type):
                  token=await super()._upload_media(block_id=block_id,filename=filename,data=data,parent_type=parent_type)
                  self.uploads.append({'block_id':block_id,'filename':filename,'data':data,'token':token,'parent_type':parent_type}); return token

          def text(block):
              for k in ('text','heading1','heading2','heading3','bullet'):
                  body=block.get(k)
                  if body:return ''.join(str((e.get('text_run') or {}).get('content') or '') for e in body.get('elements') or [])
              return ''

          async def children(t,doc):
              out=[]; page=None
              while True:
                  params={'page_size':'50'}
                  if page:params['page_token']=page
                  r=await t._request('GET',f'/docx/v1/documents/{quote(doc,safe="")}/blocks/{quote(doc,safe="")}/children',params=params)
                  d=r.get('data') or {}; out.extend(d.get('items') or d.get('children') or [])
                  if not d.get('has_more'):return out
                  page=d.get('page_token'); assert page

          async def media_check(t,doc,rec):
              r=await t._request('GET',f'/docx/v1/documents/{quote(doc,safe="")}/blocks/{quote(rec["block_id"],safe="")}')
              b=(r.get('data') or {}).get('block') or {}
              if rec['parent_type']=='docx_image': remote=(b.get('image') or {}).get('token')
              else:
                  f=b.get('file') or {}; remote=f.get('token'); name=f.get('name')
                  if name: assert name==rec['filename'],(name,rec['filename'])
              assert remote==rec['token'],rec['filename']
              tenant=await t._tenant_token(); url=settings.feishu_base_url.rstrip('/')+f'/drive/v1/medias/{quote(rec["token"],safe="")}/download'
              async with httpx.AsyncClient(timeout=settings.feishu_timeout_seconds) as c: dl=await c.get(url,headers={'Authorization':f'Bearer {tenant}'})
              dl.raise_for_status(); assert dl.content==rec['data'],(rec['filename'],len(dl.content),len(rec['data']))
              return {'filename':rec['filename'],'size_bytes':len(rec['data']),'sha256':hashlib.sha256(rec['data']).hexdigest(),'block_token_verified':True,'download_byte_equal':True}

          def save(obj): RESULT.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          async def main():
              db=DB(); t=FeishuLiveTransport(); s=Service(transport=t,storage=Storage())
              first=await s.project(db,case_id=case_id,report_id=report_id); doc=first.document_id; assert doc
              m1=dict(first.metadata_json or {}); c1=int(m1.get('projection_root_block_count') or 0); assert first.projection_version==1 and c1>0 and m1.get('migration_mode')=='INITIAL'
              r1=await children(t,doc); assert len(r1)==c1,(len(r1),c1)
              save({'status':'RUNNING_AFTER_FIRST','exact_product_head':HEAD,'document_url':first.document_url,'first_root_block_count':c1})

              sentinel=f'MANUAL-SENTINEL-{uuid.uuid4().hex}'
              await s._insert_blocks(doc,[s._text(sentinel)],index=c1)
              rs=await children(t,doc); assert len(rs)==c1+1 and sum(text(x)==sentinel for x in rs)==1
              first_uploads=len(s.uploads); assert first_uploads==5,first_uploads

              report.version=2; report.snapshot_json=dict(report.snapshot_json); report.snapshot_json['generated_at']=datetime.now(timezone.utc).isoformat(); report.snapshot_json['headline']=str(report.snapshot_json.get('headline') or '')+'｜LIVE SECOND PROJECTION'
              second=await s.project(db,case_id=case_id,report_id=report_id); m2=dict(second.metadata_json or {}); c2=int(m2.get('projection_root_block_count') or 0)
              assert second.document_id==doc and second.projection_version==2 and c2>0 and m2.get('migration_mode')=='TRACKED_REPLACE'
              r2=await children(t,doc); tx=[text(x) for x in r2]
              assert len(r2)==c2+1,(len(r2),c2); assert tx.count(sentinel)==1; assert tx.count('0. 当前状态 / 快速导航')==1; assert tx.count('1. 当前初步结论')==1; assert any('LIVE SECOND PROJECTION' in x for x in tx)
              assert len(s.uploads)==10,len(s.uploads)
              media=[await media_check(t,doc,x) for x in s.uploads[first_uploads:]]; assert len(media)==5
              result={'schema_version':'prd-spec-v1-live-feishu-living-validation-v1','status':'PASS','exact_product_head':HEAD,'source_pcap_sha256':bundle['source']['sha256'],'document_url':second.document_url,'living_document_contract':m2.get('living_document_contract'),'first_projection':{'version':1,'root_block_count':c1,'media_count':first_uploads,'migration_mode':m1.get('migration_mode')},'second_projection':{'version':2,'root_block_count':c2,'root_children_including_manual_sentinel':len(r2),'manual_sentinel_preserved_once':True,'system_section_zero_count':tx.count('0. 当前状态 / 快速导航'),'system_section_one_count':tx.count('1. 当前初步结论'),'migration_mode':m2.get('migration_mode')},'media':media}
              save(result)
              print(json.dumps({'status':'PASS','exact_product_head':HEAD,'document_url':second.document_url,'first_root_blocks':c1,'second_root_blocks':c2,'manual_sentinel_preserved_once':True,'media_byte_verified':5},ensure_ascii=False,indent=2))
          asyncio.run(main())
          PY

      - name: Upload live Feishu validation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prd-spec-v1-live-feishu-living-validation
          path: validation/live_feishu_living_document/live_feishu_living_validation.json
          if-no-files-found: warn
