name: Inspect Feishu Identity Config Names
on:
  pull_request:
    branches: [feat/prd-spec-v1-alignment]
permissions:
  contents: read
jobs:
  inspect-identity-config:
    runs-on: [self-hosted, linux, x64, voip-controlled-linux]
    timeout-minutes: 5
    steps:
      - name: Show Feishu-related variable names only
        shell: bash
        run: |
          set -euo pipefail
          test -f /home/github-runner/.config/voip-ai/.env
          set -a; source /home/github-runner/.config/voip-ai/.env; set +a
          env | sed 's/=.*//' | grep '^FEISHU' | sort -u
          printf 'RUNNER_CONFIG_FILES:\n'
          find /home/github-runner/.config/voip-ai -maxdepth 1 -type f -printf '%f\n' | sort | grep -E '^feishu|^\.env$' || true
