name: Grant Feishu Reader Access
on:
  pull_request:
    branches: [feat/prd-spec-v1-alignment]
permissions:
  contents: read
jobs:
  grant-reader:
    runs-on: [self-hosted, linux, x64, voip-controlled-linux]
    timeout-minutes: 10
    env:
      DOCUMENT_TOKEN: RFtmdjLNRo1SaBxXBugcpLgdnvb
      TARGET_OPENID_SHA256: 5a8d6e0ba24701f0dedc169a74279ab12bb4da8d8f87a7929dbaf6d1a060260c
    steps:
      - name: Resolve exact reader, grant current doc view, verify
        shell: bash
        run: |
          set -euo pipefail
          test -f /home/github-runner/.config/voip-ai/.env
          test -f /home/github-runner/.config/voip-ai/feishu_app_secret
          set -a; source /home/github-runner/.config/voip-ai/.env; set +a
          export FEISHU_APP_SECRET_FILE=/home/github-runner/.config/voip-ai/feishu_app_secret
          test "${FEISHU_RECEIVE_ID_TYPE:-}" = "chat_id" || { echo EXPECTED_CHAT_ID_CONFIG; exit 2; }
          python3 - <<'PY'
          import hashlib, json, os, urllib.parse, urllib.request, urllib.error

          base=os.environ.get('FEISHU_BASE_URL','https://open.feishu.cn/open-apis').rstrip('/')
          doc=os.environ['DOCUMENT_TOKEN'].strip()
          target_hash=os.environ['TARGET_OPENID_SHA256'].strip().lower()
          with open(os.environ['FEISHU_APP_SECRET_FILE'],'r',encoding='utf-8') as f:
              secret=f.read().strip()

          def call(method,url,payload=None,token=None):
              data=None if payload is None else json.dumps(payload).encode()
              headers={'Content-Type':'application/json'}
              if token:
                  headers['Authorization']='Bearer '+token
              req=urllib.request.Request(url,data=data,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read()
              except urllib.error.HTTPError as e:
                  raw=e.read()
                  out=json.loads(raw.decode()) if raw else {'code':e.code}
                  raise RuntimeError(f'FEISHU_HTTP_{e.code}:{out.get("code")}:{out.get("msg")}')
              return json.loads(raw.decode()) if raw else {}

          auth=call('POST',base+'/auth/v3/tenant_access_token/internal',{
              'app_id':os.environ['FEISHU_APP_ID'],
              'app_secret':secret,
          })
          token=auth['tenant_access_token']
          chat=os.environ['FEISHU_DEFAULT_RECEIVE_ID']
          members=call(
              'GET',
              base+'/im/v1/chats/'+urllib.parse.quote(chat,safe='')+'/members?member_id_type=open_id&page_size=100',
              token=token,
          )
          items=(members.get('data') or {}).get('items') or []
          ids=[]
          for item in items:
              mid=str(item.get('member_id') or item.get('open_id') or '').strip()
              if mid.startswith('ou_') and mid not in ids:
                  ids.append(mid)
          matched=[x for x in ids if hashlib.sha256(x.encode()).hexdigest()==target_hash]
          print('TARGET_READER_MATCH_COUNT='+str(len(matched)))
          assert len(matched)==1, 'TARGET_READER_NOT_UNIQUELY_RESOLVED'
          reader=matched[0]

          def permission_entries():
              result=call(
                  'GET',
                  base+'/drive/v1/permissions/'+urllib.parse.quote(doc,safe='')+'/members?type=docx&page_size=100',
                  token=token,
              )
              data=result.get('data') or {}
              return data.get('items') or data.get('members') or []

          def current_perm():
              for item in permission_entries():
                  if str(item.get('member_id') or '')==reader:
                      return str(item.get('perm') or '').lower()
              return ''

          before=current_perm()
          if before not in {'view','edit','full_access'}:
              endpoint=(
                  base+'/drive/v1/permissions/'+urllib.parse.quote(doc,safe='')
                  +'/members?type=docx&need_notification=false'
              )
              result=call('POST',endpoint,{
                  'member_type':'openid',
                  'member_id':reader,
                  'perm':'view',
              },token)
              assert result.get('code',0)==0, f'GRANT_FAILED:{result.get("code")}:{result.get("msg")}'

          after=current_perm()
          assert after in {'view','edit','full_access'}, 'READER_PERMISSION_VERIFY_FAILED'
          print('DOCUMENT_READER_ACCESS=PASS')
          print('EFFECTIVE_PERMISSION='+after)
          PY
