name: Evidence V2 Manifest Helper

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: evidence-v2-manifest-helper-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh-manifest:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - name: Refresh canonical source manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/source_manifest_gate.py --update
          python3 tools/source_manifest_gate.py
          if git diff --quiet -- release/source_manifest.json; then
            echo "SOURCE_MANIFEST_REFRESH=NO_CHANGE"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/source_manifest.json
          git commit -m "chore: refresh Evidence V2 source manifest"
          git push origin "HEAD:${{ github.head_ref }}"
          echo "SOURCE_MANIFEST_REFRESH=PASS"
