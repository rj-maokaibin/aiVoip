name: Real DUT SIP Registration A-B-A Live Gate

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: real-dut-sip-registration-aba-live
  cancel-in-progress: false

jobs:
  real-sip-registration-aba:
    if: >-
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/run-real-sip-aba ')
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 30
    env:
      REAL_LIVE_MUTATION: EXPLICIT_ONLY
      REPRODUCTION_PLATFORM_MODE: real
      SIP_ABA_ENV_FILE: /home/github-runner/.config/voip-ai/.env
      SIP_ABA_VENV: /tmp/voip-ai-real-sip-aba-${{ github.run_id }}-${{ github.run_attempt }}
      SIP_ABA_OUTPUT_ROOT: /tmp/voip-ai-real-sip-aba-evidence-${{ github.run_id }}-${{ github.run_attempt }}
      SIP_ABA_RUNTIME_ROOT: /tmp/voip-ai-real-sip-aba-runtime-${{ github.run_id }}-${{ github.run_attempt }}
      SIP_ABA_PHASE_SECONDS_DEFAULT: '75'

    steps:
      - name: Checkout exact master
        uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          ref: master

      - name: Authorize exact master SHA
        shell: bash
        env:
          TRIGGER_BODY: ${{ github.event.comment.body }}
          TRIGGER_ACTOR: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          expected="/run-real-sip-aba ${head_sha}"
          test "$TRIGGER_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          if [ "$TRIGGER_BODY" != "$expected" ]; then
            printf 'Refusing stale or malformed live trigger. expected=%s\n' "$expected" >&2
            exit 64
          fi
          printf 'LIVE_GATE_MASTER_SHA=%s\n' "$head_sha"
          printf 'LIVE_GATE_TRIGGER_ACTOR=%s\n' "$TRIGGER_ACTOR"

      - name: Prepare isolated Python and TShark runtime
        shell: bash
        run: |
          set -euo pipefail
          test -r "$SIP_ABA_ENV_FILE"
          rm -rf "$SIP_ABA_VENV" "$SIP_ABA_RUNTIME_ROOT" "$SIP_ABA_OUTPUT_ROOT"
          mkdir -p "$SIP_ABA_RUNTIME_ROOT" "$SIP_ABA_OUTPUT_ROOT"
          chmod 0700 "$SIP_ABA_RUNTIME_ROOT"
          python3 -m venv "$SIP_ABA_VENV"
          "$SIP_ABA_VENV/bin/pip" install --disable-pip-version-check -q -r backend/requirements.txt
          if command -v tshark >/dev/null 2>&1; then
            tshark_bin="$(command -v tshark)"
          else
            root="$RUNNER_TEMP/tshark-root-sip-aba"
            debs="$RUNNER_TEMP/tshark-debs-sip-aba"
            rm -rf "$root" "$debs"
            mkdir -p "$root" "$debs"
            cd "$debs"
            mapfile -t pkgs < <(apt-cache depends --recurse --no-recommends --no-suggests --no-conflicts --no-breaks --no-replaces --no-enhances tshark | awk '/^[^ <][^:]*$/ {print $1}' | sort -u)
            miss=()
            for p in "${pkgs[@]}"; do
              dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -q 'install ok installed' || miss+=("$p")
            done
            [ ${#miss[@]} -eq 0 ] || apt-get download "${miss[@]}"
            shopt -s nullglob
            for d in ./*.deb; do dpkg-deb -x "$d" "$root"; done
            tshark_bin="$RUNNER_TEMP/tshark-userspace-sip-aba"
            printf '#!/bin/bash\nexport LD_LIBRARY_PATH="%s/usr/lib/x86_64-linux-gnu:%s/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"\nexport WIRESHARK_DATA_DIR="%s/usr/share/wireshark"\nexec "%s/usr/bin/tshark" "$@"\n' "$root" "$root" "$root" "$root" > "$tshark_bin"
            chmod +x "$tshark_bin"
          fi
          "$tshark_bin" -v | head -n1
          printf 'TSHARK_BINARY=%s\n' "$tshark_bin" >> "$GITHUB_ENV"

      - name: Resolve live DB and exactly one eligible DUT
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$SIP_ABA_ENV_FILE"
          set +a
          export PYTHONPATH="$GITHUB_WORKSPACE/backend"
          "$SIP_ABA_VENV/bin/python" tools/resolve_real_sip_aba_database_env.py > "$SIP_ABA_RUNTIME_ROOT/production_db.env"
          chmod 0600 "$SIP_ABA_RUNTIME_ROOT/production_db.env"
          set -a
          source "$SIP_ABA_RUNTIME_ROOT/production_db.env"
          set +a
          "$SIP_ABA_VENV/bin/python" tools/resolve_real_sip_aba_context.py \
            --output-root "$SIP_ABA_OUTPUT_ROOT" \
            --runtime-root "$SIP_ABA_RUNTIME_ROOT"

      - name: Resolve Production SSH credential
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$SIP_ABA_RUNTIME_ROOT/production_db.env"
          source "$SIP_ABA_RUNTIME_ROOT/db_runtime.env"
          source "$SIP_ABA_RUNTIME_ROOT/resolved_dut.env"
          set +a
          export PYTHONPATH="$GITHUB_WORKSPACE/backend"
          credential_file="$SIP_ABA_RUNTIME_ROOT/credential.env"
          "$SIP_ABA_VENV/bin/python" tools/resolve_real_sip_aba_credential_env.py \
            --container "$SIP_ABA_PRODUCTION_CREDENTIAL_CONTAINER" \
            --expected-provider "$SIP_ABA_PRODUCTION_CREDENTIAL_PROVIDER" \
            --sn "$DEVICE_SN" \
            --ip "$DEVICE_HOST" \
            --product "$DEVICE_MODEL" \
            --fallback-user "$DEVICE_USER" \
            --output "$credential_file"
          test -s "$credential_file"
          test "$(stat -c '%a' "$credential_file")" = "600"
          echo 'SIP_ABA_PRODUCTION_CREDENTIAL_RESOLUTION=PASS'

      - name: Execute real A1 B A2 with mandatory cleanup
        id: aba
        shell: bash
        run: |
          set -uo pipefail
          set -a
          source "$SIP_ABA_ENV_FILE"
          source "$SIP_ABA_RUNTIME_ROOT/db_runtime.env"
          source "$SIP_ABA_RUNTIME_ROOT/resolved_dut.env"
          source "$SIP_ABA_RUNTIME_ROOT/credential.env"
          set +a
          export PYTHONPATH="$GITHUB_WORKSPACE/backend"
          export REAL_LIVE_MUTATION=EXPLICIT_ONLY
          export REPRODUCTION_PLATFORM_MODE=real
          export TSHARK_BINARY="$TSHARK_BINARY"
          phase_seconds="${SIP_ABA_PHASE_SECONDS:-$SIP_ABA_PHASE_SECONDS_DEFAULT}"
          trigger_command="${SIP_ABA_REGISTRATION_TRIGGER_COMMAND:-}"
          serial_command='v="$(uci -q get sysinfo.@sysinfo[0].serial_num 2>/dev/null || true)"; [ -n "$v" ] || v="$(uci -q get sysinfo.@sysinfo[0].serial_number 2>/dev/null || true)"; [ -n "$v" ] || v="$(uci -q get sysinfo.@sysinfo[0].sn 2>/dev/null || true)"; [ -n "$v" ] || v="$(uci -q get sysinfo.@sysinfo[0].serial 2>/dev/null || true)"; [ -n "$v" ] || exit 44; printf "%s\\n" "$v"'
          version_command='uci -q get sysinfo.@sysinfo[0].software_version'
          args=(
            -m app.capture_v2.gate.cli sip-registration-aba
            --device-id "$DEVICE_ID"
            --model "$DEVICE_MODEL"
            --host "$DEVICE_HOST"
            --port "$DEVICE_PORT"
            --username "$SIP_ABA_SSH_USERNAME"
            --password-env "ENV:SIP_ABA_SSH_PASSWORD"
            --reproduction-session-id AUTO_NEW
            --worker-id "github-real-sip-aba-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            --gate-id SIP-REGISTRATION-ABA
            --phase-seconds "$phase_seconds"
            --sip-transport "${SIP_ABA_SIP_TRANSPORT:-udp}"
            --serial-command "$serial_command"
            --software-version-command "$version_command"
            --profile-root "$GITHUB_WORKSPACE/profiles"
            --output-root "$SIP_ABA_OUTPUT_ROOT"
            --allow-live-mutation
          )
          case "$DEVICE_PLATFORM" in
            mt7621|mt7981) args+=(--platform-id "$DEVICE_PLATFORM") ;;
          esac
          if [ -n "$trigger_command" ]; then args+=(--registration-trigger-command "$trigger_command"); fi
          set +e
          "$SIP_ABA_VENV/bin/python" "${args[@]}" 2>&1 | tee "$SIP_ABA_OUTPUT_ROOT/cli-output.log"
          rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$rc" > "$SIP_ABA_OUTPUT_ROOT/exit_code.txt"
          printf 'REAL_SIP_ABA_EXIT_CODE=%s\n' "$rc" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Upload immutable A-B-A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-sip-registration-aba-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.SIP_ABA_OUTPUT_ROOT }}
          if-no-files-found: warn
          retention-days: 30

      - name: Remove runtime secrets
        if: always()
        shell: bash
        run: |
          rm -rf "$SIP_ABA_RUNTIME_ROOT"
