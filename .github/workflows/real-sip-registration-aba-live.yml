name: Real DUT SIP Registration A-B-A Live Gate

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: real-dut-sip-registration-aba-live
  cancel-in-progress: false

jobs:
  real-sip-registration-aba:
    if: >-
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/run-real-sip-aba ')
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 30
    env:
      REAL_LIVE_MUTATION: EXPLICIT_ONLY
      REPRODUCTION_PLATFORM_MODE: real
      SIP_ABA_ENV_FILE: /home/github-runner/.config/voip-ai/.env
      SIP_ABA_VENV: /tmp/voip-ai-real-sip-aba-${{ github.run_id }}-${{ github.run_attempt }}
      SIP_ABA_OUTPUT_ROOT: /tmp/voip-ai-real-sip-aba-evidence-${{ github.run_id }}-${{ github.run_attempt }}
      SIP_ABA_RUNTIME_ROOT: ${{ runner.temp }}/voip-ai-real-sip-aba-runtime-${{ github.run_id }}-${{ github.run_attempt }}
      SIP_ABA_PHASE_SECONDS_DEFAULT: '75'
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Authorize exact master SHA
        shell: bash
        env:
          TRIGGER_BODY: ${{ github.event.comment.body }}
          TRIGGER_ACTOR: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          expected="/run-real-sip-aba ${head_sha}"
          test "$TRIGGER_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          if [ "$TRIGGER_BODY" != "$expected" ]; then
            printf 'Refusing stale or malformed live trigger. expected=%s\n' "$expected" >&2
            exit 64
          fi
          printf 'LIVE_GATE_MASTER_SHA=%s\n' "$head_sha"
          printf 'LIVE_GATE_TRIGGER_ACTOR=%s\n' "$TRIGGER_ACTOR"

      - name: Prepare isolated Python and TShark runtime
        shell: bash
        run: |
          set -euo pipefail
          test -r "$SIP_ABA_ENV_FILE"
          rm -rf "$SIP_ABA_VENV" "$SIP_ABA_RUNTIME_ROOT" "$SIP_ABA_OUTPUT_ROOT"
          mkdir -p "$SIP_ABA_RUNTIME_ROOT" "$SIP_ABA_OUTPUT_ROOT"
          chmod 0700 "$SIP_ABA_RUNTIME_ROOT"
          python3 -m venv "$SIP_ABA_VENV"
          "$SIP_ABA_VENV/bin/pip" install --disable-pip-version-check -q -r backend/requirements.txt

          if command -v tshark >/dev/null 2>&1; then
            tshark_bin="$(command -v tshark)"
          else
            root="$RUNNER_TEMP/tshark-root-sip-aba"
            debs="$RUNNER_TEMP/tshark-debs-sip-aba"
            rm -rf "$root" "$debs"
            mkdir -p "$root" "$debs"
            cd "$debs"
            mapfile -t pkgs < <(apt-cache depends --recurse --no-recommends --no-suggests --no-conflicts --no-breaks --no-replaces --no-enhances tshark | awk '/^[^ <][^:]*$/ {print $1}' | sort -u)
            miss=()
            for p in "${pkgs[@]}"; do
              dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -q 'install ok installed' || miss+=("$p")
            done
            [ ${#miss[@]} -eq 0 ] || apt-get download "${miss[@]}"
            shopt -s nullglob
            for d in ./*.deb; do dpkg-deb -x "$d" "$root"; done
            tshark_bin="$RUNNER_TEMP/tshark-userspace-sip-aba"
            printf '#!/bin/bash\nexport LD_LIBRARY_PATH="%s/usr/lib/x86_64-linux-gnu:%s/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"\nexport WIRESHARK_DATA_DIR="%s/usr/share/wireshark"\nexec "%s/usr/bin/tshark" "$@"\n' "$root" "$root" "$root" "$root" > "$tshark_bin"
            chmod +x "$tshark_bin"
          fi
          "$tshark_bin" -v | head -n1
          printf 'TSHARK_BINARY=%s\n' "$tshark_bin" >> "$GITHUB_ENV"

      - name: Resolve live DB and exactly one eligible DUT
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$SIP_ABA_ENV_FILE"
          set +a
          export PYTHONPATH="$GITHUB_WORKSPACE/backend"
          "$SIP_ABA_VENV/bin/python" - <<'PY'
          import hashlib
          import json
          import os
          import shlex
          import socket
          import subprocess
          from pathlib import Path
          from sqlalchemy.engine import make_url

          output_root = Path(os.environ['SIP_ABA_OUTPUT_ROOT'])
          runtime_root = Path(os.environ['SIP_ABA_RUNTIME_ROOT'])
          runtime_root.mkdir(parents=True, exist_ok=True)
          runtime_root.chmod(0o700)

          def inspect_running():
              rows = []
              ps = subprocess.check_output(
                  ['docker', 'ps', '--format', '{{.ID}}\t{{.Image}}\t{{.Names}}'], text=True
              )
              for line in ps.splitlines():
                  parts = line.split('\t', 2)
                  if len(parts) != 3:
                      continue
                  cid, image, name = parts
                  data = json.loads(subprocess.check_output(['docker', 'inspect', cid], text=True))[0]
                  env = {}
                  for item in ((data.get('Config') or {}).get('Env') or []):
                      key, sep, value = str(item).partition('=')
                      if sep:
                          env[key] = value
                  networks = (data.get('NetworkSettings') or {}).get('Networks') or {}
                  rows.append({'id': cid, 'image': image, 'name': name, 'env': env, 'networks': networks})
              return rows

          containers = inspect_running()
          raw_url = os.getenv('DATABASE_URL', '').strip()
          db_source = 'runner-env' if raw_url else ''
          source_containers = []
          if raw_url:
              source_containers = [c for c in containers if c['env'].get('DATABASE_URL') == raw_url]
          else:
              db_containers = [c for c in containers if str(c['env'].get('DATABASE_URL') or '').strip()]
              unique_urls = {str(c['env']['DATABASE_URL']).strip() for c in db_containers}
              sanitized = [
                  {
                      'name': c['name'],
                      'image': c['image'],
                      'has_database_url': bool(c['env'].get('DATABASE_URL')),
                      'reproduction_mode': c['env'].get('REPRODUCTION_PLATFORM_MODE'),
                      'app_env': c['env'].get('APP_ENV'),
                  }
                  for c in containers
              ]
              (output_root / 'runtime_container_inventory.json').write_text(
                  json.dumps({'containers': sanitized}, indent=2) + '\n', encoding='utf-8'
              )
              if len(unique_urls) != 1:
                  raise SystemExit(
                      f'SIP_ABA_DATABASE_SOURCE_NOT_UNIQUE containers_with_db={len(db_containers)} unique_urls={len(unique_urls)}'
                  )
              raw_url = next(iter(unique_urls))
              source_containers = [c for c in db_containers if str(c['env']['DATABASE_URL']).strip() == raw_url]
              db_source = 'docker-env-consensus'

          url = make_url(raw_url)
          db_host = str(url.host or '').strip()
          db_port = int(url.port or 5432)
          if not db_host:
              raise SystemExit('SIP_ABA_DATABASE_HOST_MISSING')

          resolved_via = 'native-dns'
          resolved_host = db_host
          target_name = None
          target_network = None
          try:
              socket.getaddrinfo(db_host, db_port, type=socket.SOCK_STREAM)
          except socket.gaierror:
              source_networks = {
                  network
                  for c in source_containers
                  for network in (c.get('networks') or {}).keys()
              }
              matches = []
              for c in containers:
                  for network, info in (c.get('networks') or {}).items():
                      if source_networks and network not in source_networks:
                          continue
                      aliases = set((info or {}).get('Aliases') or [])
                      ip = str((info or {}).get('IPAddress') or '').strip()
                      if ip and (db_host == c['name'] or db_host in aliases):
                          matches.append((c['name'], network, ip))
              unique_matches = set(matches)
              if len(unique_matches) != 1:
                  raise SystemExit(
                      f'SIP_ABA_DATABASE_TARGET_NOT_UNIQUE db_host={db_host} match_count={len(unique_matches)}'
                  )
              target_name, target_network, resolved_host = next(iter(unique_matches))
              url = url.set(host=resolved_host)
              resolved_via = 'docker-shared-network-ip'

          runtime_url = url.render_as_string(hide_password=False)
          db_runtime = runtime_root / 'db_runtime.env'
          db_runtime.write_text(f'DATABASE_URL={shlex.quote(runtime_url)}\n', encoding='utf-8')
          db_runtime.chmod(0o600)
          os.environ['DATABASE_URL'] = runtime_url

          (output_root / 'db_resolution.json').write_text(
              json.dumps({
                  'source': db_source,
                  'source_container_count': len(source_containers),
                  'source_containers': [c['name'] for c in source_containers],
                  'original_host': db_host,
                  'port': db_port,
                  'resolved_via': resolved_via,
                  'target_container': target_name,
                  'target_network': target_network,
              }, indent=2) + '\n', encoding='utf-8'
          )

          # Import application DB modules only after DATABASE_URL is resolved for the host process.
          from sqlalchemy import select
          from app.db.models import CaseDevice, DeviceCredential, ReproductionSession
          from app.db.session import SessionLocal

          selector_id = next((os.getenv(k, '').strip() for k in (
              'SIP_ABA_DEVICE_ID', 'REAL_DUT_DEVICE_ID', 'CAPTURE_GATE_DEVICE_ID'
          ) if os.getenv(k, '').strip()), '')
          selector_sn = next((os.getenv(k, '').strip() for k in (
              'SIP_ABA_DEVICE_SN', 'REAL_DUT_DEVICE_SN', 'CAPTURE_GATE_DEVICE_SN'
          ) if os.getenv(k, '').strip()), '')

          with SessionLocal() as db:
              devices = list(db.scalars(select(CaseDevice).order_by(CaseDevice.created_at.desc())).all())
              eligible = []
              for device in devices:
                  template = db.scalar(
                      select(ReproductionSession)
                      .where(ReproductionSession.device_id == device.id)
                      .order_by(ReproductionSession.created_at.desc())
                      .limit(1)
                  )
                  credential = db.scalar(select(DeviceCredential).where(DeviceCredential.sn == device.sn))
                  info = dict(device.device_info or {})
                  model = str(info.get('model') or info.get('product_model') or device.platform_id or '').strip()
                  if (
                      template is not None
                      and credential is not None
                      and str(credential.password or '')
                      and str(device.ip or '').strip()
                      and str(device.sn or '').strip()
                      and model
                  ):
                      eligible.append((device, template, model))

              if selector_id:
                  selected = [row for row in eligible if str(row[0].id) == selector_id]
              elif selector_sn:
                  selected = [row for row in eligible if str(row[0].sn) == selector_sn]
              else:
                  selected = eligible

              inventory = []
              for device, template, model in selected:
                  sn_hash = hashlib.sha256(str(device.sn).encode()).hexdigest()[:12]
                  inventory.append({
                      'device_id': str(device.id),
                      'sn_sha256_12': sn_hash,
                      'model': model,
                      'platform_id': device.platform_id,
                      'device_created_at': device.created_at.isoformat() if device.created_at else None,
                      'latest_reproduction_session_id': str(template.id),
                      'latest_reproduction_created_at': template.created_at.isoformat() if template.created_at else None,
                  })
              (output_root / 'dut_candidates.json').write_text(
                  json.dumps({
                      'selector_id_present': bool(selector_id),
                      'selector_sn_present': bool(selector_sn),
                      'candidate_count': len(selected),
                      'candidates': inventory,
                  }, indent=2) + '\n', encoding='utf-8'
              )
              if len(selected) != 1:
                  raise SystemExit(f'SIP_ABA_DUT_SELECTION_NOT_UNIQUE count={len(selected)}')

              device, template, model = selected[0]
              values = {
                  'DEVICE_ID': str(device.id),
                  'DEVICE_SN': str(device.sn),
                  'DEVICE_HOST': str(device.ip),
                  'DEVICE_PORT': str(int(device.ssh_port or 22)),
                  'DEVICE_USER': str(device.username or 'admin'),
                  'DEVICE_MODEL': model,
                  'DEVICE_PLATFORM': str(device.platform_id or ''),
              }
              dut_runtime = runtime_root / 'resolved_dut.env'
              dut_runtime.write_text(''.join(f'{k}={shlex.quote(v)}\n' for k, v in values.items()), encoding='utf-8')
              dut_runtime.chmod(0o600)
              print(json.dumps({
                  'database_source': db_source,
                  'database_resolution': resolved_via,
                  'device_id': str(device.id),
                  'model': model,
                  'platform_id': device.platform_id,
                  'reproduction_template': str(template.id),
              }, sort_keys=True))
          PY

      - name: Execute real A1 B A2 with mandatory cleanup
        id: aba
        shell: bash
        run: |
          set -uo pipefail
          set -a
          source "$SIP_ABA_ENV_FILE"
          source "$SIP_ABA_RUNTIME_ROOT/db_runtime.env"
          source "$SIP_ABA_RUNTIME_ROOT/resolved_dut.env"
          set +a
          export PYTHONPATH="$GITHUB_WORKSPACE/backend"
          export REAL_LIVE_MUTATION=EXPLICIT_ONLY
          export REPRODUCTION_PLATFORM_MODE=real
          export TSHARK_BINARY="$TSHARK_BINARY"

          phase_seconds="${SIP_ABA_PHASE_SECONDS:-$SIP_ABA_PHASE_SECONDS_DEFAULT}"
          trigger_command="${SIP_ABA_REGISTRATION_TRIGGER_COMMAND:-}"
          serial_command='v="$(uci -q get sysinfo.@sysinfo[0].serial_number 2>/dev/null || true)"; [ -n "$v" ] || v="$(uci -q get sysinfo.@sysinfo[0].sn 2>/dev/null || true)"; [ -n "$v" ] || v="$(uci -q get sysinfo.@sysinfo[0].serial 2>/dev/null || true)"; [ -n "$v" ] || exit 44; printf "%s\\n" "$v"'
          version_command='uci -q get sysinfo.@sysinfo[0].software_version'

          args=(
            -m app.capture_v2.gate.cli sip-registration-aba
            --device-id "$DEVICE_ID"
            --model "$DEVICE_MODEL"
            --host "$DEVICE_HOST"
            --port "$DEVICE_PORT"
            --username "$DEVICE_USER"
            --password-env "DB:$DEVICE_SN"
            --reproduction-session-id AUTO_NEW
            --worker-id "github-real-sip-aba-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            --gate-id SIP-REGISTRATION-ABA
            --phase-seconds "$phase_seconds"
            --sip-transport "${SIP_ABA_SIP_TRANSPORT:-udp}"
            --serial-command "$serial_command"
            --software-version-command "$version_command"
            --profile-root "$GITHUB_WORKSPACE/profiles"
            --output-root "$SIP_ABA_OUTPUT_ROOT"
            --allow-live-mutation
          )
          case "$DEVICE_PLATFORM" in
            mt7621|mt7981) args+=(--platform-id "$DEVICE_PLATFORM") ;;
          esac
          if [ -n "$trigger_command" ]; then
            args+=(--registration-trigger-command "$trigger_command")
          fi

          set +e
          "$SIP_ABA_VENV/bin/python" "${args[@]}" 2>&1 | tee "$SIP_ABA_OUTPUT_ROOT/cli-output.log"
          rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$rc" > "$SIP_ABA_OUTPUT_ROOT/exit_code.txt"
          printf 'REAL_SIP_ABA_EXIT_CODE=%s\n' "$rc" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Upload immutable A-B-A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-sip-registration-aba-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.SIP_ABA_OUTPUT_ROOT }}
          if-no-files-found: warn
          retention-days: 30

      - name: Remove runtime secrets
        if: always()
        shell: bash
        run: |
          rm -rf "$SIP_ABA_RUNTIME_ROOT"
