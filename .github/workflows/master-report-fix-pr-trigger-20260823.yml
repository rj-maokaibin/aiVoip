name: PR Triggered Master Report Fix

on:
  pull_request:
    paths:
      - '.ci/report-fix-trigger-20260823'

permissions:
  contents: write

jobs:
  apply-fix-directly-to-master:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply product patch
        run: python3 scripts/apply_actionable_report_fix_20260823.py
      - name: Install dependencies
        run: python3 -m pip install -r backend/requirements.txt >/dev/null
      - name: Regression gate
        env:
          PYTHONPATH: backend
        run: |
          set -euo pipefail
          pytest -q backend/tests/test_actionable_report_projection.py
          pytest -q backend/tests -x
      - name: Commit directly to master
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/reports/actionable_summary.py backend/app/golden/offline_analysis_e2e.py backend/app/integrations/feishu/evidence_document.py backend/tests/test_actionable_report_projection.py
          git diff --cached --check
          git commit -m "fix(report): preserve scope time and diagnostic next actions"
          git push origin HEAD:master
