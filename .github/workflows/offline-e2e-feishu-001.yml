name: Offline E2E Prepared PCAP -> PR7 -> Feishu Docx

on:
  pull_request:
    branches:
      - feat/pr7-diagnostic-contracts

permissions:
  contents: read

jobs:
  offline-e2e-feishu:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 30
    env:
      VOIP_OFFLINE_GOLDEN_001_PCAP: /tmp/tcpdump-2026-08-14.pcap
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_BASE_URL: https://open.feishu.cn/open-apis
    steps:
      - name: Checkout exact PR7 base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Verify exact PR7 head and prepared PCAP
        shell: bash
        run: |
          set -euo pipefail
          echo "PR7_BASE_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "48a3855e31a7019640671e422956212b540dd08d"
          test -f "$VOIP_OFFLINE_GOLDEN_001_PCAP"
          actual_sha="$(sha256sum "$VOIP_OFFLINE_GOLDEN_001_PCAP" | awk '{print $1}')"
          echo "Prepared PCAP SHA256=$actual_sha"
          test "$actual_sha" = "b038aa7c9a0644581f2815f654fcdee4620860796382265b178823fccba2e3f0"

      - name: Prepare TShark 4.2.2 userspace
        shell: bash
        run: |
          set -euo pipefail
          if command -v tshark >/dev/null 2>&1 && tshark -v | head -n1 | grep -q '4.2.2'; then
            echo "TSHARK_BINARY=$(command -v tshark)" >> "$GITHUB_ENV"
            tshark -v | head -n2
            exit 0
          fi
          root="$RUNNER_TEMP/tshark-root"
          debs="$RUNNER_TEMP/tshark-debs"
          rm -rf "$root" "$debs"
          mkdir -p "$root" "$debs"
          mapfile -t packages < <(
            apt-cache depends --recurse \
              --no-recommends --no-suggests --no-conflicts --no-breaks \
              --no-replaces --no-enhances tshark \
            | awk '/^[^ <][^:]*$/ {print $1}' | sort -u
          )
          missing=()
          for pkg in "${packages[@]}"; do
            if ! dpkg-query -W -f='${Status}' "$pkg" 2>/dev/null | grep -q 'install ok installed'; then
              missing+=("$pkg")
            fi
          done
          cd "$debs"
          if [ "${#missing[@]}" -gt 0 ]; then apt-get download "${missing[@]}"; fi
          shopt -s nullglob
          for deb in ./*.deb; do dpkg-deb -x "$deb" "$root"; done
          wrapper="$RUNNER_TEMP/tshark-userspace"
          cat > "$wrapper" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          export LD_LIBRARY_PATH="$root/usr/lib/x86_64-linux-gnu:$root/lib/x86_64-linux-gnu:\${LD_LIBRARY_PATH:-}"
          export WIRESHARK_DATA_DIR="$root/usr/share/wireshark"
          exec "$root/usr/bin/tshark" "\$@"
          EOF
          chmod +x "$wrapper"
          "$wrapper" -v | head -n2
          echo "TSHARK_BINARY=$wrapper" >> "$GITHUB_ENV"

      - name: Prepare Python environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv-offline-e2e
          .venv-offline-e2e/bin/python -m pip install --upgrade pip
          .venv-offline-e2e/bin/python -m pip install -r backend/requirements.txt

      - name: Run prepared-PCAP Offline Golden through production analyzers and PR7
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation/offline_e2e_feishu_001
          .venv-offline-e2e/bin/python tools/offline_analysis_golden_replay.py \
            --pcap "$VOIP_OFFLINE_GOLDEN_001_PCAP" \
            --tshark "$TSHARK_BINARY" \
            --require-fixture \
            --result validation/offline_e2e_feishu_001/golden_result.json \
            --artifacts validation/offline_e2e_feishu_001/analyzer_artifacts

      - name: Discover local Feishu configuration without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FEISHU_APP_ID:-}" ] || [ -z "${FEISHU_APP_SECRET:-}" ]; then
            for candidate in \
              /etc/voip-ai/.env \
              /etc/voip-ai/feishu.env \
              /opt/voip-ai/.env \
              /srv/aiVoip/.env \
              /home/github-runner/.config/voip-ai/.env \
              /home/github-runner/voip-ai.env; do
              if [ -r "$candidate" ]; then
                echo "Loading local VOIP AI environment from configured candidate path: $candidate"
                set -a
                . "$candidate"
                set +a
                break
              fi
            done
          fi
          if [ -n "${FEISHU_APP_ID:-}" ]; then echo "FEISHU_APP_ID_PRESENT=true"; else echo "FEISHU_APP_ID_PRESENT=false"; fi
          if [ -n "${FEISHU_APP_SECRET:-}" ] || [ -n "${FEISHU_APP_SECRET_FILE:-}" ]; then echo "FEISHU_APP_SECRET_PRESENT=true"; else echo "FEISHU_APP_SECRET_PRESENT=false"; fi
          {
            echo "FEISHU_APP_ID=${FEISHU_APP_ID:-}"
            echo "FEISHU_APP_SECRET=${FEISHU_APP_SECRET:-}"
            echo "FEISHU_APP_SECRET_FILE=${FEISHU_APP_SECRET_FILE:-}"
            echo "FEISHU_APP_SECRET_ENV=${FEISHU_APP_SECRET_ENV:-}"
            echo "FEISHU_LIVE_ENABLED=true"
          } >> "$GITHUB_ENV"

      - name: Build canonical report and publish real Feishu Docx
        id: publish
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=backend .venv-offline-e2e/bin/python - <<'PY'
          import asyncio
          import copy
          import json
          import os
          from pathlib import Path
          from types import SimpleNamespace

          from app.core.config import settings
          from app.golden.offline_analysis_e2e import build_offline_analysis_bundle
          from app.integrations.feishu.evidence_document import FeishuEvidenceDocumentService

          out = Path('validation/offline_e2e_feishu_001')
          out.mkdir(parents=True, exist_ok=True)
          pcap = Path(os.environ['VOIP_OFFLINE_GOLDEN_001_PCAP'])
          profile = Path('profiles/pcm/ruijie_aim_diag_v1.yaml')
          tshark = os.environ.get('TSHARK_BINARY', 'tshark')

          bundle = build_offline_analysis_bundle(
              pcap_path=pcap,
              pcm_profile_path=profile,
              output_dir=out / 'report_artifacts',
              tshark_binary=tshark,
          )
          report = bundle['report']
          (out / 'canonical_report.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2, default=str) + '\n',
              encoding='utf-8',
          )
          summary = {
              'schema_version': bundle.get('schema_version'),
              'source': bundle.get('source'),
              'analysis_context': bundle.get('analysis_context'),
              'display_call': bundle.get('display_call'),
              'diagnosis': bundle.get('diagnosis'),
              'finding_count': len(report.get('findings') or []),
              'headline': report.get('headline'),
              'completeness': report.get('completeness'),
              'diagnostic_contract_summary': (report.get('diagnostic_contract') or {}).get('summary'),
          }
          (out / 'offline_e2e_summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, default=str) + '\n',
              encoding='utf-8',
          )

          publish_status = {
              'status': 'BLOCKED_FEISHU_CREDENTIALS',
              'document_id': None,
              'document_url': None,
              'source_sha256': (bundle.get('source') or {}).get('sha256'),
              'finding_count': len(report.get('findings') or []),
          }

          async def publish():
              service = FeishuEvidenceDocumentService()
              # Credential resolution happens inside the production transport. Do not log values.
              if not settings.feishu_app_id:
                  return
              try:
                  service.transport._app_secret()
              except Exception:
                  return
              fake_report = SimpleNamespace(
                  version=1,
                  status='OFFLINE_IMPORTED',
                  scope_type='CASE',
                  id='OFFLINE-E2E-FEISHU-001',
              )
              payload = copy.deepcopy(report)
              blocks, _attachment_index, _inline_plan = service._core_blocks(fake_report, payload)
              # This validation has no persisted ObjectStorage rows. Keep all textual
              # Artifact references, but omit empty media placeholder blocks.
              blocks = [b for b in blocks if int(b.get('block_type') or 0) not in {23, 27}]
              document_id, document_url = await service._create_document(
                  'VOIP Offline E2E #001 - Prepared PCAP'
              )
              await service._insert_blocks(document_id, blocks, index=0)
              publish_status.update({
                  'status': 'PASS',
                  'document_id': document_id,
                  'document_url': document_url,
                  'block_count': len(blocks),
                  'inline_media_materialized': False,
                  'inline_media_note': 'Textual Artifact references retained; persisted ObjectStorage media projection is outside this offline validation.',
              })

          try:
              asyncio.run(publish())
          except Exception as exc:
              publish_status.update({
                  'status': 'FAIL',
                  'error_type': type(exc).__name__,
                  'error': str(exc)[:300],
              })

          (out / 'feishu_publish.json').write_text(
              json.dumps(publish_status, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps({
              'feishu_status': publish_status['status'],
              'document_url': publish_status.get('document_url'),
              'finding_count': publish_status['finding_count'],
          }, ensure_ascii=False))
          if publish_status['status'] != 'PASS':
              raise SystemExit(22)
          PY

      - name: Validate Offline E2E result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('validation/offline_e2e_feishu_001')
          golden=json.loads((root/'golden_result.json').read_text())
          print(f"Golden={golden.get('status')} {golden.get('checks_passed')}/{golden.get('checks_total')}")
          if golden.get('status') != 'PASS' or golden.get('checks_passed') != golden.get('checks_total'):
              raise SystemExit(31)
          pub_path=root/'feishu_publish.json'
          if not pub_path.exists():
              print('Feishu=NOT_EXECUTED')
              raise SystemExit(32)
          pub=json.loads(pub_path.read_text())
          print(f"Feishu={pub.get('status')} URL={pub.get('document_url')}")
          if pub.get('status') != 'PASS':
              raise SystemExit(33)
          PY

      - name: Upload Offline E2E validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-e2e-feishu-001
          path: validation/offline_e2e_feishu_001/**
          if-no-files-found: warn
          retention-days: 14
