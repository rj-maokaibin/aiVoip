name: Refresh legacy Feishu consumer manifest temp

on:
  pull_request:
    branches:
      - master
    paths:
      - 'backend/app/workers/celery_app.py'
      - 'backend/app/workers/feishu_long_connection_task.py'
      - 'backend/tests/test_feishu_long_connection_deployment_v1.py'
      - '.github/workflows/refresh-legacy-feishu-consumer-manifest-temp.yml'

permissions:
  contents: write

concurrency:
  group: refresh-legacy-feishu-consumer-manifest-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Prepare Python environment
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/legacy-feishu-cleanup-venv"
          source "$RUNNER_TEMP/legacy-feishu-cleanup-venv/bin/activate"
          pip install -q -r backend/requirements.txt

      - name: Refresh source manifest
        run: |
          set -euo pipefail
          python3 tools/source_manifest_gate.py --update

      - name: Validate legacy consumer removal
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/legacy-feishu-cleanup-venv/bin/activate"
          PYTHONPATH=backend:. pytest -q backend/tests/test_feishu_long_connection_deployment_v1.py
          python3 tools/source_manifest_gate.py

      - name: Commit refreshed source manifest
        run: |
          set -euo pipefail
          if git diff --quiet -- release/source_manifest.json; then
            echo 'SOURCE_MANIFEST_ALREADY_CURRENT=PASS'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add release/source_manifest.json
          git commit -m 'chore(release): refresh manifest after legacy Feishu consumer removal'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
