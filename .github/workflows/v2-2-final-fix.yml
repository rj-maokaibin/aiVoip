name: Temporary V2.2 Final Fix

on:
  push:
    branches:
      - perf/cicd-v2-2

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/cicd-v2-2
          fetch-depth: 0

      - name: Apply final evidence fix and refresh source manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/prd-spec-v1-release.yml')
          text = path.read_text(encoding='utf-8')
          old = '          python - "$EXPECTED_SHA" <<\'PY\'\n'
          new = '          python3 - "$EXPECTED_SHA" <<\'PY\'\n'
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('expected Full Acceptance evidence Python invocation not found')
          PY
          python3 tools/source_manifest_gate.py --update
          python3 tools/source_manifest_gate.py
          if git diff --quiet -- .github/workflows/prd-spec-v1-release.yml release/source_manifest.json; then
            echo "V2_2_FINAL_FIX=NOOP"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/prd-spec-v1-release.yml release/source_manifest.json
          git commit -m "fix(ci): use python3 for Full Acceptance evidence"
          git push origin HEAD:perf/cicd-v2-2
          echo "V2_2_FINAL_FIX=PASS"
