name: Evidence V2 Source Manifest Refresh Temp

on:
  push:
    branches:
      - fix/evidence-v2-bootstrap-workspace-repair-20260904

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch source
        uses: actions/checkout@v4
        with:
          ref: fix/evidence-v2-bootstrap-workspace-repair-20260904
          fetch-depth: 0

      - name: Regenerate and verify exact Source Manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/source_manifest_gate.py --update
          python3 tools/source_manifest_gate.py
          python3 tools/evidence_v2_bootstrap_workflow_contract.py
          git diff --check
          echo "EVIDENCE_V2_SOURCE_MANIFEST_REFRESH=PASS"

      - name: Commit refreshed Source Manifest
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- release/source_manifest.json; then
            echo "SOURCE_MANIFEST_ALREADY_EXACT=PASS"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/source_manifest.json
          git commit -m "Refresh source manifest for Evidence V2 bootstrap contract fix"
          git push origin HEAD:fix/evidence-v2-bootstrap-workspace-repair-20260904
          echo "SOURCE_MANIFEST_REFRESH_COMMIT=PASS"