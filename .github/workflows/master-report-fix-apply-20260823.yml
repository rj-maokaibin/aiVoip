name: Apply Actionable Evidence Report Fix

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/master-report-fix-apply-20260823.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Patch product code and add regression tests
        shell: bash
        run: |
