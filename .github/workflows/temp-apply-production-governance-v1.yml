name: TEMP Probe Runner Workspaces

on:
  push:
    branches:
      - release/production-governance-v1

permissions:
  contents: read

concurrency:
  group: temp-production-governance-v1
  cancel-in-progress: true

jobs:
  probe:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 3
    steps:
      - name: Inspect reusable local repositories
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base=/home/github-runner/actions-runner/_work/aiVoip
          echo "BASE=$base"
          find "$base" -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | sort || true
          for d in "$base"/aiVoip*; do
            [ -d "$d" ] || continue
            echo "===== $d ====="
            test -d "$d/.git" && echo GIT=YES || echo GIT=NO
            if [ -d "$d/.git" ]; then
              git -C "$d" rev-parse HEAD 2>/dev/null || true
              git -C "$d" status --short --untracked-files=no 2>/dev/null | head -20 || true
              test -f "$d/deploy/voip-ai" && echo DEPLOY_FILE=YES || echo DEPLOY_FILE=NO
              test -f "$d/tools/source_manifest_gate.py" && echo MANIFEST_TOOL=YES || echo MANIFEST_TOOL=NO
              find "$d" -maxdepth 2 -type f 2>/dev/null | wc -l || true
            fi
          done
