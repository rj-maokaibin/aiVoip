name: TEMP Apply Production Governance V1

on:
  push:
    branches:
      - release/production-governance-v1

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'production-governance-patches'
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/production-governance-v1
          fetch-depth: 0

      - name: Apply fail-closed production governance patches
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/temp/apply_production_governance_v1.py
          bash -n deploy/voip-ai
          python3 -m py_compile deploy/exact_source_binding_gate.py tools/source_manifest_gate.py
          python3 -m pytest -q \
            backend/tests/test_exact_source_binding_gate_v1.py \
            backend/tests/test_source_manifest_release_governance_v1.py
          python3 tools/source_manifest_gate.py --update
          python3 tools/source_manifest_gate.py
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            backend/Dockerfile \
            frontend/Dockerfile \
            docker-compose.yml \
            docker-compose.production.yml \
            tools/source_manifest_gate.py \
            deploy/voip-ai \
            release/source_manifest.json
          git commit -m 'production-governance-patches'
          git push origin HEAD:release/production-governance-v1
