name: CI/CD Performance V2 Bootstrap

on:
  push:
    branches:
      - perf/cicd-performance-v2
  pull_request:
    branches:
      - master

permissions:
  contents: write
  actions: read

concurrency:
  group: cicd-performance-v2-bootstrap
  cancel-in-progress: false

jobs:
  patch-refresh-commit:
    if: github.ref == 'refs/heads/perf/cicd-performance-v2' || github.head_ref == 'perf/cicd-performance-v2'
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/cicd-performance-v2
          fetch-depth: 2
          clean: true

      - name: Collect real Production Deploy baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/perf_v2_baseline_collector.py

      - name: Upload baseline performance evidence
        uses: actions/upload-artifact@v4
        with:
          name: cicd-performance-v2-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: validation/cicd_performance_baseline.json
          if-no-files-found: error

      - name: Apply V2 patch
        run: |
          set -euo pipefail
          python3 tools/perf_v2_patcher.py
          python3 tools/perf_v2_test_patcher.py

      - name: Refresh and verify source manifest
        run: |
          set -euo pipefail
          python3 tools/source_manifest_gate.py --update
          python3 tools/source_manifest_gate.py

      - name: Self-remove bootstrap helpers and commit
        run: |
          set -euo pipefail
          git rm .github/workflows/perf-v2-bootstrap.yml tools/perf_v2_patcher.py tools/perf_v2_test_patcher.py tools/perf_v2_baseline_collector.py
          python3 tools/source_manifest_gate.py --update
          python3 tools/source_manifest_gate.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf(ci): instrument and optimize production deploy v2'
          git push origin HEAD:perf/cicd-performance-v2
