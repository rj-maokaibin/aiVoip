              assert anchor in text
              text = text.replace(anchor, replacement, 1)
              text = text.replace('  compose build --pull --build-arg "BUILD_REVISION=$(env_value BUILD_REVISION)" "${services[@]}" 2>&1 | tee "$build_log"', '  BUILDKIT_PROGRESS="${BUILDKIT_PROGRESS:-plain}" compose build --pull --build-arg "BUILD_REVISION=$(env_value BUILD_REVISION)" "${services[@]}" 2>&1 | tee "$build_log"', 1)
              # Keep the existing post-build guarded fallback, but enable BuildKit there too.
              text = text.replace('  compose build --pull=false --build-arg "BUILD_REVISION=$(env_value BUILD_REVISION)" "${services[@]}"\n  echo "PRODUCTION_IMAGE_BUILD=PASS mode=OFFLINE_LOCAL_INVENTORY audit=$audit_file"\n}', '  BUILDKIT_PROGRESS="${BUILDKIT_PROGRESS:-plain}" compose build --pull=false --build-arg "BUILD_REVISION=$(env_value BUILD_REVISION)" "${services[@]}"\n  echo "PRODUCTION_IMAGE_BUILD=PASS mode=OFFLINE_LOCAL_INVENTORY audit=$audit_file"\n}', 1)

              old = '''deploy_stack() {
  host_preflight
  prepare_host
  if [[ "$SKIP_BACKUP" != "1" ]]; then backup_db; fi
  build_images

