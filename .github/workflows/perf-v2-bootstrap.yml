name: CI/CD Performance V2 Bootstrap

on:
  push:
    branches:
      - perf/cicd-performance-v2

permissions:
  contents: write

concurrency:
  group: cicd-performance-v2-bootstrap
  cancel-in-progress: false

jobs:
  patch-and-refresh:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/cicd-performance-v2
          fetch-depth: 2
          clean: true

      - name: Apply production performance instrumentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('deploy/voip-ai')
          text = path.read_text(encoding='utf-8')
          if 'CICD_PERFORMANCE_V2_EVIDENCE' not in text:
              old = '  VOIP_APP_ENV_FILE="$ENV_FILE" docker compose \\\n'
              new = '  DOCKER_BUILDKIT="${DOCKER_BUILDKIT:-1}" COMPOSE_DOCKER_CLI_BUILD="${COMPOSE_DOCKER_CLI_BUILD:-1}" \\\n    VOIP_APP_ENV_FILE="$ENV_FILE" docker compose \\\n'
              assert old in text
              text = text.replace(old, new, 1)

              anchor = '''if [[ "$PROJECT_FROM_CLI" != "1" ]]; then
  PROJECT="$(env_value VOIP_PROJECT_NAME 2>/dev/null || printf '%s' "$PROJECT")"
fi
'''
              helpers = r'''if [[ "$PROJECT_FROM_CLI" != "1" ]]; then
  PROJECT="$(env_value VOIP_PROJECT_NAME 2>/dev/null || printf '%s' "$PROJECT")"
fi

# CICD_PERFORMANCE_V2_EVIDENCE: phase timing is evidence-only and never bypasses a gate.
PERF_TIMING_LOG=""
PERF_EVIDENCE="${VOIP_CICD_PERF_EVIDENCE:-validation/cicd_performance_v2.json}"

perf_reset() {
  mkdir -p validation
  PERF_TIMING_LOG="$(mktemp)"
  : > "$PERF_TIMING_LOG"
}

perf_write_timing() {
  local revision
  revision="$(env_value BUILD_REVISION 2>/dev/null || echo unknown)"
  python3 - "$PERF_TIMING_LOG" "$PERF_EVIDENCE" "$revision" <<'PYTIMING'
import json
import sys
from datetime import datetime, timezone
from pathlib import Path

log_path, out_path, revision = map(Path, sys.argv[1:3]) + [sys.argv[3]] if False else (Path(sys.argv[1]), Path(sys.argv[2]), sys.argv[3])
phases = []
for raw in log_path.read_text(encoding='utf-8').splitlines():
    if not raw.strip():
        continue
    name, status, duration_ms = raw.split('\t', 2)
    phases.append({'phase': name, 'status': status, 'duration_ms': int(duration_ms)})
payload = {
    'schema_version': 'cicd-performance-v2',
    'created_at': datetime.now(timezone.utc).isoformat(),
    'build_revision': revision,
    'status': 'PASS' if phases and all(x['status'] == 'PASS' for x in phases) else 'FAIL',
    'total_duration_ms': sum(x['duration_ms'] for x in phases),
    'phases': phases,
}
out_path.parent.mkdir(parents=True, exist_ok=True)
out_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
print(f"CICD_PERFORMANCE_V2_EVIDENCE={out_path} total_ms={payload['total_duration_ms']} status={payload['status']}")
PYTIMING
}

perf_phase() {
  local name="$1" start_ns end_ns duration_ms rc status
  shift
  start_ns="$(date +%s%N)"
  if "$@"; then
    rc=0
    status=PASS
  else
    rc=$?
    status=FAIL
  fi
  end_ns="$(date +%s%N)"
  duration_ms="$(( (end_ns - start_ns) / 1000000 ))"
  printf '%s\t%s\t%s\n' "$name" "$status" "$duration_ms" >> "$PERF_TIMING_LOG"
  perf_write_timing
  echo "PERF_PHASE name=$name status=$status duration_ms=$duration_ms"
  return "$rc"
}
'''
