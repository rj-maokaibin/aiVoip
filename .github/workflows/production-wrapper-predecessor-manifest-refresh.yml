name: Production Wrapper Predecessor Manifest Refresh

on:
  pull_request:
    branches:
      - master
    paths:
      - 'deploy/production_wrapper_migration.py'
      - 'backend/tests/test_production_wrapper_predecessor_contract.py'
      - '.github/workflows/production-wrapper-predecessor-manifest-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Refresh final source manifest and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/production-wrapper-predecessor-manifest-refresh.yml
          python3 tools/source_manifest_gate.py --update
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'SOURCE_MANIFEST_REFRESH=NO_CHANGES'
            exit 0
          fi
          git commit -m 'Refresh source manifest for production wrapper predecessor'
          git push origin "HEAD:${{ github.head_ref }}"
