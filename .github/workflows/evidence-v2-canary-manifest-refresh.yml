name: Evidence V2 CANARY Manifest Refresh

on:
  pull_request:
    branches:
      - master
    paths:
      - 'deploy/evidence_v2_rollout.json'
      - '.github/workflows/evidence-v2-canary-manifest-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Validate CANARY rollout contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('deploy/evidence_v2_rollout.json').read_text(encoding='utf-8'))
          assert p.get('schema_version') == 'evidence-v2-production-rollout-v1', p
          assert p.get('stage') == 'CANARY', p
          assert p.get('canary_selector') == 'BOUND_REAL_GOLDEN_001', p
          assert p.get('strict_validator') is True, p
          assert p.get('default_projection') == 'V1', p
          text=Path('deploy/voip-ai').read_text(encoding='utf-8')
          assert 'if [[ "$stage" == "CANARY" ]]' in text
          assert '-e PRELIMINARY_EVIDENCE_V2_PROJECT=true' in text
          assert 'Evidence V2 SHADOW/CANARY must keep global V1 projection' in text
          assert 'r.get("canonical_readback")=="PASS"' in text
          print('EVIDENCE_V2_CANARY_SOURCE_CONTRACT=PASS')
          PY
      - name: Refresh governed source manifest and remove helper workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout '${{ github.event.pull_request.head.ref }}'
          rm -f .github/workflows/evidence-v2-canary-manifest-refresh.yml
          python3 tools/source_manifest_gate.py --update
          python3 tools/source_manifest_gate.py
          git add release/source_manifest.json .github/workflows/evidence-v2-canary-manifest-refresh.yml
          git commit -m 'Refresh source manifest for Evidence V2 CANARY'
          git push origin HEAD:'${{ github.event.pull_request.head.ref }}'
