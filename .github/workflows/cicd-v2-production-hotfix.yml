name: CI/CD V2 Source Manifest Refresh

on:
  push:
    branches:
      - fix/cicd-v2-production-failclosed
    paths:
      - '.github/workflows/cicd-v2-production-hotfix.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cicd-v2-production-failclosed
          fetch-depth: 2

      - name: Refresh source manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/source_manifest_gate.py --update
          python3 tools/source_manifest_gate.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/source_manifest.json
          if git diff --cached --quiet; then
            echo 'SOURCE_MANIFEST_REFRESH=NO_CHANGE'
            exit 0
          fi
          git commit -m 'chore(release): refresh source manifest for production hotfix'
          git push origin HEAD:fix/cicd-v2-production-failclosed
