# retrigger: production fail-closed + docker network migration v4
name: CI/CD V2 Production Fail-Closed Hotfix

on:
  push:
    branches:
      - fix/cicd-v2-production-failclosed
    paths:
      - '.github/workflows/cicd-v2-production-hotfix.yml'

permissions:
  contents: write

concurrency:
  group: cicd-v2-production-failclosed-hotfix
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cicd-v2-production-failclosed
          fetch-depth: 2

      - name: Apply production fail-closed and network fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing patch anchor: {label}')
              return text.replace(old, new, 1)

          for rel in ('backend/Dockerfile', 'frontend/Dockerfile'):
              p = Path(rel)
              text = p.read_text(encoding='utf-8')
              text = text.removeprefix('# syntax=docker/dockerfile:1.7\n')
              p.write_text(text, encoding='utf-8')

          guard = r'''#!/usr/bin/env python3
import argparse
import ipaddress
import json
import os
import socket
import subprocess
from pathlib import Path
from urllib.parse import urlparse

MARKER = Path('/run/voip-ai-registry-route.json')
EVIDENCE = Path('validation/docker_network_guard.json')
DEFAULT_SUBNET = '172.30.250.0/24'


def run(*args, check=True):
    cp = subprocess.run(args, text=True, capture_output=True)
    if check and cp.returncode:
        raise SystemExit(f"command failed ({cp.returncode}): {' '.join(args)}\n{cp.stderr.strip()}")
    return cp.stdout.strip()


def docker_networks():
    out = []
    names = run('docker', 'network', 'ls', '--format', '{{.Name}}').splitlines()
    for name in names:
        raw = run('docker', 'network', 'inspect', name)
        item = json.loads(raw)[0]
        subnets = []
        for cfg in (item.get('IPAM') or {}).get('Config') or []:
            if cfg.get('Subnet'):
                try:
                    subnets.append(ipaddress.ip_network(cfg['Subnet'], strict=False))
                except ValueError:
                    pass
        containers = sorted((item.get('Containers') or {}).keys())
        out.append({'name': name, 'subnets': subnets, 'containers': containers})
    return out


def default_route():
    line = run('ip', '-4', 'route', 'show', 'default').splitlines()[0]
    parts = line.split()
    if 'via' not in parts or 'dev' not in parts:
        raise SystemExit(f'unsupported default route: {line}')
    return parts[parts.index('via') + 1], parts[parts.index('dev') + 1]


def registry_endpoint():
    path = Path('/etc/docker/daemon.json')
    if not path.exists():
        return None
    try:
        cfg = json.loads(path.read_text(encoding='utf-8'))
    except Exception as exc:
        raise SystemExit(f'invalid /etc/docker/daemon.json: {exc}')
    mirrors = cfg.get('registry-mirrors') or []
    if not mirrors:
        return None
    parsed = urlparse(mirrors[0])
    host = parsed.hostname
    if not host:
        raise SystemExit(f'invalid registry mirror URL: {mirrors[0]}')
    port = parsed.port or (443 if parsed.scheme == 'https' else 80)
    ips = sorted({x[4][0] for x in socket.getaddrinfo(host, port, socket.AF_INET, socket.SOCK_STREAM)})
    if not ips:
        raise SystemExit(f'cannot resolve registry mirror: {host}')
    return {'url': mirrors[0], 'host': host, 'port': port, 'ips': ips}


def route_get(ip):
    return run('ip', '-4', 'route', 'get', ip).splitlines()[0]


def physical_route_conflicts(desired, docker_nets):
    docker_subnets = {str(s) for n in docker_nets for s in n['subnets']}
    conflicts = []
    for raw in run('ip', '-4', 'route', 'show', 'table', 'main').splitlines():
        token = raw.split()[0] if raw.split() else ''
        if token == 'default':
            continue
        try:
            net = ipaddress.ip_network(token, strict=False)
        except ValueError:
            continue
        if str(net) in docker_subnets:
            continue
        if desired.overlaps(net):
            conflicts.append({'route': raw, 'network': str(net)})
    return conflicts


def write_evidence(payload):
    EVIDENCE.parent.mkdir(parents=True, exist_ok=True)
    EVIDENCE.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
    print(json.dumps(payload, ensure_ascii=False, indent=2))


def prepare(project, desired_text):
    desired = ipaddress.ip_network(desired_text, strict=False)
    nets = docker_networks()
    physical = physical_route_conflicts(desired, nets)
    if physical:
        write_evidence({'status': 'FAIL', 'reason': 'DESIRED_SUBNET_OVERLAPS_HOST_ROUTE', 'desired_subnet': str(desired), 'conflicts': physical})
        raise SystemExit(2)
    docker_overlap = [
        {'network': n['name'], 'subnet': str(s)}
        for n in nets for s in n['subnets'] if desired.overlaps(s)
    ]
    if docker_overlap:
        write_evidence({'status': 'FAIL', 'reason': 'DESIRED_SUBNET_OVERLAPS_EXISTING_DOCKER_NETWORK', 'desired_subnet': str(desired), 'conflicts': docker_overlap})
        raise SystemExit(2)

    endpoint = registry_endpoint()
    repaired = []
    registry_conflicts = []
    if endpoint:
        gateway, dev = default_route()
        for ip_text in endpoint['ips']:
            ip = ipaddress.ip_address(ip_text)
            if ip in desired:
                write_evidence({'status': 'FAIL', 'reason': 'DESIRED_SUBNET_CONTAINS_REGISTRY_MIRROR', 'desired_subnet': str(desired), 'registry_ip': ip_text})
                raise SystemExit(2)
            hits = [
                {'network': n['name'], 'subnet': str(s)}
                for n in nets for s in n['subnets'] if ip in s
            ]
            if hits:
                registry_conflicts.extend([dict(x, registry_ip=ip_text) for x in hits])
                before = route_get(ip_text)
                run('ip', 'route', 'replace', f'{ip_text}/32', 'via', gateway, 'dev', dev)
                after = route_get(ip_text)
                if f'dev {dev}' not in after:
                    write_evidence({'status': 'FAIL', 'reason': 'REGISTRY_ROUTE_REPAIR_FAILED', 'registry_ip': ip_text, 'before': before, 'after': after})
                    raise SystemExit(2)
                repaired.append({'ip': ip_text, 'gateway': gateway, 'dev': dev, 'before': before, 'after': after})
        if repaired:
            MARKER.parent.mkdir(parents=True, exist_ok=True)
            MARKER.write_text(json.dumps({'routes': repaired}, indent=2) + '\n', encoding='utf-8')

    payload = {
        'status': 'PASS', 'phase': 'prepare', 'project': project,
        'desired_subnet': str(desired), 'registry': endpoint,
        'registry_conflicts': registry_conflicts, 'temporary_routes': repaired,
    }
    write_evidence(payload)


def cleanup(project, desired_text):
    desired = ipaddress.ip_network(desired_text, strict=False)
    endpoint = registry_endpoint()
    removed = []
    nets = docker_networks()
    registry_ips = [ipaddress.ip_address(x) for x in (endpoint or {}).get('ips', [])]
    legacy_name = f'{project}_default'
    for n in nets:
        conflicts_registry = any(ip in s for ip in registry_ips for s in n['subnets'])
        if n['name'] == legacy_name and conflicts_registry:
            if n['containers']:
                write_evidence({'status': 'FAIL', 'reason': 'LEGACY_CONFLICT_NETWORK_STILL_IN_USE', 'network': n['name'], 'containers': n['containers']})
                raise SystemExit(3)
            run('docker', 'network', 'rm', n['name'])
            removed.append(n['name'])

    remaining = docker_networks()
    remaining_conflicts = []
    for n in remaining:
        for s in n['subnets']:
            for ip in registry_ips:
                if ip in s:
                    remaining_conflicts.append({'network': n['name'], 'subnet': str(s), 'registry_ip': str(ip)})
    if remaining_conflicts:
        write_evidence({'status': 'FAIL', 'reason': 'REGISTRY_DOCKER_ROUTE_CONFLICT_REMAINS', 'conflicts': remaining_conflicts, 'removed': removed})
        raise SystemExit(3)

    deleted_routes = []
    if MARKER.exists():
        try:
            marker = json.loads(MARKER.read_text(encoding='utf-8'))
        except Exception:
            marker = {'routes': []}
        for item in marker.get('routes', []):
            run('ip', 'route', 'del', f"{item['ip']}/32", 'via', item['gateway'], 'dev', item['dev'], check=False)
            deleted_routes.append(item)
        MARKER.unlink(missing_ok=True)

    payload = {
        'status': 'PASS', 'phase': 'cleanup', 'project': project,
        'desired_subnet': str(desired), 'removed_legacy_networks': removed,
        'removed_temporary_routes': deleted_routes,
    }
    write_evidence(payload)


def main():
    parser = argparse.ArgumentParser()
    parser.add_argument('phase', choices=['prepare', 'cleanup'])
    parser.add_argument('--project', required=True)
    parser.add_argument('--subnet', default=os.environ.get('VOIP_DOCKER_SUBNET', DEFAULT_SUBNET))
    args = parser.parse_args()
    if args.phase == 'prepare':
        prepare(args.project, args.subnet)
    else:
        cleanup(args.project, args.subnet)


if __name__ == '__main__':
    main()
'''
          Path('deploy/docker_network_guard.py').write_text(guard, encoding='utf-8')

          p = Path('docker-compose.production.yml')
          text = p.read_text(encoding='utf-8')
          network_block = '''\n\n# Production uses a named, narrow subnet instead of Docker's automatic /16 pools.\n# This prevents corporate routes such as the registry mirror (172.18.34.132) from\n# being captured by a project bridge. The deploy guard validates overrides before use.\nnetworks:\n  default:\n    name: ${VOIP_DOCKER_NETWORK_NAME:-aivoip-production}\n    ipam:\n      config:\n        - subnet: ${VOIP_DOCKER_SUBNET:-172.30.250.0/24}\n'''
          if 'VOIP_DOCKER_NETWORK_NAME' not in text:
              text += network_block
          p.write_text(text, encoding='utf-8')

          p = Path('deploy/voip-ai')
          text = p.read_text(encoding='utf-8')
          text = replace_once(text, '#!/usr/bin/env bash\nset -Eeuo pipefail\n', '#!/usr/bin/env bash\nset -Eeuo pipefail\n# Production deploy runs under sudo; prevent read-only Git checks from refreshing\n# the index as root and polluting the self-hosted runner workspace.\nexport GIT_OPTIONAL_LOCKS=0\n', 'git-optional-locks')
          text = replace_once(text, '''  python3 deploy/deployment_preflight.py --env-file "$ENV_FILE" --mode deploy --out validation/phase_f3_deployment_preflight.json\n  compose config >/dev/null\n''', '''  python3 deploy/deployment_preflight.py --env-file "$ENV_FILE" --mode deploy --out validation/phase_f3_deployment_preflight.json\n  # Repair any existing Docker bridge route hijack without stopping the live stack.\n  # The permanent migration is completed after application promotion.\n  python3 deploy/docker_network_guard.py prepare --project "$PROJECT"\n  compose config >/dev/null\n''', 'network-guard-prepare')
          old = '''      echo "OFFLINE_IMAGE_FALLBACK=AUTHORIZED source=REGISTRY_PREFLIGHT audit=$audit_file"\n      BUILDKIT_PROGRESS="${BUILDKIT_PROGRESS:-plain}" compose build --pull=false --build-arg "BUILD_REVISION=$(env_value BUILD_REVISION)" "${services[@]}"\n      echo "PRODUCTION_IMAGE_BUILD=PASS mode=OFFLINE_LOCAL_INVENTORY audit=$audit_file"\n      return 0\n'''
          new = '''      echo "OFFLINE_IMAGE_FALLBACK=AUTHORIZED source=REGISTRY_PREFLIGHT audit=$audit_file"\n      local offline_rc\n      set +e\n      BUILDKIT_PROGRESS="${BUILDKIT_PROGRESS:-plain}" compose build --pull=false --build-arg "BUILD_REVISION=$(env_value BUILD_REVISION)" "${services[@]}"\n      offline_rc="$?"\n      set -e\n      if [[ "$offline_rc" != "0" ]]; then\n        echo "PRODUCTION_IMAGE_BUILD=FAIL mode=OFFLINE_LOCAL_INVENTORY source=REGISTRY_PREFLIGHT exit_code=$offline_rc audit=$audit_file" >&2\n        return "$offline_rc"\n      fi\n      echo "PRODUCTION_IMAGE_BUILD=PASS mode=OFFLINE_LOCAL_INVENTORY audit=$audit_file"\n      return 0\n'''
          text = replace_once(text, old, new, 'preflight-offline-failclosed')
          old = '''  echo "OFFLINE_IMAGE_FALLBACK=AUTHORIZED audit=$audit_file"\n  BUILDKIT_PROGRESS="${BUILDKIT_PROGRESS:-plain}" compose build --pull=false --build-arg "BUILD_REVISION=$(env_value BUILD_REVISION)" "${services[@]}"\n  echo "PRODUCTION_IMAGE_BUILD=PASS mode=OFFLINE_LOCAL_INVENTORY audit=$audit_file"\n}\n'''
          new = '''  echo "OFFLINE_IMAGE_FALLBACK=AUTHORIZED audit=$audit_file"\n  local offline_rc\n  set +e\n  BUILDKIT_PROGRESS="${BUILDKIT_PROGRESS:-plain}" compose build --pull=false --build-arg "BUILD_REVISION=$(env_value BUILD_REVISION)" "${services[@]}"\n  offline_rc="$?"\n  set -e\n  if [[ "$offline_rc" != "0" ]]; then\n    echo "PRODUCTION_IMAGE_BUILD=FAIL mode=OFFLINE_LOCAL_INVENTORY source=POSTBUILD_FALLBACK exit_code=$offline_rc audit=$audit_file" >&2\n    return "$offline_rc"\n  fi\n  echo "PRODUCTION_IMAGE_BUILD=PASS mode=OFFLINE_LOCAL_INVENTORY audit=$audit_file"\n  return 0\n}\n'''
          text = replace_once(text, old, new, 'postbuild-offline-failclosed')
          text = replace_once(text, '''  perf_phase application_promotion compose up -d \\\n    backend collector-worker packet-worker pcm-worker media-worker diagnosis-worker \\\n    feishu-long-connection \\\n    reproduction-worker reproduction-control-high-worker reproduction-watch-worker beat frontend\n\n  local timeout backend_port frontend_port\n''', '''  perf_phase application_promotion compose up -d \\\n    backend collector-worker packet-worker pcm-worker media-worker diagnosis-worker \\\n    feishu-long-connection \\\n    reproduction-worker reproduction-control-high-worker reproduction-watch-worker beat frontend\n  # At this point every managed service is attached to the named safe production network.\n  # Remove the now-empty legacy ${PROJECT}_default network if it hijacked the registry route.\n  perf_phase network_cleanup python3 deploy/docker_network_guard.py cleanup --project "$PROJECT"\n\n  local timeout backend_port frontend_port\n''', 'network-guard-cleanup')
          text = replace_once(text, '  verify_feishu_consumer_host\n', '  verify_feishu_consumer_host || return $?\n', 'verify-feishu-propagate')
          text = replace_once(text, '''  compose run --rm -e PRODUCTION_RUNTIME_EVIDENCE=/workspace/validation/production_runtime_result.json release-runner \\\n    python deploy/production_runtime_verify.py\n''', '''  compose run --rm -e PRODUCTION_RUNTIME_EVIDENCE=/workspace/validation/production_runtime_result.json release-runner \\\n    python deploy/production_runtime_verify.py || return $?\n''', 'runtime-verify-propagate')
          text = replace_once(text, '''    --feishu-evidence validation/feishu_long_connection_runtime.json \\\n    --out validation/exact_source_binding_result.json\n''', '''    --feishu-evidence validation/feishu_long_connection_runtime.json \\\n    --out validation/exact_source_binding_result.json || return $?\n''', 'exact-binding-propagate')
          p.write_text(text, encoding='utf-8')

          p = Path('.github/workflows/production-deploy.yml')
          text = p.read_text(encoding='utf-8')
          anchor = '''    timeout-minutes: 90\n    steps:\n      - name: Checkout exact master\n'''
          block = '''    timeout-minutes: 90\n    steps:\n      - name: Repair self-hosted workspace before checkout\n        shell: bash\n        run: |\n          set -euo pipefail\n          docker info >/dev/null\n          docker image inspect python:3.12-slim >/dev/null\n          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" python:3.12-slim \\\n            sh -lc 'find /workspace -mindepth 1 -maxdepth 1 -exec rm -rf {} +'\n          test -z "$(find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)"\n          echo "PRODUCTION_RUNNER_WORKSPACE_REPAIR=PASS"\n\n      - name: Checkout exact master\n'''
          text = replace_once(text, anchor, block, 'production-precheckout-repair')
          p.write_text(text, encoding='utf-8')

          p = Path('backend/tests/test_cicd_performance_v2.py')
          text = p.read_text(encoding='utf-8')
          if 'test_production_offline_build_is_explicitly_fail_closed' not in text:
              text += '''\n\ndef test_production_offline_build_is_explicitly_fail_closed():\n    deploy = (ROOT / "deploy/voip-ai").read_text(encoding="utf-8")\n    assert deploy.count('offline_rc="$?"') == 2\n    assert "PRODUCTION_IMAGE_BUILD=FAIL mode=OFFLINE_LOCAL_INVENTORY source=REGISTRY_PREFLIGHT" in deploy\n    assert "PRODUCTION_IMAGE_BUILD=FAIL mode=OFFLINE_LOCAL_INVENTORY source=POSTBUILD_FALLBACK" in deploy\n    assert "verify_feishu_consumer_host || return $?" in deploy\n    assert "--out validation/exact_source_binding_result.json || return $?" in deploy\n\n\ndef test_offline_build_has_no_external_dockerfile_frontend_dependency():\n    for rel in ("backend/Dockerfile", "frontend/Dockerfile"):\n        text = (ROOT / rel).read_text(encoding="utf-8")\n        assert not text.startswith("# syntax=docker/dockerfile:")\n        assert "RUN --mount=type=cache" in text\n\n\ndef test_production_workflow_repairs_workspace_before_checkout():\n    text = (ROOT / ".github/workflows/production-deploy.yml").read_text(encoding="utf-8")\n    assert text.index("Repair self-hosted workspace before checkout") < text.index("Checkout exact master")\n    assert "PRODUCTION_RUNNER_WORKSPACE_REPAIR=PASS" in text\n\n\ndef test_production_network_is_named_narrow_and_guarded():\n    compose = (ROOT / "docker-compose.production.yml").read_text(encoding="utf-8")\n    deploy = (ROOT / "deploy/voip-ai").read_text(encoding="utf-8")\n    guard = (ROOT / "deploy/docker_network_guard.py").read_text(encoding="utf-8")\n    assert "VOIP_DOCKER_NETWORK_NAME:-aivoip-production" in compose\n    assert "VOIP_DOCKER_SUBNET:-172.30.250.0/24" in compose\n    assert "docker_network_guard.py prepare" in deploy\n    assert "docker_network_guard.py cleanup" in deploy\n    assert "DESIRED_SUBNET_CONTAINS_REGISTRY_MIRROR" in guard\n    assert "LEGACY_CONFLICT_NETWORK_STILL_IN_USE" in guard\n'''
              p.write_text(text, encoding='utf-8')
          PY
