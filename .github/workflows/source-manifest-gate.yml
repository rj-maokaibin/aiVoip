name: Source Manifest Gate

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'profiles/**'
      - 'rules/**'
      - 'knowledge/**'
      - 'tools/**'
      - 'contracts/**'
      - 'deploy/**'
      - 'golden_cases/**'
      - 'docs/02_Core_Documents/Preliminary_Evidence_Report_V1.0/**'
      - 'Makefile'
      - '.env.example'
      - 'docker-compose.yml'
      - 'docker-compose.production.yml'
      - 'docker-compose.e2e.yml'
      - 'release/release_policy.yaml'
      - '.github/workflows/source-manifest-gate.yml'
      - '.github/workflows/prd-spec-v1-release.yml'
      - '.github/workflows/preliminary-evidence-v1.yml'
      - '.github/workflows/production-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-manifest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-source-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source on GitHub-hosted transport
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0

      - name: Build immutable source bundle and derived manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          before="$(git status --porcelain --untracked-files=no)"
          test -z "$before"
          python3 tools/source_manifest_gate.py --write "$RUNNER_TEMP/source_manifest_expected.json"
          test -s "$RUNNER_TEMP/source_manifest_expected.json"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          python3 tools/source_manifest_gate.py --expected "$RUNNER_TEMP/source_manifest_expected.json"
          git branch -f bundle-head "$EXPECTED_SHA"
          git bundle create "$RUNNER_TEMP/source.bundle" refs/heads/bundle-head
          printf '%s\n' "$EXPECTED_SHA" > "$RUNNER_TEMP/source.sha"
          git bundle verify "$RUNNER_TEMP/source.bundle"
          echo "SOURCE_MANIFEST_DERIVED_ARTIFACT=PASS mutation=false revision=$EXPECTED_SHA"
          echo "EXACT_SOURCE_BUNDLE=PASS revision=$EXPECTED_SHA"

      - name: Upload shared immutable source bundle
        uses: actions/upload-artifact@v4
        with:
          name: exact-source-${{ env.EXPECTED_SHA }}
          path: |
            ${{ runner.temp }}/source.bundle
            ${{ runner.temp }}/source.sha
            ${{ runner.temp }}/source_manifest_expected.json
          if-no-files-found: error
          retention-days: 1

  source-manifest:
    needs: exact-source-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Download shared immutable source bundle
        uses: actions/download-artifact@v4
        with:
          name: exact-source-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/exact-source

      - name: Materialize exact source offline
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/exact-source/source.bundle"
          sha_file="$RUNNER_TEMP/exact-source/source.sha"
          manifest="$RUNNER_TEMP/exact-source/source_manifest_expected.json"
          test -s "$bundle"
          test -s "$manifest"
          test "$(cat "$sha_file")" = "$EXPECTED_SHA"
          cd "$RUNNER_TEMP"
          rm -rf "$GITHUB_WORKSPACE"
          git clone -q -b bundle-head "$bundle" "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" checkout -q --detach "$EXPECTED_SHA"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git -C "$GITHUB_WORKSPACE" status --porcelain --untracked-files=no)"
          echo "EXACT_SOURCE_MATERIALIZATION=PASS revision=$EXPECTED_SHA"

      - name: Verify derived source manifest is exact
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_MANIFEST_HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 tools/source_manifest_gate.py --expected "$RUNNER_TEMP/exact-source/source_manifest_expected.json"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "SOURCE_MANIFEST_PR_GATE=PASS mode=DERIVED_ARTIFACT"

      - name: Verify production Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          bash tools/production_compose_config_gate.sh

  temporary-g0-recovery-observe:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'fix/g0-authority-keepalive-recovery' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner
    needs: exact-source-bundle
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      G0_ENV_FILE: /home/github-runner/.config/voip-ai/.env
      OBS_VENV: /tmp/voip-ai-g0-observe-${{ github.run_id }}-${{ github.run_attempt }}
      OBS_RUNTIME_ROOT: /tmp/voip-ai-g0-observe-runtime-${{ github.run_id }}-${{ github.run_attempt }}
      OBS_OUTPUT: validation/g0_recovery_observe.json
    steps:
      - name: Repair self-hosted workspace before offline materialization
        shell: bash
        run: |
          set -euo pipefail
          docker info >/dev/null
          docker image inspect python:3.12-slim >/dev/null
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" python:3.12-slim \
            sh -lc 'find /workspace -mindepth 1 -maxdepth 1 -exec rm -rf {} +'
          test -z "$(find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)"

      - name: Download exact source bundle
        uses: actions/download-artifact@v4
        with:
          name: exact-source-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/g0-recovery-exact-source

      - name: Materialize exact PR head offline
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/g0-recovery-exact-source/source.bundle"
          sha_file="$RUNNER_TEMP/g0-recovery-exact-source/source.sha"
          test -s "$bundle"
          test "$(cat "$sha_file")" = "$EXPECTED_SHA"
          rm -rf "$GITHUB_WORKSPACE"
          git clone -q -b bundle-head "$bundle" "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" checkout -q --detach "$EXPECTED_SHA"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git -C "$GITHUB_WORKSPACE" status --porcelain --untracked-files=no)"
          echo "G0_RECOVERY_EXACT_SOURCE=PASS revision=$EXPECTED_SHA"

      - name: Prepare read-only runtime and resolve DUT
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -r "$G0_ENV_FILE"
          rm -rf "$OBS_VENV" "$OBS_RUNTIME_ROOT"
          mkdir -p "$OBS_RUNTIME_ROOT" validation
          chmod 0700 "$OBS_RUNTIME_ROOT"
          python3 -m venv "$OBS_VENV"
          "$OBS_VENV/bin/pip" install --disable-pip-version-check -q -r backend/requirements.txt
          set -a
          source "$G0_ENV_FILE"
          set +a
          export PYTHONPATH="$GITHUB_WORKSPACE/backend"
          "$OBS_VENV/bin/python" tools/resolve_real_sip_aba_database_env.py > "$OBS_RUNTIME_ROOT/production_db.env"
          chmod 0600 "$OBS_RUNTIME_ROOT/production_db.env"
          set -a
          source "$OBS_RUNTIME_ROOT/production_db.env"
          set +a
          "$OBS_VENV/bin/python" tools/resolve_real_sip_aba_context.py \
            --output-root validation \
            --runtime-root "$OBS_RUNTIME_ROOT"
          set -a
          source "$OBS_RUNTIME_ROOT/db_runtime.env"
          source "$OBS_RUNTIME_ROOT/resolved_dut.env"
          set +a
          "$OBS_VENV/bin/python" tools/resolve_real_sip_aba_credential_env.py \
            --container "$SIP_ABA_PRODUCTION_CREDENTIAL_CONTAINER" \
            --expected-provider "$SIP_ABA_PRODUCTION_CREDENTIAL_PROVIDER" \
            --sn "$DEVICE_SN" \
            --ip "$DEVICE_HOST" \
            --product "$DEVICE_MODEL" \
            --fallback-user "$DEVICE_USER" \
            --output "$OBS_RUNTIME_ROOT/credential.env"
          chmod 0600 "$OBS_RUNTIME_ROOT/credential.env"

      - name: Observe current G0 state without mutation
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$G0_ENV_FILE"
          source "$OBS_RUNTIME_ROOT/production_db.env"
          source "$OBS_RUNTIME_ROOT/db_runtime.env"
          source "$OBS_RUNTIME_ROOT/resolved_dut.env"
          source "$OBS_RUNTIME_ROOT/credential.env"
          set +a
          export PYTHONPATH="$GITHUB_WORKSPACE/backend"
          args=(
            tools/observe_g0_recovery_state.py
            --device-id "$DEVICE_ID"
            --model "$DEVICE_MODEL"
            --host "$DEVICE_HOST"
            --port "$DEVICE_PORT"
            --username "$SIP_ABA_SSH_USERNAME"
            --password-env "ENV:SIP_ABA_SSH_PASSWORD"
            --failed-probe-marker G0
            --output "$OBS_OUTPUT"
          )
          case "$DEVICE_PLATFORM" in
            mt7621|mt7981) args+=(--platform-id "$DEVICE_PLATFORM") ;;
          esac
          "$OBS_VENV/bin/python" "${args[@]}"
          python3 - <<'PY'
          import json, os
          p=json.load(open(os.environ['OBS_OUTPUT'], encoding='utf-8'))
          assert p.get('read_only') is True, p
          assert p.get('mutation_executed') is False, p
          print('G0_RECOVERY_OBSERVE=PASS')
          PY

      - name: Upload sanitized recovery observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-recovery-observe-${{ github.run_id }}-${{ github.run_attempt }}
          path: validation/g0_recovery_observe.json
          if-no-files-found: warn
          retention-days: 30

      - name: Remove runtime secrets
        if: always()
        shell: bash
        run: |
          rm -rf "$OBS_RUNTIME_ROOT"
