name: Source Manifest Gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-manifest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-source-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source on GitHub-hosted transport
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0

      - name: Build immutable source bundle and derived manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          before="$(git status --porcelain --untracked-files=no)"
          test -z "$before"
          python3 tools/source_manifest_gate.py --write "$RUNNER_TEMP/source_manifest_expected.json"
          test -s "$RUNNER_TEMP/source_manifest_expected.json"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          python3 tools/source_manifest_gate.py --expected "$RUNNER_TEMP/source_manifest_expected.json"
          git branch -f bundle-head "$EXPECTED_SHA"
          git bundle create "$RUNNER_TEMP/source.bundle" refs/heads/bundle-head
          printf '%s\n' "$EXPECTED_SHA" > "$RUNNER_TEMP/source.sha"
          git bundle verify "$RUNNER_TEMP/source.bundle"
          echo "SOURCE_MANIFEST_DERIVED_ARTIFACT=PASS mutation=false revision=$EXPECTED_SHA"
          echo "EXACT_SOURCE_BUNDLE=PASS revision=$EXPECTED_SHA"

      - name: Upload shared immutable source bundle
        uses: actions/upload-artifact@v4
        with:
          name: exact-source-${{ env.EXPECTED_SHA }}
          path: |
            ${{ runner.temp }}/source.bundle
            ${{ runner.temp }}/source.sha
            ${{ runner.temp }}/source_manifest_expected.json
          if-no-files-found: error
          retention-days: 1

  source-manifest:
    needs: exact-source-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Download shared immutable source bundle
        uses: actions/download-artifact@v4
        with:
          name: exact-source-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/exact-source

      - name: Materialize exact source offline
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/exact-source/source.bundle"
          sha_file="$RUNNER_TEMP/exact-source/source.sha"
          manifest="$RUNNER_TEMP/exact-source/source_manifest_expected.json"
          test -s "$bundle"
          test -s "$manifest"
          test "$(cat "$sha_file")" = "$EXPECTED_SHA"
          cd "$RUNNER_TEMP"
          rm -rf "$GITHUB_WORKSPACE"
          git clone -q -b bundle-head "$bundle" "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" checkout -q --detach "$EXPECTED_SHA"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git -C "$GITHUB_WORKSPACE" status --porcelain --untracked-files=no)"
          echo "EXACT_SOURCE_MATERIALIZATION=PASS revision=$EXPECTED_SHA"

      - name: Verify derived source manifest is exact
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_MANIFEST_HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 tools/source_manifest_gate.py --expected "$RUNNER_TEMP/exact-source/source_manifest_expected.json"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "SOURCE_MANIFEST_PR_GATE=PASS mode=DERIVED_ARTIFACT"

      - name: Verify production Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          bash tools/production_compose_config_gate.sh
