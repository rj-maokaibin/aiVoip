name: Source Manifest Gate

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'profiles/**'
      - 'rules/**'
      - 'knowledge/**'
      - 'tools/**'
      - 'contracts/**'
      - 'deploy/**'
      - 'Makefile'
      - '.env.example'
      - 'docker-compose.yml'
      - 'docker-compose.production.yml'
      - 'docker-compose.e2e.yml'
      - 'release/release_policy.yaml'
      - 'release/source_manifest.json'
      - '.github/workflows/source-manifest-gate.yml'
      - '.github/workflows/production-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-manifest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-source-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head on GitHub-hosted transport
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Build immutable Git bundle
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git branch -f bundle-head "$EXPECTED_SHA"
          git bundle create "$RUNNER_TEMP/source.bundle" refs/heads/bundle-head
          printf '%s\n' "$EXPECTED_SHA" > "$RUNNER_TEMP/source.sha"
          git bundle verify "$RUNNER_TEMP/source.bundle"
          echo "EXACT_SOURCE_BUNDLE=PASS revision=$EXPECTED_SHA"

      - name: Upload immutable source bundle
        uses: actions/upload-artifact@v4
        with:
          name: exact-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/source.bundle
            ${{ runner.temp }}/source.sha
          if-no-files-found: error
          retention-days: 1

  source-manifest:
    needs: exact-source-bundle
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Reset self-hosted workspace
        shell: bash
        run: |
          set -euo pipefail
          docker info >/dev/null
          docker image inspect python:3.12-slim >/dev/null
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" python:3.12-slim \
            sh -lc 'find /workspace -mindepth 1 -maxdepth 1 -exec rm -rf {} +'
          test -z "$(find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)"

      - name: Download immutable source bundle
        uses: actions/download-artifact@v4
        with:
          name: exact-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exact-source

      - name: Materialize exact PR source offline
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/exact-source/source.bundle"
          sha_file="$RUNNER_TEMP/exact-source/source.sha"
          test -s "$bundle"
          test "$(cat "$sha_file")" = "$EXPECTED_SHA"
          git clone -q -b bundle-head "$bundle" "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" checkout -q --detach "$EXPECTED_SHA"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git -C "$GITHUB_WORKSPACE" status --porcelain --untracked-files=no)"
          echo "EXACT_SOURCE_MATERIALIZATION=PASS revision=$EXPECTED_SHA"

      - name: Verify source manifest is exact
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_MANIFEST_HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 tools/source_manifest_gate.py
          echo "SOURCE_MANIFEST_PR_GATE=PASS"

      - name: Verify production Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          bash tools/production_compose_config_gate.sh
