name: Current WEB Auth Source Probe

on:
  pull_request:
    branches: [master]
    paths:
      - "tools/probe_current_web_auth_source.py"
      - "tools/probe_dut_web_auth_source_ssh.py"
      - ".github/workflows/current-web-auth-source-probe.yml"
      - "backend/app/automation/adapters/web_auth/**"
      - "backend/app/automation/gates/golden_web_config.py"
      - "profiles/web_api/**"

permissions:
  contents: read

jobs:
  exact-source-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head on GitHub-hosted transport
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0

      - name: Build immutable source bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git branch -f bundle-head "$EXPECTED_SHA"
          git bundle create "$RUNNER_TEMP/source.bundle" refs/heads/bundle-head
          printf '%s\n' "$EXPECTED_SHA" > "$RUNNER_TEMP/source.sha"
          git bundle verify "$RUNNER_TEMP/source.bundle"

      - name: Upload exact source bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-auth-exact-source-${{ env.EXPECTED_SHA }}
          path: |
            ${{ runner.temp }}/source.bundle
            ${{ runner.temp }}/source.sha
          if-no-files-found: error
          retention-days: 1

  read-only-web-auth-source:
    needs: exact-source-bundle
    runs-on: [self-hosted, linux, x64, voip-controlled-linux]
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      AUTH_ENV_FILE: /home/github-runner/.config/voip-ai/.env
      AUTH_PROBE_VENV: /tmp/voip-web-auth-source-${{ github.run_id }}-${{ github.run_attempt }}
      AUTH_RUNTIME_ROOT: /tmp/voip-web-auth-source-runtime-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Repair self-hosted workspace before offline materialization
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect python:3.12-slim >/dev/null
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" python:3.12-slim \
            sh -lc 'find /workspace -mindepth 1 -maxdepth 1 -exec rm -rf {} +'

      - name: Download exact source bundle
        uses: actions/download-artifact@v4
        with:
          name: web-auth-exact-source-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/web-auth-exact-source

      - name: Materialize exact PR head offline
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/web-auth-exact-source/source.bundle"
          sha_file="$RUNNER_TEMP/web-auth-exact-source/source.sha"
          test -s "$bundle"
          test "$(cat "$sha_file")" = "$EXPECTED_SHA"
          cd "$RUNNER_TEMP"
          rm -rf "$GITHUB_WORKSPACE"
          git clone -q -b bundle-head "$bundle" "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" checkout -q --detach "$EXPECTED_SHA"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git -C "$GITHUB_WORKSPACE" status --porcelain --untracked-files=no)"
          echo "WEB_AUTH_EXACT_SOURCE=PASS revision=$EXPECTED_SHA"

      - name: Probe current Golden DUT public WEB auth source without credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          out="/tmp/current-web-auth-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          python3 tools/probe_current_web_auth_source.py \
            --base-url 'https://10.48.8.74:10003' \
            --output "$out"
          mkdir -p web-auth-source-evidence
          cp "$out" web-auth-source-evidence/public-source-probe.json

      - name: Prepare isolated read-only SSH source runtime
        shell: bash
        run: |
          set -euo pipefail
          test -r "$AUTH_ENV_FILE"
          rm -rf "$AUTH_PROBE_VENV" "$AUTH_RUNTIME_ROOT"
          mkdir -p "$AUTH_RUNTIME_ROOT"
          chmod 0700 "$AUTH_RUNTIME_ROOT"
          python3 -m venv "$AUTH_PROBE_VENV"
          "$AUTH_PROBE_VENV/bin/pip" install --disable-pip-version-check -q -r backend/requirements.txt

      - name: Resolve production DUT and existing SSH credential read-only
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$AUTH_ENV_FILE"
          set +a
          export PYTHONPATH="$GITHUB_WORKSPACE/backend"
          "$AUTH_PROBE_VENV/bin/python" tools/resolve_real_sip_aba_database_env.py > "$AUTH_RUNTIME_ROOT/production_db.env"
          chmod 0600 "$AUTH_RUNTIME_ROOT/production_db.env"
          set -a
          source "$AUTH_RUNTIME_ROOT/production_db.env"
          set +a
          "$AUTH_PROBE_VENV/bin/python" tools/resolve_real_sip_aba_context.py \
            --output-root "$AUTH_RUNTIME_ROOT/context-evidence" \
            --runtime-root "$AUTH_RUNTIME_ROOT"
          set -a
          source "$AUTH_RUNTIME_ROOT/db_runtime.env"
          source "$AUTH_RUNTIME_ROOT/resolved_dut.env"
          set +a
          "$AUTH_PROBE_VENV/bin/python" tools/resolve_real_sip_aba_credential_env.py \
            --container "$SIP_ABA_PRODUCTION_CREDENTIAL_CONTAINER" \
            --expected-provider "$SIP_ABA_PRODUCTION_CREDENTIAL_PROVIDER" \
            --sn "$DEVICE_SN" \
            --ip "$DEVICE_HOST" \
            --product "$DEVICE_MODEL" \
            --fallback-user "$DEVICE_USER" \
            --output "$AUTH_RUNTIME_ROOT/credential.env"
          chmod 0600 "$AUTH_RUNTIME_ROOT/credential.env"
          echo 'DUT_WEB_AUTH_SOURCE_CREDENTIAL_RESOLUTION=PASS mutation=false'

      - name: Probe PBX provider source read-only
        shell: bash
        run: |
          set -euo pipefail
          test -r "$AUTH_ENV_FILE"
          mkdir -p web-auth-source-evidence
          python3 - "$AUTH_ENV_FILE" <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess
          import sys

          env_path = Path(sys.argv[1])
          key_pattern = re.compile(
              r"(?:PBX|FUSION|FREESWITCH|(?:^|_)FS_|EXTENSION|ALIAS|SIP.*(?:HOST|URL|API|PBX))",
              re.IGNORECASE,
          )
          env_keys = []
          for raw in env_path.read_text(encoding="utf-8", errors="ignore").splitlines():
              line = raw.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key = line.split("=", 1)[0].strip()
              if key.startswith("export "):
                  key = key[7:].strip()
              if re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*", key) and key_pattern.search(key):
                  env_keys.append(key)

          fusion_roots = [
              Path("/var/www/fusionpbx"),
              Path("/usr/share/fusionpbx"),
              Path("/opt/fusionpbx"),
          ]
          present_roots = [str(path) for path in fusion_roots if path.is_dir()]
          root = next((path for path in fusion_roots if path.is_dir()), None)

          source_markers = []
          if root is not None:
              marker_candidates = [
                  root / "app/extensions",
                  root / "app/api",
                  root / "app/commands",
                  root / "resources/classes",
                  root / "core",
              ]
              source_markers = [str(path.relative_to(root)) for path in marker_candidates if path.exists()]
              for base in (root / "app", root / "core"):
                  if not base.is_dir():
                      continue
                  for path in base.rglob("*"):
                      if not path.is_file():
                          continue
                      name = path.name.lower()
                      if any(token in name for token in ("extension", "api", "command")):
                          source_markers.append(str(path.relative_to(root)))
                          if len(source_markers) >= 50:
                              break
                  if len(source_markers) >= 50:
                      break

          def run_text(argv):
              try:
                  completed = subprocess.run(
                      argv,
                      check=False,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.DEVNULL,
                      text=True,
                      timeout=5,
                  )
              except Exception:
                  return None
              value = completed.stdout.strip()
              return value or None

          freeswitch_state = run_text(["systemctl", "is-active", "freeswitch"])
          fusion_git_revision = None
          if root is not None and (root / ".git").exists():
              fusion_git_revision = run_text(["git", "-C", str(root), "rev-parse", "HEAD"])

          docker_names = []
          docker_output = run_text(["docker", "ps", "--format", "{{.Names}}"])
          if docker_output:
              for name in docker_output.splitlines():
                  if re.search(r"(?:pbx|fusion|freeswitch)", name, re.IGNORECASE):
                      docker_names.append(name)

          payload = {
              "mutation_executed": False,
              "secret_values_emitted": False,
              "runner_env_matching_key_names": sorted(set(env_keys)),
              "fs_cli_path": shutil.which("fs_cli"),
              "freeswitch_service_state": freeswitch_state,
              "fusionpbx_roots": present_roots,
              "fusionpbx_git_revision": fusion_git_revision,
              "fusionpbx_source_markers": sorted(set(source_markers))[:50],
              "pbx_related_running_container_names": sorted(set(docker_names)),
              "freeswitch_config_roots": [
                  path for path in (
                      "/etc/freeswitch",
                      "/usr/local/freeswitch/conf",
                      "/usr/share/freeswitch",
                  ) if Path(path).exists()
              ],
          }
          out = Path("web-auth-source-evidence/pbx-provider-source-probe.json")
          out.write_text(json.dumps(payload, ensure_ascii=False, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({
              "PBX_PROVIDER_SOURCE_PROBE": "PASS",
              "mutation": False,
              "secret_values_emitted": False,
              "matching_key_count": len(payload["runner_env_matching_key_names"]),
              "fusionpbx_present": bool(payload["fusionpbx_roots"]),
              "fs_cli_present": bool(payload["fs_cli_path"]),
          }, sort_keys=True))
          PY

      - name: Probe DUT packaged WEB auth source over SSH read-only
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$AUTH_RUNTIME_ROOT/resolved_dut.env"
          source "$AUTH_RUNTIME_ROOT/credential.env"
          set +a
          export PYTHONPATH="$GITHUB_WORKSPACE/backend"
          "$AUTH_PROBE_VENV/bin/python" tools/probe_dut_web_auth_source_ssh.py \
            --device-id "$DEVICE_ID" \
            --model "$DEVICE_MODEL" \
            --host "$DEVICE_HOST" \
            --port "$DEVICE_PORT" \
            --username "$SIP_ABA_SSH_USERNAME" \
            --password-env 'ENV:SIP_ABA_SSH_PASSWORD' \
            --platform-id "$DEVICE_PLATFORM" \
            --output web-auth-source-evidence/dut-static-source-probe.json
          echo 'DUT_WEB_AUTH_STATIC_SOURCE_MUTATION=NOT_EXECUTED'

      - name: Upload read-only source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-web-auth-source-${{ env.EXPECTED_SHA }}
          path: web-auth-source-evidence/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove runtime credentials
        if: always()
        shell: bash
        run: |
          rm -rf "$AUTH_RUNTIME_ROOT" "$AUTH_PROBE_VENV"
