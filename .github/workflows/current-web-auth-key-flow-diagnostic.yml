name: Current WEB Auth Key Flow Diagnostic

on:
  pull_request:
    branches:
      - feat/generic-voip-automation-v1-pr-d-web-golden
    paths:
      - ".github/workflows/current-web-auth-key-flow-diagnostic.yml"

permissions:
  contents: read

jobs:
  read-only-auth-key-flow:
    runs-on: [self-hosted, linux, x64, voip-controlled-linux]
    timeout-minutes: 12
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      PROBE_ENV_FILE: /home/github-runner/.config/voip-ai/.env
      PROBE_VENV: /tmp/voip-web-auth-key-flow-${{ github.run_id }}-${{ github.run_attempt }}
      WEB_BASE_URL: https://10.48.8.74:10003

    steps:
      - name: Repair workspace
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect python:3.12-slim >/dev/null
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" python:3.12-slim \
            sh -lc 'find /workspace -mindepth 1 -maxdepth 1 -exec rm -rf {} +'
          rm -rf "$PROBE_VENV"

      - name: Materialize exact diagnostic head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          actual="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "${api}/commits/${EXPECTED_SHA}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          test "$actual" = "$EXPECTED_SHA"
          archive="$RUNNER_TEMP/web-auth-key-flow-${EXPECTED_SHA}.tar.gz"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "${api}/tarball/${EXPECTED_SHA}" -o "$archive"
          test -s "$archive"
          tar -xzf "$archive" -C "$GITHUB_WORKSPACE" --strip-components=1
          echo "WEB_AUTH_KEY_FLOW_EXACT_HEAD=PASS revision=$EXPECTED_SHA"

      - name: Prepare isolated runtime
        shell: bash
        run: |
          set -euo pipefail
          test -r "$PROBE_ENV_FILE"
          test "$(stat -c '%a' "$PROBE_ENV_FILE")" = '600'
          python3 -m venv "$PROBE_VENV"
          "$PROBE_VENV/bin/pip" install --disable-pip-version-check -q -r backend/requirements.txt

      - name: Compare rendered encryption key and perform one read-only login
        shell: bash
        run: |
          set -euo pipefail
          set -a; source "$PROBE_ENV_FILE"; set +a
          : "${WEB_USERNAME:?WEB_USERNAME_RUNTIME_REQUIRED}"
          : "${WEB_PASSWORD:?WEB_PASSWORD_RUNTIME_REQUIRED}"
          export PYTHONPATH="$GITHUB_WORKSPACE/backend"
          "$PROBE_VENV/bin/python" - <<'PY'
          import asyncio
          import json
          import os
          import re
          import time
          from collections.abc import Mapping

          import httpx

          from app.automation.adapters.web_auth.apf3260m import (
              APF3260M_DEFAULT_AES_PASSPHRASE,
              Apf3260mGibberishAesPasswordEncoder,
              build_apf3260m_luci_auth_provider,
          )
          from app.infrastructure.transport.http import HttpApiTransport, HttpRequest, HttpRetryPolicy

          def extract_key(text: str):
              patterns = (
                  r'GibberishAES\.enc\s*\(\s*[^,\n]+,\s*(["\'])([^"\']+)\1',
                  r'GibberishAES\.enc\s*\(\s*[^,\n]+,\s*`([^`]+)`',
              )
              for p in patterns:
                  m = re.search(p, text, re.I)
                  if m:
                      return m.group(2) if m.lastindex and m.lastindex >= 2 else m.group(1)
              return None

          async def main():
              base = os.environ['WEB_BASE_URL']
              async with httpx.AsyncClient(base_url=base, verify=False, timeout=15.0) as page_client:
                  page = await page_client.get('/cgi-bin/luci/')
                  page_text = page.text[:1_000_000]
              rendered_key = extract_key(page_text)
              result = {
                  'schema': 'current-web-auth-rendered-key-v1',
                  'mutation_executed': False,
                  'secret_values_emitted': False,
                  'page_status': page.status_code,
                  'gibberish_aes_present': bool(re.search(r'GibberishAES\.enc', page_text, re.I)),
                  'rendered_key_found': bool(rendered_key),
                  'rendered_key_length': len(rendered_key) if rendered_key else 0,
                  'rendered_key_equals_current_default': bool(rendered_key and rendered_key == APF3260M_DEFAULT_AES_PASSPHRASE),
              }
              if not rendered_key:
                  result['login_attempted'] = False
                  print(json.dumps(result, sort_keys=True))
                  return

              provider = build_apf3260m_luci_auth_provider(
                  timestamp_provider=lambda: str(int(time.time())),
                  password_encoder=Apf3260mGibberishAesPasswordEncoder(passphrase=rendered_key),
              )
              client = httpx.AsyncClient(base_url=base, verify=False, timeout=15.0)
              transport = HttpApiTransport(base, client=client)
              password = os.environ['WEB_PASSWORD']
              encoded = provider.password_encoder(password)
              payload = dict(provider.login_payload_builder(os.environ['WEB_USERNAME'], encoded))
              try:
                  response = await transport.request(
                      HttpRequest(
                          method='POST', path=provider.login_endpoint, json_body=payload,
                          mutation=False, sensitive_values=(password, encoded, rendered_key),
                      ),
                      retry_policy=HttpRetryPolicy(max_attempts=1),
                  )
                  body = response.json_body
                  data = body.get('data') if isinstance(body, Mapping) else None
                  result.update({
                      'login_attempted': True,
                      'http_success': response.success,
                      'protocol_success': provider.protocol_success(response),
                      'sid_extracted': bool(provider.sid_extractor(response)),
                      'data_type': type(data).__name__,
                      'data_key_names': sorted(str(k) for k in data.keys()) if isinstance(data, Mapping) else [],
                      'msg_empty': (str(data.get('msg') or '') == '') if isinstance(data, Mapping) and 'msg' in data else None,
                      'reload_value': bool(data.get('reload')) if isinstance(data, Mapping) and isinstance(data.get('reload'), bool) else None,
                  })
              finally:
                  password = ''
                  encoded = ''
                  payload = {}
                  rendered_key = ''
                  page_text = ''
                  await client.aclose()
              print(json.dumps(result, sort_keys=True))

          asyncio.run(main())
          PY

      - name: Remove isolated runtime
        if: always()
        shell: bash
        run: |
          rm -rf "$PROBE_VENV"
