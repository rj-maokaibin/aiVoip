name: Current WEB Auth Key Flow Diagnostic

on:
  pull_request:
    branches:
      - feat/generic-voip-automation-v1-pr-d-web-golden
    paths:
      - ".github/workflows/current-web-auth-key-flow-diagnostic.yml"

permissions:
  contents: read

jobs:
  read-only-auth-key-flow:
    runs-on: [self-hosted, linux, x64, voip-controlled-linux]
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      PROBE_ENV_FILE: /home/github-runner/.config/voip-ai/.env
      PROBE_VENV: /tmp/voip-web-auth-key-flow-${{ github.run_id }}-${{ github.run_attempt }}
      RUNTIME_ROOT: /tmp/voip-web-auth-key-flow-runtime-${{ github.run_id }}-${{ github.run_attempt }}
      WEB_BASE_URL: https://10.48.8.74:10003

    steps:
      - name: Repair workspace
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect python:3.12-slim >/dev/null
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" python:3.12-slim \
            sh -lc 'find /workspace -mindepth 1 -maxdepth 1 -exec rm -rf {} +'
          rm -rf "$PROBE_VENV" "$RUNTIME_ROOT"
          mkdir -p "$RUNTIME_ROOT"
          chmod 0700 "$RUNTIME_ROOT"

      - name: Materialize exact diagnostic head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          actual="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "${api}/commits/${EXPECTED_SHA}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          test "$actual" = "$EXPECTED_SHA"
          archive="$RUNNER_TEMP/web-auth-key-flow-${EXPECTED_SHA}.tar.gz"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "${api}/tarball/${EXPECTED_SHA}" -o "$archive"
          test -s "$archive"
          tar -xzf "$archive" -C "$GITHUB_WORKSPACE" --strip-components=1
          echo "WEB_AUTH_KEY_FLOW_EXACT_HEAD=PASS revision=$EXPECTED_SHA"

      - name: Prepare isolated runtime and resolve DUT read-only
        shell: bash
        run: |
          set -euo pipefail
          test -r "$PROBE_ENV_FILE"
          test "$(stat -c '%a' "$PROBE_ENV_FILE")" = '600'
          python3 -m venv "$PROBE_VENV"
          "$PROBE_VENV/bin/pip" install --disable-pip-version-check -q -r backend/requirements.txt
          set -a
          source "$PROBE_ENV_FILE"
          set +a
          : "${WEB_USERNAME:?WEB_USERNAME_RUNTIME_REQUIRED}"
          : "${WEB_PASSWORD:?WEB_PASSWORD_RUNTIME_REQUIRED}"
          export PYTHONPATH="$GITHUB_WORKSPACE/backend"
          "$PROBE_VENV/bin/python" tools/resolve_real_sip_aba_database_env.py > "$RUNTIME_ROOT/production_db.env"
          chmod 0600 "$RUNTIME_ROOT/production_db.env"
          set -a; source "$RUNTIME_ROOT/production_db.env"; set +a
          "$PROBE_VENV/bin/python" tools/resolve_real_sip_aba_context.py --output-root "$RUNTIME_ROOT/context" --runtime-root "$RUNTIME_ROOT"
          set -a
          source "$RUNTIME_ROOT/db_runtime.env"
          source "$RUNTIME_ROOT/resolved_dut.env"
          set +a
          "$PROBE_VENV/bin/python" tools/resolve_real_sip_aba_credential_env.py \
            --container "$SIP_ABA_PRODUCTION_CREDENTIAL_CONTAINER" \
            --expected-provider "$SIP_ABA_PRODUCTION_CREDENTIAL_PROVIDER" \
            --sn "$DEVICE_SN" --ip "$DEVICE_HOST" --product "$DEVICE_MODEL" \
            --fallback-user "$DEVICE_USER" --output "$RUNTIME_ROOT/device_credential.env"
          chmod 0600 "$RUNTIME_ROOT/device_credential.env"

      - name: Prove dynamic auth key source and one keyed login read-only
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$PROBE_ENV_FILE"
          source "$RUNTIME_ROOT/resolved_dut.env"
          source "$RUNTIME_ROOT/device_credential.env"
          set +a
          export PYTHONPATH="$GITHUB_WORKSPACE/backend"
          "$PROBE_VENV/bin/python" - <<'PY'
          import asyncio
          import json
          import os
          import re
          import time
          from collections.abc import Mapping
          from urllib.parse import urlparse

          import httpx

          from app.automation.adapters.web_auth.apf3260m import (
              Apf3260mGibberishAesPasswordEncoder,
              build_apf3260m_luci_auth_provider,
          )
          from app.capture_v2.gate.context import build_asyncssh_adapter
          from app.capture_v2.gate.models import GateDeviceSpec
          from app.infrastructure.transport.http import HttpApiTransport, HttpRequest, HttpRetryPolicy

          LOGIN_SOURCE = '/usr/lib/lua/luci/view/login.htm'
          LOGFILE_SOURCES = ('/usr/lib/lua/luci/utils/logFile.lua', '/rom/usr/lib/lua/luci/utils/logFile.lua')
          NOAUTH_SOURCE = '/usr/lib/lua/luci/modules/noauth.lua'
          SUFFIX = 'Ykhwzx$2018!'

          def safe_ids(text):
              out=[]
              for t in re.findall(r'[A-Za-z_][A-Za-z0-9_.:]*', text):
                  if t not in out:
                      out.append(t)
              return out[:80]

          def source_facts(login_source, logfile_source, noauth_source):
              sctm_context=[]
              for m in re.finditer(r'sctM', login_source, re.I):
                  frag=login_source[max(0,m.start()-220):m.end()+350]
                  sctm_context.append({
                      'identifiers':safe_ids(frag),
                      'has_gibberish_aes':bool(re.search(r'GibberishAES',frag,re.I)),
                      'has_auth_endpoint':bool(re.search(r'/cgi-bin/luci/api/auth',frag,re.I)),
                      'has_login_literal':bool(re.search(r'["\']login["\']',frag)),
                      'source_text_emitted':False,
                  })
              logfile_functions=sorted(set(re.findall(r'function\s+([A-Za-z_][A-Za-z0-9_.:]*)\s*\(',logfile_source)))
              return {
                  'login_source_present':bool(login_source),
                  'login_has_sctM':bool(re.search(r'sctM',login_source,re.I)),
                  'login_has_gibberish_aes':bool(re.search(r'GibberishAES',login_source,re.I)),
                  'login_has_auth_endpoint':bool(re.search(r'/cgi-bin/luci/api/auth',login_source,re.I)),
                  'sctm_contexts':sctm_context[:10],
                  'logfile_source_present':bool(logfile_source),
                  'logfile_get_user_key_present':bool(re.search(r'getUserKey',logfile_source)),
                  'logfile_set_user_key_present':bool(re.search(r'setUserKey',logfile_source)),
                  'logfile_function_names':[x for x in logfile_functions if re.search(r'key|user|auth|login',x,re.I)][:30],
                  'noauth_get_user_key_before_decry':bool(re.search(r'getUserKey[\s\S]{0,600}tool\.decry',noauth_source)),
                  'source_text_emitted':False,
              }

          async def read_source(ssh, path):
              cp=await ssh.execute_shell("cat '"+path+"' 2>/dev/null",timeout=30,retries=1)
              return cp.stdout or '' if cp.exit_status==0 else ''

          def extract_sctm(text):
              patterns=(
                  r'(?:window\.)?sctM\s*=\s*["\']([^"\']+)["\']',
                  r'["\']sctM["\']\s*:\s*["\']([^"\']+)["\']',
              )
              for p in patterns:
                  m=re.search(p,text)
                  if m and m.group(1):
                      return m.group(1)
              return None

          async def main():
              spec=GateDeviceSpec(
                  device_id=os.environ['DEVICE_ID'],model=os.environ['DEVICE_MODEL'],
                  host=os.environ['DEVICE_HOST'],port=int(os.environ.get('DEVICE_PORT') or '22'),
                  username=os.environ['SIP_ABA_SSH_USERNAME'],platform_id=os.environ.get('DEVICE_PLATFORM') or None,
              )
              ssh=build_asyncssh_adapter(spec,password_env='ENV:SIP_ABA_SSH_PASSWORD')
              await ssh.connect()
              try:
                  login_source=await read_source(ssh,LOGIN_SOURCE)
                  noauth_source=await read_source(ssh,NOAUTH_SOURCE)
                  logfile_source=''
                  for p in LOGFILE_SOURCES:
                      logfile_source=await read_source(ssh,p)
                      if logfile_source:
                          break
              finally:
                  await ssh.disconnect()

              pages=[]; dynamic_key=None; dynamic_key_path=None
              async with httpx.AsyncClient(base_url=os.environ['WEB_BASE_URL'],verify=False,follow_redirects=True,timeout=15.0) as page_client:
                  for path in ('/','/cgi-bin/luci/','/cgi-bin/luci/admin'):
                      try:
                          r=await page_client.get(path)
                          text=r.text[:500000]
                          key=extract_sctm(text)
                          pages.append({
                              'requested_path':path,
                              'status_code':r.status_code,
                              'final_path':urlparse(str(r.url)).path or '/',
                              'sctM_present':bool(re.search(r'sctM',text,re.I)),
                              'gibberish_aes_present':bool(re.search(r'GibberishAES',text,re.I)),
                              'dynamic_key_extracted':bool(key),
                              'dynamic_key_length':len(key) if key else 0,
                              'page_text_emitted':False,
                          })
                          if key and dynamic_key is None:
                              dynamic_key=key; dynamic_key_path=path
                      except Exception as exc:
                          pages.append({'requested_path':path,'error_type':type(exc).__name__,'page_text_emitted':False})

              login_result={'attempted':False}
              if dynamic_key:
                  passphrase=dynamic_key+SUFFIX
                  provider=build_apf3260m_luci_auth_provider(
                      timestamp_provider=lambda:str(int(time.time())),
                      password_encoder=Apf3260mGibberishAesPasswordEncoder(passphrase=passphrase),
                  )
                  client=httpx.AsyncClient(base_url=os.environ['WEB_BASE_URL'],verify=False,timeout=15.0)
                  transport=HttpApiTransport(os.environ['WEB_BASE_URL'],client=client)
                  password=os.environ['WEB_PASSWORD']; encoded=provider.password_encoder(password)
                  payload=dict(provider.login_payload_builder(os.environ['WEB_USERNAME'],encoded))
                  try:
                      response=await transport.request(HttpRequest(method='POST',path=provider.login_endpoint,json_body=payload,mutation=False,sensitive_values=(password,encoded,dynamic_key,passphrase)),retry_policy=HttpRetryPolicy(max_attempts=1))
                      body=response.json_body; data=body.get('data') if isinstance(body,Mapping) else None
                      login_result={
                          'attempted':True,
                          'http_success':response.success,
                          'protocol_success':provider.protocol_success(response),
                          'data_type':type(data).__name__,
                          'data_key_names':sorted(str(k) for k in data.keys()) if isinstance(data,Mapping) else [],
                          'msg_empty':(str(data.get('msg') or '')=='') if isinstance(data,Mapping) and 'msg' in data else None,
                          'reload_value':bool(data.get('reload')) if isinstance(data,Mapping) and isinstance(data.get('reload'),bool) else None,
                          'sid_extracted':bool(provider.sid_extractor(response)),
                      }
                  finally:
                      password=''; encoded=''; payload={}; passphrase=''
                      await client.aclose()

              result={
                  'schema':'current-web-auth-key-flow-v1',
                  'mutation_executed':False,
                  'secret_values_emitted':False,
                  'pages':pages,
                  'dynamic_key_found':dynamic_key is not None,
                  'dynamic_key_source_path':dynamic_key_path,
                  'source_facts':source_facts(login_source,logfile_source,noauth_source),
                  'dynamic_key_login':login_result,
              }
              print(json.dumps(result,sort_keys=True))
              dynamic_key=''; login_source=''; logfile_source=''; noauth_source=''

          asyncio.run(main())
          PY

      - name: Remove isolated runtime
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNTIME_ROOT" "$PROBE_VENV"
