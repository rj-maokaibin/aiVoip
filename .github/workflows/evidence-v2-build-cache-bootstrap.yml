name: Evidence V2 Build Cache Bootstrap

on:
  push:
    branches:
      - fix/evidence-v2-build-cache-mirrors
    paths:
      - 'backend/Dockerfile'
      - 'backend/tests/test_evidence_v2_production_rollout_contract.py'
      - '.github/workflows/evidence-v2-build-cache-bootstrap.yml'

permissions:
  contents: write

jobs:
  validate-and-regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build backend with domestic mirror preference
        shell: bash
        run: |
          set -euo pipefail
          DOCKER_BUILDKIT=1 docker build --progress=plain \
            -t voip-ai-backend-cache-boundary:${GITHUB_SHA} \
            backend

      - name: Verify rollout cache-boundary contract
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e PYTHONPATH=/app \
            voip-ai-backend-cache-boundary:${GITHUB_SHA} \
            pytest -q tests/test_evidence_v2_production_rollout_contract.py

      - name: Regenerate and verify source manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/source_manifest_gate.py --update
          python3 tools/source_manifest_gate.py

      - name: Commit generated source manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/source_manifest.json
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: regenerate source manifest for build cache optimization'
          git push origin HEAD:fix/evidence-v2-build-cache-mirrors
