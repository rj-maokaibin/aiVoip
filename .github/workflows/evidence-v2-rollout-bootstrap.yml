name: Evidence V2 Rollout Bootstrap

on:
  push:
    branches:
      - feat/evidence-v2-production-rollout
    paths:
      - '.github/workflows/evidence-v2-rollout-bootstrap.yml'
      - '.github/scripts/evidence_v2_patch_deploy.py'

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch governed production entrypoint
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/evidence_v2_patch_deploy.py
          python3 -m py_compile tools/evidence_v2_production_acceptance.py backend/tests/test_evidence_v2_production_rollout_contract.py
          bash -n deploy/voip-ai
          python3 tools/source_manifest_gate.py --update
          python3 tools/source_manifest_gate.py

      - name: Commit generated production closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/voip-ai release/source_manifest.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No generated changes required.'
            exit 0
          fi
          git commit -m 'feat: wire Evidence V2 production rollout acceptance'
          git push origin HEAD:feat/evidence-v2-production-rollout
