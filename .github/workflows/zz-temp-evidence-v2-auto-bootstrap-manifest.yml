name: TEMP Evidence V2 Auto Bootstrap Manifest Refresh

on:
  push:
    branches:
      - fix/evidence-v2-auto-bootstrap
    paths:
      - '.github/workflows/zz-temp-evidence-v2-auto-bootstrap-manifest.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/evidence-v2-auto-bootstrap
          fetch-depth: 0
      - name: Refresh final manifest and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/zz-temp-evidence-v2-auto-bootstrap-manifest.yml
          python3 tools/source_manifest_gate.py --update
          python3 tools/source_manifest_gate.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Refresh source manifest for Evidence V2 auto bootstrap'
          git push origin HEAD:fix/evidence-v2-auto-bootstrap
