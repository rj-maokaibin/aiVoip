name: TEMP Apply Production Compose Hotfix PR

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'hotfix/production-compose-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/production-compose-gate
          fetch-depth: 2

      - name: Apply hotfix and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/temp/apply_production_compose_hotfix.py
          chmod +x tools/production_compose_config_gate.sh
          bash tools/production_compose_config_gate.sh
          PYTHONDONTWRITEBYTECODE=1 python3 tools/source_manifest_gate.py --update
          PYTHONDONTWRITEBYTECODE=1 python3 tools/source_manifest_gate.py
          python3 -m py_compile backend/tests/test_production_compose_config_gate_v1.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docker-compose.yml .github/workflows/source-manifest-gate.yml tools/production_compose_config_gate.sh backend/tests/test_production_compose_config_gate_v1.py release/source_manifest.json
          git commit -m 'fix(release): validate production compose before deploy'
          git push origin HEAD:hotfix/production-compose-gate
