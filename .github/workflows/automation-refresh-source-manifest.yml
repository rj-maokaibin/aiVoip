name: Automation Refresh Source Manifest

on:
  push:
    branches:
      - automation/evidence-v2-bootstrap-pythonpath
    paths:
      - '.github/workflows/automation-refresh-source-manifest.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/evidence-v2-bootstrap-pythonpath
          fetch-depth: 0
      - name: Refresh exact source manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/source_manifest_gate.py --update
          python3 tools/source_manifest_gate.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add release/source_manifest.json
          if git diff --cached --quiet; then
            echo 'SOURCE_MANIFEST_ALREADY_EXACT=PASS'
            exit 0
          fi
          git commit -m 'Refresh source manifest for Evidence V2 bootstrap fix'
          git push origin HEAD:automation/evidence-v2-bootstrap-pythonpath
