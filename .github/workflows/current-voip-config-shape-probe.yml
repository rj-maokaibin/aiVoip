name: Current VOIP Config Shape Probe

on:
  pull_request:
    branches: [master]
    paths:
      - "tools/probe_current_voip_config_shapes.py"
      - ".github/workflows/current-voip-config-shape-probe.yml"
      - "backend/app/infrastructure/config_framework/**"

permissions:
  contents: read

jobs:
  current-voip-config-shape:
    runs-on: [self-hosted, linux, x64, voip-controlled-linux]
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      PROD_ENV_FILE: /home/github-runner/.config/voip-ai/.env
      PROBE_VENV: /tmp/current-voip-shape-venv-${{ github.run_id }}-${{ github.run_attempt }}
      RUNTIME_ROOT: /tmp/current-voip-shape-runtime-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_ROOT: /tmp/current-voip-shape-evidence-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Repair self-hosted workspace
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect python:3.12-slim >/dev/null
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" python:3.12-slim \
            sh -lc 'find /workspace -mindepth 1 -maxdepth 1 -exec rm -rf {} +'

      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0

      - name: Prepare isolated read-only runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -r "$PROD_ENV_FILE"
          rm -rf "$PROBE_VENV" "$RUNTIME_ROOT" "$EVIDENCE_ROOT"
          mkdir -p "$RUNTIME_ROOT" "$EVIDENCE_ROOT"
          chmod 0700 "$RUNTIME_ROOT"
          python3 -m venv "$PROBE_VENV"
          "$PROBE_VENV/bin/pip" install --disable-pip-version-check -q -r backend/requirements.txt
          "$PROBE_VENV/bin/python" -m py_compile tools/probe_current_voip_config_shapes.py

      - name: Resolve exact DUT and SSH credential read-only
        shell: bash
        run: |
          set -euo pipefail
          set -a; source "$PROD_ENV_FILE"; set +a
          export PYTHONPATH="$GITHUB_WORKSPACE/backend"
          "$PROBE_VENV/bin/python" tools/resolve_real_sip_aba_database_env.py > "$RUNTIME_ROOT/production_db.env"
          chmod 0600 "$RUNTIME_ROOT/production_db.env"
          set -a; source "$RUNTIME_ROOT/production_db.env"; set +a
          "$PROBE_VENV/bin/python" tools/resolve_real_sip_aba_context.py \
            --output-root "$RUNTIME_ROOT/context-evidence" \
            --runtime-root "$RUNTIME_ROOT"
          set -a
          source "$RUNTIME_ROOT/db_runtime.env"
          source "$RUNTIME_ROOT/resolved_dut.env"
          set +a
          "$PROBE_VENV/bin/python" tools/resolve_real_sip_aba_credential_env.py \
            --container "$SIP_ABA_PRODUCTION_CREDENTIAL_CONTAINER" \
            --expected-provider "$SIP_ABA_PRODUCTION_CREDENTIAL_PROVIDER" \
            --sn "$DEVICE_SN" --ip "$DEVICE_HOST" --product "$DEVICE_MODEL" \
            --fallback-user "$DEVICE_USER" \
            --output "$RUNTIME_ROOT/device_credential.env"
          chmod 0600 "$RUNTIME_ROOT/device_credential.env"

      - name: Read current five-module shape only
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$RUNTIME_ROOT/resolved_dut.env"
          source "$RUNTIME_ROOT/device_credential.env"
          set +a
          export PYTHONPATH="$GITHUB_WORKSPACE/backend"
          args=(
            --device-id "$DEVICE_ID" --model "$DEVICE_MODEL" --host "$DEVICE_HOST"
            --port "$DEVICE_PORT" --username "$SIP_ABA_SSH_USERNAME"
            --password-env 'ENV:SIP_ABA_SSH_PASSWORD'
            --output "$EVIDENCE_ROOT/dut-voip-config-shape-safe.json"
          )
          case "$DEVICE_PLATFORM" in mt7621|mt7981) args+=(--platform-id "$DEVICE_PLATFORM") ;; esac
          "$PROBE_VENV/bin/python" tools/probe_current_voip_config_shapes.py "${args[@]}"
          python3 - "$EVIDENCE_ROOT/dut-voip-config-shape-safe.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1], encoding='utf-8'))
          assert data['mutation_executed'] is False
          assert data['secret_values_emitted'] is False
          assert len(data['modules']) == 5
          print('CURRENT_VOIP_CONFIG_SHAPE=PASS mutation=false secret_values_emitted=false')
          PY

      - name: Upload immutable safe shape evidence
        uses: actions/upload-artifact@v4
        with:
          name: current-voip-config-shape-${{ env.EXPECTED_SHA }}
          path: ${{ env.EVIDENCE_ROOT }}/dut-voip-config-shape-safe.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove runtime secrets
        if: always()
        shell: bash
        run: rm -rf "$RUNTIME_ROOT" "$PROBE_VENV"
