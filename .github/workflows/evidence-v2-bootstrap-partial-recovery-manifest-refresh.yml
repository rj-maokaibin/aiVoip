name: Evidence V2 Bootstrap Partial Recovery Manifest Refresh

on:
  pull_request:
    branches:
      - master
    paths:
      - 'tools/evidence_v2_production_golden_bootstrap.py'
      - 'tools/evidence_v2_bootstrap_workflow_contract.py'
      - '.github/workflows/evidence-v2-bootstrap-partial-recovery-manifest-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Validate bootstrap partial recovery contract
        run: |
          set -euo pipefail
          python3 -m py_compile tools/evidence_v2_production_golden_bootstrap.py tools/evidence_v2_bootstrap_workflow_contract.py
          python3 tools/evidence_v2_bootstrap_workflow_contract.py
      - name: Refresh governed source manifest and remove helper workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout '${{ github.event.pull_request.head.ref }}'
          rm -f .github/workflows/evidence-v2-bootstrap-partial-recovery-manifest-refresh.yml
          python3 tools/source_manifest_gate.py --update
          python3 tools/source_manifest_gate.py
          git add release/source_manifest.json .github/workflows/evidence-v2-bootstrap-partial-recovery-manifest-refresh.yml
          git commit -m 'Refresh source manifest for bootstrap partial recovery'
          git push origin HEAD:'${{ github.event.pull_request.head.ref }}'
