name: Preliminary Evidence Report V1 Frozen Gate

on:
  pull_request:
    paths:
      - 'backend/app/**'
      - 'backend/tests/test_*evidence*'
      - 'backend/tests/test_feishu_*'
      - 'frontend/src/evidence_report_page.tsx'
      - 'tools/preliminary_evidence_v1_gate.sh'
      - 'docs/02_Core_Documents/Preliminary_Evidence_Report_V1.0/**'
      - '.github/workflows/preliminary-evidence-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-contracts:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Environment identity
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python3 --version
      - name: Frozen PRD/SPEC software contract gate
        run: bash tools/preliminary_evidence_v1_gate.sh
