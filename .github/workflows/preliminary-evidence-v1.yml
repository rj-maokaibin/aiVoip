name: Preliminary Evidence Report V1 Acceptance

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'tools/**'
      - 'golden_cases/**'
      - 'golden_registry/**'
      - 'profiles/**'
      - 'deploy/acceptance_v2/**'
      - 'docs/ACCEPTANCE_INFRA_V2.md'
      - 'docs/02_Core_Documents/Preliminary_Evidence_Report_V1.0/**'
      - '.github/workflows/preliminary-evidence-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preliminary-evidence-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VOIP_ACCEPTANCE_ROOT: /opt/voip-acceptance
  OFFLINE_GOLDEN_SHA256: b038aa7c9a0644581f2815f654fcdee4620860796382265b178823fccba2e3f0
  GIT_CONFIG_COUNT: '2'
  GIT_CONFIG_KEY_0: http.lowSpeedLimit
  GIT_CONFIG_VALUE_0: '1024'
  GIT_CONFIG_KEY_1: http.lowSpeedTime
  GIT_CONFIG_VALUE_1: '15'

jobs:
  infra-preflight:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 10
    steps:
      - name: Observe host network before checkout
        id: network_probe
        continue-on-error: true
        run: |
          set +e
          ok=0
          for attempt in 1 2; do
            getent ahosts github.com >/dev/null || { sleep 3; continue; }
            timeout 8 bash -c '</dev/tcp/github.com/443' || { sleep 3; continue; }
            timeout 20 git -c http.lowSpeedLimit=1024 -c http.lowSpeedTime=10 \
              ls-remote https://github.com/actions/checkout.git HEAD >/dev/null && { ok=1; break; }
            sleep 5
          done
          if [ "$ok" -eq 1 ]; then
            echo 'PRECHECK_NETWORK=PASS'
            exit 0
          fi
          echo 'PRECHECK_NETWORK=DEGRADED transient probe failed; actual checkout will retry'
          exit 1

      - name: Checkout exact head attempt 1
        id: checkout1
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Cooldown after transient checkout failure
        if: steps.checkout1.outcome == 'failure'
        run: sleep 15

      - name: Checkout exact head attempt 2
        if: steps.checkout1.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Runner Doctor - merge gate prerequisites only
        run: |
          set -euo pipefail
          mkdir -p validation
          python3 tools/acceptance_runner_doctor.py \
            --root "$VOIP_ACCEPTANCE_ROOT" \
            --require-docker --require-golden --require-tshark --require-runtime \
            --out validation/runner-doctor.json

      - name: Upload sanitized infrastructure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-infra-v2-doctor
          path: validation/runner-doctor.json
          if-no-files-found: warn

  frozen-contracts:
    needs: infra-preflight
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 20
    steps:
      - name: Checkout exact head attempt 1
        id: checkout1
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - if: steps.checkout1.outcome == 'failure'
        run: sleep 10
      - name: Checkout exact head attempt 2
        if: steps.checkout1.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Environment identity
        run: |
          set -euo pipefail
          printf 'FROZEN_GATE_HEAD=%s\n' "$(git rev-parse HEAD)"
          python3 --version
      - name: Frozen PRD/SPEC software contract gate
        run: bash tools/preliminary_evidence_v1_gate.sh

  full-software-acceptance:
    needs: frozen-contracts
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 60
    steps:
      - name: Checkout exact head attempt 1
        id: checkout1
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - if: steps.checkout1.outcome == 'failure'
        run: sleep 10
      - name: Checkout exact head attempt 2
        if: steps.checkout1.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Resolve immutable Golden and prepared runtime
        run: |
          set -euo pipefail
          golden_json="$(python3 tools/acceptance_golden.py ensure --root "$VOIP_ACCEPTANCE_ROOT")"
          golden_path="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["path"])' <<<"$golden_json")"
          test -r "$golden_path"
          actual_sha="$(sha256sum "$golden_path" | awk '{print $1}')"
          test "$actual_sha" = "$OFFLINE_GOLDEN_SHA256"
          tshark_bin="$VOIP_ACCEPTANCE_ROOT/runtime/bin/tshark"
          test -x "$tshark_bin"
          "$tshark_bin" -v | head -n1 | grep -q '4.2.2'
          python3 tools/acceptance_runtime.py verify --root "$VOIP_ACCEPTANCE_ROOT" >/dev/null
          runtime_env="$(python3 tools/acceptance_runtime.py env --root "$VOIP_ACCEPTANCE_ROOT")"
          printf '%s\n' "$runtime_env" >> "$GITHUB_ENV"
          prepared_venv="$(printf '%s\n' "$runtime_env" | awk -F= '$1=="VOIP_AI_PREPARED_VENV"{print substr($0,index($0,"=")+1)}')"
          runtime_fp="$(printf '%s\n' "$runtime_env" | awk -F= '$1=="ACCEPTANCE_RUNTIME_FINGERPRINT"{print substr($0,index($0,"=")+1)}')"
          test -x "$prepared_venv/bin/python"
          test -n "$runtime_fp"
          echo "OFFLINE_GOLDEN_PCAP=$golden_path" >> "$GITHUB_ENV"
          echo "TSHARK_BINARY=$tshark_bin" >> "$GITHUB_ENV"
          echo "VOIP_AI_GATE_VENV=$prepared_venv" >> "$GITHUB_ENV"
          printf 'PREPARED_PCAP_SHA256=%s\n' "$actual_sha"
          printf 'TSHARK=%s\n' "$("$tshark_bin" -v | head -n1)"
          printf 'ACCEPTANCE_RUNTIME_FINGERPRINT=%s\n' "$runtime_fp"

      - name: Check exact-SHA software evidence cache
        id: evidence
        run: |
          set +e
          result="$(python3 tools/acceptance_evidence.py check \
            --root "$VOIP_ACCEPTANCE_ROOT" \
            --commit "$(git rev-parse HEAD)" \
            --golden-sha "$OFFLINE_GOLDEN_SHA256" \
            --runtime-id "$ACCEPTANCE_RUNTIME_FINGERPRINT")"
          rc=$?
          set -e
          echo "$result"
          if [ "$rc" -eq 0 ]; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Full VOIP AI software release gate
        if: steps.evidence.outputs.reuse != 'true'
        run: bash tools/voip_ai_release_gate.sh

      - name: Real Offline Golden 001
        if: steps.evidence.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          source "$VOIP_AI_GATE_VENV/bin/activate"
          rm -rf offline-golden-artifacts offline-golden-result.json
          TSHARK_BINARY="$TSHARK_BINARY" python tools/offline_analysis_golden_replay.py \
            --pcap "$OFFLINE_GOLDEN_PCAP" \
            --require-fixture \
            --artifacts offline-golden-artifacts \
            --result offline-golden-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('offline-golden-result.json').read_text(encoding='utf-8'))
          assert p['status']=='PASS' and p['passed'] is True, p
          assert p['checks_passed']==142 and p['checks_total']==142, p
          print('REAL_OFFLINE_GOLDEN_001=PASS 142/142')
          PY

      - name: Real Offline Golden 001 Human Evidence Gate
        if: steps.evidence.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          source "$VOIP_AI_GATE_VENV/bin/activate"
          rm -rf offline-golden-human-artifacts
          python tools/human_evidence_real_golden_gate.py \
            --artifacts offline-golden-artifacts \
            --output offline-golden-human-artifacts
          test -s offline-golden-human-artifacts/pcm_rx_periodic_spectrum_human_v2.png
          test -s offline-golden-human-artifacts/pcm_rx_periodic_spectrogram_human_v2.png
          test -s offline-golden-human-artifacts/pcm_rx_dtmf_first_digit_inspector_human_v2.png
          test -s offline-golden-human-artifacts/human-golden-result.json
          echo 'HUMAN_REAL_OFFLINE_GOLDEN_001=PASS'

      - name: Record exact-SHA software evidence
        if: steps.evidence.outputs.reuse != 'true'
        run: |
          python3 tools/acceptance_evidence.py record \
            --root "$VOIP_ACCEPTANCE_ROOT" \
            --commit "$(git rev-parse HEAD)" \
            --golden-sha "$OFFLINE_GOLDEN_SHA256" \
            --runtime-id "$ACCEPTANCE_RUNTIME_FINGERPRINT"

      - name: Acceptance summary
        run: |
          set -euo pipefail
          printf 'PRD_SPEC_V1_FROZEN_CONTRACTS=PASS\n'
          if [ "${{ steps.evidence.outputs.reuse }}" = "true" ]; then
            printf 'SOFTWARE_EVIDENCE_REUSED=PASS exact-sha\n'
          else
            printf 'VOIP_AI_SOFTWARE_RELEASE_GATE=PASS\n'
            printf 'REAL_OFFLINE_GOLDEN_001=PASS 142/142\n'
            printf 'HUMAN_REAL_OFFLINE_GOLDEN_001=PASS\n'
          fi
          printf 'ACCEPTANCE_COMMIT=%s\n' "$(git rev-parse HEAD)"

      - name: Upload Golden evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prd-spec-v1-golden-001
          path: |
            offline-golden-result.json
            offline-golden-artifacts
            offline-golden-human-artifacts
          if-no-files-found: ignore

  acceptance-stack-smoke:
    needs: full-software-acceptance
    continue-on-error: true
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 10
    steps:
      - name: Checkout exact head attempt 1
        id: stack_checkout1
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - if: steps.stack_checkout1.outcome == 'failure'
        run: sleep 10
      - name: Checkout exact head attempt 2
        if: steps.stack_checkout1.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Isolated Acceptance Stack health
        run: |
          set -euo pipefail
          mkdir -p validation
          python3 tools/acceptance_runner_doctor.py \
            --root "$VOIP_ACCEPTANCE_ROOT" \
            --require-docker --require-stack --repair \
            --out validation/acceptance-stack-doctor.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-stack-v2-doctor
          path: validation/acceptance-stack-doctor.json
          if-no-files-found: warn
