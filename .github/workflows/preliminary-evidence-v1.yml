name: Preliminary Evidence Report V1 Acceptance

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'tools/**'
      - 'golden_cases/**'
      - 'profiles/**'
      - 'deploy/**'
      - 'deploy/live_acceptance/**'
      - 'docs/LIVE_ACCEPTANCE_RUNTIME_V1.md'
      - 'docs/02_Core_Documents/Preliminary_Evidence_Report_V1.0/**'
      - '.github/workflows/source-manifest-gate.yml'
      - '.github/workflows/prd-spec-v1-release.yml'
      - '.github/workflows/preliminary-evidence-v1.yml'
      - '.github/workflows/production-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: preliminary-evidence-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-full-acceptance-evidence:
    runs-on: [self-hosted, linux, x64, voip-controlled-linux]
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Resolve exact-SHA Full Acceptance run
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = process.env.EXPECTED_SHA;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            for (let i = 0; i < 180; i++) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'prd-spec-v1-release.yml',
                head_sha: sha,
                per_page: 20,
              });
              const runs = response.data.workflow_runs
                .filter((run) => run.head_sha === sha)
                .sort((a, b) => b.id - a.id);
              if (runs.length > 0) {
                const run = runs[0];
                core.info(`Full Acceptance run ${run.id}: ${run.status}/${run.conclusion || 'pending'}`);
                if (run.status === 'completed') {
                  if (run.conclusion !== 'success') {
                    core.setFailed(`Full Acceptance failed for ${sha}: ${run.conclusion}`);
                    return;
                  }
                  core.setOutput('run_id', String(run.id));
                  return;
                }
              }
              await sleep(5000);
            }
            core.setFailed(`Timed out waiting for Full Acceptance for ${sha}`);

      - name: Download exact-SHA Full Acceptance evidence
        uses: actions/download-artifact@v4
        with:
          name: full-acceptance-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/full-acceptance
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.resolve.outputs.run_id }}

      - name: Verify reusable Full Acceptance evidence
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/full-acceptance"
          test -s "$root/full-acceptance-result.json"
          test -s "$root/offline-golden-result.json"
          test -s "$root/offline-golden-human-artifacts/human-golden-result.json"
          test -s "$root/offline-golden-human-artifacts/pcm_rx_periodic_spectrum_human_v2.png"
          test -s "$root/offline-golden-human-artifacts/pcm_rx_periodic_spectrogram_human_v2.png"
          test -s "$root/offline-golden-human-artifacts/pcm_rx_dtmf_first_digit_inspector_human_v2.png"
          python3 - "$EXPECTED_SHA" "$root" <<'PY'
          import json
          import sys
          from pathlib import Path

          revision = sys.argv[1]
          root = Path(sys.argv[2])
          evidence = json.loads((root / "full-acceptance-result.json").read_text(encoding="utf-8"))
          golden = json.loads((root / "offline-golden-result.json").read_text(encoding="utf-8"))
          human = json.loads((root / "offline-golden-human-artifacts/human-golden-result.json").read_text(encoding="utf-8"))

          assert evidence.get("schema_version") == "full-software-acceptance-v2", evidence
          assert evidence.get("revision") == revision, evidence
          assert evidence.get("passed") is True, evidence
          assert evidence.get("frozen_contracts", {}).get("passed") is True, evidence
          assert evidence.get("full_release_gate", {}).get("passed") is True, evidence
          assert evidence.get("golden_001") == {
              "passed": True,
              "checks_passed": 142,
              "checks_total": 142,
          }, evidence
          assert evidence.get("human_evidence", {}).get("passed") is True, evidence
          assert golden.get("passed") is True, golden
          assert golden.get("checks_passed") == 142, golden
          assert golden.get("checks_total") == 142, golden
          assert human.get("status") == "PASS", human

          print("PRELIMINARY_REUSED_FULL_ACCEPTANCE=PASS")
          print(f"ACCEPTANCE_COMMIT={revision}")
          PY

      - name: Acceptance summary
        shell: bash
        run: |
          set -euo pipefail
          echo "PRD_SPEC_V1_FROZEN_CONTRACTS=PASS source=REUSED_FULL_ACCEPTANCE"
          echo "VOIP_AI_SOFTWARE_RELEASE_GATE=PASS source=REUSED_FULL_ACCEPTANCE"
          echo "REAL_OFFLINE_GOLDEN_001=PASS 142/142 source=REUSED_FULL_ACCEPTANCE"
          echo "HUMAN_REAL_OFFLINE_GOLDEN_001=PASS source=REUSED_FULL_ACCEPTANCE"
          echo "PRELIMINARY_EVIDENCE_ACCEPTANCE=PASS"
