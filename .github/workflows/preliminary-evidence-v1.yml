name: Preliminary Evidence Report V1 Acceptance

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'tools/**'
      - 'golden_cases/**'
      - 'profiles/**'
      - 'docs/02_Core_Documents/Preliminary_Evidence_Report_V1.0/**'
      - '.github/workflows/preliminary-evidence-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preliminary-evidence-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frozen-contracts:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Environment identity
        run: |
          set -euo pipefail
          printf 'FROZEN_GATE_HEAD=%s\n' "$(git rev-parse HEAD)"
          python3 --version
      - name: Frozen PRD/SPEC software contract gate
        run: bash tools/preliminary_evidence_v1_gate.sh

  full-software-acceptance:
    needs: frozen-contracts
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 60
    env:
      OFFLINE_GOLDEN_PCAP: /tmp/tcpdump-2026-08-14.pcap
      OFFLINE_GOLDEN_SHA256: b038aa7c9a0644581f2815f654fcdee4620860796382265b178823fccba2e3f0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Environment and prepared-PCAP identity
        run: |
          set -euo pipefail
          printf 'ACCEPTANCE_HEAD=%s\n' "$(git rev-parse HEAD)"
          printf 'PYTHON=%s\n' "$(python3 --version 2>&1)"
          printf 'NODE=%s\n' "$(node --version 2>&1)"
          printf 'NPM=%s\n' "$(npm --version 2>&1)"
          docker info >/dev/null

          fixture="$OFFLINE_GOLDEN_PCAP"
          if [ ! -r "$fixture" ]; then
            staged="$RUNNER_TEMP/offline-e2e-prepared.pcap"
            rm -f "$staged"
            docker run --rm \
              -v /tmp:/source:ro \
              -v "$RUNNER_TEMP":/output \
              --entrypoint sh postgres:16 \
              -c "cp /source/tcpdump-2026-08-14.pcap /output/offline-e2e-prepared.pcap && chmod 0644 /output/offline-e2e-prepared.pcap"
            fixture="$staged"
          fi
          test -r "$fixture"
          actual_sha="$(sha256sum "$fixture" | awk '{print $1}')"
          test "$actual_sha" = "$OFFLINE_GOLDEN_SHA256"
          echo "OFFLINE_GOLDEN_PCAP=$fixture" >> "$GITHUB_ENV"
          echo "VOIP_AI_GATE_VENV=$RUNNER_TEMP/voip-ai-release-gate" >> "$GITHUB_ENV"
          printf 'PREPARED_PCAP=%s\n' "$fixture"
          printf 'PREPARED_PCAP_SHA256=%s\n' "$actual_sha"

      - name: Prepare exact userspace TShark 4.2.2 runtime
        run: |
          set -euo pipefail
          tshark_bin=""
          if command -v tshark >/dev/null 2>&1; then
            candidate="$(command -v tshark)"
            candidate_version="$($candidate -v | head -n1)"
            if [[ "$candidate_version" == *"4.2.2"* ]]; then
              tshark_bin="$candidate"
            fi
          fi
          if [ -z "$tshark_bin" ]; then
            root="$RUNNER_TEMP/tshark-root"
            debs="$RUNNER_TEMP/tshark-debs"
            rm -rf "$root" "$debs"
            mkdir -p "$root" "$debs"
            cd "$debs"
            mapfile -t pkgs < <(apt-cache depends --recurse --no-recommends --no-suggests --no-conflicts --no-breaks --no-replaces --no-enhances tshark | awk '/^[^ <][^:]*$/ {print $1}' | sort -u)
            miss=()
            for p in "${pkgs[@]}"; do
              dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -q 'install ok installed' || miss+=("$p")
            done
            [ ${#miss[@]} -eq 0 ] || apt-get download "${miss[@]}"
            shopt -s nullglob
            for d in ./*.deb; do dpkg-deb -x "$d" "$root"; done
            tshark_bin="$RUNNER_TEMP/tshark-userspace"
            printf '#!/bin/bash\nexport LD_LIBRARY_PATH="%s/usr/lib/x86_64-linux-gnu:%s/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"\nexport WIRESHARK_DATA_DIR="%s/usr/share/wireshark"\nexec "%s/usr/bin/tshark" "$@"\n' "$root" "$root" "$root" "$root" > "$tshark_bin"
            chmod +x "$tshark_bin"
          fi
          tshark_version="$($tshark_bin -v | head -n1)"
          printf 'TSHARK=%s\n' "$tshark_version"
          [[ "$tshark_version" == *"4.2.2"* ]]
          echo "TSHARK_BINARY=$tshark_bin" >> "$GITHUB_ENV"

      - name: Full VOIP AI software release gate
        run: bash tools/voip_ai_release_gate.sh

      - name: Prepared-PCAP Real Offline Golden 001
        run: |
          set -euo pipefail
          source "$VOIP_AI_GATE_VENV/bin/activate"
          rm -rf offline-golden-artifacts offline-golden-result.json
          TSHARK_BINARY="$TSHARK_BINARY" python tools/offline_analysis_golden_replay.py \
            --pcap "$OFFLINE_GOLDEN_PCAP" \
            --require-fixture \
            --artifacts offline-golden-artifacts \
            --result offline-golden-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('offline-golden-result.json').read_text(encoding='utf-8'))
          assert p['status'] == 'PASS', p
          assert p['passed'] is True, p
          assert p['checks_passed'] == 142, p
          assert p['checks_total'] == 142, p
          print('REAL_OFFLINE_GOLDEN_001=PASS 142/142')
          PY

      - name: Real Offline Golden 001 Human Evidence Gate
        run: |
          set -euo pipefail
          source "$VOIP_AI_GATE_VENV/bin/activate"
          rm -rf offline-golden-human-artifacts
          python tools/human_evidence_real_golden_gate.py \
            --artifacts offline-golden-artifacts \
            --output offline-golden-human-artifacts
          test -s offline-golden-human-artifacts/pcm_rx_periodic_spectrum_human_v2.png
          test -s offline-golden-human-artifacts/pcm_rx_periodic_spectrogram_human_v2.png
          test -s offline-golden-human-artifacts/pcm_rx_dtmf_first_digit_inspector_human_v2.png
          test -s offline-golden-human-artifacts/human-golden-result.json
          echo 'HUMAN_REAL_OFFLINE_GOLDEN_001=PASS'

      - name: Acceptance summary
        run: |
          set -euo pipefail
          printf 'PRD_SPEC_V1_FROZEN_CONTRACTS=PASS\n'
          printf 'VOIP_AI_SOFTWARE_RELEASE_GATE=PASS\n'
          printf 'REAL_OFFLINE_GOLDEN_001=PASS 142/142\n'
          printf 'HUMAN_REAL_OFFLINE_GOLDEN_001=PASS\n'
          printf 'ACCEPTANCE_COMMIT=%s\n' "$(git rev-parse HEAD)"

      - name: Upload Golden evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prd-spec-v1-golden-001
          path: |
            offline-golden-result.json
            offline-golden-artifacts
            offline-golden-human-artifacts
          if-no-files-found: ignore

  # One-shot release-closure gate for PR #45 only. It is removed again after
  # the live Feishu projection is verified so this temporary mutation path is
  # not carried into master.
  live-feishu-acceptance:
    needs: full-software-acceptance
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/human-evidence-renderer-v2' }}
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 30
    env:
      LIVE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CONTROLLED_ENV_FILE: /home/github-runner/.config/voip-ai/.env
      FEISHU_SECRET_FILE: /home/github-runner/.config/voip-ai/feishu_app_secret
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Exact-head and controlled live environment
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$LIVE_HEAD_SHA"
          test -r "$CONTROLLED_ENV_FILE"
          test -r "$FEISHU_SECRET_FILE"
          set -a
          source "$CONTROLLED_ENV_FILE"
          set +a
          test "${REPRODUCTION_PLATFORM_MODE:-}" = "real"
          test "${FEISHU_LIVE_ENABLED:-}" = "true"
          printf 'LIVE_FEISHU_ACCEPTANCE_HEAD=%s\n' "$LIVE_HEAD_SHA"
          printf 'CONTROLLED_ENV_FILES_LOADED=1\n'
          printf 'REPRODUCTION_PLATFORM_MODE=%s\n' "$REPRODUCTION_PLATFORM_MODE"

      - name: Prepare isolated live container on running backend network
        run: |
          set -euo pipefail
          backend_cid="$(python3 - <<'PY'
          import json
          import subprocess
          ids = subprocess.check_output(
              ['docker', 'ps', '--filter', 'label=com.docker.compose.service=backend', '-q'],
              text=True,
          ).split()
          matches = []
          for cid in ids:
              info = json.loads(subprocess.check_output(['docker', 'inspect', cid], text=True))[0]
              env = set(info.get('Config', {}).get('Env') or [])
              if 'REPRODUCTION_PLATFORM_MODE=real' in env and 'FEISHU_LIVE_ENABLED=true' in env:
                  matches.append(cid)
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one real Feishu backend, found {len(matches)}')
          print(matches[0])
          PY
          )"
          test -n "$backend_cid"
          network="$(docker inspect "$backend_cid" \
            --format '{{range $name,$cfg := .NetworkSettings.Networks}}{{$name}}{{"\n"}}{{end}}' \
            | head -n1)"
          test -n "$network"
          secret_mounts="$RUNNER_TEMP/human-live-secret-mounts.txt"
          python3 - "$backend_cid" "$secret_mounts" "$FEISHU_SECRET_FILE" <<'PY'
          import json
          import subprocess
          import sys
          cid, out, feishu_fallback = sys.argv[1:4]
          info = json.loads(subprocess.check_output(['docker', 'inspect', cid], text=True))[0]
          rows = []
          destinations = set()
          for mount in info.get('Mounts') or []:
              destination = str(mount.get('Destination') or '')
              source = str(mount.get('Source') or '')
              if destination.startswith('/run/secrets/') and source:
                  rows.append(f'{source}|{destination}')
                  destinations.add(destination)
          if '/run/secrets/feishu_app_secret' not in destinations:
              rows.append(f'{feishu_fallback}|/run/secrets/feishu_app_secret')
          with open(out, 'w', encoding='utf-8') as fh:
              fh.write('\n'.join(rows) + '\n')
          PY
          grep -q '/run/secrets/feishu_app_secret' "$secret_mounts"
          image="voip-human-live:${LIVE_HEAD_SHA:0:12}"
          docker build -t "$image" backend
          echo "LIVE_BACKEND_CID=$backend_cid" >> "$GITHUB_ENV"
          echo "LIVE_DOCKER_NETWORK=$network" >> "$GITHUB_ENV"
          echo "LIVE_DOCKER_IMAGE=$image" >> "$GITHUB_ENV"
          echo "LIVE_SECRET_MOUNTS=$secret_mounts" >> "$GITHUB_ENV"
          printf 'LIVE_BACKEND_NETWORK=%s\n' "$network"
          printf 'LIVE_SECRET_MOUNT_COUNT=%s\n' "$(wc -l < "$secret_mounts")"

      - name: Project and read back existing Real Golden 001 Feishu document
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$LIVE_HEAD_SHA"
          test -n "$LIVE_DOCKER_NETWORK"
          test -n "$LIVE_DOCKER_IMAGE"
          test -s "$LIVE_SECRET_MOUNTS"
          mount_args=(-v "$GITHUB_WORKSPACE:/workspace")
          while IFS='|' read -r source destination; do
            [ -n "$source" ] || continue
            [ -n "$destination" ] || continue
            mount_args+=(-v "$source:$destination:ro")
          done < "$LIVE_SECRET_MOUNTS"
          rm -f validation/human_evidence_feishu_live_acceptance.json
          trap 'docker image rm -f "$LIVE_DOCKER_IMAGE" >/dev/null 2>&1 || true' EXIT
          docker run --rm \
            --network "$LIVE_DOCKER_NETWORK" \
            --env-file "$CONTROLLED_ENV_FILE" \
            "${mount_args[@]}" \
            -w /workspace \
            -e PYTHONPATH=/workspace/backend:/workspace \
            -e HUMAN_EVIDENCE_RENDERER_ENABLED=true \
            -e HUMAN_EVIDENCE_FEISHU_PREFERRED=true \
            -e MPLCONFIGDIR=/tmp/human-evidence-matplotlib \
            -e FEISHU_APP_SECRET_FILE=/run/secrets/feishu_app_secret \
            "$LIVE_DOCKER_IMAGE" \
            python tools/human_evidence_feishu_live_acceptance.py \
              --result validation/human_evidence_feishu_live_acceptance.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('validation/human_evidence_feishu_live_acceptance.json').read_text(encoding='utf-8'))
          assert p['status']=='PASS', p
          assert p['golden_sha256_verified'] is True, p
          assert p['document_reused'] is True, p
          assert p['required_visual_kinds_present'] is True, p
          assert p['image_then_five_explanations_verified'] is True, p
          assert p['diagnostic_authority_escalation'] is False, p
          print('HUMAN_EVIDENCE_FEISHU_LIVE_ACCEPTANCE=PASS')
          print(json.dumps({
              'document_fingerprint': p.get('document_fingerprint'),
              'previous_report_version': p.get('previous_report_version'),
              'projected_report_version': p.get('projected_report_version'),
              'projection_version': p.get('projection_version'),
              'ready_human_visual_count': p.get('ready_human_visual_count'),
              'ready_human_visual_kinds': p.get('ready_human_visual_kinds'),
              'remote_image_block_count': p.get('remote_image_block_count'),
              'remote_human_sequence_count': p.get('remote_human_sequence_count'),
          }, ensure_ascii=False))
          PY

      - name: Upload sanitized live acceptance result
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: human-evidence-feishu-live-acceptance
          path: validation/human_evidence_feishu_live_acceptance.json
          if-no-files-found: warn
          retention-days: 14
