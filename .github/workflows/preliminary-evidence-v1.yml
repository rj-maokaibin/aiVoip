name: Preliminary Evidence Report V1 Acceptance

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'tools/**'
      - 'golden_cases/**'
      - 'profiles/**'
      - 'docs/02_Core_Documents/Preliminary_Evidence_Report_V1.0/**'
      - '.github/workflows/preliminary-evidence-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-contracts:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Environment identity
        run: |
          set -euo pipefail
          printf 'FROZEN_GATE_HEAD=%s\n' "$(git rev-parse HEAD)"
          python3 --version
      - name: Frozen PRD/SPEC software contract gate
        run: bash tools/preliminary_evidence_v1_gate.sh

  full-software-acceptance:
    needs: frozen-contracts
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 60
    env:
      OFFLINE_GOLDEN_PCAP: /tmp/tcpdump-2026-08-14.pcap
      OFFLINE_GOLDEN_SHA256: b038aa7c9a0644581f2815f654fcdee4620860796382265b178823fccba2e3f0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Environment and prepared-PCAP identity
        run: |
          set -euo pipefail
          printf 'ACCEPTANCE_HEAD=%s\n' "$(git rev-parse HEAD)"
          printf 'PYTHON=%s\n' "$(python3 --version 2>&1)"
          printf 'NODE=%s\n' "$(node --version 2>&1)"
          printf 'NPM=%s\n' "$(npm --version 2>&1)"
          docker info >/dev/null

          fixture="$OFFLINE_GOLDEN_PCAP"
          if [ ! -r "$fixture" ]; then
            staged="$RUNNER_TEMP/offline-e2e-prepared.pcap"
            rm -f "$staged"
            docker run --rm \
              -v /tmp:/source:ro \
              -v "$RUNNER_TEMP":/output \
              --entrypoint sh postgres:16 \
              -c "cp /source/tcpdump-2026-08-14.pcap /output/offline-e2e-prepared.pcap && chmod 0644 /output/offline-e2e-prepared.pcap"
            fixture="$staged"
          fi
          test -r "$fixture"
          actual_sha="$(sha256sum "$fixture" | awk '{print $1}')"
          test "$actual_sha" = "$OFFLINE_GOLDEN_SHA256"
          echo "OFFLINE_GOLDEN_PCAP=$fixture" >> "$GITHUB_ENV"
          echo "VOIP_AI_GATE_VENV=$RUNNER_TEMP/voip-ai-release-gate" >> "$GITHUB_ENV"
          printf 'PREPARED_PCAP=%s\n' "$fixture"
          printf 'PREPARED_PCAP_SHA256=%s\n' "$actual_sha"

      - name: Prepare exact userspace TShark 4.2.2 runtime
        run: |
          set -euo pipefail
          tshark_bin=""
          if command -v tshark >/dev/null 2>&1; then
            candidate="$(command -v tshark)"
            candidate_version="$($candidate -v | head -n1)"
            if [[ "$candidate_version" == *"4.2.2"* ]]; then
              tshark_bin="$candidate"
            fi
          fi
          if [ -z "$tshark_bin" ]; then
            root="$RUNNER_TEMP/tshark-root"
            debs="$RUNNER_TEMP/tshark-debs"
            rm -rf "$root" "$debs"
            mkdir -p "$root" "$debs"
            cd "$debs"
            mapfile -t pkgs < <(apt-cache depends --recurse --no-recommends --no-suggests --no-conflicts --no-breaks --no-replaces --no-enhances tshark | awk '/^[^ <][^:]*$/ {print $1}' | sort -u)
            miss=()
            for p in "${pkgs[@]}"; do
              dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -q 'install ok installed' || miss+=("$p")
            done
            [ ${#miss[@]} -eq 0 ] || apt-get download "${miss[@]}"
            shopt -s nullglob
            for d in ./*.deb; do dpkg-deb -x "$d" "$root"; done
            tshark_bin="$RUNNER_TEMP/tshark-userspace"
            printf '#!/bin/bash\nexport LD_LIBRARY_PATH="%s/usr/lib/x86_64-linux-gnu:%s/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"\nexport WIRESHARK_DATA_DIR="%s/usr/share/wireshark"\nexec "%s/usr/bin/tshark" "$@"\n' "$root" "$root" "$root" "$root" > "$tshark_bin"
            chmod +x "$tshark_bin"
          fi
          tshark_version="$($tshark_bin -v | head -n1)"
          printf 'TSHARK=%s\n' "$tshark_version"
          [[ "$tshark_version" == *"4.2.2"* ]]
          echo "TSHARK_BINARY=$tshark_bin" >> "$GITHUB_ENV"

      - name: Full VOIP AI software release gate
        run: bash tools/voip_ai_release_gate.sh

      - name: Prepared-PCAP Real Offline Golden 001
        run: |
          set -euo pipefail
          source "$VOIP_AI_GATE_VENV/bin/activate"
          rm -rf offline-golden-artifacts offline-golden-result.json
          TSHARK_BINARY="$TSHARK_BINARY" python tools/offline_analysis_golden_replay.py \
            --pcap "$OFFLINE_GOLDEN_PCAP" \
            --require-fixture \
            --artifacts offline-golden-artifacts \
            --result offline-golden-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('offline-golden-result.json').read_text(encoding='utf-8'))
          assert p['status'] == 'PASS', p
          assert p['passed'] is True, p
          assert p['checks_passed'] == 142, p
          assert p['checks_total'] == 142, p
          print('REAL_OFFLINE_GOLDEN_001=PASS 142/142')
          PY

      - name: Real Offline Golden 001 Human Evidence Gate
        run: |
          set -euo pipefail
          source "$VOIP_AI_GATE_VENV/bin/activate"
          rm -rf offline-golden-human-artifacts
          python tools/human_evidence_real_golden_gate.py \
            --artifacts offline-golden-artifacts \
            --output offline-golden-human-artifacts
          test -s offline-golden-human-artifacts/pcm_rx_periodic_spectrum_human_v2.png
          test -s offline-golden-human-artifacts/pcm_rx_periodic_spectrogram_human_v2.png
          test -s offline-golden-human-artifacts/human-golden-result.json
          echo 'HUMAN_REAL_OFFLINE_GOLDEN_001=PASS'

      - name: Acceptance summary
        run: |
          set -euo pipefail
          printf 'PRD_SPEC_V1_FROZEN_CONTRACTS=PASS\n'
          printf 'VOIP_AI_SOFTWARE_RELEASE_GATE=PASS\n'
          printf 'REAL_OFFLINE_GOLDEN_001=PASS 142/142\n'
          printf 'HUMAN_REAL_OFFLINE_GOLDEN_001=PASS\n'
          printf 'ACCEPTANCE_COMMIT=%s\n' "$(git rev-parse HEAD)"

      - name: Upload Golden evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prd-spec-v1-golden-001
          path: |
            offline-golden-result.json
            offline-golden-artifacts
            offline-golden-human-artifacts
          if-no-files-found: ignore
