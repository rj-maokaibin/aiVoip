name: Publish Markdown To Feishu

# PR observability trigger: this workflow also serves as the quick-use publishing path.
on:
  push:
    branches:
      - master
    paths:
      - 'feishu_publish/requests/*.md'
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/publish-markdown-to-feishu.yml'
      - 'feishu_publish/requests/*.md'
  workflow_dispatch:
    inputs:
      source:
        description: 'Repository-relative Markdown path'
        required: true
        default: 'feishu_publish/requests/PON_84B_1260Mbps_最终定性报告_2026-08-25.md'

permissions:
  contents: read

concurrency:
  group: publish-markdown-to-feishu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8

      - name: Resolve source Markdown
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            source_path='${{ github.event.inputs.source }}'
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            source_path='feishu_publish/requests/PON_84B_1260Mbps_最终定性报告_2026-08-25.md'
          else
            source_path="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^feishu_publish/requests/.*\.md$' | head -n1 || true)"
          fi
          test -n "$source_path"
          test -f "$source_path"
          echo "path=$source_path" >> "$GITHUB_OUTPUT"
          echo "SOURCE_MD=$source_path"

      - name: Load controlled Feishu environment and publish
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          loaded=0
          set -a
          for env_file in /home/dev/workspace/aiVoip/.env /home/dev/workspace/aiVoip/backend/.env; do
            if [ -r "$env_file" ]; then
              source "$env_file"
              loaded=$((loaded+1))
              echo "ENV_SOURCE=direct"
            elif [ -e "$env_file" ] && sudo -n test -r "$env_file" 2>/dev/null; then
              staged_env="$RUNNER_TEMP/$(basename "$(dirname "$env_file")")-$(basename "$env_file")"
              sudo -n cat "$env_file" > "$staged_env"
              chmod 600 "$staged_env"
              source "$staged_env"
              loaded=$((loaded+1))
              echo "ENV_SOURCE=sudo-staged"
            fi
          done
          set +a
          echo "ENV_FILES_LOADED=$loaded"
          test "$loaded" -gt 0

          export PYTHONPATH="$GITHUB_WORKSPACE/backend:$GITHUB_WORKSPACE"
          result="$RUNNER_TEMP/feishu_markdown_publish_result.json"
          python3 - <<'PY'
          import importlib.util
          required = ['httpx', 'pydantic_settings']
          missing = [m for m in required if importlib.util.find_spec(m) is None]
          print('PYTHON_DEPENDENCIES=' + ('OK' if not missing else 'MISSING:' + ','.join(missing)))
          if missing:
              raise SystemExit(2)
          PY
          python3 tools/publish_markdown_to_feishu.py \
            --source '${{ steps.source.outputs.path }}' \
            --result "$result" | tee "$RUNNER_TEMP/feishu_publish.log"

          python3 - "$result" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          p = json.load(open(sys.argv[1], encoding='utf-8'))
          assert p['status'] == 'PASS', p
          print('url=' + p['url'])
          print('document_id=' + p['document_id'])
          print('block_count=' + str(p['block_count']))
          PY

          mkdir -p validation
          cp "$result" validation/feishu_markdown_publish_result.json

      - name: Publish job summary
        if: success()
        shell: bash
        run: |
          {
            echo '## Feishu Markdown Publish'
            echo
            echo '- Source: `${{ steps.source.outputs.path }}`'
            echo '- Document ID: `${{ steps.publish.outputs.document_id }}`'
            echo '- Blocks: `${{ steps.publish.outputs.block_count }}`'
            echo '- Document: ${{ steps.publish.outputs.url }}'
          } >> "$GITHUB_STEP_SUMMARY"
          echo 'FEISHU_DOC_URL=${{ steps.publish.outputs.url }}'

      - name: Upload publish result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feishu-markdown-publish-result
          path: validation/feishu_markdown_publish_result.json
          if-no-files-found: warn
          retention-days: 14
