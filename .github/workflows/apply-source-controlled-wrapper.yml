name: Apply Source Controlled Production Wrapper

on:
  push:
    branches:
      - fix/source-controlled-production-wrapper

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize source-controlled wrapper migration
        shell: bash
        run: |
          set -euo pipefail

          cat > deploy/production_deploy_wrapper.sh <<'WRAPPER'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077

          TARGET="${1:-}"
          REPO="/home/github-runner/actions-runner/_work/aiVoip/aiVoip"
          ENV_FILE="/etc/voip-ai/production.env"

          [[ "$TARGET" =~ ^[0-9a-f]{40}$ ]] || {
              echo "ERROR: target must be a 40-char git SHA" >&2
              exit 2
          }

          [[ -d "$REPO/.git" ]] || {
              echo "ERROR: runner checkout missing: $REPO" >&2
              exit 2
          }

          git_safe() {
              git -c "safe.directory=$REPO" -C "$REPO" "$@"
          }

          HEAD="$(git_safe rev-parse HEAD)"
          MASTER="$(git_safe rev-parse refs/remotes/origin/master)"

          echo "TARGET=$TARGET"
          echo "HEAD=$HEAD"
          echo "ORIGIN_MASTER=$MASTER"

          [[ "$HEAD" == "$TARGET" ]] || {
              echo "ERROR: checkout SHA mismatch" >&2
              exit 3
          }
          [[ "$MASTER" == "$TARGET" ]] || {
              echo "ERROR: target is not current origin/master" >&2
              exit 3
          }
          [[ -z "$(git_safe status --porcelain --untracked-files=no)" ]] || {
              echo "ERROR: tracked working tree is dirty" >&2
              exit 3
          }

          cd "$REPO"
          python3 tools/source_manifest_gate.py

          cleanup() {
              if [[ -d "$REPO/validation" ]]; then
                  chown -R github-runner:github-runner "$REPO/validation" || true
              fi
          }
          trap cleanup EXIT

          echo "PRODUCTION_WRAPPER_VERSION=source-controlled-v2"
          ./deploy/voip-ai --env "$ENV_FILE" --revision "$TARGET" deploy
          ./deploy/voip-ai --env "$ENV_FILE" --revision "$TARGET" verify
          echo "PRODUCTION_DEPLOY_WRAPPER=PASS"
          WRAPPER
          chmod 0755 deploy/production_deploy_wrapper.sh

          cat > deploy/production_wrapper_migration.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import argparse
          import hashlib
          import os
          import re
          import stat
          import tempfile
          from pathlib import Path

          LEGACY_WRAPPER_SHA256 = {
              "77b2b30e448b1600a56e476dae9c359617d87706e1bf48e549ac4d4d35635edb",
          }
          BUILD_REVISION_RE = re.compile(rb"^[ \t]*(?:export[ \t]+)?BUILD_REVISION[ \t]*=", re.ASCII)


          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()


          def normalize_persistent_env(path: Path) -> int:
              st = path.stat()
              mode = stat.S_IMODE(st.st_mode)
              if mode & 0o077:
                  raise RuntimeError(f"persistent production env is not private: {path} mode={mode:04o}")
              raw = path.read_bytes()
              lines = raw.splitlines(keepends=True)
              kept = [line for line in lines if not BUILD_REVISION_RE.match(line)]
              removed = len(lines) - len(kept)
              if removed == 0:
                  return 0

              fd, tmp_name = tempfile.mkstemp(prefix=f".{path.name}.", dir=str(path.parent))
              tmp = Path(tmp_name)
              try:
                  with os.fdopen(fd, "wb") as handle:
                      handle.write(b"".join(kept))
                      handle.flush()
                      os.fsync(handle.fileno())
                  os.chmod(tmp, mode)
                  os.chown(tmp, st.st_uid, st.st_gid)
                  os.replace(tmp, path)
                  dir_fd = os.open(path.parent, os.O_DIRECTORY)
                  try:
                      os.fsync(dir_fd)
                  finally:
                      os.close(dir_fd)
              finally:
                  if tmp.exists():
                      tmp.unlink()
              return removed


          def install_wrapper(source: Path, target: Path) -> None:
              data = source.read_bytes()
              fd, tmp_name = tempfile.mkstemp(prefix=f".{target.name}.", dir=str(target.parent))
              tmp = Path(tmp_name)
              try:
                  with os.fdopen(fd, "wb") as handle:
                      handle.write(data)
                      handle.flush()
                      os.fsync(handle.fileno())
                  os.chmod(tmp, 0o755)
                  if os.geteuid() == 0:
                      os.chown(tmp, 0, 0)
                  os.replace(tmp, target)
                  dir_fd = os.open(target.parent, os.O_DIRECTORY)
                  try:
                      os.fsync(dir_fd)
                  finally:
                      os.close(dir_fd)
              finally:
                  if tmp.exists():
                      tmp.unlink()


          def sync(source: Path, target: Path, env_file: Path) -> tuple[str, int, str]:
              source_hash = digest(source)
              current_hash = digest(target) if target.exists() else "missing"

              if current_hash == source_hash:
                  removed = normalize_persistent_env(env_file)
                  mode = "CURRENT_NORMALIZED" if removed else "CURRENT"
                  return mode, removed, source_hash

              if current_hash != "missing" and current_hash not in LEGACY_WRAPPER_SHA256:
                  raise RuntimeError(
                      "refusing to replace unknown privileged production wrapper: "
                      f"observed_sha256={current_hash} expected_current={source_hash} "
                      f"allowed_legacy={sorted(LEGACY_WRAPPER_SHA256)}"
                  )

              removed = normalize_persistent_env(env_file)
              install_wrapper(source, target)
              if digest(target) != source_hash:
                  raise RuntimeError("privileged production wrapper post-install digest mismatch")
              return "MIGRATED", removed, source_hash


          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument("--source", required=True, type=Path)
              parser.add_argument("--target", required=True, type=Path)
              parser.add_argument("--env-file", required=True, type=Path)
              args = parser.parse_args()
              if os.geteuid() != 0:
                  raise SystemExit("ERROR: production wrapper synchronization requires root")
              try:
                  mode, removed, source_hash = sync(
                      args.source.resolve(), args.target.resolve(), args.env_file.resolve()
                  )
              except Exception as exc:
                  print(f"PRODUCTION_WRAPPER_SYNC=FAIL reason={exc}", file=__import__("sys").stderr)
                  return 2
              print(
                  "PRODUCTION_WRAPPER_SYNC=PASS "
                  f"mode={mode} source_sha256={source_hash} "
                  f"persistent_build_revision_removed={removed}"
              )
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          PY
          chmod 0755 deploy/production_wrapper_migration.py

          python3 - <<'PY'
          from pathlib import Path
          path = Path('deploy/voip-ai')
          text = path.read_text(encoding='utf-8')
          needle = "deploy_stack() {\n  perf_reset\n"
          replacement = '''deploy_stack() {
            if [[ "$(id -u)" == "0" && "$BASE_ENV_FILE" == "/etc/voip-ai/production.env" ]]; then
              python3 deploy/production_wrapper_migration.py \\
                --source deploy/production_deploy_wrapper.sh \\
                --target /usr/local/sbin/voip-ai-production-deploy \\
                --env-file "$BASE_ENV_FILE"
            fi
            perf_reset
          '''
          if needle not in text:
              raise SystemExit('deploy_stack insertion point not found')
          text = text.replace(needle, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY

          cat > backend/tests/test_production_wrapper_migration.py <<'PYTEST'
          import hashlib
          import importlib.util
          import stat
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[2]
          MIGRATION = ROOT / "deploy" / "production_wrapper_migration.py"
          WRAPPER = ROOT / "deploy" / "production_deploy_wrapper.sh"


          def load_migration():
              spec = importlib.util.spec_from_file_location("production_wrapper_migration", MIGRATION)
              module = importlib.util.module_from_spec(spec)
              assert spec.loader is not None
              spec.loader.exec_module(module)
              return module


          def test_source_controlled_wrapper_never_writes_persistent_build_revision():
              text = WRAPPER.read_text(encoding="utf-8")
              assert 'python3 - "$ENV_FILE" "$TARGET"' not in text
              assert 'BUILD_REVISION={target}' not in text
              assert '--revision "$TARGET" deploy' in text
              assert '--revision "$TARGET" verify' in text
              assert "PRODUCTION_WRAPPER_VERSION=source-controlled-v2" in text


          def test_migration_removes_only_build_revision_and_preserves_private_mode(tmp_path):
              migration = load_migration()
              env = tmp_path / "production.env"
              env.write_bytes(
                  b"APP_ENV=production\n"
                  b"BUILD_REVISION=1111111111111111111111111111111111111111\n"
                  b"SECRET_VALUE=keep-me-byte-for-byte\n"
              )
              env.chmod(0o600)
              removed = migration.normalize_persistent_env(env)
              assert removed == 1
              assert env.read_bytes() == b"APP_ENV=production\nSECRET_VALUE=keep-me-byte-for-byte\n"
              assert stat.S_IMODE(env.stat().st_mode) == 0o600


          def test_migration_refuses_unknown_privileged_wrapper(tmp_path):
              migration = load_migration()
              source = tmp_path / "source-wrapper"
              source.write_text("#!/bin/sh\necho new\n", encoding="utf-8")
              target = tmp_path / "target-wrapper"
              target.write_text("#!/bin/sh\necho unknown\n", encoding="utf-8")
              env = tmp_path / "production.env"
              env.write_text("APP_ENV=production\n", encoding="utf-8")
              env.chmod(0o600)
              try:
                  migration.sync(source, target, env)
              except RuntimeError as exc:
                  assert "unknown privileged production wrapper" in str(exc)
              else:
                  raise AssertionError("unknown wrapper must fail closed")


          def test_legacy_wrapper_hash_is_explicitly_pinned():
              migration = load_migration()
              assert migration.LEGACY_WRAPPER_SHA256 == {
                  "77b2b30e448b1600a56e476dae9c359617d87706e1bf48e549ac4d4d35635edb"
              }
          PYTEST

          python3 - <<'PY'
          from pathlib import Path
          path = Path('deploy/DEPLOYMENT_GUIDE.md')
          text = path.read_text(encoding='utf-8')
          marker = "- 禁止手工同步 `BUILD_REVISION` 到 `/etc/voip-ai/production.env`；该值由部署入口运行时注入。\n"
          addition = marker + "- `/usr/local/sbin/voip-ai-production-deploy` 由 `deploy/production_deploy_wrapper.sh` 管控；已知 legacy wrapper 会在首次 exact-master 部署时自动迁移，并一次性删除持久 env 中遗留的 `BUILD_REVISION`。未知 wrapper 哈希一律 fail-closed。\n"
          if marker not in text:
              raise SystemExit('deployment guide marker not found')
          path.write_text(text.replace(marker, addition, 1), encoding='utf-8')
          PY

          python3 tools/source_manifest_gate.py --update
          python3 tools/source_manifest_gate.py
          bash -n deploy/voip-ai
          bash -n deploy/production_deploy_wrapper.sh
          python3 -m py_compile deploy/runtime_env.py deploy/production_wrapper_migration.py

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/voip-ai deploy/production_deploy_wrapper.sh deploy/production_wrapper_migration.py \
            deploy/DEPLOYMENT_GUIDE.md backend/tests/test_production_wrapper_migration.py release/source_manifest.json
          git commit -m 'fix(deploy): source-control privileged production wrapper'
          git push origin HEAD:fix/source-controlled-production-wrapper
