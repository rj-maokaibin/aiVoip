name: Evidence V2 DEFAULT manifest refresh

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.ref == 'promote/evidence-v2-default'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate DEFAULT source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('deploy/evidence_v2_rollout.json').read_text(encoding='utf-8'))
          assert p['schema_version'] == 'evidence-v2-production-rollout-v1'
          assert p['stage'] == 'DEFAULT'
          assert p['strict_validator'] is True
          assert p['default_projection'] == 'V2'
          assert p['canary_selector'] == 'BOUND_REAL_GOLDEN_001'
          PY
          python3 -m py_compile deploy/runtime_env.py

          base="$(mktemp)"
          out="$(mktemp)"
          trap 'rm -f "$base" "$out" /tmp/evidence-v2-shadow.json /tmp/evidence-v2-invalid.json' EXIT
          cat >"$base" <<'EOF'
          PRELIMINARY_EVIDENCE_V2_COMPOSE=true
          PRELIMINARY_EVIDENCE_V2_STRICT_VALIDATOR=true
          PRELIMINARY_EVIDENCE_V2_PROJECT=false
          BUILD_REVISION=0000000000000000000000000000000000000000
          EOF
          chmod 600 "$base"
          before="$(sha256sum "$base" | awk '{print $1}')"
          head="$(git rev-parse HEAD)"
          python3 deploy/runtime_env.py --base-env "$base" --revision "$head" --out "$out"
          grep -qx 'PRELIMINARY_EVIDENCE_V2_PROJECT=true' "$out"
          test "$(grep -c '^PRELIMINARY_EVIDENCE_V2_PROJECT=' "$out")" = 1
          test "$(sha256sum "$base" | awk '{print $1}')" = "$before"
          test "$(stat -c '%a' "$out")" = 600

          cat >/tmp/evidence-v2-shadow.json <<'EOF'
          {"schema_version":"evidence-v2-production-rollout-v1","stage":"SHADOW","canary_selector":"BOUND_REAL_GOLDEN_001","strict_validator":true,"default_projection":"V1"}
          EOF
          python3 deploy/runtime_env.py --base-env "$base" --revision "$head" --out "$out" --rollout /tmp/evidence-v2-shadow.json
          grep -qx 'PRELIMINARY_EVIDENCE_V2_PROJECT=false' "$out"

          cat >/tmp/evidence-v2-invalid.json <<'EOF'
          {"schema_version":"evidence-v2-production-rollout-v1","stage":"DEFAULT","canary_selector":"BOUND_REAL_GOLDEN_001","strict_validator":true,"default_projection":"V1"}
          EOF
          if python3 deploy/runtime_env.py --base-env "$base" --revision "$head" --out "$out" --rollout /tmp/evidence-v2-invalid.json; then
            echo 'ERROR: invalid DEFAULT/V1 rollout was accepted' >&2
            exit 1
          fi

      - name: Refresh governed source manifest and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout '${{ github.event.pull_request.head.ref }}'
          rm -f .github/workflows/evidence-v2-default-manifest-refresh.yml
          python3 tools/source_manifest_gate.py --update
          python3 tools/source_manifest_gate.py
          git add release/source_manifest.json .github/workflows/evidence-v2-default-manifest-refresh.yml
          git commit -m 'Refresh source manifest for Evidence V2 DEFAULT'
          git push origin HEAD:'${{ github.event.pull_request.head.ref }}'
