name: CI/CD V2 Production Probe

on:
  push:
    branches:
      - ops/cicd-v2-production-probe
    paths:
      - '.github/workflows/production-probe.yml'

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_SHA: c701685f2f389ab639eb20a0b4270797734ad50d
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/cicd-v2-production-probe
          fetch-depth: 2
      - name: Probe formal Production Deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GITHUB_TOKEN']; target=os.environ['TARGET_SHA']; api=os.environ.get('GITHUB_API_URL','https://api.github.com')
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'aivoip-cicd-v2-probe'}
          def get(path):
              req=urllib.request.Request(f'{api}/repos/{repo}{path}',headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          runs=get('/actions/workflows/production-deploy.yml/runs?branch=master&per_page=30').get('workflow_runs',[])
          matches=[r for r in runs if r.get('head_sha')==target]
          run=sorted(matches,key=lambda r:r.get('run_attempt',1),reverse=True)[0] if matches else None
          payload={'target_sha':target,'run':None,'jobs':[]}
          if run:
              payload['run']={k:run.get(k) for k in ('id','run_number','run_attempt','event','status','conclusion','created_at','run_started_at','updated_at','html_url')}
              jobs=get(f"/actions/runs/{run['id']}/jobs?per_page=100").get('jobs',[])
              payload['jobs']=[{'id':j.get('id'),'name':j.get('name'),'status':j.get('status'),'conclusion':j.get('conclusion'),'steps':[{'name':s.get('name'),'status':s.get('status'),'conclusion':s.get('conclusion')} for s in j.get('steps',[])]} for j in jobs]
          p=Path('validation/cicd_v2_production_probe.json');p.parent.mkdir(parents=True,exist_ok=True);p.write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8');print(json.dumps(payload,ensure_ascii=False,indent=2))
          PY
      - name: Commit probe result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/cicd_v2_production_probe.json
          git commit -m 'chore: capture CI/CD V2 production probe'
          git push origin HEAD:ops/cicd-v2-production-probe
