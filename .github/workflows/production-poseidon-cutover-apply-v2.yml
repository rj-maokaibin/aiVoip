name: Production Poseidon Credential Cutover Apply V2

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/production-poseidon-cutover-apply-v2.yml'

permissions:
  contents: read

concurrency:
  group: production-poseidon-credential-cutover-apply-v2
  cancel-in-progress: false

jobs:
  apply-cutover-v2:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 30
    env:
      EXPECTED_PRODUCTION_ENV: /etc/voip-ai/production.env
      EXPECTED_WORKDIR: /home/dev/workspace/aiVoip-control
      TARGET_IP: '10.48.8.74'
      TARGET_PORT: '10002'
      TARGET_SN: 'G1U060H000384'
      TARGET_PRODUCT: 'APF3260'
      TARGET_VOICE_INTERFACE: 'br-lan_400'
      APP_SERVICES: 'backend collector-worker packet-worker pcm-worker media-worker diagnosis-worker feishu-long-connection reproduction-worker reproduction-control-high-worker reproduction-watch-worker beat'

    steps:
      - name: Fail-closed pre-cutover guard
        run: |
          set -euo pipefail
          docker info >/dev/null

          mapfile -t backends < <(docker ps --filter label=com.docker.compose.project=voip-ai --filter label=com.docker.compose.service=backend --format '{{.Names}}')
          mapfile -t workers < <(docker ps --filter label=com.docker.compose.project=voip-ai --filter label=com.docker.compose.service=reproduction-worker --format '{{.Names}}')
          test "${#backends[@]}" -eq 1
          test "${#workers[@]}" -eq 1
          backend="${backends[0]}"
          worker="${workers[0]}"
          env_file="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project.environment_file" }}' "$backend")"
          workdir="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' "$backend")"
          helper_image="$(docker inspect --format '{{.Config.Image}}' "$backend")"
          test "$env_file" = "$EXPECTED_PRODUCTION_ENV"
          test "$workdir" = "$EXPECTED_WORKDIR"
          test -n "$helper_image"

          docker exec -i "$backend" python - <<'PY'
          import os
          assert os.getenv('CREDENTIAL_PROVIDER','').lower() == 'api'
          assert os.getenv('CAPTURE_ENGINE_VERSION') == 'V2'
          assert os.getenv('CAPTURE_V2_PRODUCTION_ENABLED','').lower() == 'true'
          assert os.getenv('REPRODUCTION_PLATFORM_MODE') == 'real'
          print('PRE_CUTOVER_PROVIDER=api')
          print('PRE_CUTOVER_CAPTURE_AUTHORITY=V2_REAL')
          PY

          docker exec -i "$backend" python - <<'PY'
          from sqlalchemy import select
          from app.contracts.enums import LockStatus, ReproductionState
          from app.db.models import DeviceDiagnosticLock, ReproductionSession
          from app.db.session import SessionLocal
          terminal={
              ReproductionState.COMPLETED.value,
              ReproductionState.PARTIAL_SUCCESS.value,
              ReproductionState.CANCELLED.value,
              ReproductionState.FAILED.value,
          }
          db=SessionLocal()
          try:
              sessions=list(db.scalars(select(ReproductionSession)).all())
              active_sessions=[s for s in sessions if s.state not in terminal]
              active_locks=list(db.scalars(select(DeviceDiagnosticLock).where(
                  DeviceDiagnosticLock.status.in_([LockStatus.ACTIVE.value, LockStatus.QUARANTINED.value])
              )).all())
              print(f'ACTIVE_NONTERMINAL_SESSION_COUNT={len(active_sessions)}')
              print(f'ACTIVE_OR_QUARANTINED_LOCK_COUNT={len(active_locks)}')
              assert not active_sessions
              assert not active_locks
          finally:
              db.close()
          PY

          docker exec -i \
            -e CREDENTIAL_PROVIDER=poseidon \
            -e TARGET_IP="$TARGET_IP" \
            -e TARGET_PORT="$TARGET_PORT" \
            -e TARGET_SN="$TARGET_SN" \
            -e TARGET_PRODUCT="$TARGET_PRODUCT" \
            -e TARGET_VOICE_INTERFACE="$TARGET_VOICE_INTERFACE" \
            "$worker" python - <<'PY'
          import asyncio, os, socket
          from app.integrations.credentials import get_credential_provider
          from app.collectors.asyncssh_adapter import AsyncSSHDeviceAdapter
          async def main():
              ip=os.environ['TARGET_IP']; port=int(os.environ['TARGET_PORT'])
              provider=get_credential_provider()
              assert type(provider).__name__ == 'PoseidonCredentialProvider'
              assert bool(getattr(provider,'production_capable',False))
              with socket.create_connection((ip,port),timeout=5): pass
              password=await provider.get_password(sn=os.environ['TARGET_SN'], ip=ip, product=os.environ['TARGET_PRODUCT'])
              assert password
              adapter=AsyncSSHDeviceAdapter(ip=ip, port=port, username='root', password=password)
              try:
                  await adapter.connect()
                  res=await adapter.execute_shell(f"echo PRE_CUTOVER_SSH_OK=1; ip link show {os.environ['TARGET_VOICE_INTERFACE']} >/dev/null 2>&1 && echo VOICE_IF_OK=1")
                  assert 'PRE_CUTOVER_SSH_OK=1' in (res.stdout or '')
                  assert 'VOICE_IF_OK=1' in (res.stdout or '')
              finally:
                  await adapter.disconnect()
              print('PRE_CUTOVER_POSEIDON_REAL_DUT=PASS')
          asyncio.run(main())
          PY

          plugin=''
          for p in \
            /usr/libexec/docker/cli-plugins/docker-compose \
            /usr/lib/docker/cli-plugins/docker-compose \
            /usr/local/lib/docker/cli-plugins/docker-compose \
            "$HOME/.docker/cli-plugins/docker-compose"; do
            if [ -x "$p" ]; then plugin="$p"; break; fi
          done
          test -n "$plugin"
          "$plugin" version

          # Important: --env-file supplies Compose interpolation, while the base
          # compose file's env_file uses VOIP_APP_ENV_FILE. Pin both to the exact
          # protected production env before any mutation.
          timeout 120 docker run --rm \
            -e WORKDIR="$workdir" \
            -e VOIP_APP_ENV_FILE=/etc/voip-ai/production.env \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$plugin:/usr/local/bin/docker-compose:ro" \
            -v "$workdir:$workdir:ro" \
            -v /etc/voip-ai:/etc/voip-ai:ro \
            -v /home/dev/secret.yaml:/home/dev/secret.yaml:ro \
            --entrypoint sh "$helper_image" -c '
              set -eu
              cd "$WORKDIR"
              /usr/local/bin/docker-compose version
              /usr/local/bin/docker-compose --project-name voip-ai \
                --env-file /etc/voip-ai/production.env \
                -f docker-compose.yml -f docker-compose.production.yml \
                config --services >/tmp/services
              grep -qx backend /tmp/services
              grep -qx reproduction-worker /tmp/services
              /usr/local/bin/docker-compose --project-name voip-ai \
                --env-file /etc/voip-ai/production.env \
                -f docker-compose.yml -f docker-compose.production.yml \
                ps --status running --services >/tmp/running
              grep -qx backend /tmp/running
              grep -qx reproduction-worker /tmp/running
              echo COMPOSE_DIRECT_PLUGIN_PREFLIGHT=PASS
            '

          printf 'PRODUCTION_WORKDIR=%s\n' "$workdir" >> "$GITHUB_ENV"
          printf 'HELPER_IMAGE=%s\n' "$helper_image" >> "$GITHUB_ENV"
          printf 'COMPOSE_PLUGIN=%s\n' "$plugin" >> "$GITHUB_ENV"
          echo 'PRE_CUTOVER_GUARD=PASS'

      - name: Atomic api-to-Poseidon cutover with automatic rollback
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/poseidon-cutover-v2"
          result="$RUNNER_TEMP/poseidon-cutover-v2/result.json"
          stage='INIT'
          mutated=0
          backup_name="production.env.pre-poseidon.$(date -u +%Y%m%dT%H%M%SZ)"

          compose_helper() {
            timeout 240 docker run --rm \
              -e WORKDIR="$PRODUCTION_WORKDIR" \
              -e VOIP_APP_ENV_FILE=/etc/voip-ai/production.env \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$COMPOSE_PLUGIN:/usr/local/bin/docker-compose:ro" \
              -v "$PRODUCTION_WORKDIR:$PRODUCTION_WORKDIR:ro" \
              -v /etc/voip-ai:/etc/voip-ai:ro \
              -v /home/dev/secret.yaml:/home/dev/secret.yaml:ro \
              --entrypoint sh "$HELPER_IMAGE" -c '
                set -eu
                cd "$WORKDIR"
                exec /usr/local/bin/docker-compose --project-name voip-ai \
                  --env-file /etc/voip-ai/production.env \
                  -f docker-compose.yml -f docker-compose.production.yml "$@"
              ' sh "$@"
          }

          write_result() {
            local verdict="$1" mutation="$2" rollback="$3" rollback_ok="$4" failed_stage="$5"
            VERDICT="$verdict" MUTATION="$mutation" ROLLBACK="$rollback" ROLLBACK_OK="$rollback_ok" FAILED_STAGE="$failed_stage" BACKUP_NAME="$backup_name" TARGET_SN_SUFFIX="${TARGET_SN: -4}" \
              python3 - <<'PY' > "$result"
          import json, os
          print(json.dumps({
              'schema_version':'production-poseidon-credential-cutover-v2',
              'verdict':os.environ['VERDICT'],
              'production_mutation_performed':os.environ['MUTATION']=='true',
              'rollback_performed':os.environ['ROLLBACK']=='true',
              'rollback_verified':os.environ['ROLLBACK_OK']=='true',
              'failed_stage':os.environ['FAILED_STAGE'] or None,
              'backup_file_basename':os.environ['BACKUP_NAME'] if os.environ['MUTATION']=='true' else None,
              'target':{'model':'APF3260-M','sn_suffix':os.environ['TARGET_SN_SUFFIX'],'ip':'10.48.8.74','ssh_port':10002},
              'intended_provider':'poseidon',
              'capture_authority_expected':'V2_REAL',
          }, ensure_ascii=False, indent=2))
          PY
          }

          rollback() {
            set +e
            local ok=true
            echo "ROLLBACK_BEGIN stage=$stage"
            docker run --rm -i \
              -e BACKUP_NAME="$backup_name" \
              -v /etc/voip-ai:/target:rw \
              --entrypoint python "$HELPER_IMAGE" - <<'PY'
          import os
          from pathlib import Path
          root=Path('/target'); src=root/os.environ['BACKUP_NAME']; dst=root/'production.env'
          if not src.is_file(): raise SystemExit('ROLLBACK_BACKUP_MISSING')
          data=src.read_bytes(); tmp=root/'.production.env.rollback.tmp'; tmp.write_bytes(data)
          st=src.stat(); os.chmod(tmp, 0o600)
          try: os.chown(tmp, st.st_uid, st.st_gid)
          except PermissionError: pass
          os.replace(tmp,dst)
          print('ROLLBACK_ENV_RESTORED=PASS')
          PY
            [ $? -eq 0 ] || ok=false
            compose_helper up -d --no-deps --force-recreate $APP_SERVICES
            [ $? -eq 0 ] || ok=false
            sleep 4
            mapfile -t rb < <(docker ps --filter label=com.docker.compose.project=voip-ai --filter label=com.docker.compose.service=backend --format '{{.Names}}')
            if [ "${#rb[@]}" -eq 1 ]; then
              docker exec -i "${rb[0]}" python - <<'PY'
          import os
          assert os.getenv('CREDENTIAL_PROVIDER','').lower() == 'api'
          assert os.getenv('CAPTURE_ENGINE_VERSION') == 'V2'
          assert os.getenv('CAPTURE_V2_PRODUCTION_ENABLED','').lower() == 'true'
          print('ROLLBACK_RUNTIME=API_V2_PASS')
          PY
              [ $? -eq 0 ] || ok=false
            else
              ok=false
            fi
            if $ok; then
              write_result BLOCKED true true true "$stage"
              echo 'ROLLBACK_VERIFIED=PASS'
            else
              write_result FAILED true true false "$stage"
              echo 'ROLLBACK_VERIFIED=FAILED' >&2
            fi
            set -e
          }

          on_exit() {
            rc=$?
            trap - EXIT
            if [ "$rc" -ne 0 ] && [ "$mutated" -eq 1 ]; then
              rollback
            elif [ "$rc" -ne 0 ]; then
              write_result BLOCKED false false false "$stage"
            fi
            exit "$rc"
          }
          trap on_exit EXIT

          stage='BACKUP_AND_ATOMIC_ENV_SWITCH'
          docker run --rm -i \
            -e BACKUP_NAME="$backup_name" \
            -v /etc/voip-ai:/target:rw \
            --entrypoint python "$HELPER_IMAGE" - <<'PY'
          import os, shutil
          from pathlib import Path
          root=Path('/target'); env=root/'production.env'; backup=root/os.environ['BACKUP_NAME']
          if not env.is_file(): raise SystemExit('PRODUCTION_ENV_MISSING')
          st=env.stat(); shutil.copy2(env, backup); os.chmod(backup, 0o600)
          lines=env.read_text(encoding='utf-8').splitlines(); out=[]; seen=0
          for line in lines:
              stripped=line.strip(); prefix='export ' if stripped.startswith('export ') else ''
              body=stripped[7:].strip() if prefix else stripped
              if body.startswith('CREDENTIAL_PROVIDER='):
                  seen += 1
                  old=body.split('=',1)[1].strip().strip("'\"").lower()
                  if old != 'api': raise SystemExit(f'UNEXPECTED_CURRENT_PROVIDER:{old}')
                  out.append(prefix+'CREDENTIAL_PROVIDER=poseidon')
              else:
                  out.append(line)
          if seen != 1: raise SystemExit(f'CREDENTIAL_PROVIDER_LINE_COUNT:{seen}')
          tmp=root/'.production.env.poseidon.tmp'; tmp.write_text('\n'.join(out)+'\n', encoding='utf-8')
          os.chmod(tmp, 0o600)
          try: os.chown(tmp, st.st_uid, st.st_gid)
          except PermissionError: pass
          os.replace(tmp, env)
          print('PRODUCTION_ENV_PROVIDER_SWITCH=POSEIDON')
          print('PRODUCTION_ENV_BACKUP_CREATED=PASS')
          PY
          mutated=1

          stage='RECREATE_APPLICATION_CONTAINERS'
          compose_helper up -d --no-deps --force-recreate $APP_SERVICES

          stage='WAIT_APPLICATION_CONTAINERS'
          for _ in $(seq 1 60); do
            all_running=true
            for svc in $APP_SERVICES; do
              mapfile -t cs < <(docker ps --filter label=com.docker.compose.project=voip-ai --filter label=com.docker.compose.service="$svc" --format '{{.Names}}')
              if [ "${#cs[@]}" -ne 1 ]; then all_running=false; break; fi
            done
            $all_running && break
            sleep 2
          done
          for svc in $APP_SERVICES; do
            mapfile -t cs < <(docker ps --filter label=com.docker.compose.project=voip-ai --filter label=com.docker.compose.service="$svc" --format '{{.Names}}')
            test "${#cs[@]}" -eq 1
            docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "${cs[0]}" | grep -qx 'CREDENTIAL_PROVIDER=poseidon'
          done
          echo 'ALL_APP_CONTAINERS_PROVIDER=POSEIDON'

          stage='VERIFY_CORE_RUNTIME'
          mapfile -t new_backends < <(docker ps --filter label=com.docker.compose.project=voip-ai --filter label=com.docker.compose.service=backend --format '{{.Names}}')
          mapfile -t new_workers < <(docker ps --filter label=com.docker.compose.project=voip-ai --filter label=com.docker.compose.service=reproduction-worker --format '{{.Names}}')
          test "${#new_backends[@]}" -eq 1
          test "${#new_workers[@]}" -eq 1
          backend="${new_backends[0]}"; worker="${new_workers[0]}"
          docker exec -i "$backend" python - <<'PY'
          import os
          from app.integrations.credentials import get_credential_provider
          assert os.getenv('CREDENTIAL_PROVIDER','').lower() == 'poseidon'
          assert os.getenv('CAPTURE_ENGINE_VERSION') == 'V2'
          assert os.getenv('CAPTURE_V2_PRODUCTION_ENABLED','').lower() == 'true'
          assert os.getenv('REPRODUCTION_PLATFORM_MODE') == 'real'
          p=get_credential_provider()
          assert type(p).__name__ == 'PoseidonCredentialProvider'
          assert bool(getattr(p,'production_capable',False))
          print('POST_CUTOVER_RUNTIME=POSEIDON_V2_REAL_PASS')
          PY
          redis="$(docker ps --filter label=com.docker.compose.project=voip-ai --filter label=com.docker.compose.service=redis --format '{{.Names}}')"
          postgres="$(docker ps --filter label=com.docker.compose.project=voip-ai --filter label=com.docker.compose.service=postgres --format '{{.Names}}')"
          test -n "$redis"; test -n "$postgres"
          docker exec "$redis" redis-cli ping | grep -qx PONG
          docker exec "$postgres" pg_isready -U voip -d voip >/dev/null
          echo 'POST_CUTOVER_CORE_SERVICES=PASS'

          stage='VERIFY_APF3260_REAL_DUT'
          docker exec -i \
            -e TARGET_IP="$TARGET_IP" \
            -e TARGET_PORT="$TARGET_PORT" \
            -e TARGET_SN="$TARGET_SN" \
            -e TARGET_PRODUCT="$TARGET_PRODUCT" \
            -e TARGET_VOICE_INTERFACE="$TARGET_VOICE_INTERFACE" \
            "$worker" python - <<'PY'
          import asyncio, os, socket
          from app.integrations.credentials import get_credential_provider
          from app.collectors.asyncssh_adapter import AsyncSSHDeviceAdapter
          async def main():
              ip=os.environ['TARGET_IP']; port=int(os.environ['TARGET_PORT'])
              provider=get_credential_provider(); assert type(provider).__name__ == 'PoseidonCredentialProvider'
              with socket.create_connection((ip,port),timeout=5): pass
              password=await provider.get_password(sn=os.environ['TARGET_SN'], ip=ip, product=os.environ['TARGET_PRODUCT']); assert password
              adapter=AsyncSSHDeviceAdapter(ip=ip, port=port, username='root', password=password)
              try:
                  await adapter.connect()
                  res=await adapter.execute_shell(f"echo POST_CUTOVER_SSH_OK=1; ip link show {os.environ['TARGET_VOICE_INTERFACE']} >/dev/null 2>&1 && echo VOICE_IF_OK=1")
                  out=res.stdout or ''
                  assert 'POST_CUTOVER_SSH_OK=1' in out
                  assert 'VOICE_IF_OK=1' in out
              finally:
                  await adapter.disconnect()
              print('POST_CUTOVER_APF3260_POSEIDON_SSH=PASS')
          asyncio.run(main())
          PY

          stage='COMPLETE'
          write_result PASS true false false ''
          trap - EXIT
          echo 'PRODUCTION_CREDENTIAL_CUTOVER=PASS provider=poseidon'

      - name: Upload sanitized cutover evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-poseidon-credential-cutover-v2
          path: ${{ runner.temp }}/poseidon-cutover-v2/result.json
          if-no-files-found: warn
          retention-days: 90
