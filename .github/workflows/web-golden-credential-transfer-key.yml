name: WEB Golden Credential Transfer Key

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/web-golden-credential-transfer-key.yml'

permissions:
  contents: read

concurrency:
  group: web-golden-credential-transfer-key
  cancel-in-progress: false

jobs:
  bootstrap-public-key:
    runs-on: [self-hosted, linux, x64, voip-controlled-linux]
    timeout-minutes: 5
    steps:
      - name: Create or reuse runner-local private key and export public key only
        shell: bash
        run: |
          set -euo pipefail
          key_dir=/home/github-runner/.config/voip-ai
          key="$key_dir/web-golden-credential-transfer.pem"
          pub="$RUNNER_TEMP/web-golden-credential-transfer-public.pem"
          mkdir -p "$key_dir"
          chmod 0700 "$key_dir"
          if [ ! -s "$key" ]; then
            umask 077
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$key" >/dev/null 2>&1
          fi
          chmod 0600 "$key"
          openssl pkey -in "$key" -pubout -out "$pub"
          openssl pkey -pubin -in "$pub" -outform DER 2>/dev/null | sha256sum | awk '{print $1}' > "$RUNNER_TEMP/web-golden-credential-transfer-public.sha256"
          test -s "$pub"
          test -s "$RUNNER_TEMP/web-golden-credential-transfer-public.sha256"
          echo 'WEB_GOLDEN_CREDENTIAL_TRANSFER_KEY=READY public_only=true'

      - name: Upload public key only
        uses: actions/upload-artifact@v4
        with:
          name: web-golden-credential-transfer-public-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/web-golden-credential-transfer-public.pem
            ${{ runner.temp }}/web-golden-credential-transfer-public.sha256
          if-no-files-found: error
          retention-days: 1
