name: Capture V2 RC93 Readiness Probe

on:
  push:
    branches:
      - ci/capture-v2-control-wakeup-20260825
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-v2-control-wakeup
  cancel-in-progress: true

jobs:
  rc93-readiness-probe:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 10
    steps:
      - name: Read backend readiness and logs
        shell: bash
        run: |
          set -euo pipefail
          echo '=== READY RESPONSE ==='
          curl -sS --max-time 5 -i http://127.0.0.1:18001/health/ready || true
          echo
          echo '=== BACKEND LOG TAIL ==='
          docker logs --tail 160 voip-ai-backend-1 2>&1 || true
          echo '=== CONTAINER STATE ==='
          docker inspect voip-ai-backend-1 --format '{{json .State}}' || true
          echo '=== VOIP-AI RUNNING SERVICES ==='
          docker ps --format '{{.Names}} {{.Status}}' | grep '^voip-ai-' | sort || true

      - name: Read safe authority keys
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i -v /etc/voip-ai:/probe/voip-ai:ro python:3.12-slim python - <<'PY'
          from pathlib import Path
          p=Path('/probe/voip-ai/production.env'); vals={}
          for raw in p.read_text(encoding='utf-8').splitlines():
              s=raw.strip()
              if not s or s.startswith('#') or '=' not in s: continue
              if s.startswith('export '): s=s[7:].strip()
              k,v=s.split('=',1); vals[k.strip()]=v.strip().strip('"').strip("'")
          def eff(k,d): return vals.get(k,'').strip() or d
          print('ENGINE='+eff('CAPTURE_ENGINE_VERSION','V1'))
          print('V2_ENABLED='+eff('CAPTURE_V2_PRODUCTION_ENABLED','false'))
          print('PLATFORM='+eff('REPRODUCTION_PLATFORM_MODE','mock'))
          print('BACKEND_PORT='+eff('VOIP_BACKEND_PORT',''))
          PY
