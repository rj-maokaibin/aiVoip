name: Capture V2 RC93 Live Readonly Probe

on:
  push:
    branches:
      - ci/capture-v2-control-wakeup-20260825
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-v2-control-wakeup
  cancel-in-progress: true

jobs:
  rc93-live-probe:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 10
    steps:
      - name: Read RC93 host processes and voip-ai runtime
        shell: bash
        run: |
          set -euo pipefail
          echo '=== CONTROL/CUTOVER PROCESSES ==='
          ps -eo pid,ppid,pgid,sid,tpgid,user,etime,stat,args | grep -E 'capture_v2.control_cli|production_cutover_guarded|deploy/voip-ai' | grep -v grep || true
          echo '=== VOIP-AI CONTAINERS ==='
          docker ps -a --format '{{.ID}} {{.Names}} {{.Status}} {{.Ports}}' | grep '^.* voip-ai-' || true
          echo '=== PORTS ==='
          ss -ltn '( sport = :18001 or sport = :8080 or sport = :19001 )' || true
          echo '=== BACKEND READINESS ==='
          curl -fsS --max-time 3 http://127.0.0.1:18001/health/ready || true

      - name: Read safe production authority keys
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i -v /etc/voip-ai:/probe/voip-ai:ro python:3.12-slim python - <<'PY'
          from pathlib import Path
          p=Path('/probe/voip-ai/production.env'); vals={}
          for raw in p.read_text(encoding='utf-8').splitlines():
              s=raw.strip()
              if not s or s.startswith('#') or '=' not in s: continue
              if s.startswith('export '): s=s[7:].strip()
              k,v=s.split('=',1); vals[k.strip()]=v.strip().strip('"').strip("'")
          def eff(k,d): return vals.get(k,'').strip() or d
          for k,d in [('CAPTURE_ENGINE_VERSION','V1'),('CAPTURE_V2_PRODUCTION_ENABLED','false'),('REPRODUCTION_PLATFORM_MODE','mock'),('VOIP_BACKEND_BIND',''),('VOIP_BACKEND_PORT',''),('VOIP_MINIO_CONSOLE_BIND',''),('VOIP_MINIO_CONSOLE_PORT','')]:
              print(f'{k}={eff(k,d)}')
          PY
