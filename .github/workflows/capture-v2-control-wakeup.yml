name: Capture V2 RC89 Readonly Progress Probe

on:
  push:
    branches:
      - ci/capture-v2-control-wakeup-20260825
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-v2-control-wakeup
  cancel-in-progress: true

jobs:
  rc89-readonly-probe:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 10
    steps:
      - name: Read control and cutover processes
        shell: bash
        run: |
          set -euo pipefail
          echo '=== CONTROL/CUTOVER PROCESSES ==='
          ps -eo pid,ppid,pgid,sid,tpgid,user,etime,stat,args | grep -E 'capture_v2.control_cli|production_cutover_guarded|deploy/voip-ai' | grep -v grep || true
          echo '=== VOIP-AI CONTAINERS ==='
          docker ps -a --filter label=com.docker.compose.project=voip-ai --format '{{.Names}}|{{.Status}}|{{.Image}}' || true

      - name: Read safe production cutover state
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i -v /etc/voip-ai:/probe/voip-ai:ro python:3.12-slim python - <<'PY'
          from pathlib import Path
          p=Path('/probe/voip-ai/production.env'); vals={}
          for raw in p.read_text(encoding='utf-8').splitlines():
              s=raw.strip()
              if not s or s.startswith('#') or '=' not in s: continue
              if s.startswith('export '): s=s[7:].strip()
              k,v=s.split('=',1); vals[k.strip()]=v.strip().strip('"').strip("'")
          def eff(k,d): return vals.get(k,'').strip() or d
          print('APP_ENV='+eff('APP_ENV',''))
          print('ENGINE='+eff('CAPTURE_ENGINE_VERSION','V1'))
          print('V2_ENABLED='+eff('CAPTURE_V2_PRODUCTION_ENABLED','false'))
          print('PLATFORM='+eff('REPRODUCTION_PLATFORM_MODE','mock'))
          print('RBAC='+eff('FEISHU_IDENTITY_RBAC_ENABLED','false'))
          root=Path('/probe/voip-ai')
          backups=sorted(x.name for x in root.glob('production.env.capture-v2-pre-*'))
          print('CUTOVER_BACKUP_COUNT='+str(len(backups)))
          print('LATEST_CUTOVER_BACKUP='+(backups[-1] if backups else 'NONE'))
          PY
