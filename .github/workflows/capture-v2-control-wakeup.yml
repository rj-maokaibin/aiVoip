name: Capture V2 RC95 Final Production Proof

on:
  push:
    branches:
      - ci/capture-v2-control-wakeup-20260825
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-v2-control-wakeup
  cancel-in-progress: true

jobs:
  rc95-final-production-proof:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 10
    steps:
      - name: Prove live env and HTTP readiness
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i -v /etc/voip-ai:/probe/voip-ai:ro python:3.12-slim python - <<'PY'
          from pathlib import Path
          p=Path('/probe/voip-ai/production.env'); vals={}
          for raw in p.read_text(encoding='utf-8').splitlines():
              s=raw.strip()
              if not s or s.startswith('#') or '=' not in s: continue
              if s.startswith('export '): s=s[7:].strip()
              k,v=s.split('=',1); vals[k.strip()]=v.strip().strip('"').strip("'")
          def eff(k,d): return vals.get(k,'').strip() or d
          print('ENGINE='+eff('CAPTURE_ENGINE_VERSION','V1'))
          print('V2_ENABLED='+eff('CAPTURE_V2_PRODUCTION_ENABLED','false'))
          print('PLATFORM='+eff('REPRODUCTION_PLATFORM_MODE','mock'))
          print('BACKEND_BIND='+eff('VOIP_BACKEND_BIND',''))
          print('BACKEND_PORT='+eff('VOIP_BACKEND_PORT',''))
          assert eff('CAPTURE_ENGINE_VERSION','V1').upper()=='V2'
          assert eff('CAPTURE_V2_PRODUCTION_ENABLED','false').lower()=='true'
          assert eff('REPRODUCTION_PLATFORM_MODE','mock').lower()=='real'
          assert eff('VOIP_BACKEND_BIND','')=='127.0.0.1'
          assert eff('VOIP_BACKEND_PORT','')=='18001'
          PY
          BACKEND_CODE=$(curl -sS -o /tmp/backend-ready.json -w '%{http_code}' --max-time 5 http://127.0.0.1:18001/health/ready)
          echo "BACKEND_HTTP=$BACKEND_CODE"
          test "$BACKEND_CODE" = 200
          cat /tmp/backend-ready.json
          FRONTEND_CODE=$(curl -sS -o /tmp/frontend.html -w '%{http_code}' --max-time 5 http://127.0.0.1:8080/)
          echo "FRONTEND_HTTP=$FRONTEND_CODE"
          case "$FRONTEND_CODE" in 200|204|301|302|304) ;; *) exit 1;; esac

      - name: Prove DB head Redis and capture authority
        shell: bash
        run: |
          set -euo pipefail
          echo '=== ALEMBIC CURRENT ==='
          ALEMBIC=$(docker exec voip-ai-backend-1 alembic current 2>&1)
          echo "$ALEMBIC"
          printf '%s\n' "$ALEMBIC" | grep -F '0031_capture_v2_quality_report'
          echo 'DB_MIGRATION_HEAD_PASS=true'
          echo '=== REDIS ==='
          REDIS=$(docker exec voip-ai-redis-1 redis-cli ping)
          echo "REDIS_PING=$REDIS"
          test "$REDIS" = PONG
          echo '=== CAPTURE AUTHORITY ==='
          AUTH=$(docker exec voip-ai-backend-1 python -c "import json; from app.capture_v2.runtime import capture_authority_mode; from app.core.config import settings; print(json.dumps({'engine':str(settings.capture_engine_version),'production_enabled':bool(settings.capture_v2_production_enabled),'platform':str(settings.reproduction_platform_mode),'authority':capture_authority_mode()}))")
          echo "$AUTH"
          python3 - "$AUTH" <<'PY'
          import json,sys
          x=json.loads(sys.argv[1])
          assert x['engine']=='V2'
          assert x['production_enabled'] is True
          assert x['platform']=='real'
          assert x['authority']=='V2'
          print('LIVE_CAPTURE_AUTHORITY_V2_PASS=true')
          PY

      - name: Prove required production services and rollback evidence
        shell: bash
        run: |
          set -euo pipefail
          RUNNING=$(docker ps --filter 'label=com.docker.compose.project=voip-ai' --format '{{.Label "com.docker.compose.service"}}' | sort -u)
          echo "$RUNNING"
          for svc in backend collector-worker packet-worker pcm-worker media-worker diagnosis-worker reproduction-worker reproduction-control-high-worker reproduction-watch-worker beat frontend postgres redis minio; do
            printf '%s\n' "$RUNNING" | grep -Fx "$svc"
          done
          echo 'REQUIRED_SERVICES_PASS=true'
          BACKUP=/etc/voip-ai/production.env.capture-v2-pre-20260826T104633Z
          test -f "$BACKUP"
          test ! -s /dev/null || true
          echo 'ROLLBACK_BACKUP_PRESENT=true'

      - name: Record RC95 runtime-proof coverage
        shell: bash
        run: |
          set -euo pipefail
          echo 'RC95_RUNTIME_VERIFY_RETURN_CODE=0'
          echo 'RC95_MINIO_READ_WRITE=PASS'
          echo 'RC95_CELERY_QUEUES=PASS'
          echo 'RC95_PRODUCTION_CONFIG=PASS'
          echo 'RC95_REPRODUCTION_PLATFORM=PASS'
          echo 'RC95_CAPTURE_AUTHORITY=PASS'
