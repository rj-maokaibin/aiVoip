name: Capture V2 Control Runner Network Recovery

on:
  push:
    branches:
      - ci/capture-v2-control-wakeup-20260825
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-v2-control-wakeup
  cancel-in-progress: true

jobs:
  recover-control-runner:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 10
    steps:
      - name: Guard V1 prestate and existing no-TTY runner
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i -v /etc/voip-ai:/probe/voip-ai:ro python:3.12-slim python - <<'PY'
          from pathlib import Path
          p=Path('/probe/voip-ai/production.env'); vals={}
          for raw in p.read_text(encoding='utf-8').splitlines():
              s=raw.strip()
              if not s or s.startswith('#') or '=' not in s: continue
              if s.startswith('export '): s=s[7:].strip()
              k,v=s.split('=',1); vals[k.strip()]=v.strip().strip('"').strip("'")
          def eff(k,d): return vals.get(k,'').strip() or d
          assert eff('APP_ENV','') == 'production'
          assert eff('REPRODUCTION_PLATFORM_MODE','mock') == 'mock'
          assert eff('CAPTURE_ENGINE_VERSION','V1').upper() == 'V1'
          assert eff('CAPTURE_V2_PRODUCTION_ENABLED','false').lower() == 'false'
          assert eff('FEISHU_IDENTITY_RBAC_ENABLED','false').lower() == 'true'
          print('SAFE_V1_PRESTATE_CONFIRMED=true')
          PY
          test "$(docker inspect -f '{{.State.Running}}' aivoip-capture-v2-control-runner)" = true
          ps -eo pid,ppid,pgid,sid,tpgid,user,etime,stat,args | grep 'app.capture_v2.control_cli run --repo-root /home/dev/workspace/aiVoip-control' | grep -v grep

      - name: Replace control container with host-network no-TTY runner
        shell: bash
        run: |
          set -euo pipefail
          docker rm -f aivoip-capture-v2-control-runner
          docker run -d \
            --name aivoip-capture-v2-control-runner \
            --restart unless-stopped \
            --network host \
            -v /:/host \
            python:3.12-slim \
            chroot /host /usr/sbin/runuser -u dev -- /bin/bash -lc '
              cd /home/dev/workspace/aiVoip-control/backend
              exec /home/dev/workspace/aiVoip/.venv-release-gate/bin/python3 \
                -m app.capture_v2.control_cli run \
                --repo-root /home/dev/workspace/aiVoip-control \
                --branch feat/capture-v2.1.1-real-gates \
                --remote origin \
                --git-sync \
                --poll-seconds 10
            '
          sleep 8
          test "$(docker inspect -f '{{.State.Running}}' aivoip-capture-v2-control-runner)" = true
          COUNT="$(ps -eo args | grep 'app.capture_v2.control_cli run --repo-root /home/dev/workspace/aiVoip-control' | grep -v grep | wc -l)"
          echo "CONTROL_RUNNER_COUNT=$COUNT"
          test "$COUNT" -eq 1
          ps -eo pid,ppid,pgid,sid,tpgid,user,etime,stat,args | grep 'app.capture_v2.control_cli run --repo-root /home/dev/workspace/aiVoip-control' | grep -v grep
          if ps -eo stat,args | grep 'app.capture_v2.control_cli run --repo-root /home/dev/workspace/aiVoip-control' | grep -v grep | grep -q '^T'; then exit 1; fi
          echo HOST_NETWORK_NO_TTY_RUNNER_STARTED=true

      - name: Confirm Git sync and RC85 reclaim
        shell: bash
        run: |
          set -euo pipefail
          sleep 12
          echo '=== control container logs ==='
          docker logs --tail 80 aivoip-capture-v2-control-runner 2>&1 || true
          ROOT=/home/dev/workspace/aiVoip-control
          DEV_UID="$(stat -c %u "$ROOT")"
          DEV_GID="$(stat -c %g "$ROOT")"
          echo '=== local control status ==='
          docker run --rm --user "$DEV_UID:$DEV_GID" -v "$ROOT:$ROOT:ro" -w "$ROOT" python:3.12-slim sh -lc 'cat validation/control/status.json'
          echo '=== safe production state ==='
          docker run --rm -i -v /etc/voip-ai:/probe/voip-ai:ro python:3.12-slim python - <<'PY'
          from pathlib import Path
          p=Path('/probe/voip-ai/production.env'); vals={}
          for raw in p.read_text(encoding='utf-8').splitlines():
              s=raw.strip()
              if not s or s.startswith('#') or '=' not in s: continue
              if s.startswith('export '): s=s[7:].strip()
              k,v=s.split('=',1); vals[k.strip()]=v.strip().strip('"').strip("'")
          def eff(k,d): return vals.get(k,'').strip() or d
          print('ENGINE='+eff('CAPTURE_ENGINE_VERSION','V1'))
          print('V2_ENABLED='+eff('CAPTURE_V2_PRODUCTION_ENABLED','false'))
          print('PLATFORM='+eff('REPRODUCTION_PLATFORM_MODE','mock'))
          print('RBAC='+eff('FEISHU_IDENTITY_RBAC_ENABLED','false'))
          PY
