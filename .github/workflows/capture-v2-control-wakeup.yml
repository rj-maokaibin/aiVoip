name: Capture V2 Master Ref Probe

on:
  push:
    branches:
      - ci/capture-v2-control-wakeup-20260825
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-v2-control-wakeup
  cancel-in-progress: true

jobs:
  master-ref-probe:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 10
    steps:
      - name: Read local and remote master refs as repo owner
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --privileged --network host -v /:/host python:3.12-slim \
            chroot /host /usr/sbin/runuser -u dev -- /usr/bin/env HOME=/home/dev USER=dev LOGNAME=dev /bin/bash -lc '
              set -euo pipefail
              cd /home/dev/workspace/aiVoip-control
              echo "CONTROL_HEAD=$(git rev-parse HEAD)"
              echo "ORIGIN_MASTER=$(git rev-parse refs/remotes/origin/master)"
              echo "FETCH_HEAD=$(git rev-parse FETCH_HEAD)"
              REMOTE="$(git ls-remote origin refs/heads/master | awk "NR==1{print \$1}")"
              echo "LS_REMOTE_MASTER=$REMOTE"
              git merge-base --is-ancestor db3e8012a9569d9508e9d2cd920baf1de6bac866 "$REMOTE"
              echo "VALIDATED_HEAD_IS_REMOTE_MASTER_ANCESTOR=true"
            '

      - name: Verify production still unmutated V1
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i -v /etc/voip-ai:/probe/voip-ai:ro python:3.12-slim python - <<'PY'
          from pathlib import Path
          p=Path('/probe/voip-ai/production.env'); vals={}
          for raw in p.read_text(encoding='utf-8').splitlines():
              s=raw.strip()
              if not s or s.startswith('#') or '=' not in s: continue
              if s.startswith('export '): s=s[7:].strip()
              k,v=s.split('=',1); vals[k.strip()]=v.strip().strip('"').strip("'")
          def eff(k,d): return vals.get(k,'').strip() or d
          print('ENGINE='+eff('CAPTURE_ENGINE_VERSION','V1'))
          print('V2_ENABLED='+eff('CAPTURE_V2_PRODUCTION_ENABLED','false'))
          print('PLATFORM='+eff('REPRODUCTION_PLATFORM_MODE','mock'))
          assert eff('CAPTURE_ENGINE_VERSION','V1').upper() == 'V1'
          assert eff('CAPTURE_V2_PRODUCTION_ENABLED','false').lower() == 'false'
          assert eff('REPRODUCTION_PLATFORM_MODE','mock') == 'mock'
          PY
