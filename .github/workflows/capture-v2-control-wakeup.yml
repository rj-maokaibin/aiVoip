name: Capture V2 Exact Pre-Mutation Probe

on:
  push:
    branches:
      - ci/capture-v2-control-wakeup-20260825
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-v2-control-wakeup
  cancel-in-progress: true

jobs:
  exact-pre-mutation-probe:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 10
    steps:
      - name: Verify single detached control runner and synced control head
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(ps -eo args | grep 'app.capture_v2.control_cli run --repo-root /home/dev/workspace/aiVoip-control' | grep -v grep | wc -l)"
          echo "CONTROL_RUNNER_COUNT=$COUNT"
          test "$COUNT" -eq 1
          if ps -eo stat,args | grep 'app.capture_v2.control_cli run --repo-root /home/dev/workspace/aiVoip-control' | grep -v grep | grep -q '^T'; then
            echo 'CONTROL_RUNNER_STOPPED=true'
            exit 1
          fi
          docker run --rm --privileged --network host -v /:/host python:3.12-slim \
            chroot /host /usr/sbin/runuser -u dev -- /bin/bash -lc '
              set -euo pipefail
              cd /home/dev/workspace/aiVoip-control
              echo "BRANCH=$(git branch --show-current)"
              echo "HEAD=$(git rev-parse HEAD)"
              echo "REMOTE_CONTROL=$(git rev-parse refs/remotes/origin/feat/capture-v2.1.1-real-gates)"
              test "$(git branch --show-current)" = feat/capture-v2.1.1-real-gates
              test "$(git rev-parse HEAD)" = 9df273ab29569afb198f5e0bcf36fe7750f07192
              test "$(git rev-parse refs/remotes/origin/feat/capture-v2.1.1-real-gates)" = 9df273ab29569afb198f5e0bcf36fe7750f07192
            '

      - name: Execute actual fixed master snapshot path as cutover root
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --privileged --network host -v /:/host python:3.12-slim \
            chroot /host /bin/bash -lc '
              set -euo pipefail
              cd /home/dev/workspace/aiVoip-control/backend
              export PYTHONPATH=.
              /home/dev/workspace/aiVoip-control/.venv-release-gate/bin/python3 - <<"PY"
          from pathlib import Path
          import subprocess
          from app.capture_v2.control import production_cutover_guarded as cutover

          repo = Path("/home/dev/workspace/aiVoip-control")
          cp, sha, err = cutover._fetch_master_snapshot(repo)
          print("FETCH_RC=" + str(cp.returncode))
          print("FETCHED_MASTER_SHA=" + sha)
          assert cp.returncode == 0, err
          assert sha == "abcb054d018b27495aaa4c47079c354b69471a9d", sha
          anc = cutover._git_as_repo_owner(repo, "merge-base", "--is-ancestor", "db3e8012a9569d9508e9d2cd920baf1de6bac866", sha)
          print("ANCESTOR_RC=" + str(anc.returncode))
          assert anc.returncode == 0, anc.stderr
          print("EXACT_FETCHED_MASTER_ANCESTRY_PASS=true")
          PY
            '

      - name: Verify production remains V1 safe prestate
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i -v /etc/voip-ai:/probe/voip-ai:ro python:3.12-slim python - <<'PY'
          from pathlib import Path
          p=Path('/probe/voip-ai/production.env'); vals={}
          for raw in p.read_text(encoding='utf-8').splitlines():
              s=raw.strip()
              if not s or s.startswith('#') or '=' not in s: continue
              if s.startswith('export '): s=s[7:].strip()
              k,v=s.split('=',1); vals[k.strip()]=v.strip().strip('"').strip("'")
          def eff(k,d): return vals.get(k,'').strip() or d
          print('ENGINE='+eff('CAPTURE_ENGINE_VERSION','V1'))
          print('V2_ENABLED='+eff('CAPTURE_V2_PRODUCTION_ENABLED','false'))
          print('PLATFORM='+eff('REPRODUCTION_PLATFORM_MODE','mock'))
          print('RBAC='+eff('FEISHU_IDENTITY_RBAC_ENABLED','false'))
          assert eff('APP_ENV','') == 'production'
          assert eff('CAPTURE_ENGINE_VERSION','V1').upper() == 'V1'
          assert eff('CAPTURE_V2_PRODUCTION_ENABLED','false').lower() == 'false'
          assert eff('REPRODUCTION_PLATFORM_MODE','mock') == 'mock'
          assert eff('FEISHU_IDENTITY_RBAC_ENABLED','false').lower() == 'true'
          PY
