name: Capture V2 Control Wakeup

on:
  push:
    branches:
      - ci/capture-v2-control-wakeup-20260825
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-v2-control-wakeup
  cancel-in-progress: true

jobs:
  control-once:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 10
    steps:
      - name: Verify worktree and control branch ancestry
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/home/dev/workspace/aiVoip
          DEV_UID="$(stat -c %u "$ROOT")"
          DEV_GID="$(stat -c %g "$ROOT")"
          docker image inspect python:3.12-slim >/dev/null
          docker run --rm \
            --user "$DEV_UID:$DEV_GID" \
            -v /usr/bin/git:/usr/local/bin/git-host:ro \
            -v "$ROOT:$ROOT:ro" \
            -w "$ROOT" \
            python:3.12-slim \
            sh -lc '
              set -eu
              git-host --version
              echo "BRANCH=$(git-host branch --show-current)"
              echo "HEAD=$(git-host rev-parse HEAD)"
              echo "STATUS_BEGIN"
              git-host status --porcelain --untracked-files=all
              echo "STATUS_END"
              test -z "$(git-host status --porcelain --untracked-files=all)"
              LOCAL_CONTROL=$(git-host rev-parse refs/heads/feat/capture-v2.1.1-real-gates)
              REMOTE_CONTROL=$(git-host rev-parse refs/remotes/origin/feat/capture-v2.1.1-real-gates)
              echo "LOCAL_CONTROL=$LOCAL_CONTROL"
              echo "REMOTE_CONTROL=$REMOTE_CONTROL"
              git-host merge-base --is-ancestor "$LOCAL_CONTROL" "$REMOTE_CONTROL"
              echo "CONTROL_FAST_FORWARD_SAFE=true"
            '

      - name: Restore dedicated control branch only
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/home/dev/workspace/aiVoip
          DEV_UID="$(stat -c %u "$ROOT")"
          DEV_GID="$(stat -c %g "$ROOT")"
          docker run --rm \
            --user "$DEV_UID:$DEV_GID" \
            -v /usr/bin/git:/usr/local/bin/git-host:ro \
            -v "$ROOT:$ROOT" \
            -w "$ROOT" \
            python:3.12-slim \
            sh -lc '
              set -eu
              test "$(git-host branch --show-current)" = master
              test -z "$(git-host status --porcelain --untracked-files=all)"
              git-host switch feat/capture-v2.1.1-real-gates
              echo "RESTORED_BRANCH=$(git-host branch --show-current)"
              echo "RESTORED_HEAD=$(git-host rev-parse HEAD)"
            '
          echo 'Branch restored. Existing dev control daemon owns the subsequent fetch/ff-only/reexec/action execution.'
