name: Capture V2 Port 9001 Readonly Probe

on:
  push:
    branches:
      - ci/capture-v2-control-wakeup-20260825
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-v2-control-wakeup
  cancel-in-progress: true

jobs:
  port-9001-readonly-probe:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 10
    steps:
      - name: Identify host port 9001 owner
        shell: bash
        run: |
          set -euo pipefail
          echo '=== LISTEN 9001 ==='
          ss -ltnp '( sport = :9001 )' || true
          echo '=== ALL RUNNING CONTAINERS WITH PORTS ==='
          docker ps --format '{{.ID}}|{{.Names}}|{{.Image}}|{{.Ports}}' || true
          echo '=== CONTAINERS PUBLISHING 9001 ==='
          docker ps --format '{{.ID}} {{.Names}} {{.Ports}}' | grep -E '(^|[, ])0\.0\.0\.0:9001->|\[::\]:9001->|:9001->' || true
          echo '=== VOIP-AI CONTAINERS ==='
          docker ps -a --filter label=com.docker.compose.project=voip-ai --format '{{.ID}}|{{.Names}}|{{.Status}}|{{.Ports}}' || true

      - name: Confirm production remains safe V1
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i -v /etc/voip-ai:/probe/voip-ai:ro python:3.12-slim python - <<'PY'
          from pathlib import Path
          p=Path('/probe/voip-ai/production.env'); vals={}
          for raw in p.read_text(encoding='utf-8').splitlines():
              s=raw.strip()
              if not s or s.startswith('#') or '=' not in s: continue
              if s.startswith('export '): s=s[7:].strip()
              k,v=s.split('=',1); vals[k.strip()]=v.strip().strip('"').strip("'")
          def eff(k,d): return vals.get(k,'').strip() or d
          print('ENGINE='+eff('CAPTURE_ENGINE_VERSION','V1'))
          print('V2_ENABLED='+eff('CAPTURE_V2_PRODUCTION_ENABLED','false'))
          print('PLATFORM='+eff('REPRODUCTION_PLATFORM_MODE','mock'))
          print('MINIO_CONSOLE_BIND='+eff('VOIP_MINIO_CONSOLE_BIND','0.0.0.0'))
          print('MINIO_CONSOLE_PORT='+eff('VOIP_MINIO_CONSOLE_PORT','9001'))
          assert eff('CAPTURE_ENGINE_VERSION','V1').upper() == 'V1'
          assert eff('CAPTURE_V2_PRODUCTION_ENABLED','false').lower() == 'false'
          assert eff('REPRODUCTION_PLATFORM_MODE','mock') == 'mock'
          PY
