name: Capture V2 RC95 Readiness Observation

on:
  push:
    branches:
      - ci/capture-v2-control-wakeup-20260825
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-v2-control-wakeup
  cancel-in-progress: true

jobs:
  rc95-readiness-observation:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 5
    steps:
      - name: Observe backend readiness without mutation
        shell: bash
        run: |
          set -euo pipefail
          READY=0
          for i in $(seq 1 20); do
            CODE=$(curl -sS -o /tmp/rc95-ready.json -w '%{http_code}' --max-time 3 http://127.0.0.1:18001/health/ready || true)
            echo "READY_ATTEMPT=$i HTTP=$CODE"
            if [ "$CODE" = "200" ]; then READY=1; break; fi
            sleep 3
          done
          if [ "$READY" -eq 1 ]; then
            echo 'BACKEND_READY=true'
            cat /tmp/rc95-ready.json
          else
            echo 'BACKEND_READY=false'
            cat /tmp/rc95-ready.json 2>/dev/null || true
          fi
          echo '=== CUTOVER PROCESS ==='
          ps -eo pid,ppid,user,etime,stat,args | grep -E 'production_cutover_guarded|deploy/voip-ai' | grep -v grep || true
          echo '=== RUNNING SERVICES ==='
          docker ps --format '{{.Names}} {{.Status}}' | grep '^voip-ai-' | sort || true

      - name: Read safe authority keys
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i -v /etc/voip-ai:/probe/voip-ai:ro python:3.12-slim python - <<'PY'
          from pathlib import Path
          p=Path('/probe/voip-ai/production.env'); vals={}
          for raw in p.read_text(encoding='utf-8').splitlines():
              s=raw.strip()
              if not s or s.startswith('#') or '=' not in s: continue
              if s.startswith('export '): s=s[7:].strip()
              k,v=s.split('=',1); vals[k.strip()]=v.strip().strip('"').strip("'")
          def eff(k,d): return vals.get(k,'').strip() or d
          print('ENGINE='+eff('CAPTURE_ENGINE_VERSION','V1'))
          print('V2_ENABLED='+eff('CAPTURE_V2_PRODUCTION_ENABLED','false'))
          print('PLATFORM='+eff('REPRODUCTION_PLATFORM_MODE','mock'))
          PY
