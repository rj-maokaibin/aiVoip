name: Capture V2 Control Wakeup

on:
  push:
    branches:
      - ci/capture-v2-control-wakeup-20260825
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-v2-control-wakeup
  cancel-in-progress: false

jobs:
  control-once:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 10
    steps:
      - name: Read-only persistent Git identity probe
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/home/dev/workspace/aiVoip
          DEV_UID="$(stat -c %u "$ROOT")"
          DEV_GID="$(stat -c %g "$ROOT")"
          docker image inspect python:3.12-slim >/dev/null
          docker run --rm -i \
            --user "$DEV_UID:$DEV_GID" \
            -v "$ROOT:$ROOT:ro" \
            -w "$ROOT" \
            python:3.12-slim \
            python - <<'PY'
          from pathlib import Path
          repo = Path('/home/dev/workspace/aiVoip')
          marker = repo / '.git'
          if marker.is_file():
              raw = marker.read_text(encoding='utf-8').strip()
              print('GIT_MARKER=file')
              print('GIT_MARKER_VALUE=' + raw)
              if not raw.startswith('gitdir:'):
                  raise SystemExit('INVALID_GIT_MARKER')
              gitdir = Path(raw.split(':', 1)[1].strip())
              if not gitdir.is_absolute():
                  gitdir = (repo / gitdir).resolve()
          elif marker.is_dir():
              print('GIT_MARKER=directory')
              gitdir = marker
          else:
              raise SystemExit('GIT_MARKER_MISSING')
          print('GITDIR=' + str(gitdir))
          head = (gitdir / 'HEAD').read_text(encoding='utf-8').strip()
          print('HEAD_RAW=' + head)
          if head.startswith('ref: '):
              ref = head[5:].strip()
              print('BRANCH=' + ref.removeprefix('refs/heads/'))
              ref_path = gitdir / ref
              if ref_path.is_file():
                  sha = ref_path.read_text(encoding='utf-8').strip()
              else:
                  sha = ''
                  packed = gitdir / 'packed-refs'
                  if packed.is_file():
                      for line in packed.read_text(encoding='utf-8').splitlines():
                          if line and not line.startswith(('#', '^')):
                              val, name = line.split(' ', 1)
                              if name == ref:
                                  sha = val
                                  break
              print('LOCAL_HEAD=' + sha)
          else:
              print('BRANCH=DETACHED')
              print('LOCAL_HEAD=' + head)
          print('MERGE_IN_PROGRESS=' + str((gitdir / 'MERGE_HEAD').exists()).lower())
          print('REBASE_IN_PROGRESS=' + str((gitdir / 'rebase-merge').exists() or (gitdir / 'rebase-apply').exists()).lower())
          print('INDEX_LOCK=' + str((gitdir / 'index.lock').exists()).lower())
          PY
          echo 'CONTROL_PROCESS_STATE_BEGIN'
          ps -o user,pid,ppid,stat,etime,wchan:32,args -p 257142,611900 || true
          echo 'CONTROL_PROCESS_STATE_END'
