name: Capture V2 RC85B Targeted Regression

on:
  push:
    branches:
      - ci/capture-v2-control-wakeup-20260825
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-v2-control-wakeup
  cancel-in-progress: true

jobs:
  targeted-regression:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 15
    steps:
      - name: Checkout PR57 head
        uses: actions/checkout@v4
        with:
          ref: fix/capture-v2-cutover-repo-owner-git-rc85b
          clean: true

      - name: Run cutover Git identity regression
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          /home/dev/workspace/aiVoip/.venv-release-gate/bin/python3 -m pytest \
            tests/test_capture_v2_production_cutover_git_identity.py -q

      - name: Real root-to-repo-owner Git identity probe
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$(docker run --rm --privileged --network host -v /:/host python:3.12-slim \
            chroot /host /usr/sbin/runuser -u dev -- /usr/bin/env \
              HOME=/home/dev USER=dev LOGNAME=dev \
              /usr/bin/git -C /home/dev/workspace/aiVoip-control \
              ls-remote origin refs/heads/master)"
          echo "$RESULT"
          SHA="$(printf '%s\n' "$RESULT" | awk 'NR==1{print $1}')"
          test "${#SHA}" -eq 40
          printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'
          echo "ROOT_TO_REPO_OWNER_GIT_IDENTITY_PASS=true"

      - name: Confirm production remained V1
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i -v /etc/voip-ai:/probe/voip-ai:ro python:3.12-slim python - <<'PY'
          from pathlib import Path
          p=Path('/probe/voip-ai/production.env'); vals={}
          for raw in p.read_text(encoding='utf-8').splitlines():
              s=raw.strip()
              if not s or s.startswith('#') or '=' not in s: continue
              if s.startswith('export '): s=s[7:].strip()
              k,v=s.split('=',1); vals[k.strip()]=v.strip().strip('"').strip("'")
          def eff(k,d): return vals.get(k,'').strip() or d
          print('ENGINE='+eff('CAPTURE_ENGINE_VERSION','V1'))
          print('V2_ENABLED='+eff('CAPTURE_V2_PRODUCTION_ENABLED','false'))
          print('PLATFORM='+eff('REPRODUCTION_PLATFORM_MODE','mock'))
          assert eff('CAPTURE_ENGINE_VERSION','V1').upper() == 'V1'
          assert eff('CAPTURE_V2_PRODUCTION_ENABLED','false').lower() == 'false'
          assert eff('REPRODUCTION_PLATFORM_MODE','mock') == 'mock'
          PY
