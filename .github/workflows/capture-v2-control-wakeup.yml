name: Capture V2 Control Git Remote Diagnostic

on:
  push:
    branches:
      - ci/capture-v2-control-wakeup-20260825
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-v2-control-wakeup
  cancel-in-progress: true

jobs:
  git-remote-diagnostic:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 10
    steps:
      - name: Diagnose repo-owner origin and explicit master fetch
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --privileged --network host -v /:/host python:3.12-slim \
            chroot /host /usr/sbin/runuser -u dev -- /usr/bin/env HOME=/home/dev USER=dev LOGNAME=dev /bin/bash -lc '
              set -euo pipefail
              cd /home/dev/workspace/aiVoip-control
              echo "HEAD=$(git rev-parse HEAD)"
              echo "BRANCH=$(git branch --show-current)"
              echo "ORIGIN_URL=$(git remote get-url origin)"
              echo "ORIGIN_FETCH_BEGIN"
              git config --get-all remote.origin.fetch || true
              echo "ORIGIN_FETCH_END"
              echo "LS_REMOTE_BEGIN"
              git ls-remote origin refs/heads/master refs/heads/feat/capture-v2.1.1-real-gates
              echo "LS_REMOTE_END"
              echo "FETCH_EXPLICIT_MASTER_BEGIN"
              git fetch --verbose origin refs/heads/master
              echo "FETCH_EXPLICIT_MASTER_END"
              echo "FETCH_HEAD_RAW_BEGIN"
              cat .git/FETCH_HEAD
              echo "FETCH_HEAD_RAW_END"
              echo "FETCH_HEAD=$(git rev-parse FETCH_HEAD)"
              echo "MASTER_EXPECTED=abcb054d018b27495aaa4c47079c354b69471a9d"
              test "$(git rev-parse FETCH_HEAD)" = abcb054d018b27495aaa4c47079c354b69471a9d
            '

      - name: Verify production remains V1
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i -v /etc/voip-ai:/probe/voip-ai:ro python:3.12-slim python - <<'PY'
          from pathlib import Path
          p=Path('/probe/voip-ai/production.env'); vals={}
          for raw in p.read_text(encoding='utf-8').splitlines():
              s=raw.strip()
              if not s or s.startswith('#') or '=' not in s: continue
              if s.startswith('export '): s=s[7:].strip()
              k,v=s.split('=',1); vals[k.strip()]=v.strip().strip('"').strip("'")
          def eff(k,d): return vals.get(k,'').strip() or d
          print('ENGINE='+eff('CAPTURE_ENGINE_VERSION','V1'))
          print('V2_ENABLED='+eff('CAPTURE_V2_PRODUCTION_ENABLED','false'))
          print('PLATFORM='+eff('REPRODUCTION_PLATFORM_MODE','mock'))
          assert eff('CAPTURE_ENGINE_VERSION','V1').upper() == 'V1'
          assert eff('CAPTURE_V2_PRODUCTION_ENABLED','false').lower() == 'false'
          assert eff('REPRODUCTION_PLATFORM_MODE','mock') == 'mock'
          PY
