name: Capture V2 Control Wakeup

on:
  push:
    branches:
      - ci/capture-v2-control-wakeup-20260825
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-v2-control-wakeup
  cancel-in-progress: false

jobs:
  control-once:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 15
    steps:
      - name: Build ephemeral Git helper
        shell: bash
        run: |
          set -euo pipefail
          cat <<'EOF' | docker build -t capture-v2-git-helper:20260825 -
          FROM python:3.12-slim
          RUN apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates && rm -rf /var/lib/apt/lists/*
          EOF

      - name: Verify persistent worktree is safe for branch restore
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/home/dev/workspace/aiVoip
          DEV_UID="$(stat -c %u "$ROOT")"
          DEV_GID="$(stat -c %g "$ROOT")"
          docker run --rm \
            --user "$DEV_UID:$DEV_GID" \
            -v "$ROOT:$ROOT:ro" \
            -w "$ROOT" \
            capture-v2-git-helper:20260825 \
            sh -lc '
              set -eu
              echo "BRANCH=$(git branch --show-current)"
              echo "HEAD=$(git rev-parse HEAD)"
              echo "STATUS_BEGIN"
              git status --porcelain --untracked-files=all
              echo "STATUS_END"
              LOCAL_CONTROL=$(git rev-parse refs/heads/feat/capture-v2.1.1-real-gates)
              REMOTE_CONTROL=$(git rev-parse refs/remotes/origin/feat/capture-v2.1.1-real-gates)
              echo "LOCAL_CONTROL=$LOCAL_CONTROL"
              echo "REMOTE_CONTROL=$REMOTE_CONTROL"
              git merge-base --is-ancestor "$LOCAL_CONTROL" "$REMOTE_CONTROL"
              echo "CONTROL_FAST_FORWARD_SAFE=true"
              test -z "$(git status --porcelain --untracked-files=all)"
              echo "WORKTREE_CLEAN=true"
            '
