name: Capture V2 Host Port 8000 PID Probe

on:
  push:
    branches:
      - ci/capture-v2-control-wakeup-20260825
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-v2-control-wakeup
  cancel-in-progress: true

jobs:
  host-port-8000-pid-probe:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 10
    steps:
      - name: Identify privileged host listener on 8000 read-only
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --privileged --pid=host --network host -v /:/host python:3.12-slim \
            chroot /host /bin/bash -lc '
              set -euo pipefail
              echo "=== SS 8000 WITH PID ==="
              ss -ltnp "( sport = :8000 )" || true
              echo "=== FUSER 8000 ==="
              fuser -v 8000/tcp || true
              echo "=== MATCHING PROCESS COMMANDS ==="
              PIDS=$(fuser 8000/tcp 2>/dev/null || true)
              for p in $PIDS; do
                ps -o pid,ppid,user,lstart,etime,stat,args -p "$p" || true
                echo "CMDLINE[$p]=$(tr "\0" " " </proc/$p/cmdline 2>/dev/null || true)"
                echo "CGROUP[$p]"; cat /proc/$p/cgroup 2>/dev/null || true
              done
            '

      - name: Confirm production remains V1 after RC91 rollback
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i -v /etc/voip-ai:/probe/voip-ai:ro python:3.12-slim python - <<'PY'
          from pathlib import Path
          p=Path('/probe/voip-ai/production.env'); vals={}
          for raw in p.read_text(encoding='utf-8').splitlines():
              s=raw.strip()
              if not s or s.startswith('#') or '=' not in s: continue
              if s.startswith('export '): s=s[7:].strip()
              k,v=s.split('=',1); vals[k.strip()]=v.strip().strip('"').strip("'")
          def eff(k,d): return vals.get(k,'').strip() or d
          print('ENGINE='+eff('CAPTURE_ENGINE_VERSION','V1'))
          print('V2_ENABLED='+eff('CAPTURE_V2_PRODUCTION_ENABLED','false'))
          print('PLATFORM='+eff('REPRODUCTION_PLATFORM_MODE','mock'))
          assert eff('CAPTURE_ENGINE_VERSION','V1').upper() == 'V1'
          assert eff('CAPTURE_V2_PRODUCTION_ENABLED','false').lower() == 'false'
          assert eff('REPRODUCTION_PLATFORM_MODE','mock') == 'mock'
          PY
