name: Capture V2 MinIO Candidate Port Probe

on:
  push:
    branches:
      - ci/capture-v2-control-wakeup-20260825
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-v2-control-wakeup
  cancel-in-progress: true

jobs:
  minio-candidate-port-probe:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 10
    steps:
      - name: Verify candidate 19001 is free
        shell: bash
        run: |
          set -euo pipefail
          echo '=== 9001 CURRENT OWNER ==='
          docker ps --format '{{.ID}} {{.Names}} {{.Ports}}' | grep ':9001->' || true
          echo '=== 19001 LISTENERS ==='
          ss -ltn '( sport = :19001 )' || true
          if ss -ltn '( sport = :19001 )' | tail -n +2 | grep -q .; then
            echo 'PORT_19001_FREE=false'
            exit 1
          fi
          echo 'PORT_19001_FREE=true'

      - name: Confirm production remains V1
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i -v /etc/voip-ai:/probe/voip-ai:ro python:3.12-slim python - <<'PY'
          from pathlib import Path
          p=Path('/probe/voip-ai/production.env'); vals={}
          for raw in p.read_text(encoding='utf-8').splitlines():
              s=raw.strip()
              if not s or s.startswith('#') or '=' not in s: continue
              if s.startswith('export '): s=s[7:].strip()
              k,v=s.split('=',1); vals[k.strip()]=v.strip().strip('"').strip("'")
          def eff(k,d): return vals.get(k,'').strip() or d
          print('ENGINE='+eff('CAPTURE_ENGINE_VERSION','V1'))
          print('V2_ENABLED='+eff('CAPTURE_V2_PRODUCTION_ENABLED','false'))
          print('PLATFORM='+eff('REPRODUCTION_PLATFORM_MODE','mock'))
          assert eff('CAPTURE_ENGINE_VERSION','V1').upper() == 'V1'
          assert eff('CAPTURE_V2_PRODUCTION_ENABLED','false').lower() == 'false'
          assert eff('REPRODUCTION_PLATFORM_MODE','mock') == 'mock'
          PY
