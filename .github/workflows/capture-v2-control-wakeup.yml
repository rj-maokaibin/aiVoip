name: Capture V2 Control Wakeup

on:
  push:
    branches:
      - ci/capture-v2-control-wakeup-20260825
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-v2-control-wakeup
  cancel-in-progress: false

jobs:
  control-once:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 10
    steps:
      - name: Read-only persistent Git refs probe
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/home/dev/workspace/aiVoip
          DEV_UID="$(stat -c %u "$ROOT")"
          DEV_GID="$(stat -c %g "$ROOT")"
          docker image inspect python:3.12-slim >/dev/null
          docker run --rm -i \
            --user "$DEV_UID:$DEV_GID" \
            -v "$ROOT:$ROOT:ro" \
            -w "$ROOT" \
            python:3.12-slim \
            python - <<'PY'
          from pathlib import Path
          repo = Path('/home/dev/workspace/aiVoip')
          gitdir = repo / '.git'
          def ref_value(name: str) -> str:
              p = gitdir / name
              if p.is_file():
                  return p.read_text(encoding='utf-8').strip()
              packed = gitdir / 'packed-refs'
              if packed.is_file():
                  for line in packed.read_text(encoding='utf-8').splitlines():
                      if line and not line.startswith(('#', '^')):
                          sha, ref = line.split(' ', 1)
                          if ref == name:
                              return sha
              return ''
          print('HEAD=' + (gitdir/'HEAD').read_text(encoding='utf-8').strip())
          for name in [
              'refs/heads/master',
              'refs/heads/feat/capture-v2.1.1-real-gates',
              'refs/remotes/origin/master',
              'refs/remotes/origin/feat/capture-v2.1.1-real-gates',
          ]:
              print(name + '=' + ref_value(name))
          fh = gitdir / 'FETCH_HEAD'
          print('FETCH_HEAD_BEGIN')
          if fh.is_file():
              for line in fh.read_text(encoding='utf-8', errors='replace').splitlines()[:8]:
                  print(line)
          print('FETCH_HEAD_END')
          print('MERGE_IN_PROGRESS=' + str((gitdir/'MERGE_HEAD').exists()).lower())
          print('REBASE_IN_PROGRESS=' + str((gitdir/'rebase-merge').exists() or (gitdir/'rebase-apply').exists()).lower())
          print('INDEX_LOCK=' + str((gitdir/'index.lock').exists()).lower())
          PY
          echo 'CONTROL_PROCESS_STATE_BEGIN'
          ps -o user,pid,ppid,stat,etime,wchan:32,args -p 257142,611900 || true
          echo 'CONTROL_PROCESS_STATE_END'
