name: Capture V2 Control Readonly Probe

on:
  push:
    branches:
      - ci/capture-v2-control-wakeup-20260825
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-v2-control-wakeup
  cancel-in-progress: true

jobs:
  readonly-probe:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 10
    steps:
      - name: Current control process and RC85 local state
        shell: bash
        run: |
          set -euo pipefail
          echo "PROBE_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ps -eo pid,ppid,pgid,sid,tpgid,user,etime,stat,args | grep -E 'app.capture_v2.control_cli run --repo-root /home/dev/workspace/aiVoip-control|production_cutover_guarded' | grep -v grep || true
          ROOT=/home/dev/workspace/aiVoip-control
          DEV_UID="$(stat -c %u "$ROOT")"
          DEV_GID="$(stat -c %g "$ROOT")"
          docker run --rm --user "$DEV_UID:$DEV_GID" -v "$ROOT:$ROOT:ro" -w "$ROOT" python:3.12-slim sh -lc '
            echo STATUS_BEGIN
            cat validation/control/status.json 2>/dev/null || true
            echo STATUS_END
            echo LEDGER_BEGIN
            tail -80 .capture-v2-control/ledger.json 2>/dev/null || true
            echo LEDGER_END
          '
          echo '=== control container if any ==='
          docker ps -a --filter name=^/aiVoip-capture-v2-control-runner$ --format 'NAME={{.Names}} STATUS={{.Status}}' || true

      - name: Safe env and voip-ai runtime state
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i -v /etc/voip-ai:/probe/voip-ai:ro python:3.12-slim python - <<'PY'
          from pathlib import Path
          p=Path('/probe/voip-ai/production.env'); vals={}
          for raw in p.read_text(encoding='utf-8').splitlines():
              s=raw.strip()
              if not s or s.startswith('#') or '=' not in s: continue
              if s.startswith('export '): s=s[7:].strip()
              k,v=s.split('=',1); vals[k.strip()]=v.strip().strip('"').strip("'")
          def eff(k,d): return vals.get(k,'').strip() or d
          print('ENGINE='+eff('CAPTURE_ENGINE_VERSION','V1'))
          print('V2_ENABLED='+eff('CAPTURE_V2_PRODUCTION_ENABLED','false'))
          print('PLATFORM='+eff('REPRODUCTION_PLATFORM_MODE','mock'))
          print('RBAC='+eff('FEISHU_IDENTITY_RBAC_ENABLED','false'))
          PY
          docker ps -a --filter label=com.docker.compose.project=voip-ai --format 'SERVICE={{.Label "com.docker.compose.service"}} NAME={{.Names}} STATUS={{.Status}} IMAGE={{.Image}}' || true
