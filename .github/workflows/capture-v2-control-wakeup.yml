name: Capture V2 Control Readonly Probe

on:
  push:
    branches:
      - ci/capture-v2-control-wakeup-20260825
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-v2-control-wakeup
  cancel-in-progress: true

jobs:
  readonly-probe:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 10
    steps:
      - name: Inspect stopped RC85 process tree
        shell: bash
        run: |
          set -euo pipefail
          echo "PROBE_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ps -o pid,ppid,pgid,sid,tpgid,user,etime,stat,wchan:24,args -p 608858,2203168,2575556,2575557,2575558 || true
          for p in 2203168 2575556 2575557 2575558; do
            if [ -r "/proc/$p/status" ]; then
              echo "=== /proc/$p/status selected ==="
              grep -E '^(Name|State|Tgid|Pid|PPid|TracerPid|SigPnd|ShdPnd|SigBlk|SigIgn|SigCgt):' "/proc/$p/status" || true
            fi
          done

      - name: Read only safe production env state
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v /etc/voip-ai:/probe/voip-ai:ro \
            python:3.12-slim \
            python - <<'PY'
          from pathlib import Path
          import json
          p=Path('/probe/voip-ai/production.env')
          keys={'APP_ENV','REPRODUCTION_PLATFORM_MODE','CAPTURE_ENGINE_VERSION','CAPTURE_V2_PRODUCTION_ENABLED','CAPTURE_V2_ACTIVATION_REHEARSAL','CAPTURE_V2_REUSE_LEGACY_REPRODUCTION_SEMANTICS','FEISHU_IDENTITY_RBAC_ENABLED'}
          out={}
          if p.is_file():
              for raw in p.read_text(encoding='utf-8').splitlines():
                  s=raw.strip()
                  if not s or s.startswith('#') or '=' not in s: continue
                  if s.startswith('export '): s=s[7:].strip()
                  k,v=s.split('=',1); k=k.strip(); v=v.strip().strip('"').strip("'")
                  if k in keys: out[k]=v
          print(json.dumps(out, sort_keys=True))
          print('BACKUPS:')
          for x in sorted(Path('/probe/voip-ai').glob('production.env*')):
              print(x.name)
          PY

      - name: Docker project and local build state
        shell: bash
        run: |
          set -euo pipefail
          echo '=== voip-ai containers ==='
          docker ps -a --filter label=com.docker.compose.project=voip-ai --format 'SERVICE={{.Label "com.docker.compose.service"}} NAME={{.Names}} STATUS={{.Status}} IMAGE={{.Image}}' || true
          echo '=== recent voip-ai images ==='
          docker images --format '{{.Repository}}:{{.Tag}} {{.ID}} {{.CreatedSince}}' | grep -E 'voip-ai|aiVoip' | head -50 || true
