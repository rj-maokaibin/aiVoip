name: Self-hosted Runner Probe (Temporary)

on:
  pull_request:
    branches:
      - feat/pr6-report-grounding-validator

permissions:
  contents: read

jobs:
  probe:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe runner environment
        run: |
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          uname -a
          python3 --version
          docker --version
          docker info >/dev/null
          node --version
          npm --version
          git rev-parse HEAD
