name: Recover Golden WEB Baseline Live

on:
  pull_request:
    branches: [master]
    paths:
      - "tools/recover_golden_web_baseline.py"
      - ".github/workflows/recover-golden-web-baseline-live.yml"

permissions:
  contents: read

concurrency:
  group: recover-golden-web-baseline-live
  cancel-in-progress: false

jobs:
  recover:
    runs-on: [self-hosted, linux, x64, voip-controlled-linux]
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      PROD_ENV_FILE: /home/github-runner/.config/voip-ai/.env
      RUNTIME_ROOT: /tmp/voip-web-recovery-${{ github.run_id }}-${{ github.run_attempt }}
      VENV: /tmp/voip-web-recovery-venv-${{ github.run_id }}-${{ github.run_attempt }}
      WEB_BASE_URL: https://10.48.8.74:10003

    steps:
      - name: Repair workspace
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect python:3.12-slim >/dev/null
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" python:3.12-slim \
            sh -lc 'find /workspace -mindepth 1 -maxdepth 1 -exec rm -rf {} +'

      - name: Materialize exact recovery head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          archive="$RUNNER_TEMP/recovery-${EXPECTED_SHA}.tar.gz"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "${api}/tarball/${EXPECTED_SHA}" -o "$archive"
          test -s "$archive"
          tar -xzf "$archive" -C "$GITHUB_WORKSPACE" --strip-components=1
          test -s tools/recover_golden_web_baseline.py
          echo "RECOVERY_EXACT_SOURCE=PASS sha=$EXPECTED_SHA"

      - name: Prepare runtime and resolve DUT
        shell: bash
        run: |
          set -euo pipefail
          test -r "$PROD_ENV_FILE"
          test "$(stat -c '%a' "$PROD_ENV_FILE")" = "600"
          rm -rf "$RUNTIME_ROOT" "$VENV"
          mkdir -p "$RUNTIME_ROOT"
          chmod 0700 "$RUNTIME_ROOT"
          source tools/ci_dependency_runtime.sh
          ci_prepare_python_runtime "$VENV" backend/requirements.txt
          export PYTHONPATH="$GITHUB_WORKSPACE/backend"
          set -a; source "$PROD_ENV_FILE"; set +a
          "$VENV/bin/python" tools/resolve_real_sip_aba_database_env.py > "$RUNTIME_ROOT/production_db.env"
          chmod 0600 "$RUNTIME_ROOT/production_db.env"
          set -a; source "$RUNTIME_ROOT/production_db.env"; set +a
          "$VENV/bin/python" tools/resolve_real_sip_aba_context.py --output-root "$RUNTIME_ROOT/context" --runtime-root "$RUNTIME_ROOT"
          set -a
          source "$RUNTIME_ROOT/db_runtime.env"
          source "$RUNTIME_ROOT/resolved_dut.env"
          set +a
          "$VENV/bin/python" tools/resolve_real_sip_aba_credential_env.py \
            --container "$SIP_ABA_PRODUCTION_CREDENTIAL_CONTAINER" \
            --expected-provider "$SIP_ABA_PRODUCTION_CREDENTIAL_PROVIDER" \
            --sn "$DEVICE_SN" --ip "$DEVICE_HOST" --product "$DEVICE_MODEL" \
            --fallback-user "$DEVICE_USER" --output "$RUNTIME_ROOT/device_credential.env"
          chmod 0600 "$RUNTIME_ROOT/device_credential.env"
          echo 'RECOVERY_DUT_CONTEXT=PASS mutation=false'

      - name: Bind WEB credential to selected DUT read-only
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$PROD_ENV_FILE"
          source "$RUNTIME_ROOT/db_runtime.env"
          source "$RUNTIME_ROOT/resolved_dut.env"
          source "$RUNTIME_ROOT/device_credential.env"
          set +a
          : "${WEB_USERNAME:?WEB_USERNAME_RUNTIME_REQUIRED}"
          : "${WEB_PASSWORD:?WEB_PASSWORD_RUNTIME_REQUIRED}"
          export PYTHONPATH="$GITHUB_WORKSPACE/backend"
          args=(tools/resolve_current_web_credential_env.py --base-url "$WEB_BASE_URL" \
            --device-id "$DEVICE_ID" --model "$DEVICE_MODEL" --device-host "$DEVICE_HOST" \
            --ssh-port "$DEVICE_PORT" --ssh-username "$SIP_ABA_SSH_USERNAME" \
            --ssh-password-env 'ENV:SIP_ABA_SSH_PASSWORD' \
            --profile-path "$GITHUB_WORKSPACE/profiles/web_api/apf3260m_reyeeos_2_421_voip_v1.yaml" \
            --secret-file "$RUNTIME_ROOT/no-secret-source.yaml" --username-env WEB_USERNAME \
            --password-env WEB_PASSWORD --output "$RUNTIME_ROOT/web_credential.env" \
            --evidence-output "$RUNTIME_ROOT/web-credential-resolution.json" --insecure-tls)
          case "$DEVICE_PLATFORM" in
            mt7621|mt7981) args+=(--platform-id "$DEVICE_PLATFORM") ;;
          esac
          "$VENV/bin/python" "${args[@]}"
          echo 'RECOVERY_WEB_BINDING=PASS mutation=false'

      - name: Recover 7102 baseline with one WEB bundle Save
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$PROD_ENV_FILE"
          source "$RUNTIME_ROOT/db_runtime.env"
          source "$RUNTIME_ROOT/resolved_dut.env"
          source "$RUNTIME_ROOT/device_credential.env"
          set +a
          export PYTHONPATH="$GITHUB_WORKSPACE/backend"
          export REAL_LIVE_MUTATION=EXPLICIT_ONLY
          "$VENV/bin/python" tools/recover_golden_web_baseline.py \
            --device-id "$DEVICE_ID" \
            --worker-id "github:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --target-number 7102 \
            --web-base-url "$WEB_BASE_URL" \
            --profile-path "$GITHUB_WORKSPACE/profiles/web_api/apf3260m_reyeeos_2_421_voip_v1.yaml" \
            --web-insecure-tls --registration-timeout 60 \
            --output "$RUNTIME_ROOT/recovery-evidence.json"

      - name: Verify safe recovery evidence
        shell: bash
        run: |
          set -euo pipefail
          "$VENV/bin/python" - "$RUNTIME_ROOT/recovery-evidence.json" <<'PY'
          import json, sys
          p = json.load(open(sys.argv[1], encoding='utf-8'))
          assert p['status'] == 'PASS', p
          assert p['after_number'] == '7102', p
          assert p['after_disname'] == '7102', p
          assert p['auth_id_preserved'] is True, p
          assert p['password_preserved'] is True, p
          assert p['ssh_fallback'] is False, p
          assert p['registration_restored'] is True, p
          assert p['release_last'] is True, p
          assert p['secret_values_emitted'] is False, p
          print('GOLDEN_WEB_BASELINE_RECOVERY=PASS number=7102 registration=true')
          PY

      - name: Upload sanitized recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-web-baseline-recovery-${{ env.EXPECTED_SHA }}
          path: ${{ env.RUNTIME_ROOT }}/recovery-evidence.json
          if-no-files-found: warn
          retention-days: 7

      - name: Remove runtime secrets
        if: always()
        shell: bash
        run: rm -rf "$RUNTIME_ROOT" "$VENV"
