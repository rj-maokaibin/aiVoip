name: CI/CD V2 Production Observer

on:
  push:
    branches:
      - ops/cicd-v2-production-observe
    paths:
      - '.github/workflows/production-observer.yml'

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      TARGET_SHA: c701685f2f389ab639eb20a0b4270797734ad50d
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/cicd-v2-production-observe
          fetch-depth: 2

      - name: Observe formal Production Deploy and capture evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io
          import json
          import os
          import time
          import urllib.request
          import zipfile
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          target = os.environ['TARGET_SHA']
          api = os.environ.get('GITHUB_API_URL', 'https://api.github.com')
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'aivoip-cicd-v2-production-observer',
          }

          def get(path):
              req = urllib.request.Request(f'{api}/repos/{repo}{path}', headers=headers)
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)

          deadline = time.time() + 90 * 60
          run = None
          while time.time() < deadline:
              data = get('/actions/workflows/production-deploy.yml/runs?branch=master&per_page=30')
              matches = [x for x in data.get('workflow_runs', []) if x.get('head_sha') == target]
              if matches:
                  run = sorted(matches, key=lambda x: x.get('run_attempt', 1), reverse=True)[0]
                  break
              time.sleep(10)
          if run is None:
              raise SystemExit(f'Production Deploy run not found for {target}')

          run_id = run['id']
          while time.time() < deadline:
              run = get(f'/actions/runs/{run_id}')
              if run.get('status') == 'completed':
                  break
              time.sleep(10)
          else:
              raise SystemExit(f'Production Deploy run {run_id} did not complete before observer timeout')

          jobs = get(f'/actions/runs/{run_id}/jobs?per_page=100').get('jobs', [])
          job_rows = []
          for job in jobs:
              job_rows.append({
                  'id': job.get('id'),
                  'name': job.get('name'),
                  'status': job.get('status'),
                  'conclusion': job.get('conclusion'),
                  'started_at': job.get('started_at'),
                  'completed_at': job.get('completed_at'),
                  'steps': [
                      {
                          'name': s.get('name'),
                          'status': s.get('status'),
                          'conclusion': s.get('conclusion'),
                          'started_at': s.get('started_at'),
                          'completed_at': s.get('completed_at'),
                      }
                      for s in job.get('steps', [])
                  ],
              })

          evidence = {}
          artifacts = get(f'/actions/runs/{run_id}/artifacts?per_page=100').get('artifacts', [])
          prod = next((a for a in artifacts if str(a.get('name', '')).startswith('production-release-')), None)
          if prod:
              req = urllib.request.Request(prod['archive_download_url'], headers=headers)
              with urllib.request.urlopen(req, timeout=120) as r:
                  payload = r.read()
              with zipfile.ZipFile(io.BytesIO(payload)) as z:
                  for name in (
                      'validation/phase_f3_deployment_preflight.json',
                      'validation/production_runtime_result.json',
                      'validation/feishu_long_connection_runtime.json',
                      'validation/exact_source_binding_result.json',
                      'validation/cicd_performance_v2.json',
                  ):
                      if name in z.namelist():
                          evidence[name] = json.loads(z.read(name).decode('utf-8'))

          report = {
              'schema_version': 'cicd-v2-production-observer-v1',
              'target_sha': target,
              'run': {
                  'id': run.get('id'),
                  'run_number': run.get('run_number'),
                  'run_attempt': run.get('run_attempt'),
                  'event': run.get('event'),
                  'status': run.get('status'),
                  'conclusion': run.get('conclusion'),
                  'created_at': run.get('created_at'),
                  'run_started_at': run.get('run_started_at'),
                  'updated_at': run.get('updated_at'),
                  'html_url': run.get('html_url'),
              },
              'jobs': job_rows,
              'artifact': {
                  'id': prod.get('id') if prod else None,
                  'name': prod.get('name') if prod else None,
              },
              'evidence': evidence,
          }
          out = Path('validation/cicd_v2_production_observer.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Commit observer result to isolated branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/cicd_v2_production_observer.json
          git commit -m 'chore: capture CI/CD V2 production evidence'
          git push origin HEAD:ops/cicd-v2-production-observe
