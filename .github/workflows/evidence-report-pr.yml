name: Evidence Report PR Gate

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/app/contracts/evidence_report.py'
      - 'backend/app/reports/evidence_brief.py'
      - 'backend/app/services/evidence_report.py'
      - 'backend/app/services/evidence_report_context.py'
      - 'backend/tests/test_evidence_report_*.py'
      - 'backend/tests/test_preliminary_evidence_report_v1.py'
      - 'backend/tests/test_evidence_report_authority_v1.py'
      - 'tools/evidence_report_*.py'
      - 'golden_cases/evidence_report_v1_synthetic.json'
      - '.github/workflows/evidence-report-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-report-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Python compile check
        run: PYTHONPATH=backend:. python -m compileall -q backend/app backend/tests tools
      - name: PR1 offline context and report contract regression
        run: |
          PYTHONPATH=backend:. pytest -q \
            backend/tests/test_evidence_report_offline_context_v1.py \
            backend/tests/test_evidence_report_context_provenance_v1.py \
            backend/tests/test_preliminary_evidence_report_v1.py \
            backend/tests/test_evidence_report_authority_v1.py
      - name: Synthetic evidence report golden gate
        run: PYTHONPATH=backend:. python tools/evidence_report_golden_gate.py
