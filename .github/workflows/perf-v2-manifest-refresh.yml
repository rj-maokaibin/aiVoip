name: CI/CD Performance V2 Hosted Manifest Refresh

on:
  push:
    branches:
      - perf/cicd-performance-v2

permissions:
  contents: write

concurrency:
  group: cicd-performance-v2-hosted-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: perf/cicd-performance-v2
          fetch-depth: 2

      - name: Lock exact-source transport regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/tests/test_cicd_performance_v2.py')
          text = p.read_text(encoding='utf-8')
          marker = 'def test_self_hosted_pr_gates_use_immutable_source_bundle():'
          if marker not in text:
              text += '''\n\ndef test_self_hosted_pr_gates_use_immutable_source_bundle():\n    for rel in (\n        ".github/workflows/source-manifest-gate.yml",\n        ".github/workflows/prd-spec-v1-release.yml",\n        ".github/workflows/preliminary-evidence-v1.yml",\n    ):\n        text = (ROOT / rel).read_text(encoding="utf-8")\n        assert "exact-source-bundle:" in text\n        assert "git bundle create" in text\n        assert "actions/download-artifact@v4" in text\n        assert "EXACT_SOURCE_MATERIALIZATION=PASS" in text\n        assert "EXPECTED_SHA" in text\n''' 
              p.write_text(text, encoding='utf-8')
          PY

      - name: Remove hosted helper and refresh governed manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git rm .github/workflows/perf-v2-manifest-refresh.yml
          python3 tools/source_manifest_gate.py --update
          python3 tools/source_manifest_gate.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: harden exact source transport for self-hosted gates'
          git push origin HEAD:perf/cicd-performance-v2
