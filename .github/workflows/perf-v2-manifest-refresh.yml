name: CI/CD Performance V2 Hosted Manifest Refresh

on:
  push:
    branches:
      - perf/cicd-performance-v2

permissions:
  contents: write

concurrency:
  group: cicd-performance-v2-hosted-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: perf/cicd-performance-v2
          fetch-depth: 2

      - name: Self-remove and refresh governed manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git rm .github/workflows/perf-v2-manifest-refresh.yml
          python3 tools/source_manifest_gate.py --update
          python3 tools/source_manifest_gate.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: refresh complete exact-source bundle manifest'
          git push origin HEAD:perf/cicd-performance-v2
