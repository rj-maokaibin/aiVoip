name: Current WEB Credential Source Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
      - name: Build immutable source bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git branch -f bundle-head "$EXPECTED_SHA"
          git bundle create "$RUNNER_TEMP/source.bundle" refs/heads/bundle-head
          printf '%s\n' "$EXPECTED_SHA" > "$RUNNER_TEMP/source.sha"
          git bundle verify "$RUNNER_TEMP/source.bundle"
      - name: Upload exact source bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-credential-exact-source-${{ env.EXPECTED_SHA }}
          path: |
            ${{ runner.temp }}/source.bundle
            ${{ runner.temp }}/source.sha
          if-no-files-found: error
          retention-days: 1

  read-only-web-credential-source:
    needs: exact-source-bundle
    runs-on: [self-hosted, linux, x64, voip-controlled-linux]
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PROD_ENV_FILE: /home/github-runner/.config/voip-ai/.env
      HOST_SECRET_FILE: /home/dev/secret.yaml
    steps:
      - name: Repair self-hosted workspace
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect python:3.12-slim >/dev/null
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" python:3.12-slim \
            sh -lc 'find /workspace -mindepth 1 -maxdepth 1 -exec rm -rf {} +'
      - name: Download exact source bundle
        uses: actions/download-artifact@v4
        with:
          name: web-credential-exact-source-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/web-credential-exact-source
      - name: Materialize exact PR head offline
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/web-credential-exact-source/source.bundle"
          test "$(cat "$RUNNER_TEMP/web-credential-exact-source/source.sha")" = "$EXPECTED_SHA"
          cd "$RUNNER_TEMP"
          rm -rf "$GITHUB_WORKSPACE"
          git clone -q -b bundle-head "$bundle" "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" checkout -q --detach "$EXPECTED_SHA"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "WEB_CREDENTIAL_EXACT_SOURCE=PASS revision=$EXPECTED_SHA"
      - name: Inspect credential contracts and runtime key names only
        shell: bash
        run: |
          set -euo pipefail
          test -r "$PROD_ENV_FILE"
          mkdir -p web-credential-source-evidence
          python3 - "$PROD_ENV_FILE" <<'PY'
          from __future__ import annotations

          import json
          import re
          import subprocess
          import sys
          from pathlib import Path

          env_file = Path(sys.argv[1])
          key_re = re.compile(
              r"(?:WEB|LUCI|GUI|HTTP|ADMIN|LOGIN|DEVICE).*(?:USER|USERNAME|PASS|PASSWORD|CRED|AUTH)|"
              r"(?:USER|USERNAME|PASS|PASSWORD|CRED|AUTH).*(?:WEB|LUCI|GUI|HTTP|ADMIN|LOGIN|DEVICE)",
              re.IGNORECASE,
          )

          def env_keys_from_lines(lines):
              found = []
              for raw in lines:
                  line = str(raw).strip()
                  if not line or line.startswith('#') or '=' not in line:
                      continue
                  key = line.split('=', 1)[0].strip()
                  if key.startswith('export '):
                      key = key[7:].strip()
                  if re.fullmatch(r'[A-Za-z_][A-Za-z0-9_]*', key) and key_re.search(key):
                      found.append(key)
              return sorted(set(found))

          host_env_keys = env_keys_from_lines(env_file.read_text(encoding='utf-8', errors='ignore').splitlines())

          # Inspect only YAML key paths from the runner secret store. Values are
          # deliberately never included in the evidence payload or stdout. If
          # github-runner cannot read the file, sudo is used only as an in-memory
          # pipe into this process; no raw secret file is copied or persisted.
          secret_key_paths = []
          generic_device_credential_keysets = []
          secret_path = Path(__import__('os').environ.get('HOST_SECRET_FILE', '/home/dev/secret.yaml'))
          secret_metadata_mode = 'absent'
          if secret_path.is_file():
              import os
              import yaml
              if os.access(secret_path, os.R_OK):
                  secret_text = secret_path.read_text(encoding='utf-8', errors='ignore')
                  secret_metadata_mode = 'runner'
              else:
                  privileged = subprocess.run(
                      ['sudo', '-n', 'cat', str(secret_path)], check=False,
                      stdout=subprocess.PIPE, stderr=subprocess.DEVNULL,
                      text=True, timeout=5,
                  )
                  if privileged.returncode != 0:
                      secret_text = ''
                      secret_metadata_mode = 'unreadable'
                  else:
                      secret_text = privileged.stdout
                      secret_metadata_mode = 'sudo_pipe'
              raw_secret = yaml.safe_load(secret_text) or {} if secret_text else {}
              del secret_text

              def walk_keys(value, prefix=''):
                  if isinstance(value, dict):
                      keys = {str(k) for k in value.keys()}
                      lowered = {k.lower() for k in keys}
                      if {'username', 'password'} <= lowered:
                          generic_device_credential_keysets.append(prefix or '<root>')
                      for key, child in value.items():
                          key_text = str(key)
                          path = f'{prefix}.{key_text}' if prefix else key_text
                          if key_re.search(key_text) or re.search(r'(?:web|luci|gui|http|admin|login)', path, re.IGNORECASE):
                              secret_key_paths.append(path)
                          walk_keys(child, path)
                  elif isinstance(value, list):
                      for child in value:
                          walk_keys(child, f'{prefix}[]' if prefix else '[]')

              walk_keys(raw_secret)

          containers = []
          cp = subprocess.run(
              ['docker', 'ps', '--format', '{{.Names}}'],
              check=False, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, text=True, timeout=5,
          )
          if cp.returncode == 0:
              for name in cp.stdout.splitlines():
                  name = name.strip()
                  if not name:
                      continue
                  inspect = subprocess.run(
                      ['docker', 'inspect', name], check=False,
                      stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, text=True, timeout=5,
                  )
                  if inspect.returncode != 0:
                      continue
                  try:
                      item = json.loads(inspect.stdout)[0]
                  except Exception:
                      continue
                  labels = dict(((item.get('Config') or {}).get('Labels') or {}))
                  if labels.get('com.docker.compose.project') != 'aivoip':
                      continue
                  env_names = env_keys_from_lines(((item.get('Config') or {}).get('Env') or []))
                  mounts = []
                  for mount in item.get('Mounts') or []:
                      destination = str(mount.get('Destination') or '')
                      if re.search(r'(?:secret|credential|auth|web|luci|login)', destination, re.IGNORECASE):
                          mounts.append(destination)
                  containers.append({
                      'service': labels.get('com.docker.compose.service'),
                      'matching_env_key_names': env_names,
                      'matching_mount_destinations': sorted(set(mounts)),
                  })

          credentials_source = Path('backend/app/integrations/credentials.py').read_text(encoding='utf-8')
          aba_source = Path('tools/resolve_real_sip_aba_credential_env.py').read_text(encoding='utf-8')
          source_contract = {
              'poseidon_calls_get_ssh_pass': 'get_ssh_pass' in credentials_source,
              'device_credential_doc_is_ssh': 'device SSH password' in credentials_source or 'DUT SSH credential' in credentials_source,
              'aba_private_env_names_ssh': 'SIP_ABA_SSH_PASSWORD' in aba_source and 'SIP_ABA_SSH_USERNAME' in aba_source,
              'dedicated_web_credential_provider_symbol_present': bool(re.search(r'WebCredentialProvider|WEB_CREDENTIAL_PROVIDER|web_credential', credentials_source, re.IGNORECASE)),
          }

          payload = {
              'mutation_executed': False,
              'secret_values_emitted': False,
              'host_matching_env_key_names': host_env_keys,
              'host_secret_file_present': secret_path.is_file(),
              'host_secret_matching_key_paths': sorted(set(secret_key_paths)),
              'host_secret_generic_username_password_nodes': sorted(set(generic_device_credential_keysets)),
              'host_secret_metadata_mode': secret_metadata_mode,
              'production_container_sources': containers,
              'repository_credential_contract': source_contract,
          }
          Path('web-credential-source-evidence/web-credential-source.json').write_text(
              json.dumps(payload, ensure_ascii=False, sort_keys=True, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps({
              'WEB_CREDENTIAL_SOURCE_PROBE': 'PASS',
              'mutation': False,
              'secret_values_emitted': False,
              'host_matching_key_count': len(host_env_keys),
              'host_secret_matching_key_path_count': len(payload['host_secret_matching_key_paths']),
              'host_secret_generic_credential_node_count': len(payload['host_secret_generic_username_password_nodes']),
              'secret_metadata_mode': secret_metadata_mode,
              'container_count': len(containers),
              'dedicated_provider_symbol_present': source_contract['dedicated_web_credential_provider_symbol_present'],
          }, sort_keys=True))
          PY
      - name: Upload immutable WEB credential source evidence
        uses: actions/upload-artifact@v4
        with:
          name: current-web-credential-source-${{ env.EXPECTED_SHA }}
          path: web-credential-source-evidence/*.json
          if-no-files-found: error
          retention-days: 7
