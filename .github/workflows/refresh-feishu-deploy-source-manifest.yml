name: Refresh Feishu deploy source manifest

on:
  push:
    branches:
      - fix/production-feishu-long-connection-governance
    paths:
      - 'deploy/**'
      - 'docker-compose.yml'
      - 'docker-compose.production.yml'
      - 'tools/source_manifest_gate.py'
      - 'backend/run_feishu_long_connection.py'

permissions:
  contents: write

jobs:
  refresh-source-manifest:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh source manifest
        run: python3 tools/source_manifest_gate.py --update
      - name: Commit refreshed manifest
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- release/source_manifest.json; then
            echo "source manifest already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/source_manifest.json
          git commit -m "chore(release): refresh source manifest for Feishu deployment governance"
          git push origin "HEAD:${GITHUB_REF_NAME}"
