name: Feishu deploy governance validation

on:
  pull_request:
    branches: [master]
    paths:
      - 'deploy/**'
      - 'docker-compose.production.yml'
      - 'backend/app/integrations/feishu/long_connection.py'
      - 'backend/run_feishu_long_connection.py'
      - 'backend/tests/test_feishu_long_connection_deployment_v1.py'
      - 'tools/source_manifest_gate.py'
      - 'release/source_manifest.json'

permissions:
  contents: write

concurrency:
  group: feishu-deploy-governance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Refresh source manifest
        run: python3 tools/source_manifest_gate.py --update
      - name: Validate deployment contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/voip-ai
          python3 -m py_compile \
            backend/run_feishu_long_connection.py \
            backend/app/integrations/feishu/long_connection.py
          PYTHONPATH=backend pytest -q \
            backend/tests/test_feishu_long_connection_deployment_v1.py
          python3 tools/source_manifest_gate.py
      - name: Commit refreshed manifest when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- release/source_manifest.json; then
            echo "source manifest already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/source_manifest.json
          git commit -m "chore(release): refresh source manifest for Feishu deployment governance"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
