name: Evidence V2 Manifest Bootstrap

on:
  push:
    branches:
      - fix/evidence-v2-build-cache-mirrors
    paths:
      - '.github/workflows/evidence-v2-manifest-bootstrap.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Regenerate source manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/source_manifest_gate.py --update
          python3 tools/source_manifest_gate.py
      - name: Commit generated manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/source_manifest.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: regenerate source manifest for dependency optimization'
          git push origin HEAD:fix/evidence-v2-build-cache-mirrors
