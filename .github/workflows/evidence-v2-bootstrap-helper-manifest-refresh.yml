name: Evidence V2 Bootstrap Helper Manifest Refresh

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/evidence-v2-production-golden-bootstrap.yml'
      - 'tools/evidence_v2_bootstrap_workflow_contract.py'
      - 'tools/human_evidence_feishu_live_acceptance.py'
      - '.github/workflows/evidence-v2-bootstrap-helper-manifest-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Validate bootstrap helper contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/evidence_v2_bootstrap_workflow_contract.py tools/human_evidence_feishu_live_acceptance.py
          python3 tools/evidence_v2_bootstrap_workflow_contract.py
      - name: Refresh final source manifest and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/evidence-v2-bootstrap-helper-manifest-refresh.yml
          python3 tools/source_manifest_gate.py --update
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'SOURCE_MANIFEST_REFRESH=NO_CHANGES'
            exit 0
          fi
          git commit -m 'Refresh source manifest for bootstrap helper injection'
          git push origin "HEAD:${{ github.head_ref }}"
