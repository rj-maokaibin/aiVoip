name: Self-hosted Runner Shell Probe (Temporary)

on:
  pull_request:
    branches:
      - feat/pr6-report-grounding-validator

permissions:
  contents: read

jobs:
  probe-shell:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 5
    steps:
      - name: Probe local runner shell
        run: |
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          echo "HOME=$HOME"
          uname -a
          python3 --version
          docker --version
          docker info >/dev/null
          node --version
          npm --version
          git --version
          curl --version | head -n 1
