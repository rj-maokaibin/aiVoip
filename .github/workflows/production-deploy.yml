name: Production Deploy

on:
  push:
    branches:
      - master
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'profiles/**'
      - 'rules/**'
      - 'knowledge/**'
      - 'tools/**'
      - 'contracts/**'
      - 'deploy/**'
      - 'Makefile'
      - '.env.example'
      - 'docker-compose.yml'
      - 'docker-compose.production.yml'
      - 'docker-compose.e2e.yml'
      - 'release/release_policy.yaml'
      - 'release/source_manifest.json'
      - '.github/workflows/production-deploy.yml'
      - '.github/workflows/source-manifest-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voip-production-deploy
  cancel-in-progress: false

jobs:
  immutable-source-bundle:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact deployment source on GitHub-hosted transport
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0

      - name: Build immutable production Git bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git branch -f bundle-head "$EXPECTED_SHA"
          git bundle create "$RUNNER_TEMP/source.bundle" refs/heads/bundle-head
          printf '%s\n' "$EXPECTED_SHA" > "$RUNNER_TEMP/source.sha"
          git bundle verify "$RUNNER_TEMP/source.bundle"
          echo "PRODUCTION_IMMUTABLE_SOURCE=PASS revision=$EXPECTED_SHA"

      - name: Upload immutable production source
        uses: actions/upload-artifact@v4
        with:
          name: production-exact-source-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/source.bundle
            ${{ runner.temp }}/source.sha
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  deploy-and-verify:
    needs: immutable-source-bundle
    if: github.ref == 'refs/heads/master'
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 90
    env:
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Repair self-hosted workspace before materialization
        shell: bash
        run: |
          set -euo pipefail
          docker info >/dev/null
          docker image inspect python:3.12-slim >/dev/null
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" python:3.12-slim \
            sh -lc 'find /workspace -mindepth 1 -maxdepth 1 -exec rm -rf {} +'
          test -z "$(find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)"
          echo "PRODUCTION_RUNNER_WORKSPACE_REPAIR=PASS"

      - name: Download immutable production source
        uses: actions/download-artifact@v4
        with:
          name: production-exact-source-${{ github.run_id }}
          path: ${{ runner.temp }}/production-exact-source

      - name: Materialize exact master offline
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/production-exact-source/source.bundle"
          sha_file="$RUNNER_TEMP/production-exact-source/source.sha"
          test -s "$bundle"
          test "$(cat "$sha_file")" = "$EXPECTED_SHA"
          git clone -q -b bundle-head "$bundle" "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" checkout -q --detach "$EXPECTED_SHA"
          git -C "$GITHUB_WORKSPACE" update-ref refs/remotes/origin/master "$EXPECTED_SHA"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse refs/remotes/origin/master)" = "$EXPECTED_SHA"
          test -z "$(git -C "$GITHUB_WORKSPACE" status --porcelain --untracked-files=no)"
          printf 'TARGET_SHA=%s\n' "$EXPECTED_SHA" >> "$GITHUB_ENV"
          printf 'TARGET_SHA=%s\n' "$EXPECTED_SHA"
          printf 'ORIGIN_MASTER=%s\n' "$EXPECTED_SHA"
          echo "PRODUCTION_TARGET_RESOLUTION=PASS source=IMMUTABLE_BUNDLE"

      - name: Source manifest release gate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/source_manifest_gate.py
          echo "SOURCE_MANIFEST_RELEASE_GATE=PASS"

      - name: Fingerprint persistent production env
        shell: bash
        run: |
          set -euo pipefail
          env_sha_before="$(docker run --rm \
            -v /etc/voip-ai/production.env:/input:ro \
            python:3.12-slim sha256sum /input | awk '{print $1}')"
          [[ "$env_sha_before" =~ ^[0-9a-f]{64}$ ]]
          printf 'PRODUCTION_ENV_SHA256_BEFORE=%s\n' "$env_sha_before" >> "$GITHUB_ENV"
          echo "PRODUCTION_ENV_FINGERPRINT_BEFORE=PASS sha256=$env_sha_before"

      - name: Formal production deployment
        shell: bash
        run: |
          set -euo pipefail
          deploy_log="$(mktemp)"
          trap 'rm -f "$deploy_log"' EXIT
          sudo -n /usr/local/sbin/voip-ai-production-deploy "$TARGET_SHA" | tee "$deploy_log"
          expected="BUILD_REVISION_SOURCE=RUNTIME revision=$TARGET_SHA base_env=/etc/voip-ai/production.env persistent_env_mutated=false"
          grep -Fqx "$expected" "$deploy_log"
          echo "RUNTIME_BUILD_REVISION_INJECTION=PASS revision=$TARGET_SHA persistent_env_mutated=false"
          echo "FORMAL_PRODUCTION_DEPLOY=PASS privilege_boundary=HOST_WRAPPER revision=$TARGET_SHA"

      - name: Verify persistent production env unchanged
        shell: bash
        run: |
          set -euo pipefail
          env_sha_after="$(docker run --rm \
            -v /etc/voip-ai/production.env:/input:ro \
            python:3.12-slim sha256sum /input | awk '{print $1}')"
          [[ "$env_sha_after" =~ ^[0-9a-f]{64}$ ]]
          test "$env_sha_after" = "$PRODUCTION_ENV_SHA256_BEFORE"
          mkdir -p validation
          python3 - "$TARGET_SHA" "$env_sha_after" <<'PY'
          import json
          import sys
          from pathlib import Path

          target, env_sha = sys.argv[1:]
          evidence = {
              "schema_version": "production-runtime-revision-injection-v1",
              "passed": True,
              "build_revision": target,
              "base_env": "/etc/voip-ai/production.env",
              "persistent_env_mutated": False,
              "persistent_env_sha256": env_sha,
              "privilege_boundary": "/usr/local/sbin/voip-ai-production-deploy",
              "source_controlled_runtime_revision": True,
          }
          Path("validation/runtime_revision_injection.json").write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print("PRODUCTION_PERSISTENT_ENV_UNCHANGED=PASS")
          PY

      - name: Verify exact source binding evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$TARGET_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path

          target = sys.argv[1]
          exact = json.loads(Path('validation/exact_source_binding_result.json').read_text(encoding='utf-8'))
          runtime = json.loads(Path('validation/production_runtime_result.json').read_text(encoding='utf-8'))
          feishu = json.loads(Path('validation/feishu_long_connection_runtime.json').read_text(encoding='utf-8'))
          revision = json.loads(Path('validation/runtime_revision_injection.json').read_text(encoding='utf-8'))

          assert exact.get('passed') is True, exact
          assert exact.get('expected_revision') == target, exact
          assert runtime.get('passed') is True, runtime
          assert runtime.get('build_revision') == target, runtime
          assert feishu.get('passed') is True, feishu
          assert feishu.get('build_revision') == target, feishu
          assert revision.get('passed') is True, revision
          assert revision.get('build_revision') == target, revision
          assert revision.get('persistent_env_mutated') is False, revision
          print('EXACT_SOURCE_BINDING_EVIDENCE=PASS')
          PY

      - name: Verify live containers and image revision labels
        shell: bash
        run: |
          set -euo pipefail
          services=(
            backend collector-worker packet-worker pcm-worker media-worker diagnosis-worker
            feishu-long-connection reproduction-worker reproduction-control-high-worker
            reproduction-watch-worker beat frontend
          )
          for svc in "${services[@]}"; do
            mapfile -t ids < <(docker ps -q \
              --filter 'label=com.docker.compose.project=aivoip' \
              --filter "label=com.docker.compose.service=$svc")
            test "${#ids[@]}" -eq 1
            cid="${ids[0]}"
            container_rev="$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$cid" \
              | awk -F= '$1=="BUILD_REVISION" {print substr($0,index($0,"=")+1); exit}')"
            image_id="$(docker inspect -f '{{.Image}}' "$cid")"
            image_rev="$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image_id")"
            echo "$svc container_revision=$container_rev image_revision=$image_rev"
            test "$container_rev" = "$TARGET_SHA"
            test "$image_rev" = "$TARGET_SHA"
          done
          ready="$(curl -fsS http://127.0.0.1:18001/health/ready)"
          health_rev="$(printf '%s' "$ready" | python3 -c 'import json,sys; print(json.load(sys.stdin)["build_revision"])')"
          test "$health_rev" = "$TARGET_SHA"
          echo "LIVE_EXACT_SOURCE_BINDING=PASS"

      - name: Deployment summary
        shell: bash
        run: |
          set -euo pipefail
          echo "PRODUCTION_DEPLOYMENT=PASS"
          echo "PRODUCTION_REVISION=$TARGET_SHA"
          echo "PRODUCTION_RUNTIME_VERIFY=PASS"
          echo "PRODUCTION_PERSISTENT_ENV_UNCHANGED=PASS"
          echo "RUNTIME_BUILD_REVISION_INJECTION=PASS"
          echo "EXACT_SOURCE_BINDING=PASS"
          echo "PRODUCTION_SOURCE_TRANSPORT=IMMUTABLE_BUNDLE"

      - name: Upload production release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            validation/phase_f3_deployment_preflight.json
            validation/production_runtime_result.json
            validation/feishu_long_connection_runtime.json
            validation/exact_source_binding_result.json
            validation/runtime_revision_injection.json
            validation/cicd_performance_v2.json
            validation/registry_connectivity_v2_1.json
            validation/docker_network_guard.json
          if-no-files-found: warn

      - name: Restore runner workspace ownership
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          uid="$(id -u)"
          gid="$(id -g)"
          docker image inspect python:3.12-slim >/dev/null
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" python:3.12-slim \
            sh -lc "for p in /workspace/.git /workspace/validation; do [ ! -e \"\$p\" ] || chown -R $uid:$gid \"\$p\"; done"
          if [ -e "$GITHUB_WORKSPACE/.git/index" ]; then
            test -w "$GITHUB_WORKSPACE/.git/index"
            test "$(stat -c '%u:%g' "$GITHUB_WORKSPACE/.git/index")" = "$uid:$gid"
          fi
          echo "PRODUCTION_RUNNER_WORKSPACE_RESTORE=PASS"
