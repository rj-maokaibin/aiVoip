name: Production M7 C06 Read-only Preflight

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/production-m7-c06-preflight.yml'

permissions:
  contents: read

concurrency:
  group: production-m7-c06-preflight
  cancel-in-progress: false

jobs:
  production-readonly-preflight:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 20
    env:
      TARGET_IP: '10.48.8.74'
      TARGET_PORT: '10001'
      TARGET_SN: 'G1V030E010214'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify exact operational head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "OPERATIONAL_HEAD=$(git rev-parse HEAD)"

      - name: Locate live production backend without mutation
        run: |
          set -euo pipefail
          docker info >/dev/null
          mapfile -t containers < <(docker ps \
            --filter label=com.docker.compose.project=voip-ai \
            --filter label=com.docker.compose.service=backend \
            --format '{{.Names}}')
          printf 'PRODUCTION_BACKEND_COUNT=%s\n' "${#containers[@]}"
          test "${#containers[@]}" -eq 1
          backend="${containers[0]}"
          test -n "$backend"
          docker inspect --format '{{.State.Status}}' "$backend" | grep -qx running
          printf 'BACKEND_CONTAINER=%s\n' "$backend" >> "$GITHUB_ENV"

      - name: Read-only V2 authority, credential chain and APF1250 DUT health
        id: preflight
        run: |
          set -uo pipefail
          mkdir -p validation
          set +e
          docker exec -i \
            -e TARGET_IP="$TARGET_IP" \
            -e TARGET_PORT="$TARGET_PORT" \
            -e TARGET_SN="$TARGET_SN" \
            "$BACKEND_CONTAINER" python - <<'PY' > validation/production_m7_c06_preflight.json
          import asyncio
          import json
          import os
          import re
          from datetime import datetime, timezone
          from urllib.parse import urlparse

          from sqlalchemy import select

          from app.collectors.asyncssh_adapter import AsyncSSHDeviceAdapter
          from app.contracts.enums import LockStatus, ReproductionState
          from app.core.config import settings
          from app.db.models import (
              Case,
              CaseDevice,
              DeviceCredential,
              DeviceDiagnosticLock,
              ReproductionSession,
          )
          from app.db.session import SessionLocal
          from app.integrations.credentials import CredentialError, get_credential_provider

          target_ip = os.environ['TARGET_IP']
          target_port = int(os.environ['TARGET_PORT'])
          target_sn = os.environ['TARGET_SN']
          terminal_states = {
              ReproductionState.COMPLETED.value,
              ReproductionState.PARTIAL_SUCCESS.value,
              ReproductionState.CANCELLED.value,
              ReproductionState.FAILED.value,
          }
          payload = {
              'schema_version': 'production-m7-c06-preflight-v4',
              'checked_at': datetime.now(timezone.utc).isoformat(),
              'mutation_performed': False,
              'target': {
                  'model': 'APF1250',
                  'ip': target_ip,
                  'ssh_port': target_port,
                  'sn_suffix': target_sn[-4:],
                  'identity_source': 'AUDITED_R6_GATE',
              },
              'runtime': {},
              'database': {},
              'credential_provider': {},
              'poseidon_readiness': {},
              'dut': {},
              'blocking_reasons': [],
          }

          engine = os.getenv('CAPTURE_ENGINE_VERSION')
          v2_enabled = os.getenv('CAPTURE_V2_PRODUCTION_ENABLED', '').lower() == 'true'
          platform_mode = os.getenv('REPRODUCTION_PLATFORM_MODE')
          runtime_ok = engine == 'V2' and v2_enabled and platform_mode == 'real'
          payload['runtime'] = {
              'capture_engine_version': engine,
              'capture_v2_production_enabled': v2_enabled,
              'reproduction_platform_mode': platform_mode,
              'authority_expected_v2': runtime_ok,
          }
          if not runtime_ok:
              payload['blocking_reasons'].append('PRODUCTION_CAPTURE_AUTHORITY_NOT_V2_REAL')

          db = SessionLocal()
          try:
              devices = list(db.scalars(
                  select(CaseDevice)
                  .where(CaseDevice.ip == target_ip, CaseDevice.ssh_port == target_port)
                  .order_by(CaseDevice.created_at.desc())
              ).all())
              device_ids = [d.id for d in devices]
              sns = sorted({d.sn for d in devices if d.sn})
              identity_conflict = bool(sns and sns != [target_sn])

              credential_row = db.scalar(
                  select(DeviceCredential).where(DeviceCredential.sn == target_sn)
              )

              active_locks = []
              sessions = []
              if device_ids:
                  active_locks = list(db.scalars(
                      select(DeviceDiagnosticLock).where(
                          DeviceDiagnosticLock.device_id.in_(device_ids),
                          DeviceDiagnosticLock.status.in_([
                              LockStatus.ACTIVE.value,
                              LockStatus.QUARANTINED.value,
                          ]),
                      )
                  ).all())
                  sessions = list(db.scalars(
                      select(ReproductionSession)
                      .where(ReproductionSession.device_id.in_(device_ids))
                      .order_by(ReproductionSession.created_at.desc())
                  ).all())

              active_sessions = [s for s in sessions if s.state not in terminal_states]
              recent_sessions = [
                  {
                      'session_id': s.id,
                      'case_id': s.case_id,
                      'state': s.state,
                      'cleanup_status': s.cleanup_status,
                      'created_at': s.created_at.isoformat() if s.created_at else None,
                  }
                  for s in sessions[:5]
              ]
              recent_cases = []
              for d in devices[:8]:
                  case = db.get(Case, d.case_id)
                  if case and all(x['case_id'] != case.id for x in recent_cases):
                      recent_cases.append({
                          'case_id': case.id,
                          'case_no': case.case_no,
                          'status': case.status,
                          'created_at': case.created_at.isoformat() if case.created_at else None,
                      })

              payload['database'] = {
                  'matching_case_device_rows': len(devices),
                  'first_production_case_binding_required': len(devices) == 0,
                  'stored_unique_device_identity_count': len(sns),
                  'stored_identity_matches_audited_target': not identity_conflict,
                  'active_or_quarantined_lock_count': len(active_locks),
                  'active_nonterminal_session_count': len(active_sessions),
                  'device_credential_registration': {
                      'row_exists': credential_row is not None,
                      'endpoint_matches_target': (
                          credential_row is not None
                          and credential_row.ip == target_ip
                          and int(credential_row.ssh_port) == target_port
                      ),
                      'username_present': bool(credential_row and credential_row.username),
                      'password_present': bool(credential_row and credential_row.password),
                      'source': credential_row.source if credential_row else None,
                      'product_present': bool(credential_row and credential_row.product),
                      'updated_at': (
                          credential_row.updated_at.isoformat()
                          if credential_row and credential_row.updated_at else None
                      ),
                  },
                  'recent_sessions': recent_sessions,
                  'recent_cases': recent_cases[:5],
              }
              if identity_conflict:
                  payload['blocking_reasons'].append('APF1250_PRODUCTION_DB_IDENTITY_CONFLICT')
              if active_locks:
                  payload['blocking_reasons'].append('APF1250_HAS_ACTIVE_OR_QUARANTINED_LOCK')
              if active_sessions:
                  payload['blocking_reasons'].append('APF1250_HAS_NONTERMINAL_REPRODUCTION_SESSION')
          finally:
              db.close()

          try:
              provider = get_credential_provider()
              api_url = str(getattr(settings, 'credential_api_url', '') or '').strip()
              parsed_api = urlparse(api_url) if api_url else None
              api_host = (parsed_api.hostname or '').lower() if parsed_api else ''
              api_placeholder = (
                  not api_url
                  or 'example.internal' in api_host
                  or 'example.com' in api_host
                  or '<' in api_url
                  or '>' in api_url
              )
              payload['credential_provider'] = {
                  'provider_id': getattr(provider, 'provider_id', 'unknown'),
                  'production_capable': bool(getattr(provider, 'production_capable', False)),
                  'api_url_configured': bool(api_url),
                  'api_url_scheme': parsed_api.scheme if parsed_api else None,
                  'api_url_is_placeholder': api_placeholder,
                  'api_token_source_configured': bool(
                      getattr(settings, 'credential_api_token_file', None)
                      or getattr(settings, 'credential_api_token_env', None)
                      or getattr(settings, 'credential_api_token', None)
                  ),
              }
              if getattr(provider, 'provider_id', None) == 'api' and api_placeholder:
                  payload['blocking_reasons'].append('PRODUCTION_CREDENTIAL_API_PLACEHOLDER')
          except Exception as exc:
              provider = None
              payload['credential_provider'] = {
                  'provider_id': None,
                  'production_capable': False,
                  'provider_init_error_type': type(exc).__name__,
                  'provider_init_error': str(exc) if isinstance(exc, CredentialError) else None,
              }
              payload['blocking_reasons'].append('PRODUCTION_CREDENTIAL_PROVIDER_INIT_FAILED')

          try:
              from app.integrations.poseidon import _baichuan_credentials, _secret_file
              secret_path = _secret_file()
              secret_exists = secret_path.is_file()
              baichuan_ready = False
              if secret_exists:
                  try:
                      user, password = _baichuan_credentials()
                      baichuan_ready = bool(user and password)
                  except CredentialError:
                      baichuan_ready = False
              payload['poseidon_readiness'] = {
                  'provider_supported_by_product': True,
                  'secret_file_present': secret_exists,
                  'baichuan_credentials_present': baichuan_ready,
              }
          except Exception as exc:
              payload['poseidon_readiness'] = {
                  'provider_supported_by_product': True,
                  'secret_file_present': False,
                  'baichuan_credentials_present': False,
                  'probe_error_type': type(exc).__name__,
              }

          async def dut_probe():
              if provider is None:
                  raise CredentialError('CREDENTIAL_PROVIDER_UNAVAILABLE')
              password = await provider.get_password(sn=target_sn, ip=target_ip, product='APF1250')
              resolver = getattr(provider, 'resolve_username', None)
              username = resolver(ip=target_ip, fallback='root') if callable(resolver) else 'root'
              adapter = AsyncSSHDeviceAdapter(
                  ip=target_ip,
                  port=target_port,
                  username=username,
                  password=password,
              )
              try:
                  await asyncio.wait_for(adapter.connect(), timeout=15)
                  command = (
                      "echo PROBE_OK=1; "
                      "echo TCPDUMP_COUNT=$(ps w | grep '[t]cpdump' | wc -l); "
                      "echo DSP_DIAG_PROCESS_COUNT=$(ps w | grep '[d]sp diag' | wc -l)"
                  )
                  result = await adapter.execute_shell(command, timeout=10)
                  text = result.stdout or ''
                  def number(name):
                      m = re.search(rf'{name}=(\\d+)', text)
                      return int(m.group(1)) if m else None
                  return {
                      'credential_resolved': True,
                      'ssh_connected': 'PROBE_OK=1' in text,
                      'tcpdump_process_count': number('TCPDUMP_COUNT'),
                      'dsp_diag_process_count': number('DSP_DIAG_PROCESS_COUNT'),
                  }
              finally:
                  try:
                      await asyncio.wait_for(adapter.disconnect(), timeout=5)
                  except Exception:
                      pass

          try:
              dut = asyncio.run(dut_probe())
              payload['dut'] = dut
              if not dut.get('ssh_connected'):
                  payload['blocking_reasons'].append('APF1250_SSH_READONLY_PROBE_FAILED')
              if dut.get('tcpdump_process_count') not in (0, None):
                  payload['blocking_reasons'].append('APF1250_RESIDUAL_TCPDUMP_PROCESS')
              if dut.get('dsp_diag_process_count') not in (0, None):
                  payload['blocking_reasons'].append('APF1250_RESIDUAL_DSP_DIAG_PROCESS')
          except Exception as exc:
              payload['dut'] = {
                  'credential_resolved': False,
                  'ssh_connected': False,
                  'error_type': type(exc).__name__,
                  'credential_error': str(exc) if isinstance(exc, CredentialError) else None,
              }
              payload['blocking_reasons'].append('APF1250_SSH_READONLY_PROBE_EXCEPTION')

          payload['verdict'] = 'PASS' if not payload['blocking_reasons'] else 'BLOCKED'
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          raise SystemExit(0 if payload['verdict'] == 'PASS' else 2)
          PY
          rc=$?
          set -e
          cat validation/production_m7_c06_preflight.json
          exit "$rc"

      - name: Upload sanitized read-only preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-m7-c06-preflight
          path: validation/production_m7_c06_preflight.json
          if-no-files-found: error
          retention-days: 30
