name: Runner Node Fetch Probe Temp

on:
  push:
    branches:
      - chore/runner-egress-probe-20260906

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, voip-controlled-linux]
    timeout-minutes: 5
    steps:
      - name: Probe exact Desktop Commander public endpoint only
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER=${RUNNER_NAME:-unknown}"
          echo "NODE_VERSION=$(node --version)"
          target='https://mcp.desktopcommander.app/api/mcp-info'
          curl_result="$(curl -sS --connect-timeout 5 --max-time 15 -o /tmp/mcp-info.json -w 'HTTP_CODE=%{http_code} TLS_VERIFY=%{ssl_verify_result} REMOTE_IP=%{remote_ip}' "$target")"
          echo "$curl_result"
          python3 - <<'PY'
          import json
          p='/tmp/mcp-info.json'
          data=json.load(open(p,encoding='utf-8'))
          print('CURL_JSON_PARSE=PASS')
          print('HAS_SUPABASE_URL=%s' % bool(data.get('supabaseUrl')))
          print('HAS_PUBLISHABLE_KEY=%s' % bool(data.get('supabasePublishableKey')))
          PY
          node - <<'NODE'
          const url='https://mcp.desktopcommander.app/api/mcp-info';
          const timer=setTimeout(()=>{ console.log('NODE_FETCH_TIMEOUT=true'); process.exit(2); },15000);
          fetch(url).then(async r=>{
            const body=await r.json();
            clearTimeout(timer);
            console.log(`NODE_FETCH_OK=true STATUS=${r.status}`);
            console.log(`NODE_HAS_SUPABASE_URL=${Boolean(body?.supabaseUrl)}`);
            console.log(`NODE_HAS_PUBLISHABLE_KEY=${Boolean(body?.supabasePublishableKey)}`);
          }).catch(e=>{
            clearTimeout(timer);
            console.log('NODE_FETCH_OK=false');
            console.log(`NODE_FETCH_ERROR_NAME=${e?.name || 'unknown'}`);
            console.log(`NODE_FETCH_ERROR_CODE=${e?.cause?.code || e?.code || 'none'}`);
            console.log(`NODE_FETCH_ERROR_ERRNO=${e?.cause?.errno || 'none'}`);
            console.log(`NODE_FETCH_CAUSE_NAME=${e?.cause?.name || 'none'}`);
            process.exitCode=3;
          });
          NODE
