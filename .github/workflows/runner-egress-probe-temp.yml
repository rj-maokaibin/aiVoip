name: Runner Egress Probe Temp

on:
  push:
    branches:
      - chore/runner-egress-probe-20260906

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, voip-controlled-linux]
    timeout-minutes: 5
    steps:
      - name: Probe outbound HTTPS and runtime only
        shell: bash
        run: |
          set -euo pipefail
          printf 'RUNNER=%s\n' "${RUNNER_NAME:-unknown}"
          printf 'NODE_VERSION=%s\n' "$(node --version 2>/dev/null || echo unavailable)"
          printf 'NPM_VERSION=%s\n' "$(npm --version 2>/dev/null || echo unavailable)"
          printf 'PYTHON_VERSION=%s\n' "$(python3 --version 2>&1 || true)"
          if getent ahosts mcp.desktopcommander.app >/dev/null 2>&1; then
            echo 'DNS_RESOLUTION=PASS'
          else
            echo 'DNS_RESOLUTION=FAIL'
            exit 21
          fi
          result="$(curl -sS --connect-timeout 5 --max-time 15 -o /dev/null -w 'HTTP_CODE=%{http_code} TLS_VERIFY=%{ssl_verify_result}' https://mcp.desktopcommander.app)"
          printf '%s\n' "$result"
          code="$(printf '%s' "$result" | sed -n 's/.*HTTP_CODE=\([0-9][0-9][0-9]\).*/\1/p')"
          verify="$(printf '%s' "$result" | sed -n 's/.*TLS_VERIFY=\([0-9][0-9]*\).*/\1/p')"
          test -n "$code"
          test "$code" != '000'
          test "$verify" = '0'
          echo 'OUTBOUND_HTTPS=PASS'
