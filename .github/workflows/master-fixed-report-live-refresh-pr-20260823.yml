name: Fixed Master Report Live Refresh

on:
  pull_request:
    paths:
      - '.ci/fixed-master-live-refresh-20260823'

permissions:
  contents: read

jobs:
  verify-and-refresh-original-feishu:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 60
    env:
      OFFLINE_PCAP: /tmp/tcpdump-2026-08-14.pcap
      OFFLINE_PCAP_SHA256: b038aa7c9a0644581f2815f654fcdee4620860796382265b178823fccba2e3f0
      DOCUMENT_ID: SN6DdJX16oisLQxnPjzcwLwfnLb
      TARGET_OPEN_ID: ou_67bee3c2e462a7f8939093bd8e697a96

    steps:
      - name: Sync current master with retry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test -d .git
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          ok=0
          for i in 1 2 3 4 5 6 7 8; do
            if git -c http.lowSpeedLimit=1 -c http.lowSpeedTime=120 fetch --no-tags --prune origin master; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = 1
          git reset --hard HEAD || true
          git clean -ffdx
          git checkout -f -B master FETCH_HEAD
          git reset --hard FETCH_HEAD
          git clean -ffdx
          head="$(git rev-parse HEAD)"
          echo "FIXED_MASTER_HEAD=$head" >> "$GITHUB_ENV"
          test -f backend/app/reports/actionable_summary.py
          grep -q '"plan": \[item.to_dict()' backend/app/golden/offline_analysis_e2e.py
          grep -q '1.1 问题范围与绝对时间' backend/app/integrations/feishu/evidence_document.py
          grep -q '1.2 下一步建议 / 验证顺序 / 通过标准' backend/app/integrations/feishu/evidence_document.py
          test -f scripts/fixed_master_live_refresh_20260823.py
          git log -1 --oneline

      - name: Prepare PCAP TShark and Python
        shell: bash
        run: |
          set -euo pipefail
          fixture="$OFFLINE_PCAP"
          if [ ! -r "$fixture" ]; then
            fixture="$RUNNER_TEMP/fixed-master-live-input.pcap"
            docker run --rm -v /tmp:/source:ro -v "$RUNNER_TEMP":/output --entrypoint sh postgres:16 \
              -c "cp /source/tcpdump-2026-08-14.pcap /output/fixed-master-live-input.pcap && chmod 0644 /output/fixed-master-live-input.pcap"
          fi
          test -r "$fixture"
          test "$(sha256sum "$fixture" | awk '{print $1}')" = "$OFFLINE_PCAP_SHA256"
          echo "OFFLINE_PCAP=$fixture" >> "$GITHUB_ENV"

          tshark_bin=""
          if command -v tshark >/dev/null 2>&1; then
            candidate="$(command -v tshark)"
            version="$($candidate -v | head -n1)"
            [[ "$version" == *'4.2.2'* ]] && tshark_bin="$candidate"
          fi
          if [ -z "$tshark_bin" ]; then
            root="$RUNNER_TEMP/tshark-root-fixed"
            debs="$RUNNER_TEMP/tshark-debs-fixed"
            rm -rf "$root" "$debs"
            mkdir -p "$root" "$debs"
            cd "$debs"
            mapfile -t pkgs < <(apt-cache depends --recurse --no-recommends --no-suggests --no-conflicts --no-breaks --no-replaces --no-enhances tshark | awk '/^[^ <][^:]*$/ {print $1}' | sort -u)
            miss=()
            for p in "${pkgs[@]}"; do
              dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -q 'install ok installed' || miss+=("$p")
            done
            [ ${#miss[@]} -eq 0 ] || apt-get download "${miss[@]}"
            shopt -s nullglob
            for d in ./*.deb; do dpkg-deb -x "$d" "$root"; done
            tshark_bin="$RUNNER_TEMP/tshark-userspace-fixed"
            printf '#!/bin/bash\nexport LD_LIBRARY_PATH="%s/usr/lib/x86_64-linux-gnu:%s/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"\nexport WIRESHARK_DATA_DIR="%s/usr/share/wireshark"\nexec "%s/usr/bin/tshark" "$@"\n' "$root" "$root" "$root" "$root" > "$tshark_bin"
            chmod +x "$tshark_bin"
          fi
          version="$($tshark_bin -v | head -n1)"
          echo "$version"
          [[ "$version" == *'4.2.2'* ]]
          echo "TSHARK_BINARY=$tshark_bin" >> "$GITHUB_ENV"

          cd "$GITHUB_WORKSPACE"
          venv="$RUNNER_TEMP/voip-fixed-master-live"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -r backend/requirements.txt >/dev/null
          echo "LIVE_VENV=$venv" >> "$GITHUB_ENV"

      - name: Run isolated product regression gates
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          docker rm -f voip-report-reg-pg voip-report-reg-redis >/dev/null 2>&1 || true
          docker run -d --rm --name voip-report-reg-pg \
            -e POSTGRES_USER=voip -e POSTGRES_PASSWORD=voip -e POSTGRES_DB=voip \
            -p 127.0.0.1:55432:5432 postgres:16 >/dev/null
          docker run -d --rm --name voip-report-reg-redis \
            -p 127.0.0.1:56379:6379 redis:7-alpine >/dev/null
          trap 'docker rm -f voip-report-reg-pg voip-report-reg-redis >/dev/null 2>&1 || true' EXIT

          for i in $(seq 1 30); do
            docker exec voip-report-reg-pg pg_isready -U voip -d voip >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec voip-report-reg-pg pg_isready -U voip -d voip >/dev/null
          for i in $(seq 1 30); do
            docker exec voip-report-reg-redis redis-cli ping 2>/dev/null | grep -q PONG && break
            sleep 1
          done
          docker exec voip-report-reg-redis redis-cli ping | grep -q PONG

          export DATABASE_URL='postgresql+psycopg://voip:voip@127.0.0.1:55432/voip'
          export REDIS_URL='redis://127.0.0.1:56379/0'
          export FEISHU_LIVE_ENABLED='false'
          export REPRODUCTION_PLATFORM_MODE='real'
          export PYTHONPATH=backend
          echo 'REGRESSION_ENV=isolated; REPRODUCTION_PLATFORM_MODE=real'

          "$LIVE_VENV/bin/python" -m compileall -q backend/app
          "$LIVE_VENV/bin/python" -m pytest -q backend/tests/test_actionable_report_projection.py
          "$LIVE_VENV/bin/python" -m pytest -q backend/tests -x

      - name: Reanalyze real PCAP and update original Feishu document
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test -f /home/github-runner/.config/voip-ai/.env
          test -f /home/github-runner/.config/voip-ai/feishu_app_secret
          set -a
          source /home/github-runner/.config/voip-ai/.env
          set +a
          test "${REPRODUCTION_PLATFORM_MODE:-}" = "real"
          export FEISHU_APP_SECRET_FILE=/home/github-runner/.config/voip-ai/feishu_app_secret
          export PYTHONPATH=backend
          mkdir -p validation/fixed_master_live_refresh
          "$LIVE_VENV/bin/python" scripts/fixed_master_live_refresh_20260823.py

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixed-master-original-feishu-refresh
          path: validation/fixed_master_live_refresh/result.json
          if-no-files-found: warn
