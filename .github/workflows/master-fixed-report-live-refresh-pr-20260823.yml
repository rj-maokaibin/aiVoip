name: Fixed Master Report Live Refresh

on:
  pull_request:
    paths:
      - '.ci/fixed-master-live-refresh-20260823'

permissions:
  contents: read

jobs:
  verify-and-refresh-original-feishu:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 40
    env:
      OFFLINE_PCAP: /tmp/tcpdump-2026-08-14.pcap
      OFFLINE_PCAP_SHA256: b038aa7c9a0644581f2815f654fcdee4620860796382265b178823fccba2e3f0
      DOCUMENT_ID: SN6DdJX16oisLQxnPjzcwLwfnLb
      TARGET_OPEN_ID: ou_67bee3c2e462a7f8939093bd8e697a96

    steps:
      - name: Pre-clean persistent self-hosted workspace
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          if [ -d .git ]; then
            git reset --hard HEAD || true
            git clean -ffdx || true
          fi

      - name: Sync latest master with bounded retry
        shell: bash
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          if [ ! -d .git ]; then
            git init
          fi
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          else
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          ok=0
          for attempt in 1 2 3; do
            echo "master fetch attempt ${attempt}/3"
            if timeout 60s git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
              fetch --no-tags --prune --depth=1 origin master; then
              ok=1
              break
            fi
            sleep $((attempt * 3))
          done
          test "$ok" = 1
          git checkout -f -B master FETCH_HEAD
          git reset --hard FETCH_HEAD
          git clean -ffdx

      - name: Validate latest master product snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"
          head="$(git rev-parse HEAD)"
          echo "FIXED_MASTER_HEAD=$head" >> "$GITHUB_ENV"
          test -f backend/app/reports/actionable_summary.py
          test -f backend/app/reports/prd_spec_v1_alignment.py
          test -f backend/app/golden/offline_report_v2.py
          test -f backend/tests/test_report_prd_spec_100_percent.py
          test -f scripts/fixed_master_live_refresh_20260823.py
          grep -q 'single_canonical_fact_layer' backend/app/reports/prd_spec_v1_alignment.py
          grep -q 'legacy_prepend_revision_allowed' backend/app/reports/prd_spec_v1_alignment.py
          grep -q 'feishu-evidence-living-document-v2' backend/app/integrations/feishu/evidence_document.py
          ! grep -q '下方旧版内容保留作为历史记录，若有冲突以本修订版为准' scripts/fixed_master_live_refresh_20260823.py
          echo "LATEST_MASTER_SNAPSHOT=$head"

      - name: Prepare PCAP TShark and Python
        shell: bash
        run: |
          set -euo pipefail
          fixture="$OFFLINE_PCAP"
          if [ ! -r "$fixture" ]; then
            fixture="$RUNNER_TEMP/fixed-master-live-input.pcap"
            docker run --rm -v /tmp:/source:ro -v "$RUNNER_TEMP":/output --entrypoint sh postgres:16 \
              -c "cp /source/tcpdump-2026-08-14.pcap /output/fixed-master-live-input.pcap && chmod 0644 /output/fixed-master-live-input.pcap"
          fi
          test -r "$fixture"
          test "$(sha256sum "$fixture" | awk '{print $1}')" = "$OFFLINE_PCAP_SHA256"
          echo "OFFLINE_PCAP=$fixture" >> "$GITHUB_ENV"

          tshark_bin=""
          if command -v tshark >/dev/null 2>&1; then
            candidate="$(command -v tshark)"
            version="$($candidate -v | head -n1)"
            [[ "$version" == *'4.2.2'* ]] && tshark_bin="$candidate"
          fi
          if [ -z "$tshark_bin" ]; then
            root="$RUNNER_TEMP/tshark-root-fixed"
            debs="$RUNNER_TEMP/tshark-debs-fixed"
            rm -rf "$root" "$debs"
            mkdir -p "$root" "$debs"
            cd "$debs"
            mapfile -t pkgs < <(apt-cache depends --recurse --no-recommends --no-suggests --no-conflicts --no-breaks --no-replaces --no-enhances tshark | awk '/^[^ <][^:]*$/ {print $1}' | sort -u)
            miss=()
            for p in "${pkgs[@]}"; do
              dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -q 'install ok installed' || miss+=("$p")
            done
            [ ${#miss[@]} -eq 0 ] || apt-get download "${miss[@]}"
            shopt -s nullglob
            for d in ./*.deb; do dpkg-deb -x "$d" "$root"; done
            tshark_bin="$RUNNER_TEMP/tshark-userspace-fixed"
            printf '#!/bin/bash\nexport LD_LIBRARY_PATH="%s/usr/lib/x86_64-linux-gnu:%s/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"\nexport WIRESHARK_DATA_DIR="%s/usr/share/wireshark"\nexec "%s/usr/bin/tshark" "$@"\n' "$root" "$root" "$root" "$root" > "$tshark_bin"
            chmod +x "$tshark_bin"
          fi
          version="$($tshark_bin -v | head -n1)"
          echo "$version"
          [[ "$version" == *'4.2.2'* ]]
          echo "TSHARK_BINARY=$tshark_bin" >> "$GITHUB_ENV"

          cd "$GITHUB_WORKSPACE"
          venv="$RUNNER_TEMP/voip-fixed-master-live-v2"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -r backend/requirements.txt >/dev/null
          echo "LIVE_VENV=$venv" >> "$GITHUB_ENV"

      - name: Run canonical V2 focused report gates
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          export FEISHU_LIVE_ENABLED='false'
          export REPRODUCTION_PLATFORM_MODE='mock'
          export PYTHONPATH=backend
          "$LIVE_VENV/bin/python" -m compileall -q backend/app scripts/fixed_master_live_refresh_20260823.py
          "$LIVE_VENV/bin/python" -m pytest -q \
            backend/tests/test_actionable_report_projection.py \
            backend/tests/test_preliminary_evidence_report_v1.py \
            backend/tests/test_report_prd_spec_100_percent.py

      - name: Run full backend regression before live mutation
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          export FEISHU_LIVE_ENABLED='false'
          export REPRODUCTION_PLATFORM_MODE='mock'
          export PYTHONPATH=backend
          "$LIVE_VENV/bin/python" -m pytest -q backend/tests -x

      - name: Reanalyze real PCAP and replace original Feishu with canonical V2
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test -f /home/github-runner/.config/voip-ai/.env
          test -f /home/github-runner/.config/voip-ai/feishu_app_secret
          set -a
          source /home/github-runner/.config/voip-ai/.env
          set +a
          test "${REPRODUCTION_PLATFORM_MODE:-}" = "real"
          export FEISHU_APP_SECRET_FILE=/home/github-runner/.config/voip-ai/feishu_app_secret
          export PYTHONPATH=backend
          rm -rf validation/fixed_master_live_refresh
          mkdir -p validation/fixed_master_live_refresh
          "$LIVE_VENV/bin/python" scripts/fixed_master_live_refresh_20260823.py

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixed-master-original-feishu-refresh
          path: |
            validation/fixed_master_live_refresh/result.json
            validation/fixed_master_live_refresh/canonical_v2/canonical-report-v2.json
            validation/fixed_master_live_refresh/canonical_v2/canonical-report-v2.html
            validation/fixed_master_live_refresh/canonical_v2/evidence-bundle-internal-full-v2.zip
            validation/fixed_master_live_refresh/legacy-feishu-root-before-canonical-v2.json
            validation/fixed_master_live_refresh/legacy-feishu-text-before-canonical-v2.txt
          if-no-files-found: warn
