name: Refresh Production Revision Manifest

on:
  push:
    branches:
      - fix/production-revision-sudo-boundary

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh and verify source manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/source_manifest_gate.py --update
          python3 tools/source_manifest_gate.py
          python3 -m py_compile deploy/runtime_env.py
          bash -n deploy/voip-ai

      - name: Commit source manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/source_manifest.json
          git commit -m 'chore(release): refresh source manifest for sudo boundary'
          git push origin HEAD:fix/production-revision-sudo-boundary
