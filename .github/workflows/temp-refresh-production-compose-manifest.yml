name: TEMP Refresh Production Compose Hotfix Manifest

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'hotfix/production-compose-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/production-compose-gate
          fetch-depth: 2

      - name: Refresh exact source manifest
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 tools/source_manifest_gate.py --update
          PYTHONDONTWRITEBYTECODE=1 python3 tools/source_manifest_gate.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/source_manifest.json
          if git diff --cached --quiet; then
            echo 'SOURCE_MANIFEST_ALREADY_CURRENT=PASS'
            exit 0
          fi
          git commit -m 'chore(release): refresh production compose hotfix manifest'
          git push origin HEAD:hotfix/production-compose-gate
