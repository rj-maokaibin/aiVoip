name: Evidence V2 Bootstrap Workspace Manifest Refresh

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/evidence-v2-production-golden-bootstrap.yml'
      - 'tools/evidence_v2_bootstrap_workflow_contract.py'
      - 'release/source_manifest.json'
      - '.github/workflows/evidence-v2-bootstrap-workspace-manifest-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'fix/evidence-v2-bootstrap-workspace-isolation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate bootstrap workspace contract
        run: |
          set -euo pipefail
          python3 -m py_compile tools/evidence_v2_bootstrap_workflow_contract.py tools/evidence_v2_production_golden_bootstrap.py tools/human_evidence_feishu_live_acceptance.py
          python3 tools/evidence_v2_bootstrap_workflow_contract.py

      - name: Refresh governed source manifest and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/evidence-v2-bootstrap-workspace-manifest-refresh.yml
          python3 tools/source_manifest_gate.py --update
          python3 tools/source_manifest_gate.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/source_manifest.json .github/workflows/evidence-v2-bootstrap-workspace-manifest-refresh.yml
          if git diff --cached --quiet; then
            echo 'SOURCE_MANIFEST_REFRESH=NO_CHANGE'
            exit 0
          fi
          git commit -m 'Refresh source manifest for bootstrap workspace isolation'
          git push origin HEAD:${{ github.head_ref }}
          echo 'SOURCE_MANIFEST_REFRESH=PASS'
