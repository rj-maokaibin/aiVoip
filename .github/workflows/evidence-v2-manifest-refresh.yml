name: Evidence V2 Clean Completion Helper

on:
  push:
    branches:
      - feat/evidence-v2-completion-clean

permissions:
  contents: write

jobs:
  apply-reviewed-production-slice:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply reviewed production integration patch
        env:
          PATCH_B64: 
        run: |
          echo "$PATCH_B64" | base64 -d | gzip -dc > /tmp/evidence-v2-production.patch
          git apply --check /tmp/evidence-v2-production.patch
          git apply /tmp/evidence-v2-production.patch
          python3 -m py_compile \
            backend/app/services/evidence_report.py \
            backend/app/services/evidence_report_v2.py \
            backend/app/integrations/feishu/evidence_document.py \
            backend/app/reports/v2/artifact_binding.py

      - name: Regenerate exact source manifest
        run: |
          python3 tools/source_manifest_gate.py --update
          python3 tools/source_manifest_gate.py

      - name: Commit reviewed slice and refreshed manifest
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/app/services/evidence_report.py \
            backend/app/services/evidence_report_v2.py \
            backend/app/reports/report_grounding.py \
            backend/app/reports/v2/artifact_binding.py \
            backend/app/integrations/feishu/evidence_document.py \
            backend/app/api/v1/evidence_reports.py \
            backend/app/services/evidence_report_artifacts.py \
            backend/tests/test_evidence_v2_artifact_binding.py \
            backend/tests/test_evidence_report_v2_production_adapter.py \
            release/source_manifest.json
          git commit -m "feat(evidence-v2): integrate production shadow and projection path"
          git push origin "HEAD:${GITHUB_REF_NAME}"
