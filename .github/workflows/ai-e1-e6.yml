name: AI E1-E6 Gate

on:
  pull_request:
    paths:
      - "backend/app/diagnosis/**"
      - "backend/app/knowledge/**"
      - "backend/app/core/config.py"
      - "backend/tests/**"
      - "tools/ai_*.py"
      - "tools/export_ai_eval_dataset.py"
      - "knowledge/seed/**"
      - "golden_cases/ai_*.json"
      - "Makefile"
      - ".github/workflows/ai-e1-e6.yml"
  push:
    branches:
      - "agent/ai-e1-real-eval-grounding"
    paths:
      - "backend/app/diagnosis/**"
      - "backend/app/knowledge/**"
      - "backend/app/core/config.py"
      - "backend/tests/**"
      - "tools/ai_*.py"
      - "tools/export_ai_eval_dataset.py"
      - "knowledge/seed/**"
      - "golden_cases/ai_*.json"
      - "Makefile"
      - ".github/workflows/ai-e1-e6.yml"

permissions:
  contents: read

jobs:
  ai-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Compile AI modules
        run: python -m compileall -q backend/app/diagnosis backend/app/knowledge tools
      - name: AI contract coverage gate
        run: make ai-eval-gate
      - name: AI E1-E6 regression gate
        run: make ai-e1-e6-gate
      - name: Full backend regression
        shell: bash
        run: |
          set +e
          PYTHONPATH=backend:. pytest -q backend/tests --tb=line 2>&1 | tee /tmp/backend-pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          text = Path('/tmp/backend-pytest.log').read_text(encoding='utf-8', errors='replace')[-12000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Full backend regression failed::{text}')
          PY
          fi
          exit "$status"
