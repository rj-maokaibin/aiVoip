name: Feishu known-good media insertion probe
on:
  workflow_dispatch:
  pull_request:
    branches: [feat/pr7-diagnostic-contracts]
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, linux, x64, voip-controlled-linux]
    timeout-minutes: 15
    env:
      TARGET_DOCX_TOKEN: A4ZqdW9wsoWA17x5yjFcR3TUnyb
    steps:
      - name: Prepare environment
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git reset --hard 48a3855e31a7019640671e422956212b540dd08d
          git clean -ffdx
          python3 -m venv .venv-feishu-probe
          .venv-feishu-probe/bin/python -m pip install --upgrade pip >/dev/null
          .venv-feishu-probe/bin/python -m pip install feishukit==0.0.6 >/dev/null
          set -a
          . /home/github-runner/.config/voip-ai/.env
          set +a
          test -n "${FEISHU_APP_ID:-}"
          test -r "$FEISHU_APP_SECRET_FILE"
          echo "FEISHU_APP_ID=$FEISHU_APP_ID" >> "$GITHUB_ENV"
          echo "FEISHU_APP_SECRET_FILE=$FEISHU_APP_SECRET_FILE" >> "$GITHUB_ENV"
      - name: Inspect and execute reference file insertion
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          .venv-feishu-probe/bin/python - <<'PY'
          import inspect, os, wave, math, struct, tempfile
          from pathlib import Path
          from feishukit import FeishuDoc
          print('REFERENCE_INSERT_MEDIA_BLOCK_SOURCE_START')
          print(inspect.getsource(FeishuDoc.insert_media_block))
          print('REFERENCE_INSERT_MEDIA_BLOCK_SOURCE_END')
          secret=Path(os.environ['FEISHU_APP_SECRET_FILE']).read_text().strip()
          wav=Path(tempfile.gettempdir())/'feishu_reference_probe.wav'
          sr=8000
          samples=[int(10000*math.sin(2*math.pi*440*i/sr)) for i in range(sr)]
          with wave.open(str(wav),'wb') as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
              w.writeframes(b''.join(struct.pack('<h',x) for x in samples))
          print('LOCAL_WAV_BYTES',wav.stat().st_size)
          doc=FeishuDoc(app_id=os.environ['FEISHU_APP_ID'],app_secret=secret,doc_url=f"https://feishu.cn/docx/{os.environ['TARGET_DOCX_TOKEN']}")
          token=doc.insert_media_block(str(wav))
          print('REFERENCE_FILE_TOKEN_PRESENT',bool(token))
          blocks=doc.get_doc_blocks()
          files=[b for b in blocks if b.get('block_type')==23]
          print('FILE_BLOCK_COUNT',len(files))
          for b in files[-5:]:
              print('FILE_BLOCK',b.get('block_id'),b.get('file'))
          assert token
          assert any(((b.get('file') or {}).get('token')==token and (b.get('file') or {}).get('name')) for b in files), files[-5:]
          print('REFERENCE_FILE_INSERTION=PASS')
          PY
