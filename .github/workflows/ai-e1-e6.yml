name: PR7 Exact Base + Real Offline Golden 001 + Full Release Gate (Temporary)

on:
  pull_request:
    branches:
      - feat/pr7-diagnostic-contracts

concurrency:
  group: pr7-exact-base-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  exact-pr7-base-validation:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 45
    env:
      VOIP_OFFLINE_GOLDEN_001_PCAP: /tmp/tcpdump-2026-08-14.pcap
    steps:
      - name: Checkout exact PR7 base commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Verify exact PR7 base commit
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.base.sha }}"
          echo "PR7_BASE_SHA=$actual"
          test "$actual" = "$expected"

      - name: Stage and verify Real Offline Golden 001 fixture
        run: |
          set -euo pipefail
          expected_sha="b038aa7c9a0644581f2815f654fcdee4620860796382265b178823fccba2e3f0"
          source_fixture="$VOIP_OFFLINE_GOLDEN_001_PCAP"
          fixture="$source_fixture"
          test -f "$source_fixture" || { echo "OFFLINE_GOLDEN_FIXTURE_NOT_FOUND"; exit 20; }
          if [ ! -r "$source_fixture" ]; then
            staged="$RUNNER_TEMP/offline-golden-001.pcap"
            rm -f "$staged"
            image="postgres:16"
            docker image inspect "$image" >/dev/null 2>&1 || docker pull "$image"
            docker run --rm \
              -v /tmp:/source:ro \
              -v "$RUNNER_TEMP":/output \
              --entrypoint sh "$image" \
              -c "cp '/source/tcpdump-2026-08-14.pcap' '/output/offline-golden-001.pcap' && chmod 0644 '/output/offline-golden-001.pcap'"
            fixture="$staged"
          fi
          actual_sha="$(sha256sum "$fixture" | awk '{print $1}')"
          echo "Fixture SHA256: $actual_sha"
          test "$actual_sha" = "$expected_sha" || { echo "OFFLINE_GOLDEN_FIXTURE_SHA_MISMATCH"; exit 21; }
          echo "VOIP_OFFLINE_GOLDEN_001_PCAP=$fixture" >> "$GITHUB_ENV"

      - name: Prepare user-space tshark
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/tshark-root"
          debs="$RUNNER_TEMP/tshark-debs"
          rm -rf "$root" "$debs"
          mkdir -p "$root" "$debs"
          mapfile -t packages < <(
            apt-cache depends --recurse \
              --no-recommends --no-suggests --no-conflicts --no-breaks \
              --no-replaces --no-enhances tshark \
            | awk '/^[^ <][^:]*$/ {print $1}' | sort -u
          )
          missing=()
          for pkg in "${packages[@]}"; do
            if ! dpkg-query -W -f='${Status}' "$pkg" 2>/dev/null | grep -q 'install ok installed'; then
              missing+=("$pkg")
            fi
          done
          cd "$debs"
          if [ "${#missing[@]}" -gt 0 ]; then apt-get download "${missing[@]}"; fi
          shopt -s nullglob
          for deb in ./*.deb; do dpkg-deb -x "$deb" "$root"; done
          wrapper="$RUNNER_TEMP/tshark-userspace"
          cat > "$wrapper" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          export LD_LIBRARY_PATH="$root/usr/lib/x86_64-linux-gnu:$root/lib/x86_64-linux-gnu:\${LD_LIBRARY_PATH:-}"
          export WIRESHARK_DATA_DIR="$root/usr/share/wireshark"
          exec "$root/usr/bin/tshark" "\$@"
          EOF
          chmod +x "$wrapper"
          "$wrapper" -v | head -n 2
          echo "TSHARK_BINARY=$wrapper" >> "$GITHUB_ENV"

      - name: Prepare isolated Python environment for Real Golden
        run: |
          set -euo pipefail
          python3 -m venv .venv-offline-golden
          .venv-offline-golden/bin/python -m pip install --upgrade pip
          .venv-offline-golden/bin/python -m pip install -r backend/requirements.txt

      - name: Run RTP and subject-call targeted regressions
        run: |
          set -euo pipefail
          PYTHONPATH=backend .venv-offline-golden/bin/python -m pytest -q \
            backend/tests/test_rtp_packet_count_semantics_v1.py \
            backend/tests/test_packet_nested_sdp_ek_regression_v1.py \
            backend/tests/test_dtmf_subject_call_correlation_v1.py \
            backend/tests/test_offline_subject_call_selection_v1.py

      - name: Run complete Real Offline Golden 001
        run: |
          set -euo pipefail
          .venv-offline-golden/bin/python tools/offline_analysis_golden_replay.py \
            --pcap "$VOIP_OFFLINE_GOLDEN_001_PCAP" \
            --tshark "$TSHARK_BINARY" \
            --require-fixture \
            --result validation/offline_analysis_golden_001.json \
            --artifacts validation/offline_analysis_golden_001_artifacts

      - name: Run full VOIP AI software release gate on exact PR7 base
        run: |
          set -euo pipefail
          bash tools/voip_ai_release_gate.sh

      - name: Upload exact-base validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voip-pr7-exact-base-validation
          path: validation/**
          if-no-files-found: warn
          retention-days: 14
