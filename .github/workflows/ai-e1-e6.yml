name: PRD SPEC V1 Alignment Software Gate

on:
  pull_request:
    branches:
      - feat/prd-spec-v1-alignment

permissions:
  contents: read

jobs:
  prd-spec-v1-alignment:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 30
    steps:
      - name: Checkout exact product base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Verify controlled Linux and exact product SHA
        run: |
          uname -a
          python3 --version
          docker --version
          node --version
          echo "expected=${{ github.event.pull_request.base.sha }}"
          echo "actual=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"
      - name: Run VOIP AI software release gate
        run: bash tools/voip_ai_release_gate.sh
      - name: Run frozen PRD SPEC alignment tests explicitly
        run: |
          python3 -m pytest -q \
            backend/tests/test_prd_spec_v1_alignment.py \
            backend/tests/test_feishu_living_document_v1.py
      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prd-spec-v1-alignment-validation
          path: validation/**
          if-no-files-found: warn
          retention-days: 14
