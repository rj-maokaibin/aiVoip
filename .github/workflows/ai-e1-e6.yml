name: AI E1-E6 + M7 + Evidence Report Gate

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "tools/**"
      - "golden_cases/**"
      - "docs/02_Core_Documents/VOIP_AI_M7_*.md"
      - "docs/02_Core_Documents/Preliminary_Evidence_Report_V1.0/**"
      - "docs/03_Implementation_Trace/**"
      - "knowledge/seed/**"
      - "Makefile"
      - ".github/workflows/ai-e1-e6.yml"
  push:
    branches:
      - "agent/**"
    paths:
      - "backend/**"
      - "frontend/**"
      - "tools/**"
      - "golden_cases/**"
      - "docs/02_Core_Documents/VOIP_AI_M7_*.md"
      - "docs/02_Core_Documents/Preliminary_Evidence_Report_V1.0/**"
      - "docs/03_Implementation_Trace/**"
      - "knowledge/seed/**"
      - "Makefile"
      - ".github/workflows/ai-e1-e6.yml"

permissions:
  contents: read

jobs:
  ai-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: voip
          POSTGRES_USER: voip
          POSTGRES_PASSWORD: voip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voip -d voip"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend and media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Compile backend and release tools
        run: python -m compileall -q backend/app backend/tests tools
      - name: AI contract coverage gate
        run: make ai-eval-gate
      - name: AI E1-E6 regression gate
        run: make ai-e1-e6-gate
      - name: M7 acceptance contract gate
        run: PYTHONPATH=backend:. pytest -q backend/tests/test_m7_acceptance_gate.py
      - name: Prepare regression database through latest migration
        env:
          DATABASE_URL: postgresql+psycopg://voip:voip@localhost:5432/voip
        run: cd backend && alembic upgrade head
      - name: Full backend regression
        shell: bash
        env:
          DATABASE_URL: postgresql+psycopg://voip:voip@localhost:5432/voip
          REDIS_URL: redis://localhost:6379/0
          REPRODUCTION_PLATFORM_MODE: real
        run: |
          set +e
          PYTHONPATH=backend:. pytest -q backend/tests --tb=line 2>&1 | tee /tmp/backend-pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          text = Path('/tmp/backend-pytest.log').read_text(encoding='utf-8', errors='replace')[-12000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Full backend regression failed::{text}')
          PY
          fi
          exit "$status"
      - name: Preliminary Evidence Report software release gate
        env:
          DATABASE_URL: postgresql+psycopg://voip:voip@localhost:5432/voip
          REDIS_URL: redis://localhost:6379/0
        run: PYTHONPATH=backend:. python tools/evidence_report_release_gate.py --skip-tests
      - name: Frontend production build gate
        run: |
          cd frontend
          npm ci
          npm run build
          test -s dist/index.html
          test -s dist/evidence-report.html
