name: Real Offline Golden 001 Diagnostics (Temporary)

# Temporary validation branch only. Product branches remain workflow_dispatch-only.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - feat/pr7-diagnostic-contracts

concurrency:
  group: pr7-controlled-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  offline-golden-001:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 30
    env:
      VOIP_OFFLINE_GOLDEN_001_PCAP: /tmp/tcpdump-2026-08-14.pcap
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Stage and verify requested external fixture
        run: |
          set -euo pipefail
          expected_sha="b038aa7c9a0644581f2815f654fcdee4620860796382265b178823fccba2e3f0"
          source_fixture="$VOIP_OFFLINE_GOLDEN_001_PCAP"
          fixture="$source_fixture"
          echo "Runner: $RUNNER_NAME"
          echo "Source fixture: $source_fixture"
          test -f "$source_fixture" || { echo "OFFLINE_GOLDEN_FIXTURE_NOT_FOUND"; exit 20; }
          ls -lh "$source_fixture"
          if [ ! -r "$source_fixture" ]; then
            staged="$RUNNER_TEMP/offline-golden-001.pcap"
            rm -f "$staged"
            image="postgres:16"
            docker image inspect "$image" >/dev/null 2>&1 || docker pull "$image"
            docker run --rm \
              -v /tmp:/source:ro \
              -v "$RUNNER_TEMP":/output \
              --entrypoint sh "$image" \
              -c "cp '/source/tcpdump-2026-08-14.pcap' '/output/offline-golden-001.pcap' && chmod 0644 '/output/offline-golden-001.pcap'"
            fixture="$staged"
          fi
          actual_sha="$(sha256sum "$fixture" | awk '{print $1}')"
          echo "Fixture used: $fixture"
          echo "Fixture SHA256: $actual_sha"
          test "$actual_sha" = "$expected_sha" || { echo "OFFLINE_GOLDEN_FIXTURE_SHA_MISMATCH"; exit 21; }
          echo "VOIP_OFFLINE_GOLDEN_001_PCAP=$fixture" >> "$GITHUB_ENV"

      - name: Prepare user-space tshark
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/tshark-root"
          debs="$RUNNER_TEMP/tshark-debs"
          rm -rf "$root" "$debs"
          mkdir -p "$root" "$debs"
          mapfile -t packages < <(
            apt-cache depends --recurse \
              --no-recommends --no-suggests --no-conflicts --no-breaks \
              --no-replaces --no-enhances tshark \
            | awk '/^[^ <][^:]*$/ {print $1}' | sort -u
          )
          missing=()
          for pkg in "${packages[@]}"; do
            if ! dpkg-query -W -f='${Status}' "$pkg" 2>/dev/null | grep -q 'install ok installed'; then
              missing+=("$pkg")
            fi
          done
          cd "$debs"
          apt-get download "${missing[@]}"
          for deb in ./*.deb; do dpkg-deb -x "$deb" "$root"; done
          wrapper="$RUNNER_TEMP/tshark-userspace"
          cat > "$wrapper" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          export LD_LIBRARY_PATH="$root/usr/lib/x86_64-linux-gnu:$root/lib/x86_64-linux-gnu:\${LD_LIBRARY_PATH:-}"
          export WIRESHARK_DATA_DIR="$root/usr/share/wireshark"
          exec "$root/usr/bin/tshark" "\$@"
          EOF
          chmod +x "$wrapper"
          "$wrapper" -v | head -n 2
          echo "TSHARK_BINARY=$wrapper" >> "$GITHUB_ENV"

      - name: Prepare isolated Python environment
        run: |
          set -euo pipefail
          python3 -m venv .venv-offline-golden
          .venv-offline-golden/bin/python -m pip install --upgrade pip
          .venv-offline-golden/bin/python -m pip install -r backend/requirements.txt

      - name: Export production replay bundle without Golden truth
        run: |
          set -euo pipefail
          mkdir -p validation/offline_analysis_golden_001_debug_artifacts
          PYTHONPATH=backend .venv-offline-golden/bin/python - <<'PY'
          import json, os
          from pathlib import Path
          from app.golden.offline_analysis_e2e import build_offline_analysis_bundle

          bundle = build_offline_analysis_bundle(
              pcap_path=Path(os.environ["VOIP_OFFLINE_GOLDEN_001_PCAP"]),
              pcm_profile_path=Path("profiles/pcm/ruijie_aim_diag_v1.yaml"),
              output_dir=Path("validation/offline_analysis_golden_001_debug_artifacts"),
              tshark_binary=os.environ["TSHARK_BINARY"],
          )
          out = Path("validation/offline_analysis_bundle_debug.json")
          out.write_text(json.dumps(bundle, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          packet = bundle.get("packet") or {}
          media = bundle.get("media") or {}
          pcm = bundle.get("pcm") or {}
          print(json.dumps({
              "source": bundle.get("source"),
              "analysis_context": bundle.get("analysis_context"),
              "display_call": bundle.get("display_call"),
              "calls": packet.get("calls"),
              "rtp_stream_count": len(packet.get("rtp_streams") or []),
              "pcm_streams": [{
                  "tap": x.get("tap"),
                  "packet_count": x.get("packet_count"),
                  "session_count": len(x.get("sessions") or []),
                  "dtmf_events": [e for s in (x.get("sessions") or []) for e in (s.get("events") or []) if str(e.get("type","")).startswith("DTMF")],
              } for x in (pcm.get("streams") or [])],
              "media_cross_layer_events": media.get("cross_layer_events"),
              "candidate_decisions": media.get("candidate_decisions"),
              "report_finding_types": [f.get("type") for f in ((bundle.get("report") or {}).get("findings") or [])],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Run real Offline Golden 001 replay
        continue-on-error: true
        run: |
          set -euo pipefail
          .venv-offline-golden/bin/python tools/offline_analysis_golden_replay.py \
            --pcap "$VOIP_OFFLINE_GOLDEN_001_PCAP" \
            --tshark "$TSHARK_BINARY" \
            --require-fixture \
            --result validation/offline_analysis_golden_001.json \
            --artifacts validation/offline_analysis_golden_001_artifacts

      - name: Upload Offline Golden diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voip-offline-golden-001-diagnostics
          path: |
            validation/offline_analysis_bundle_debug.json
            validation/offline_analysis_golden_001.json
            validation/offline_analysis_golden_001_debug_artifacts/**
            validation/offline_analysis_golden_001_artifacts/**
          if-no-files-found: error
          retention-days: 14
