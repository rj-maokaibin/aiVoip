name: Real Offline Golden 001 (Temporary)

# Temporary validation branch only. Product branches remain workflow_dispatch-only.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - feat/pr7-diagnostic-contracts

concurrency:
  group: pr7-controlled-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  offline-golden-001:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 30
    env:
      VOIP_OFFLINE_GOLDEN_001_PCAP: /data/voip-golden/tcpdump-2026-08-14(2).pcap
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Discover and verify external fixture
        run: |
          set -euo pipefail
          expected_sha="b038aa7c9a0644581f2815f654fcdee4620860796382265b178823fccba2e3f0"
          candidate=""
          if [ -f "$VOIP_OFFLINE_GOLDEN_001_PCAP" ]; then
            candidate="$VOIP_OFFLINE_GOLDEN_001_PCAP"
          else
            candidate="$(find /data /home /srv /opt /tmp -type f -name 'tcpdump-2026-08-14(2).pcap' -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$candidate" ]; then
            echo "No same-name fixture found; scanning accessible PCAP candidates by SHA256..."
            while IFS= read -r file; do
              [ -f "$file" ] || continue
              actual="$(sha256sum "$file" 2>/dev/null | awk '{print $1}' || true)"
              if [ "$actual" = "$expected_sha" ]; then
                candidate="$file"
                break
              fi
            done < <(find /data /home /srv /opt /tmp -type f \( -name '*.pcap' -o -name '*.cap' \) -print 2>/dev/null || true)
          fi
          if [ -z "$candidate" ]; then
            echo "OFFLINE_GOLDEN_FIXTURE_NOT_FOUND"
            exit 20
          fi
          actual_sha="$(sha256sum "$candidate" | awk '{print $1}')"
          echo "Fixture resolved: $candidate"
          echo "Fixture SHA256: $actual_sha"
          if [ "$actual_sha" != "$expected_sha" ]; then
            echo "OFFLINE_GOLDEN_FIXTURE_SHA_MISMATCH"
            exit 21
          fi
          echo "VOIP_OFFLINE_GOLDEN_001_PCAP=$candidate" >> "$GITHUB_ENV"
      - name: Verify tshark
        run: |
          set -euo pipefail
          command -v tshark
          tshark --version | head -n 2
      - name: Prepare isolated Python environment
        run: |
          set -euo pipefail
          python3 -m venv .venv-offline-golden
          .venv-offline-golden/bin/python -m pip install --upgrade pip
          .venv-offline-golden/bin/python -m pip install -r backend/requirements.txt
      - name: Run real Offline Golden 001 replay
        run: |
          set -euo pipefail
          .venv-offline-golden/bin/python tools/offline_analysis_golden_replay.py \
            --require-fixture \
            --result validation/offline_analysis_golden_001.json \
            --artifacts validation/offline_analysis_golden_001_artifacts
      - name: Re-run synthetic Evidence Report Golden gate
        run: .venv-offline-golden/bin/python tools/evidence_report_golden_gate.py
      - name: Upload Offline Golden validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voip-offline-golden-001-validation
          path: |
            validation/offline_analysis_golden_001.json
            validation/offline_analysis_golden_001_artifacts/**
            validation/evidence_report_golden_gate.json
          if-no-files-found: warn
          retention-days: 14
