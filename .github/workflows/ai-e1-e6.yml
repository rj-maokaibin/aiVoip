name: Real Offline Golden 001 EK Probe (Temporary)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feat/pr7-diagnostic-contracts

concurrency:
  group: pr7-ek-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ek-probe:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 20
    env:
      VOIP_OFFLINE_GOLDEN_001_PCAP: /tmp/tcpdump-2026-08-14.pcap
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Stage and verify requested external fixture
        run: |
          set -euo pipefail
          expected_sha="b038aa7c9a0644581f2815f654fcdee4620860796382265b178823fccba2e3f0"
          source_fixture="$VOIP_OFFLINE_GOLDEN_001_PCAP"
          fixture="$source_fixture"
          test -f "$source_fixture" || { echo "OFFLINE_GOLDEN_FIXTURE_NOT_FOUND"; exit 20; }
          if [ ! -r "$source_fixture" ]; then
            staged="$RUNNER_TEMP/offline-golden-001.pcap"
            rm -f "$staged"
            image="postgres:16"
            docker image inspect "$image" >/dev/null 2>&1 || docker pull "$image"
            docker run --rm \
              -v /tmp:/source:ro \
              -v "$RUNNER_TEMP":/output \
              --entrypoint sh "$image" \
              -c "cp '/source/tcpdump-2026-08-14.pcap' '/output/offline-golden-001.pcap' && chmod 0644 '/output/offline-golden-001.pcap'"
            fixture="$staged"
          fi
          actual_sha="$(sha256sum "$fixture" | awk '{print $1}')"
          echo "Fixture SHA256: $actual_sha"
          test "$actual_sha" = "$expected_sha" || { echo "OFFLINE_GOLDEN_FIXTURE_SHA_MISMATCH"; exit 21; }
          echo "VOIP_OFFLINE_GOLDEN_001_PCAP=$fixture" >> "$GITHUB_ENV"

      - name: Prepare user-space tshark
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/tshark-root"
          debs="$RUNNER_TEMP/tshark-debs"
          rm -rf "$root" "$debs"
          mkdir -p "$root" "$debs"
          mapfile -t packages < <(
            apt-cache depends --recurse \
              --no-recommends --no-suggests --no-conflicts --no-breaks \
              --no-replaces --no-enhances tshark \
            | awk '/^[^ <][^:]*$/ {print $1}' | sort -u
          )
          missing=()
          for pkg in "${packages[@]}"; do
            if ! dpkg-query -W -f='${Status}' "$pkg" 2>/dev/null | grep -q 'install ok installed'; then
              missing+=("$pkg")
            fi
          done
          cd "$debs"
          if [ "${#missing[@]}" -gt 0 ]; then apt-get download "${missing[@]}"; fi
          shopt -s nullglob
          for deb in ./*.deb; do dpkg-deb -x "$deb" "$root"; done
          wrapper="$RUNNER_TEMP/tshark-userspace"
          cat > "$wrapper" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          export LD_LIBRARY_PATH="$root/usr/lib/x86_64-linux-gnu:$root/lib/x86_64-linux-gnu:\${LD_LIBRARY_PATH:-}"
          export WIRESHARK_DATA_DIR="$root/usr/share/wireshark"
          exec "$root/usr/bin/tshark" "\$@"
          EOF
          chmod +x "$wrapper"
          "$wrapper" -v | head -n 2
          echo "TSHARK_BINARY=$wrapper" >> "$GITHUB_ENV"

      - name: Capture real SIP SDP EK records
        run: |
          set -euo pipefail
          mkdir -p validation
          "$TSHARK_BINARY" -n \
            -r "$VOIP_OFFLINE_GOLDEN_001_PCAP" \
            -Y 'frame.number == 2786 || frame.number == 2808 || frame.number == 3387' \
            -T ek > validation/tshark_sdp_probe_ek.jsonl

          PYTHONPATH=backend python3 - <<'PY'
          import json
          from pathlib import Path
          from app.analyzers.packet.normalize import FieldIndex, normalize_ek_record

          path = Path('validation/tshark_sdp_probe_ek.jsonl')
          output = []
          for raw_line in path.read_text(encoding='utf-8').splitlines():
              if not raw_line.strip():
                  continue
              record = json.loads(raw_line)
              layers = record.get('layers') or record.get('_source', {}).get('layers')
              if not isinstance(layers, dict):
                  continue
              idx = FieldIndex(layers)
              normalized = normalize_ek_record(record)
              output.append({
                  'top_level_layer_keys': list(layers.keys()),
                  'has_sdp_layer': idx.has_layer('sdp'),
                  'has_sip_layer': idx.has_layer('sip'),
                  'normalized_frame': getattr(normalized, 'frame_number', None),
                  'normalized_sip_call_id': getattr(getattr(normalized, 'sip', None), 'call_id', None),
                  'normalized_sdp': None if normalized is None or normalized.sdp is None else {
                      'raw': normalized.sdp.raw,
                      'connection_address': normalized.sdp.connection_address,
                      'media_port': normalized.sdp.media_port,
                      'media_protocol': normalized.sdp.media_protocol,
                      'media_payload_types': normalized.sdp.media_payload_types,
                      'attributes': normalized.sdp.attributes,
                  },
              })
          Path('validation/tshark_sdp_normalize_probe.json').write_text(
              json.dumps(output, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(output, ensure_ascii=False, indent=2))
          PY

      - name: Upload EK probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voip-offline-golden-001-ek-probe
          path: |
            validation/tshark_sdp_probe_ek.jsonl
            validation/tshark_sdp_normalize_probe.json
          if-no-files-found: error
          retention-days: 7
