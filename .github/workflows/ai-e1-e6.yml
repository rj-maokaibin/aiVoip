name: Real Offline Golden 001 (Temporary)

# Temporary validation branch only. Product branches remain workflow_dispatch-only.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - feat/pr7-diagnostic-contracts

concurrency:
  group: pr7-controlled-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  offline-golden-001:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 30
    env:
      VOIP_OFFLINE_GOLDEN_001_PCAP: /tmp/tcpdump-2026-08-14.pcap
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Stage and verify requested external fixture
        run: |
          set -euo pipefail
          expected_sha="b038aa7c9a0644581f2815f654fcdee4620860796382265b178823fccba2e3f0"
          source_fixture="$VOIP_OFFLINE_GOLDEN_001_PCAP"
          fixture="$source_fixture"
          echo "Runner: $RUNNER_NAME"
          echo "Source fixture: $source_fixture"
          if [ ! -f "$source_fixture" ]; then
            echo "OFFLINE_GOLDEN_FIXTURE_NOT_FOUND"
            exit 20
          fi
          ls -lh "$source_fixture"
          if [ ! -r "$source_fixture" ]; then
            staged="$RUNNER_TEMP/offline-golden-001.pcap"
            echo "Source is not readable by $(id -un); staging a private runner copy through Docker without changing source permissions."
            rm -f "$staged"
            image="postgres:16"
            docker image inspect "$image" >/dev/null 2>&1 || docker pull "$image"
            docker run --rm \
              -v /tmp:/source:ro \
              -v "$RUNNER_TEMP":/output \
              --entrypoint sh "$image" \
              -c "cp '/source/tcpdump-2026-08-14.pcap' '/output/offline-golden-001.pcap' && chmod 0644 '/output/offline-golden-001.pcap'"
            test -r "$staged"
            fixture="$staged"
          fi
          actual_sha="$(sha256sum "$fixture" | awk '{print $1}')"
          echo "Fixture used: $fixture"
          echo "Fixture SHA256: $actual_sha"
          echo "Expected SHA256: $expected_sha"
          if [ "$actual_sha" != "$expected_sha" ]; then
            echo "OFFLINE_GOLDEN_FIXTURE_SHA_MISMATCH"
            exit 21
          fi
          echo "VOIP_OFFLINE_GOLDEN_001_PCAP=$fixture" >> "$GITHUB_ENV"
      - name: Prepare user-space tshark
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/tshark-root"
          debs="$RUNNER_TEMP/tshark-debs"
          rm -rf "$root" "$debs"
          mkdir -p "$root" "$debs"

          echo "APT candidate:"
          apt-cache policy tshark | sed -n '1,8p'

          mapfile -t packages < <(
            apt-cache depends --recurse \
              --no-recommends --no-suggests --no-conflicts --no-breaks \
              --no-replaces --no-enhances tshark \
            | awk '/^[^ <][^:]*$/ {print $1}' \
            | sort -u
          )
          missing=()
          for pkg in "${packages[@]}"; do
            if ! dpkg-query -W -f='${Status}' "$pkg" 2>/dev/null | grep -q 'install ok installed'; then
              missing+=("$pkg")
            fi
          done
          echo "Missing package count: ${#missing[@]}"
          printf '%s\n' "${missing[@]}"
          if [ ${#missing[@]} -eq 0 ]; then
            echo "Dependency graph unexpectedly reports no missing tshark package"
            exit 23
          fi

          cd "$debs"
          apt-get download "${missing[@]}"
          for deb in ./*.deb; do
            dpkg-deb -x "$deb" "$root"
          done

          wrapper="$RUNNER_TEMP/tshark-userspace"
          cat > "$wrapper" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          export LD_LIBRARY_PATH="$root/usr/lib/x86_64-linux-gnu:$root/lib/x86_64-linux-gnu:\${LD_LIBRARY_PATH:-}"
          export WIRESHARK_DATA_DIR="$root/usr/share/wireshark"
          exec "$root/usr/bin/tshark" "\$@"
          EOF
          chmod +x "$wrapper"
          "$wrapper" -v | head -n 2
          echo "TSHARK_BINARY=$wrapper" >> "$GITHUB_ENV"
      - name: Prepare isolated Python environment
        run: |
          set -euo pipefail
          python3 -m venv .venv-offline-golden
          .venv-offline-golden/bin/python -m pip install --upgrade pip
          .venv-offline-golden/bin/python -m pip install -r backend/requirements.txt
      - name: Run real Offline Golden 001 replay
        run: |
          set -euo pipefail
          .venv-offline-golden/bin/python tools/offline_analysis_golden_replay.py \
            --pcap "$VOIP_OFFLINE_GOLDEN_001_PCAP" \
            --tshark "$TSHARK_BINARY" \
            --require-fixture \
            --result validation/offline_analysis_golden_001.json \
            --artifacts validation/offline_analysis_golden_001_artifacts
      - name: Re-run synthetic Evidence Report Golden gate
        run: .venv-offline-golden/bin/python tools/evidence_report_golden_gate.py
      - name: Upload Offline Golden validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voip-offline-golden-001-validation
          path: |
            validation/offline_analysis_golden_001.json
            validation/offline_analysis_golden_001_artifacts/**
            validation/evidence_report_golden_gate.json
          if-no-files-found: warn
          retention-days: 14
