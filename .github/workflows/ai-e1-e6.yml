name: Persist clean Feishu report result
on:
  workflow_dispatch:
  pull_request:
    branches: [feat/pr7-diagnostic-contracts]
permissions:
  contents: read
jobs:
  persist:
    runs-on: [self-hosted, linux, x64, voip-controlled-linux]
    timeout-minutes: 5
    steps:
      - name: Verify previous clean report result remains on controlled runner
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test -s validation/offline_e2e_feishu_001/clean_final_report.json
          test -s validation/offline_e2e_feishu_001/clean_report_golden.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('validation/offline_e2e_feishu_001/clean_final_report.json').read_text())
          golden=json.loads(Path('validation/offline_e2e_feishu_001/clean_report_golden.json').read_text())
          assert result['status']=='PASS'
          assert len(result['media'])==5
          assert golden['status']=='PASS'
          print(json.dumps(result,ensure_ascii=False))
          print('GOLDEN_STATUS',golden['status'],golden.get('checks_passed'),golden.get('checks_total'))
          PY
      - name: Upload clean report validation record
        uses: actions/upload-artifact@v4
        with:
          name: clean-feishu-report-validation
          path: |
            validation/offline_e2e_feishu_001/clean_final_report.json
            validation/offline_e2e_feishu_001/clean_report_golden.json
          retention-days: 30
