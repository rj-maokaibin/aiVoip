name: AI E1-E6 + M7 + Evidence Report Gate

# GitHub-hosted CI is intentionally opt-in. Software release acceptance is
# performed with tools/voip_ai_release_gate.sh on a controlled Linux host.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run VOIP AI software release gate
        run: bash tools/voip_ai_release_gate.sh
