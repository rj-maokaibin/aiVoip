name: PRD SPEC V1 Full Software Acceptance

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'tools/**'
      - 'golden_cases/**'
      - 'profiles/**'
      - 'deploy/**'
      - 'docs/02_Core_Documents/Preliminary_Evidence_Report_V1.0/**'
      - '.github/workflows/source-manifest-gate.yml'
      - '.github/workflows/preliminary-evidence-v1.yml'
      - '.github/workflows/prd-spec-v1-release.yml'
      - '.github/workflows/production-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: prd-spec-v1-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resolve-shared-source:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    outputs:
      run_id: ${{ steps.resolve.outputs.run_id }}
    steps:
      - name: Wait for Source Manifest Gate exact-SHA bundle
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = process.env.EXPECTED_SHA;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            for (let i = 0; i < 120; i++) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'source-manifest-gate.yml',
                event: 'pull_request',
                head_sha: sha,
                per_page: 20,
              });
              const runs = response.data.workflow_runs
                .filter((run) => run.head_sha === sha)
                .sort((a, b) => b.id - a.id);
              if (runs.length > 0) {
                const run = runs[0];
                core.info(`Source Manifest run ${run.id}: ${run.status}/${run.conclusion || 'pending'}`);
                if (run.status === 'completed') {
                  if (run.conclusion !== 'success') {
                    core.setFailed(`Source Manifest Gate failed for ${sha}: ${run.conclusion}`);
                    return;
                  }
                  core.setOutput('run_id', String(run.id));
                  return;
                }
              }
              await sleep(5000);
            }
            core.setFailed(`Timed out waiting for Source Manifest Gate for ${sha}`);

  manual-source-bundle:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact source on GitHub-hosted transport
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0

      - name: Build immutable Git bundle for manual acceptance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 tools/source_manifest_gate.py --write "$RUNNER_TEMP/source_manifest_expected.json"
          python3 tools/source_manifest_gate.py --expected "$RUNNER_TEMP/source_manifest_expected.json"
          test -z "$(git status --porcelain --untracked-files=no)"
          git branch -f bundle-head "$EXPECTED_SHA"
          git bundle create "$RUNNER_TEMP/source.bundle" refs/heads/bundle-head
          printf '%s\n' "$EXPECTED_SHA" > "$RUNNER_TEMP/source.sha"
          git bundle verify "$RUNNER_TEMP/source.bundle"

      - name: Upload immutable source bundle
        uses: actions/upload-artifact@v4
        with:
          name: exact-source-${{ env.EXPECTED_SHA }}
          path: |
            ${{ runner.temp }}/source.bundle
            ${{ runner.temp }}/source.sha
            ${{ runner.temp }}/source_manifest_expected.json
          if-no-files-found: error
          retention-days: 1

  full-software-acceptance:
    needs:
      - resolve-shared-source
      - manual-source-bundle
    if: always() && (needs.resolve-shared-source.result == 'success' || needs.manual-source-bundle.result == 'success')
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 60
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OFFLINE_GOLDEN_PCAP: /tmp/tcpdump-2026-08-14.pcap
      OFFLINE_GOLDEN_SHA256: b038aa7c9a0644581f2815f654fcdee4620860796382265b178823fccba2e3f0
      PRELIMINARY_EVIDENCE_V1_VENV: /tmp/voip-ai-acceptance-runtime-${{ github.run_id }}-${{ github.run_attempt }}
      VOIP_AI_GATE_VENV: /tmp/voip-ai-acceptance-runtime-${{ github.run_id }}-${{ github.run_attempt }}
      CICD_PERFORMANCE_V3_EVIDENCE: validation/cicd_performance_v3.json
    steps:
      - name: Reset self-hosted workspace
        shell: bash
        run: |
          set -euo pipefail
          docker info >/dev/null
          docker image inspect python:3.12-slim >/dev/null
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" python:3.12-slim \
            sh -lc 'find /workspace -mindepth 1 -maxdepth 1 -exec rm -rf {} +'

      - name: Download shared immutable source bundle
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: exact-source-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/exact-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-shared-source.outputs.run_id }}

      - name: Download manual immutable source bundle
        if: github.event_name != 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: exact-source-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/exact-source

      - name: Materialize exact source and verify derived manifest
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/exact-source/source.bundle"
          sha_file="$RUNNER_TEMP/exact-source/source.sha"
          manifest="$RUNNER_TEMP/exact-source/source_manifest_expected.json"
          test -s "$bundle"
          test -s "$manifest"
          test "$(cat "$sha_file")" = "$EXPECTED_SHA"
          git clone -q -b bundle-head "$bundle" "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" checkout -q --detach "$EXPECTED_SHA"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git -C "$GITHUB_WORKSPACE" status --porcelain --untracked-files=no)"
          mkdir -p "$GITHUB_WORKSPACE/validation"
          cp "$manifest" "$GITHUB_WORKSPACE/validation/source_manifest_expected.json"
          cd "$GITHUB_WORKSPACE"
          python3 tools/source_manifest_gate.py --expected validation/source_manifest_expected.json
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "EXACT_SOURCE_MATERIALIZATION=PASS revision=$EXPECTED_SHA"
          echo "SOURCE_MANIFEST_ACCEPTANCE_BINDING=PASS mode=DERIVED_ARTIFACT"

      - name: Environment and prepared-PCAP identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'ACCEPTANCE_HEAD=%s\n' "$(git rev-parse HEAD)"
          printf 'PYTHON=%s\n' "$(python3 --version 2>&1)"
          printf 'NODE=%s\n' "$(node --version 2>&1)"
          printf 'NPM=%s\n' "$(npm --version 2>&1)"
          docker info >/dev/null

          fixture="$OFFLINE_GOLDEN_PCAP"
          if [ ! -r "$fixture" ]; then
            staged="$RUNNER_TEMP/offline-e2e-prepared.pcap"
            rm -f "$staged"
            docker run --rm \
              -v /tmp:/source:ro \
              -v "$RUNNER_TEMP":/output \
              --entrypoint sh postgres:16 \
              -c "cp /source/tcpdump-2026-08-14.pcap /output/offline-e2e-prepared.pcap && chmod 0644 /output/offline-e2e-prepared.pcap"
            fixture="$staged"
          fi
          test -r "$fixture"
          test "$(sha256sum "$fixture" | awk '{print $1}')" = "$OFFLINE_GOLDEN_SHA256"
          echo "OFFLINE_GOLDEN_PCAP=$fixture" >> "$GITHUB_ENV"
          printf 'PREPARED_PCAP=%s\n' "$fixture"
          printf 'PREPARED_PCAP_SHA256=%s\n' "$OFFLINE_GOLDEN_SHA256"

      - name: Prepare userspace TShark 4.2.2-compatible runtime
        run: |
          set -euo pipefail
          if command -v tshark >/dev/null 2>&1; then
            tshark_bin="$(command -v tshark)"
          else
            root="$RUNNER_TEMP/tshark-root"
            debs="$RUNNER_TEMP/tshark-debs"
            rm -rf "$root" "$debs"
            mkdir -p "$root" "$debs"
            cd "$debs"
            mapfile -t pkgs < <(apt-cache depends --recurse --no-recommends --no-suggests --no-conflicts --no-breaks --no-replaces --no-enhances tshark | awk '/^[^ <][^:]*$/ {print $1}' | sort -u)
            miss=()
            for p in "${pkgs[@]}"; do
              dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -q 'install ok installed' || miss+=("$p")
            done
            [ ${#miss[@]} -eq 0 ] || apt-get download "${miss[@]}"
            shopt -s nullglob
            for d in ./*.deb; do dpkg-deb -x "$d" "$root"; done
            tshark_bin="$RUNNER_TEMP/tshark-userspace"
            printf '#!/bin/bash\nexport LD_LIBRARY_PATH="%s/usr/lib/x86_64-linux-gnu:%s/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"\nexport WIRESHARK_DATA_DIR="%s/usr/share/wireshark"\nexec "%s/usr/bin/tshark" "$@"\n' "$root" "$root" "$root" "$root" > "$tshark_bin"
            chmod +x "$tshark_bin"
          fi
          "$tshark_bin" -v | head -n1
          echo "TSHARK_BINARY=$tshark_bin" >> "$GITHUB_ENV"

      - name: Frozen PRD/SPEC contracts
        run: bash tools/preliminary_evidence_v1_gate.sh

      - name: Full VOIP AI software release gate
        run: bash tools/voip_ai_release_gate.sh

      - name: Prepared-PCAP Real Offline Golden 001
        run: |
          set -euo pipefail
          source "$VOIP_AI_GATE_VENV/bin/activate"
          rm -rf offline-golden-artifacts offline-golden-result.json
          TSHARK_BINARY="$TSHARK_BINARY" python tools/offline_analysis_golden_replay.py \
            --pcap "$OFFLINE_GOLDEN_PCAP" \
            --require-fixture \
            --artifacts offline-golden-artifacts \
            --result offline-golden-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('offline-golden-result.json').read_text(encoding='utf-8'))
          assert p['status'] == 'PASS', p
          assert p['passed'] is True, p
          assert p['checks_passed'] == 142, p
          assert p['checks_total'] == 142, p
          print('REAL_OFFLINE_GOLDEN_001=PASS 142/142')
          PY

      - name: Real Offline Golden 001 Human Evidence Gate
        run: |
          set -euo pipefail
          source "$VOIP_AI_GATE_VENV/bin/activate"
          rm -rf offline-golden-human-artifacts
          python tools/human_evidence_real_golden_gate.py \
            --artifacts offline-golden-artifacts \
            --output offline-golden-human-artifacts
          test -s offline-golden-human-artifacts/pcm_rx_periodic_spectrum_human_v2.png
          test -s offline-golden-human-artifacts/pcm_rx_periodic_spectrogram_human_v2.png
          test -s offline-golden-human-artifacts/pcm_rx_dtmf_first_digit_inspector_human_v2.png
          test -s offline-golden-human-artifacts/human-golden-result.json
          echo 'HUMAN_REAL_OFFLINE_GOLDEN_001=PASS'

      - name: Build machine-readable Full Acceptance evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$EXPECTED_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path
          revision = sys.argv[1]
          golden = json.loads(Path("offline-golden-result.json").read_text(encoding="utf-8"))
          human = json.loads(Path("offline-golden-human-artifacts/human-golden-result.json").read_text(encoding="utf-8"))
          perf = json.loads(Path("validation/cicd_performance_v3.json").read_text(encoding="utf-8"))
          evidence = {
              "schema_version": "full-software-acceptance-v2",
              "revision": revision,
              "passed": True,
              "frozen_contracts": {"passed": True},
              "full_release_gate": {"passed": True},
              "golden_001": {
                  "passed": golden.get("passed") is True,
                  "checks_passed": golden.get("checks_passed"),
                  "checks_total": golden.get("checks_total"),
              },
              "human_evidence": {
                  "passed": human.get("status") == "PASS",
                  "schema_version": human.get("schema_version"),
              },
              "performance_v3": {
                  "status": perf.get("status"),
                  "total_duration_ms": perf.get("total_duration_ms"),
              },
          }
          assert evidence["golden_001"] == {
              "passed": True,
              "checks_passed": 142,
              "checks_total": 142,
          }, evidence
          assert evidence["human_evidence"]["passed"] is True, evidence
          assert evidence["performance_v3"]["status"] == "PASS", evidence
          Path("full-acceptance-result.json").write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print("FULL_ACCEPTANCE_EVIDENCE=PASS")
          PY

      - name: Acceptance summary
        run: |
          set -euo pipefail
          printf 'PRD_SPEC_V1_FROZEN_CONTRACTS=PASS\n'
          printf 'VOIP_AI_SOFTWARE_RELEASE_GATE=PASS\n'
          printf 'REAL_OFFLINE_GOLDEN_001=PASS 142/142\n'
          printf 'HUMAN_REAL_OFFLINE_GOLDEN_001=PASS\n'
          printf 'CICD_PERFORMANCE_V3=PASS\n'
          printf 'ACCEPTANCE_COMMIT=%s\n' "$(git rev-parse HEAD)"

      - name: Upload Full Acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-acceptance-${{ env.EXPECTED_SHA }}
          path: |
            full-acceptance-result.json
            validation/cicd_performance_v3.json
            validation/source_manifest_expected.json
            offline-golden-result.json
            offline-golden-artifacts
            offline-golden-human-artifacts
          if-no-files-found: ignore
          retention-days: 1
