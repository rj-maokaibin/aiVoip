name: Apply Runtime Revision Patch

on:
  push:
    branches:
      - fix/runtime-build-revision-injection

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patch and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/runtime-revision.patch
          git apply .github/runtime-revision.patch
          rm -f .github/runtime-revision.patch
          python3 tools/source_manifest_gate.py --update
          python3 tools/source_manifest_gate.py
          bash -n deploy/voip-ai
          python3 -m py_compile deploy/runtime_env.py

      - name: Commit final source change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(deploy): inject immutable build revision at runtime'
          git push origin HEAD:fix/runtime-build-revision-injection
