name: Cancel Stale Controlled Gate

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale-controlled-gate:
    if: >-
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/cancel-stale-controlled-gate 33187032610'
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact stale run and cancel
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: '33187032610'
          EXPECTED_HEAD_SHA: a1af254ea9c6fc011f9967224ea9cb8368ebf061
          EXPECTED_WORKFLOW: Preliminary Evidence Report V1 Acceptance
        shell: bash
        run: |
          set -euo pipefail
          payload="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}")"
          name="$(jq -r '.name' <<<"$payload")"
          sha="$(jq -r '.head_sha' <<<"$payload")"
          event="$(jq -r '.event' <<<"$payload")"
          status="$(jq -r '.status' <<<"$payload")"
          test "$name" = "$EXPECTED_WORKFLOW"
          test "$sha" = "$EXPECTED_HEAD_SHA"
          test "$event" = 'pull_request'
          test "$status" = 'in_progress'
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}/cancel"
          printf 'cancelled_run=%s workflow=%s head_sha=%s\n' "$TARGET_RUN_ID" "$name" "$sha"
