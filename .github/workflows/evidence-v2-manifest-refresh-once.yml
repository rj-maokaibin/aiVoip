name: Evidence V2 One-shot Manifest Refresh

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: evidence-v2-manifest-refresh-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh-and-remove:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - name: Refresh canonical manifest and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/source_manifest_gate.py --update
          python3 tools/source_manifest_gate.py
          git rm .github/workflows/evidence-v2-manifest-refresh-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/source_manifest.json
          git commit -m "chore: refresh source manifest after Evidence V2 lifecycle hardening"
          git push origin "HEAD:${{ github.head_ref }}"
