name: One-shot frontend dependency refresh

on:
  push:
    branches:
      - agent/preliminary-evidence-report-v1-implementation
    paths:
      - .github/workflows/frontend-deps-refresh.yml
      - frontend/package.json
      - frontend/package-lock.json

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/preliminary-evidence-report-v1-implementation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Refresh Vite lockfile to patched 7.x
        run: |
          cd frontend
          npm install --package-lock-only --save-dev vite@7.3.5
          npm audit --audit-level=high
      - name: Commit generated dependency lock
        run: |
          if git diff --quiet -- frontend/package.json frontend/package-lock.json; then
            echo 'No dependency lock changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package.json frontend/package-lock.json
          git commit -m 'fix(frontend): update Vite to patched 7.3.5'
          git push origin HEAD:agent/preliminary-evidence-report-v1-implementation
