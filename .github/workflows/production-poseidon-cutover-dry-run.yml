name: Production Poseidon Cutover Dry Run

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/production-poseidon-cutover-dry-run.yml'

permissions:
  contents: read

concurrency:
  group: production-poseidon-cutover-dry-run
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 20
    env:
      REQUIRED_MASTER_SHA: bd385b96972dedeee96c245875a2778f290c2c2c
      EXPECTED_PRODUCTION_ENV: /etc/voip-ai/production.env
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify source contains credential Gate fix
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor "$REQUIRED_MASTER_SHA" HEAD
          echo "DRY_RUN_HEAD=$(git rev-parse HEAD)"
          echo "REQUIRED_MASTER_SHA=$REQUIRED_MASTER_SHA"

      - name: Locate live production backend and deployment metadata
        run: |
          set -euo pipefail
          docker info >/dev/null
          mapfile -t containers < <(docker ps \
            --filter label=com.docker.compose.project=voip-ai \
            --filter label=com.docker.compose.service=backend \
            --format '{{.Names}}')
          test "${#containers[@]}" -eq 1
          backend="${containers[0]}"
          docker inspect --format '{{.State.Status}}' "$backend" | grep -qx running
          workdir="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' "$backend")"
          config_files="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project.config_files" }}' "$backend")"
          environment_file="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project.environment_file" }}' "$backend" 2>/dev/null || true)"
          helper_image="$(docker inspect --format '{{.Config.Image}}' "$backend")"
          test -n "$helper_image"
          test "$environment_file" = "$EXPECTED_PRODUCTION_ENV"
          printf 'BACKEND_CONTAINER=%s\n' "$backend" >> "$GITHUB_ENV"
          printf 'PRODUCTION_WORKDIR=%s\n' "$workdir" >> "$GITHUB_ENV"
          printf 'COMPOSE_CONFIG_FILES=%s\n' "$config_files" >> "$GITHUB_ENV"
          printf 'COMPOSE_ENVIRONMENT_FILE=%s\n' "$environment_file" >> "$GITHUB_ENV"
          printf 'HELPER_IMAGE=%s\n' "$helper_image" >> "$GITHUB_ENV"
          printf 'PRODUCTION_WORKDIR=%s\n' "$workdir"
          printf 'COMPOSE_CONFIG_FILES=%s\n' "$config_files"
          printf 'COMPOSE_ENVIRONMENT_FILE=%s\n' "$environment_file"

      - name: Validate protected production env identity without exposing secrets
        run: |
          set -euo pipefail
          mkdir -p validation
          runtime_json="$(docker exec -i "$BACKEND_CONTAINER" python - <<'PY'
          import json, os
          from urllib.parse import urlparse
          url=os.getenv('CREDENTIAL_API_URL','').strip()
          print(json.dumps({
            'provider': os.getenv('CREDENTIAL_PROVIDER','').strip().lower(),
            'api_host': (urlparse(url).hostname or '').lower(),
            'capture_engine': os.getenv('CAPTURE_ENGINE_VERSION',''),
            'v2_enabled': os.getenv('CAPTURE_V2_PRODUCTION_ENABLED','').lower() == 'true',
            'platform_mode': os.getenv('REPRODUCTION_PLATFORM_MODE',''),
          }))
          PY
          )"
          export RUNTIME_JSON="$runtime_json"
          python3 - <<'PY'
          import json, os
          p=json.loads(os.environ['RUNTIME_JSON'])
          assert p['provider']=='api', p
          assert p['api_host'].endswith('.example.internal') or p['api_host']=='example.internal', p
          assert p['capture_engine']=='V2', p
          assert p['v2_enabled'] is True, p
          assert p['platform_mode']=='real', p
          print('RUNTIME_CURRENT_PROVIDER=api')
          print('RUNTIME_API_URL_CLASS=PLACEHOLDER')
          print('RUNTIME_CAPTURE_AUTHORITY=V2_REAL')
          PY

          # The runner account intentionally cannot read the protected host env
          # directly. Reuse its already-authorized Docker control plane to mount
          # exactly the Compose-declared env file read-only into an ephemeral
          # helper. Only non-secret identity fields are compared; no env values
          # are printed.
          docker run --rm -i \
            --entrypoint python \
            -e RUNTIME_JSON="$runtime_json" \
            -v "$COMPOSE_ENVIRONMENT_FILE:/source/production.env:ro" \
            "$HELPER_IMAGE" - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.parse import urlparse
          path=Path('/source/production.env')
          values={}
          for raw in path.read_text(encoding='utf-8').splitlines():
              line=raw.strip()
              if not line or line.startswith('#') or '=' not in line:
                  continue
              if line.startswith('export '):
                  line=line[7:].strip()
              k,v=line.split('=',1)
              k=k.strip(); v=v.strip()
              if len(v)>=2 and v[0]==v[-1] and v[0] in {'"', "'"}:
                  v=v[1:-1]
              values[k]=v
          runtime=json.loads(os.environ['RUNTIME_JSON'])
          host=(urlparse(values.get('CREDENTIAL_API_URL','')).hostname or '').lower()
          assert values.get('APP_ENV','').lower()=='production'
          assert values.get('CREDENTIAL_PROVIDER','').lower()==runtime['provider']
          assert host==runtime['api_host']
          print('PRODUCTION_ENV_IDENTITY_MATCH=PASS')
          PY

          tmp="$RUNNER_TEMP/production-poseidon-dryrun.env"
          rm -f "$tmp"
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          docker run --rm \
            -e RUNNER_UID="$runner_uid" \
            -e RUNNER_GID="$runner_gid" \
            -v "$COMPOSE_ENVIRONMENT_FILE:/source/production.env:ro" \
            -v "$RUNNER_TEMP:/out" \
            --entrypoint sh \
            "$HELPER_IMAGE" -c \
            'set -eu; umask 077; cp /source/production.env /out/production-poseidon-dryrun.env; chown "$RUNNER_UID:$RUNNER_GID" /out/production-poseidon-dryrun.env; chmod 0600 /out/production-poseidon-dryrun.env'
          test -r "$tmp"
          test "$(stat -c '%a' "$tmp")" = '600'
          echo "DRYRUN_ENV_COPY=$tmp" >> "$GITHUB_ENV"
          echo 'PRODUCTION_ENV_PROTECTED_READ=PASS'

      - name: Run deployment preflight against temporary Poseidon env copy
        run: |
          set -euo pipefail
          tmp="$DRYRUN_ENV_COPY"
          trap 'rm -f "$tmp"' EXIT
          TMP_ENV="$tmp" python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['TMP_ENV'])
          lines=p.read_text(encoding='utf-8').splitlines()
          seen=0
          out=[]
          for line in lines:
              stripped=line.strip()
              prefix='export ' if stripped.startswith('export ') else ''
              body=stripped[7:].strip() if prefix else stripped
              if body.startswith('CREDENTIAL_PROVIDER='):
                  seen += 1
                  out.append(prefix + 'CREDENTIAL_PROVIDER=poseidon')
              else:
                  out.append(line)
          if seen != 1:
              raise SystemExit(f'CREDENTIAL_PROVIDER_LINE_COUNT={seen}')
          p.write_text('\n'.join(out)+'\n', encoding='utf-8')
          PY

          # Execute the newly merged preflight source inside a disposable Python
          # runtime while exposing production secret paths read-only. This avoids
          # weakening permissions on /etc/voip-ai or /home/dev/secret.yaml.
          set +e
          docker run --rm \
            --entrypoint python \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$tmp:/tmp/production.env:ro" \
            -v "$GITHUB_WORKSPACE/validation:/out" \
            -v /etc/voip-ai:/etc/voip-ai:ro \
            -v /home/dev/secret.yaml:/home/dev/secret.yaml:ro \
            -w /workspace \
            "$HELPER_IMAGE" \
            deploy/deployment_preflight.py \
              --env-file /tmp/production.env \
              --mode deploy \
              --out /out/production_poseidon_cutover_dry_run.json
          rc=$?
          set -e
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('validation/production_poseidon_cutover_dry_run.json').read_text(encoding='utf-8'))
          checks={x['key']: x for x in p['checks']}
          summary={
            'status': p['status'],
            'deployment_status': p['deployment_status'],
            'release_status': p['release_status'],
            'deploy_blocking_keys': p['deploy_blocking_keys'],
            'credential_provider': checks.get('CREDENTIAL_PROVIDER'),
            'poseidon_secret_file': checks.get('POSEIDON_SECRET_FILE'),
          }
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          assert checks['CREDENTIAL_PROVIDER']['status']=='PASS', checks['CREDENTIAL_PROVIDER']
          assert checks['POSEIDON_SECRET_FILE']['status']=='PASS', checks['POSEIDON_SECRET_FILE']
          PY
          exit "$rc"

      - name: Upload sanitized dry-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-poseidon-cutover-dry-run
          path: validation/production_poseidon_cutover_dry_run.json
          if-no-files-found: warn
          retention-days: 30
