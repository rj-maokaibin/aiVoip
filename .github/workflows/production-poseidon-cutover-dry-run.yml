name: Production Poseidon Cutover Dry Run

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/production-poseidon-cutover-dry-run.yml'

permissions:
  contents: read

concurrency:
  group: production-poseidon-cutover-dry-run
  cancel-in-progress: true

jobs:
  dry-run:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 20
    env:
      EXPECTED_PRODUCTION_ENV: /etc/voip-ai/production.env
      TARGET_IP: '10.48.8.74'
      TARGET_PORT: '10002'
      TARGET_SN: 'G1U060H000384'
      TARGET_MODEL: 'APF3260-M'
      TARGET_PRODUCT: 'APF3260'
      TARGET_VOICE_INTERFACE: 'br-lan_400'
    steps:
      - name: Locate live production containers and authority
        run: |
          set -euo pipefail
          docker info >/dev/null
          mapfile -t backends < <(docker ps --filter label=com.docker.compose.project=voip-ai --filter label=com.docker.compose.service=backend --format '{{.Names}}')
          mapfile -t workers < <(docker ps --filter label=com.docker.compose.project=voip-ai --filter label=com.docker.compose.service=reproduction-worker --format '{{.Names}}')
          test "${#backends[@]}" -eq 1
          test "${#workers[@]}" -eq 1
          backend="${backends[0]}"
          worker="${workers[0]}"
          environment_file="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project.environment_file" }}' "$backend")"
          helper_image="$(docker inspect --format '{{.Config.Image}}' "$backend")"
          test "$environment_file" = "$EXPECTED_PRODUCTION_ENV"
          test -n "$helper_image"
          printf 'BACKEND_CONTAINER=%s\n' "$backend" >> "$GITHUB_ENV"
          printf 'REPRO_WORKER=%s\n' "$worker" >> "$GITHUB_ENV"
          printf 'PRODUCTION_ENV_FILE=%s\n' "$environment_file" >> "$GITHUB_ENV"
          printf 'HELPER_IMAGE=%s\n' "$helper_image" >> "$GITHUB_ENV"
          docker exec -i "$backend" python - <<'PY'
          import os
          assert os.getenv('CREDENTIAL_PROVIDER','').lower() == 'api'
          assert os.getenv('CAPTURE_ENGINE_VERSION') == 'V2'
          assert os.getenv('CAPTURE_V2_PRODUCTION_ENABLED','').lower() == 'true'
          assert os.getenv('REPRODUCTION_PLATFORM_MODE') == 'real'
          print('CURRENT_CREDENTIAL_PROVIDER=api')
          print('CAPTURE_AUTHORITY=V2_REAL')
          PY

      - name: Validate protected production env identity
        run: |
          set -euo pipefail
          runtime_host="$(docker exec -i "$BACKEND_CONTAINER" python - <<'PY'
          import os
          from urllib.parse import urlparse
          print((urlparse(os.getenv('CREDENTIAL_API_URL','')).hostname or '').lower())
          PY
          )"
          docker run --rm -i \
            --entrypoint python \
            -e RUNTIME_HOST="$runtime_host" \
            -v "$PRODUCTION_ENV_FILE:/source/production.env:ro" \
            "$HELPER_IMAGE" - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import urlparse
          values={}
          for raw in Path('/source/production.env').read_text(encoding='utf-8').splitlines():
              line=raw.strip()
              if not line or line.startswith('#') or '=' not in line:
                  continue
              if line.startswith('export '): line=line[7:].strip()
              k,v=line.split('=',1); v=v.strip()
              if len(v)>=2 and v[0]==v[-1] and v[0] in {'"', "'"}: v=v[1:-1]
              values[k.strip()]=v
          host=(urlparse(values.get('CREDENTIAL_API_URL','')).hostname or '').lower()
          assert values.get('APP_ENV','').lower() == 'production'
          assert values.get('CREDENTIAL_PROVIDER','').lower() == 'api'
          assert host == os.environ['RUNTIME_HOST']
          assert host == 'credential-service.example.internal' or host.endswith('.example.internal')
          print('PRODUCTION_ENV_IDENTITY=PASS')
          print('CURRENT_API_URL_CLASS=PLACEHOLDER')
          PY

      - name: Simulate Poseidon provider in production reproduction worker
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/poseidon-dry-run"
          set +e
          docker exec -i \
            -e CREDENTIAL_PROVIDER=poseidon \
            -e TARGET_IP="$TARGET_IP" \
            -e TARGET_PORT="$TARGET_PORT" \
            -e TARGET_SN="$TARGET_SN" \
            -e TARGET_PRODUCT="$TARGET_PRODUCT" \
            -e TARGET_VOICE_INTERFACE="$TARGET_VOICE_INTERFACE" \
            "$REPRO_WORKER" python - <<'PY' > "$RUNNER_TEMP/poseidon-dry-run/result.json"
          import asyncio, json, os, socket
          from datetime import datetime, timezone
          from app.integrations.credentials import get_credential_provider
          from app.collectors.asyncssh_adapter import AsyncSSHDeviceAdapter

          async def main():
              ip=os.environ['TARGET_IP']; port=int(os.environ['TARGET_PORT'])
              sn=os.environ['TARGET_SN']; product=os.environ['TARGET_PRODUCT']
              iface=os.environ['TARGET_VOICE_INTERFACE']
              payload={
                  'schema_version':'production-poseidon-cutover-dry-run-v4',
                  'checked_at':datetime.now(timezone.utc).isoformat(),
                  'mutation_performed':False,
                  'target':{'ip':ip,'port':port,'sn':sn,'product':product,'voice_interface':iface},
                  'checks':{},
              }
              provider=get_credential_provider()
              payload['checks']['provider_class']=type(provider).__name__
              payload['checks']['production_capable']=bool(getattr(provider,'production_capable',False))
              payload['checks']['provider_ok']=payload['checks']['provider_class']=='PoseidonCredentialProvider' and payload['checks']['production_capable']
              try:
                  with socket.create_connection((ip,port),timeout=5): pass
                  payload['checks']['tcp']=True
              except Exception as exc:
                  payload['checks']['tcp']=False
                  payload['checks']['tcp_error']=type(exc).__name__
              try:
                  password=await provider.get_password(sn=sn, ip=ip, product=product)
                  payload['checks']['credential_resolved']=bool(password)
              except Exception as exc:
                  password=''
                  payload['checks']['credential_resolved']=False
                  payload['checks']['credential_error']=type(exc).__name__
              if password:
                  adapter=AsyncSSHDeviceAdapter(host=ip, port=port, username='root', password=password)
                  try:
                      out=await adapter.run(f"echo PROBE_OK=1; ip link show {iface} >/dev/null 2>&1 && echo VOICE_IF_OK=1; pgrep -af tcpdump | wc -l; ps w | grep -E '[d]sp diag|[p]cm_(rx|tx)' | wc -l")
                      payload['checks']['ssh']=True
                      payload['checks']['probe_ok']='PROBE_OK=1' in out
                      payload['checks']['voice_interface']='VOICE_IF_OK=1' in out
                  except Exception as exc:
                      payload['checks']['ssh']=False
                      payload['checks']['ssh_error']=type(exc).__name__
              payload['verdict']='PASS' if all([
                  payload['checks'].get('provider_ok'),
                  payload['checks'].get('tcp'),
                  payload['checks'].get('credential_resolved'),
                  payload['checks'].get('ssh'),
                  payload['checks'].get('probe_ok'),
                  payload['checks'].get('voice_interface'),
              ]) else 'BLOCKED'
              print(json.dumps(payload,ensure_ascii=False,indent=2))
              return 0 if payload['verdict']=='PASS' else 2
          raise SystemExit(asyncio.run(main()))
          PY
          rc=$?
          set -e
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads((Path(os.environ['RUNNER_TEMP'])/'poseidon-dry-run/result.json').read_text())
          safe={
              'verdict':p['verdict'],
              'provider_class':p['checks'].get('provider_class'),
              'production_capable':p['checks'].get('production_capable'),
              'tcp':p['checks'].get('tcp'),
              'credential_resolved':p['checks'].get('credential_resolved'),
              'ssh':p['checks'].get('ssh'),
              'probe_ok':p['checks'].get('probe_ok'),
              'voice_interface':p['checks'].get('voice_interface'),
          }
          print(json.dumps(safe,ensure_ascii=False,indent=2))
          assert p['verdict']=='PASS', safe
          PY
          exit "$rc"

      - name: Verify no production mutation occurred
        run: |
          set -euo pipefail
          docker exec -i "$BACKEND_CONTAINER" python - <<'PY'
          import os
          assert os.getenv('CREDENTIAL_PROVIDER','').lower() == 'api'
          assert os.getenv('CAPTURE_ENGINE_VERSION') == 'V2'
          print('POST_DRYRUN_PROVIDER=api')
          print('POST_DRYRUN_CAPTURE_AUTHORITY=V2')
          print('PRODUCTION_MUTATION=false')
          PY

      - name: Upload sanitized dry-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-poseidon-cutover-dry-run
          path: ${{ runner.temp }}/poseidon-dry-run/result.json
          if-no-files-found: warn
          retention-days: 30
