name: P0 Production Golden Inspect 20260828

on:
  push:
    branches:
      - ops/p0-production-golden-inspect-20260828

permissions:
  contents: read

jobs:
  inspect-production-golden:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 20
    env:
      P0_CASE: VOIP-20260827-D38C67
    steps:
      - name: Probe C01 controlled-fault capability read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t backends < <(docker ps \
            --filter label=com.docker.compose.project=voip-ai \
            --filter label=com.docker.compose.service=backend \
            --format '{{.Names}}')
          test "${#backends[@]}" -eq 1
          backend="${backends[0]}"
          echo "BACKEND=$backend"

          docker exec -i -e P0_CASE="$P0_CASE" "$backend" python - <<'PY'
          import asyncio, hashlib, json, os, re
          from sqlalchemy import select
          from app.db.models import Case, ReproductionSession
          from app.db.session import SessionLocal
          from app.workers.reproduction_tasks import _build_real_adapter

          case_no = os.environ['P0_CASE']
          db = SessionLocal()
          try:
              case = db.scalar(select(Case).where(Case.case_no == case_no))
              assert case is not None, f'CASE_NOT_FOUND:{case_no}'
              session = db.scalar(
                  select(ReproductionSession)
                  .where(ReproductionSession.case_id == case.id)
                  .order_by(ReproductionSession.created_at.desc())
                  .limit(1)
              )
              assert session is not None, 'NO_REPRODUCTION_SESSION'
              safe_session = {
                  'id': session.id,
                  'state': session.state,
                  'device_id': session.device_id,
                  'platform_profile_id': getattr(session, 'platform_profile_id', None),
                  'voice_runtime_context': session.voice_runtime_context_json or {},
              }
          finally:
              db.close()

          adapter = _build_real_adapter(session)

          async def run():
              result = {'case_no': case_no, 'session': safe_session, 'shell': {}, 'aim': {}}
              await adapter.connect()
              try:
                  commands = {
                      'iptables_path': "command -v iptables 2>/dev/null || true",
                      'iptables_save_path': "command -v iptables-save 2>/dev/null || true",
                      'nft_path': "command -v nft 2>/dev/null || true",
                      'ip_path': "command -v ip 2>/dev/null || true",
                      'route_path': "command -v route 2>/dev/null || true",
                      'iptables_output_rule_count': "iptables -S OUTPUT 2>/dev/null | wc -l",
                      'iptables_ruleset_hash': "(iptables-save 2>/dev/null || true) | sha256sum | awk '{print $1}'",
                      'route_table': "ip route show 2>/dev/null || route -n 2>/dev/null || true",
                      'voice_config': "dev_config get -m voipServInfo 2>/dev/null || true",
                      'voice_vlan': "dev_config get -m voice_vlan 2>/dev/null || true",
                  }
                  for key, cmd in commands.items():
                      r = await adapter.execute_shell(cmd, timeout=8)
                      text = (r.stdout or r.stderr or '').strip()
                      if key == 'route_table':
                          text = '\n'.join(text.splitlines()[:40])
                      result['shell'][key] = {'exit_status': r.exit_status, 'output': text}

                  for key, cmd in {
                      'sip_running': 'voip sip regc show running RC1',
                      'sip_config': 'voip sip regc show config RC1',
                  }.items():
                      try:
                          r = await adapter.execute_cli(cmd, timeout=8)
                          text = (r.stdout or r.stderr or '')
                          safe_lines = []
                          for line in text.splitlines():
                              low = line.lower()
                              if any(x in low for x in ('password','passwd','secret','auth')):
                                  continue
                              if key == 'sip_config' and not any(x in low for x in ('server','proxy','registr','port','transport','domain','expire','status','address','ip')):
                                  continue
                              safe_lines.append(line)
                          result['aim'][key] = '\n'.join(safe_lines[:80])
                      except Exception as exc:
                          result['aim'][key] = f'{type(exc).__name__}:{exc}'
              finally:
                  await adapter.disconnect()
              return result

          result = asyncio.run(run())
          print('P0_C01_DUT_CAPABILITY_JSON_BEGIN')
          print(json.dumps(result, ensure_ascii=False, indent=2, default=str))
          print('P0_C01_DUT_CAPABILITY_JSON_END')
          shell = result['shell']
          summary = {
              'iptables': bool(shell['iptables_path']['output']),
              'iptables_save': bool(shell['iptables_save_path']['output']),
              'nft': bool(shell['nft_path']['output']),
              'ip': bool(shell['ip_path']['output']),
              'iptables_output_rule_count': shell['iptables_output_rule_count']['output'],
              'iptables_ruleset_hash': shell['iptables_ruleset_hash']['output'],
              'voice_gateway': (safe_session.get('voice_runtime_context') or {}).get('voice_gateway_ip'),
              'voice_interface': (safe_session.get('voice_runtime_context') or {}).get('voice_interface'),
          }
          print('P0_C01_DUT_CAPABILITY_SUMMARY=' + json.dumps(summary, ensure_ascii=False))
          PY
