name: Runner Workspace Repair

on:
  push:
    branches:
      - ops/runner-workspace-repair

permissions:
  contents: read

concurrency:
  group: voip-runner-workspace-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 5
    steps:
      - name: Repair workspace without checkout
        shell: bash
        run: |
          set -euo pipefail
          docker info >/dev/null
          docker image inspect python:3.12-slim >/dev/null
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            python:3.12-slim \
            sh -lc 'find /workspace -mindepth 1 -maxdepth 1 -exec rm -rf {} +'
          test -z "$(find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)"
          echo "RUNNER_WORKSPACE_REPAIR=PASS"
