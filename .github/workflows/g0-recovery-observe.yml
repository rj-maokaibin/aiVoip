name: G0 Recovery Read-Only Observe

on:
  pull_request:
    branches: [master]
    paths:
      - 'backend/app/automation/gates/golden_cfg_config.py'
      - 'backend/app/infrastructure/device_authority/keepalive.py'
      - 'backend/tests/test_authority_keepalive.py'
      - 'tools/observe_g0_recovery_state.py'
      - '.github/workflows/g0-recovery-observe.yml'

permissions:
  contents: read

concurrency:
  group: g0-recovery-observe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  observe:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on:
      - self-hosted
      - linux
      - x64
      - voip-controlled-linux
    timeout-minutes: 15
    env:
      G0_ENV_FILE: /home/github-runner/.config/voip-ai/.env
      OBS_VENV: /tmp/voip-ai-g0-observe-${{ github.run_id }}-${{ github.run_attempt }}
      OBS_RUNTIME_ROOT: /tmp/voip-ai-g0-observe-runtime-${{ github.run_id }}-${{ github.run_attempt }}
      OBS_OUTPUT: validation/g0_recovery_observe.json

    steps:
      - name: Repair self-hosted workspace before checkout
        shell: bash
        run: |
          set -euo pipefail
          docker info >/dev/null
          docker image inspect python:3.12-slim >/dev/null
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" python:3.12-slim \
            sh -lc 'find /workspace -mindepth 1 -maxdepth 1 -exec rm -rf {} +'
          test -z "$(find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)"

      - name: Checkout exact PR head
        uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Prepare isolated read-only runtime
        shell: bash
        run: |
          set -euo pipefail
          test -r "$G0_ENV_FILE"
          rm -rf "$OBS_VENV" "$OBS_RUNTIME_ROOT"
          mkdir -p "$OBS_RUNTIME_ROOT" validation
          chmod 0700 "$OBS_RUNTIME_ROOT"
          python3 -m venv "$OBS_VENV"
          "$OBS_VENV/bin/pip" install --disable-pip-version-check -q -r backend/requirements.txt

      - name: Resolve production DB, DUT and existing SSH credential
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$G0_ENV_FILE"
          set +a
          export PYTHONPATH="$GITHUB_WORKSPACE/backend"
          "$OBS_VENV/bin/python" tools/resolve_real_sip_aba_database_env.py > "$OBS_RUNTIME_ROOT/production_db.env"
          chmod 0600 "$OBS_RUNTIME_ROOT/production_db.env"
          set -a
          source "$OBS_RUNTIME_ROOT/production_db.env"
          set +a
          "$OBS_VENV/bin/python" tools/resolve_real_sip_aba_context.py \
            --output-root validation \
            --runtime-root "$OBS_RUNTIME_ROOT"
          set -a
          source "$OBS_RUNTIME_ROOT/db_runtime.env"
          source "$OBS_RUNTIME_ROOT/resolved_dut.env"
          set +a
          "$OBS_VENV/bin/python" tools/resolve_real_sip_aba_credential_env.py \
            --container "$SIP_ABA_PRODUCTION_CREDENTIAL_CONTAINER" \
            --expected-provider "$SIP_ABA_PRODUCTION_CREDENTIAL_PROVIDER" \
            --sn "$DEVICE_SN" \
            --ip "$DEVICE_HOST" \
            --product "$DEVICE_MODEL" \
            --fallback-user "$DEVICE_USER" \
            --output "$OBS_RUNTIME_ROOT/credential.env"
          chmod 0600 "$OBS_RUNTIME_ROOT/credential.env"

      - name: Observe current G0 state without mutation
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$G0_ENV_FILE"
          source "$OBS_RUNTIME_ROOT/production_db.env"
          source "$OBS_RUNTIME_ROOT/db_runtime.env"
          source "$OBS_RUNTIME_ROOT/resolved_dut.env"
          source "$OBS_RUNTIME_ROOT/credential.env"
          set +a
          export PYTHONPATH="$GITHUB_WORKSPACE/backend"
          args=(
            tools/observe_g0_recovery_state.py
            --device-id "$DEVICE_ID"
            --model "$DEVICE_MODEL"
            --host "$DEVICE_HOST"
            --port "$DEVICE_PORT"
            --username "$SIP_ABA_SSH_USERNAME"
            --password-env "ENV:SIP_ABA_SSH_PASSWORD"
            --failed-probe-marker G0
            --output "$OBS_OUTPUT"
          )
          case "$DEVICE_PLATFORM" in
            mt7621|mt7981) args+=(--platform-id "$DEVICE_PLATFORM") ;;
          esac
          "$OBS_VENV/bin/python" "${args[@]}"
          python3 - <<'PY'
          import json, os
          p=json.load(open(os.environ['OBS_OUTPUT'], encoding='utf-8'))
          assert p.get('read_only') is True, p
          assert p.get('mutation_executed') is False, p
          print('G0_RECOVERY_OBSERVE=PASS')
          PY

      - name: Upload sanitized recovery observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-recovery-observe-${{ github.run_id }}-${{ github.run_attempt }}
          path: validation/g0_recovery_observe.json
          if-no-files-found: warn
          retention-days: 30

      - name: Remove runtime secrets
        if: always()
        shell: bash
        run: |
          rm -rf "$OBS_RUNTIME_ROOT"
