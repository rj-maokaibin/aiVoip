profiles:
  - id: RUIJIE_VOIP_AIM_V1
    name: Ruijie OpenWrt + aimd/AIM VOIP Platform
    version: 0.5.1
    status: PARTIAL
    family: RUIJIE_OPENWRT_AIM
    description: >-
      EC-02 partial platform contract backed by supplied VOIP troubleshooting material and
      device transcripts. Voice VLAN, Gateway, dynamic interface and realtime FXS event parsers
      are verified and read-only commands are executable. PCM cleanup is confirmed effective but
      non-idempotent: a second OFF exits the AIM CLI. Autonomous reproduction remains blocked until
      recovery uses verify-before-execute cleanup and never blindly repeats PCM OFF. A quiet UDP
      probe alone cannot prove PCM is disabled while the device is idle; that state requires an
      active-call validation before the contract can be promoted.
    transport:
      ssh_username: admin
      aim_executable: aim
      aim_root_prompt: "AIM>"
      aim_session: PERSISTENT_PTY
    source_refs:
      - "voip 排障案例_思路整理。(1).md"
      - "M6.2 confirmed PCM destination semantics: voice gateway IP; DUT is the only SSH target"
      - "User device transcript 2026-08-13: dev_config VOIP service/VLAN and AIM enable commands"

    readonly_actions:
      - CHECK_AIMD_PROCESS
      - GET_VOIP_LOG
      - GET_NETWORK_CONFIG
      - GET_VOICE_VLAN_REF
      - GET_VOIP_SERVICE_INFO
      - GET_VOICE_VLAN_CONFIG
      - GET_INTERFACE_LINKS
      - GET_BRIDGE_INFO
      - GET_ROUTE
      - GET_DNS
      - GET_NETWORK_VOIP_LOG
      - GET_PCM_COUNTER
      - GET_AIM_BIND
      - GET_AIM_SIP_CONFIG
      - GET_SIP_REGISTER
      - GET_DSP_RUNNING

    # Empty by design. No real write/diagnostic action is production-activatable in D1.
    autonomous_reproduction_actions: []

    voice_runtime_context:
      voice_vlan:
        command_action_id: GET_VOICE_VLAN_CONFIG
        parser_id: DEV_CONFIG_VOICE_VLAN_ID_V1
        parser_status: VERIFIED
        cardinality: EXACTLY_ONE
        notes: "dev_config voice_vlan output is JSON; enable must be 1 and vlanid must be in 1..4094."
      voice_interface:
        command_action_id: GET_INTERFACE_LINKS
        parser_id: IP_LINK_VOICE_INTERFACE_V1
        parser_status: VERIFIED
        cardinality: EXACTLY_ONE
        derive: "br-lan_<voice_vlan_id>"
        notes: "Select br-lan_<voice_vlan_id> dynamically; the exact interface must contain both UP and LOWER_UP flags."
      voice_gateway:
        command_action_id: GET_VOIP_SERVICE_INFO
        parser_id: DEV_CONFIG_VOIP_SERVICE_GATEWAY_V1
        parser_status: VERIFIED
        cardinality: EXACTLY_ONE
        notes: "dev_config voipServInfo output is JSON; data must contain exactly one object and svrName is the Gateway IP."

    realtime_event_sources:
      hook:
        command_action_id: null
        parser_id: AIM_FXS_EVENT_V1
        parser_status: VERIFIED
        notes: "Timestamped '[line] ... OFFHOOK/ONHOOK' records are the primary hook anchors."
      dtmf:
        command_action_id: null
        parser_id: AIM_FXS_EVENT_V1
        parser_status: VERIFIED
        notes: "Timestamped '[line] ... DTMF<digit>' records provide per-line dial events."

    known_diagnostic_templates:
      - template_id: PCM_RX_ON_KNOWN_SYNTAX
        executor: AIM_PTY
        command_template: "voip dsp diag set {voice_gateway_ip} 40000 1 pcm_rx on"
        status: CONFIRMED_REVERSIBLE
        reason_not_activatable: "A second OFF exits AIM; recovery must verify UDP 40000 activity before executing OFF once."
        cleanup_command_template: "voip dsp diag set {voice_gateway_ip} 40000 1 pcm_rx off"
        cleanup_status: CONFIRMED_NON_IDEMPOTENT
        cleanup_idempotent: false
        cleanup_retry_strategy: VERIFY_QUIET_THEN_EXECUTE_ONCE
        cleanup_guard: "Skip OFF when UDP 40000 is already quiet; execute once only when the stream is active."
        source_refs:
          - "User device transcript 2026-08-13"
      - template_id: PCM_TX_ON_KNOWN_SYNTAX
        executor: AIM_PTY
        command_template: "voip dsp diag set {voice_gateway_ip} 50000 1 pcm_tx on"
        status: CONFIRMED_REVERSIBLE
        reason_not_activatable: "A second OFF exits AIM; recovery must verify UDP 50000 activity before executing OFF once."
        cleanup_command_template: "voip dsp diag set {voice_gateway_ip} 50000 1 pcm_tx off"
        cleanup_status: CONFIRMED_NON_IDEMPOTENT
        cleanup_idempotent: false
        cleanup_retry_strategy: VERIFY_QUIET_THEN_EXECUTE_ONCE
        cleanup_guard: "Skip OFF when UDP 50000 is already quiet; execute once only when the stream is active."
        source_refs:
          - "User device transcript 2026-08-13"
      - template_id: HOOK_DEBUG_ON_KNOWN_SYNTAX
        executor: AIM_PTY
        command_template: "debug p on"
        status: CONFIRMED_REVERSIBLE
        reason_not_activatable: "Real platform action binding remains blocked until all cleanup actions are retry-safe."
        cleanup_command_template: "debug p off"
        cleanup_status: CONFIRMED_IDEMPOTENT
        cleanup_idempotent: true
        source_refs:
          - "User device transcript 2026-08-13"
      - template_id: DEBUG_SYSTEM_ON_KNOWN_SYNTAX
        executor: AIM_PTY
        command_template: "debug sys debug"
        status: CONFIRMED_NO_DEDICATED_CLEANUP
        reason_not_activatable: "No dedicated cleanup is required; the debug bundle still awaits retry-safe cleanup binding."
        source_refs:
          - "User device transcript 2026-08-13"
      - template_id: DEBUG_EVENT_ON_KNOWN_SYNTAX
        executor: AIM_PTY
        command_template: "de p on"
        status: CONFIRMED_REVERSIBLE
        reason_not_activatable: "de p off stops the event logs, but repeated cleanup has not yet been demonstrated."
        cleanup_command_template: "de p off"
        cleanup_status: CONFIRMED_EFFECTIVE
        cleanup_idempotent: null
        source_refs:
          - "User device transcript 2026-08-13"
      - template_id: SIP_DEBUG_ON_KNOWN_SYNTAX
        executor: AIM_PTY
        command_template: "de sip de"
        status: CONFIRMED_NO_DEDICATED_CLEANUP
        reason_not_activatable: "No dedicated cleanup is required; the debug bundle still awaits retry-safe cleanup binding."
        source_refs:
          - "User device transcript 2026-08-13"
      - template_id: IPC_DEBUG_ON_KNOWN_SYNTAX
        executor: AIM_PTY
        command_template: "de ipc de"
        status: CONFIRMED_NO_DEDICATED_CLEANUP
        reason_not_activatable: "No dedicated cleanup is required; the debug bundle still awaits retry-safe cleanup binding."
        source_refs:
          - "User device transcript 2026-08-13"
      - template_id: CM_DEBUG_ON_KNOWN_SYNTAX
        executor: AIM_PTY
        command_template: "de cm de"
        status: CONFIRMED_NO_DEDICATED_CLEANUP
        reason_not_activatable: "No dedicated cleanup is required; the debug bundle still awaits retry-safe cleanup binding."
        source_refs:
          - "User device transcript 2026-08-13"
      - template_id: DSP_DEBUG_ON_KNOWN_SYNTAX
        executor: AIM_PTY
        command_template: "de dsp de"
        status: CONFIRMED_NO_DEDICATED_CLEANUP
        reason_not_activatable: "No dedicated cleanup is required; the debug bundle still awaits retry-safe cleanup binding."
        source_refs:
          - "User device transcript 2026-08-13"
      - template_id: SYSTEM_EVENT_DEBUG_ON_KNOWN_SYNTAX
        executor: AIM_PTY
        command_template: "de sys de"
        status: CONFIRMED_NO_DEDICATED_CLEANUP
        reason_not_activatable: "No dedicated cleanup is required; the debug bundle still awaits retry-safe cleanup binding."
        source_refs:
          - "User device transcript 2026-08-13"
      - template_id: SIP_PACKET_LOG_ON_KNOWN_SYNTAX
        executor: AIM_PTY
        command_template: "voip sip log-pkt on"
        status: CONFIRMED_REVERSIBLE
        reason_not_activatable: "Cleanup is effective, but repeated cleanup has not yet been demonstrated."
        cleanup_command_template: "voip sip log-pkt off"
        cleanup_status: CONFIRMED
        cleanup_idempotent: null
        source_refs:
          - "User device transcript 2026-08-13"

    gaps:
      - key: PCM_CLEANUP_COMMANDS
        severity: BLOCKING
        blocking_capabilities: [AUTONOMOUS_REPRODUCTION]
        description: "PCM RX/TX OFF commands stop their UDP streams but are non-idempotent; a second OFF exits the AIM CLI. The cleanup guard implementation must be bound to the real adapter and preserve its per-channel OFF history across watchdog retries."
        required_confirmation: "During an active call, validate active UDP -> one OFF -> quiet UDP for RX and TX, then prove that a watchdog retry does not issue a second OFF."
      - key: PCM_IDLE_ARM_STATE
        severity: BLOCKING
        blocking_capabilities: [AUTONOMOUS_REPRODUCTION]
        description: "On 2026-08-13, pcm_rx on was accepted by AIM while idle UDP 40000 remained quiet. UDP quiet therefore does not prove that the PCM diagnostic setting is disabled when no call is active."
        required_confirmation: "Provide a read-only diagnostic-state query, or run a controlled active-call experiment that proves no PCM traffic resumes after the one permitted OFF."
      - key: DEBUG_CLEANUP_COMMANDS
        severity: BLOCKING
        blocking_capabilities: [AUTONOMOUS_REPRODUCTION]
        description: "debug p off, de p off and SIP packet-log cleanup are effective; only debug p off is currently confirmed idempotent. Other debug-level commands require no dedicated cleanup."
        required_confirmation: "Execute de p off and voip sip log-pkt off twice and confirm the second call is harmless and logs remain stopped."
      - key: FXS_SUBMODE_PROMPT
        severity: NON_BLOCKING
        blocking_capabilities: []
        description: "show information is documented under `voip fxs 1`, but submode prompt is not available in the text source."
        required_confirmation: "Provide an interactive AIM transcript for `voip fxs 1` and `show information`."
