profiles:
  - id: RUIJIE_VOIP_AIM_V1
    name: Ruijie OpenWrt + aimd/AIM VOIP Platform
    version: 0.6.0
    status: PARTIAL
    family: RUIJIE_OPENWRT_AIM
    description: >-
      EC-02 partial platform contract backed by supplied VOIP troubleshooting material and
      2026-08-13 live-device validation. Voice VLAN, Gateway, dynamic interface, realtime FXS
      event parsers, PCM cleanup and debug cleanup are verified against the real DUT. Active-call
      validation on 2026-08-13 confirmed the full PCM sequence for both RX (UDP 40000) and TX
      (UDP 50000): pcm_* on produced mirrored media traffic, a single pcm_* off returned the
      stream to quiet, and no traffic resumed afterward. de p off and voip sip log-pkt off are
      both confirmed harmless on a second call. The FXS submode prompt is confirmed as
      AIM(fxs/1)> with a working `show information` snapshot. Autonomous reproduction still
      remains gated: the transport-injected PCM guard is bound in the orchestrator but the real
      adapter binding inside a live reproduction session and the production platform gate are
      not yet promoted.
    transport:
      ssh_username: admin
      aim_executable: aim
      aim_root_prompt: "AIM>"
      aim_session: PERSISTENT_PTY
    source_refs:
      - "voip 排障案例_思路整理。(1).md"
      - "M6.2 confirmed PCM destination semantics: voice gateway IP; DUT is the only SSH target"
      - "User device transcript 2026-08-13: dev_config VOIP service/VLAN and AIM enable commands"
      - "Live-device validation 2026-08-13: PCM RX/TX active-call sequence, debug cleanup idempotency, FXS submode prompt"

    readonly_actions:
      - CHECK_AIMD_PROCESS
      - GET_VOIP_LOG
      - GET_NETWORK_CONFIG
      - GET_VOICE_VLAN_REF
      - GET_VOIP_SERVICE_INFO
      - GET_VOICE_VLAN_CONFIG
      - GET_INTERFACE_LINKS
      - GET_BRIDGE_INFO
      - GET_ROUTE
      - GET_DNS
      - GET_NETWORK_VOIP_LOG
      - GET_PCM_COUNTER
      - GET_AIM_BIND
      - GET_AIM_SIP_CONFIG
      - GET_SIP_REGISTER
      - GET_DSP_RUNNING

    # Empty by design. No real write/diagnostic action is production-activatable in D1.
    autonomous_reproduction_actions: []

    voice_runtime_context:
      voice_vlan:
        command_action_id: GET_VOICE_VLAN_CONFIG
        parser_id: DEV_CONFIG_VOICE_VLAN_ID_V1
        parser_status: VERIFIED
        cardinality: EXACTLY_ONE
        notes: "dev_config voice_vlan output is JSON; enable must be 1 and vlanid must be in 1..4094."
      voice_interface:
        command_action_id: GET_INTERFACE_LINKS
        parser_id: IP_LINK_VOICE_INTERFACE_V1
        parser_status: VERIFIED
        cardinality: EXACTLY_ONE
        derive: "br-lan_<voice_vlan_id>"
        notes: "Select br-lan_<voice_vlan_id> dynamically; the exact interface must contain both UP and LOWER_UP flags."
      voice_gateway:
        command_action_id: GET_VOIP_SERVICE_INFO
        parser_id: DEV_CONFIG_VOIP_SERVICE_GATEWAY_V1
        parser_status: VERIFIED
        cardinality: EXACTLY_ONE
        notes: "dev_config voipServInfo output is JSON; data must contain exactly one object and svrName is the Gateway IP."

    realtime_event_sources:
      hook:
        command_action_id: null
        parser_id: AIM_FXS_EVENT_V1
        parser_status: VERIFIED
        notes: >-
          Live-verified 2026-08-13: with the full debug sequence enabled
          (debug p on / debug sys debug / de p on / de sip de / de ipc de / de cm de / de dsp de /
          de sys de / voip sip log-pkt on), the persistent AIM PTY emits timestamped event lines
          like '2026-08-13 22:52:53.878000 [0] D:: [D]OFFHOOK' and '[D]ONHOOK'. OFFHOOK/ONHOOK are
          the hook anchors; parse with AIM_FXS_EVENT_V1. Requires the full debug set, not de p on
          alone.
      dtmf:
        command_action_id: null
        parser_id: AIM_FXS_EVENT_V1
        parser_status: VERIFIED
        notes: >-
          Live-verified 2026-08-13: with the full debug sequence enabled, the persistent AIM PTY
          emits timestamped '... [D]DTMF<digit>' lines (e.g. DTMF<1>). One complete cycle
          OFFHOOK -> 7x DTMF<1> -> ONHOOK was captured and parsed by AIM_FXS_EVENT_V1. Requires the
          full debug set, not de p on alone.

    known_diagnostic_templates:
      - template_id: PCM_RX_ON_KNOWN_SYNTAX
        executor: AIM_PTY
        command_template: "voip dsp diag set {voice_gateway_ip} 40000 1 pcm_rx on"
        status: CONFIRMED_REVERSIBLE
        reason_not_activatable: "A second OFF exits AIM; recovery must verify UDP 40000 activity before executing OFF once. Active-call sequence validated 2026-08-13."
        cleanup_command_template: "voip dsp diag set {voice_gateway_ip} 40000 1 pcm_rx off"
        cleanup_status: CONFIRMED_NON_IDEMPOTENT
        cleanup_idempotent: false
        cleanup_retry_strategy: VERIFY_QUIET_THEN_EXECUTE_ONCE
        cleanup_guard: "Skip OFF when UDP 40000 is already quiet; execute once only when the stream is active."
        source_refs:
          - "User device transcript 2026-08-13"
          - "Live-device validation 2026-08-13: on produced UDP 40000 mirror (192.168.150.4 -> 192.168.3.200:40000, length 160); single off -> 0 packets; no resumption"
      - template_id: PCM_TX_ON_KNOWN_SYNTAX
        executor: AIM_PTY
        command_template: "voip dsp diag set {voice_gateway_ip} 50000 1 pcm_tx on"
        status: CONFIRMED_REVERSIBLE
        reason_not_activatable: "A second OFF exits AIM; recovery must verify UDP 50000 activity before executing OFF once. Active-call sequence validated 2026-08-13."
        cleanup_command_template: "voip dsp diag set {voice_gateway_ip} 50000 1 pcm_tx off"
        cleanup_status: CONFIRMED_NON_IDEMPOTENT
        cleanup_idempotent: false
        cleanup_retry_strategy: VERIFY_QUIET_THEN_EXECUTE_ONCE
        cleanup_guard: "Skip OFF when UDP 50000 is already quiet; execute once only when the stream is active."
        source_refs:
          - "User device transcript 2026-08-13"
          - "Live-device validation 2026-08-13: on produced UDP 50000 traffic; single off -> 0 packets; no resumption"
      - template_id: HOOK_DEBUG_ON_KNOWN_SYNTAX
        executor: AIM_PTY
        command_template: "debug p on"
        status: CONFIRMED_REVERSIBLE
        reason_not_activatable: "Real platform action binding remains blocked until all cleanup actions are retry-safe."
        cleanup_command_template: "debug p off"
        cleanup_status: CONFIRMED_IDEMPOTENT
        cleanup_idempotent: true
        source_refs:
          - "User device transcript 2026-08-13"
      - template_id: DEBUG_SYSTEM_ON_KNOWN_SYNTAX
        executor: AIM_PTY
        command_template: "debug sys debug"
        status: CONFIRMED_NO_DEDICATED_CLEANUP
        reason_not_activatable: "No dedicated cleanup is required; the debug bundle still awaits retry-safe cleanup binding."
        source_refs:
          - "User device transcript 2026-08-13"
      - template_id: DEBUG_EVENT_ON_KNOWN_SYNTAX
        executor: AIM_PTY
        command_template: "de p on"
        status: CONFIRMED_REVERSIBLE
        reason_not_activatable: "Cleanup is confirmed idempotent on the live device; binding remains part of the real adapter promotion."
        cleanup_command_template: "de p off"
        cleanup_status: CONFIRMED_IDEMPOTENT
        cleanup_idempotent: true
        source_refs:
          - "User device transcript 2026-08-13"
          - "Live-device validation 2026-08-13: two consecutive de p off both harmless; AIM root prompt intact"
      - template_id: SIP_PACKET_LOG_ON_KNOWN_SYNTAX
        executor: AIM_PTY
        command_template: "voip sip log-pkt on"
        status: CONFIRMED_REVERSIBLE
        reason_not_activatable: "Cleanup is confirmed idempotent on the live device; binding remains part of the real adapter promotion."
        cleanup_command_template: "voip sip log-pkt off"
        cleanup_status: CONFIRMED_IDEMPOTENT
        cleanup_idempotent: true
        source_refs:
          - "User device transcript 2026-08-13"
          - "Live-device validation 2026-08-13: two consecutive voip sip log-pkt off both returned set OK; AIM root prompt intact"
      - template_id: SIP_DEBUG_ON_KNOWN_SYNTAX
        executor: AIM_PTY
        command_template: "de sip de"
        status: CONFIRMED_NO_DEDICATED_CLEANUP
        reason_not_activatable: "No dedicated cleanup is required; the debug bundle still awaits retry-safe cleanup binding."
        source_refs:
          - "User device transcript 2026-08-13"
      - template_id: IPC_DEBUG_ON_KNOWN_SYNTAX
        executor: AIM_PTY
        command_template: "de ipc de"
        status: CONFIRMED_NO_DEDICATED_CLEANUP
        reason_not_activatable: "No dedicated cleanup is required; the debug bundle still awaits retry-safe cleanup binding."
        source_refs:
          - "User device transcript 2026-08-13"
      - template_id: CM_DEBUG_ON_KNOWN_SYNTAX
        executor: AIM_PTY
        command_template: "de cm de"
        status: CONFIRMED_NO_DEDICATED_CLEANUP
        reason_not_activatable: "No dedicated cleanup is required; the debug bundle still awaits retry-safe cleanup binding."
        source_refs:
          - "User device transcript 2026-08-13"
      - template_id: DSP_DEBUG_ON_KNOWN_SYNTAX
        executor: AIM_PTY
        command_template: "de dsp de"
        status: CONFIRMED_NO_DEDICATED_CLEANUP
        reason_not_activatable: "No dedicated cleanup is required; the debug bundle still awaits retry-safe cleanup binding."
        source_refs:
          - "User device transcript 2026-08-13"
      - template_id: SYSTEM_EVENT_DEBUG_ON_KNOWN_SYNTAX
        executor: AIM_PTY
        command_template: "de sys de"
        status: CONFIRMED_NO_DEDICATED_CLEANUP
        reason_not_activatable: "No dedicated cleanup is required; the debug bundle still awaits retry-safe cleanup binding."
        source_refs:
          - "User device transcript 2026-08-13"
      - template_id: FXS_SUBMODE_SNAPSHOT
        executor: AIM_PTY_SUBMODE
        command_template: "voip fxs 1"
        status: CONFIRMED_SUBMODE_PROMPT
        submode_prompt: "AIM(fxs/1)> "
        reason_not_activatable: "Submode snapshot is read-only and available; binding is part of the real adapter promotion."
        snapshot_command: "show information"
        snapshot_fields: [Hook State, Rx Gain, Tx Gain, DTMF Queue, DTMF Detect Cnt, Loop Current, Onhook Voltage, Vline, Error]
        source_refs:
          - "Live-device validation 2026-08-13: voip fxs 1 -> AIM(fxs/1)> ; show information returned full FXS snapshot; exit returned to AIM>"

    gaps: []
