id: Golden-WEB-NONNUM-001
version: 1
name: Current WEB non-numeric VOIP configuration and SIP registration Golden
suite_id: web_voip
entry: web
contract_status: RESERVED
environment:
  profile: real_controlled
parameters:
  target_number: "79+00.a"
  pbx_resource_kind: alias
snapshot:
  - web_voip_writable_bundle
steps:
  - action: voip.account.configure
    purpose: test
    args: {}
assertions:
  - id: pbx_nonnum_identity_provisioned
    source: pbx
    path: provisioned
    op: eq
    value: true
  - id: web_nonnum_number_readback
    source: entry
    path: number
    op: eq
    value: ${target_number}
  - id: sip_nonnum_registration_observed
    source: sip
    path: registered
    op: eq
    value: true
  - id: sip_nonnum_registration_identity
    source: sip
    path: number
    op: eq
    value: ${target_number}
cleanup:
  strategy: restore_snapshot
  verify: true
