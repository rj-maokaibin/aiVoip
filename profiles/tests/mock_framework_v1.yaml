cases:
  - id: MOCK-WEB-CONFIG-PASS
    version: 1
    suite_id: mock-framework-v1
    name: mock_web_config_pass
    entry: web
    environment: {profile: mock-lab}
    parameters: {extension: "7901"}
    snapshot: [voip.account]
    steps:
      - action: voip.account.configure
        purpose: test
        args: {extension: "${extension}"}
    assertions:
      - id: entry-accepted
        source: entry
        path: result
        op: eq
        value: accepted
    cleanup: {strategy: restore_snapshot, verify: true}

