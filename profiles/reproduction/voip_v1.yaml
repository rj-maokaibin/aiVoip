  - id: VOIP_GENERIC_FULL_CAPTURE
    name: VOIP通用完整采集
    version: "1.0.0"
    status: ACTIVE
    symptom_classes: [UNKNOWN, GENERIC]
    description: 无法可靠分类时的安全兜底Profile；允许能力缺失降级，但缺失必须显式标记UNAVAILABLE/PARTIAL。arm_barrier 采用真机语义（min=0/不要求推进）：arm 就绪 = 捕获设施就绪，真实媒体流量在 FXS 事件触发呼叫后才会出现。
    primary_start_anchor: FXS_OFFHOOK
    end_policy: EVIDENCE_SUFFICIENCY
    max_calls: 5
    target_count: 1
    allow_partial_capability_downgrade: true
    arm_barrier:
      min_pcap_packets: 0
      min_pcm_packets: 0
      require_advancing: false
    stages:
      - stage: BASE
        auto_arm_actions: [CAPTURE_PRE_SNAPSHOT, START_VOICE_PCAP, START_PCM_RX, START_PCM_TX, ENABLE_BASIC_VOIP_DEBUG]
        required_channels: [PCAP, PCM_RX, PCM_TX, DEBUG]
        live_analyzers: [SIP_CALL_LIVE, RTP_BASIC_LIVE, PCM_STREAM_HEALTH, DTMF_EVENT_LIVE]
        quick_analyzers: [SIP_CALL_FULL, RTP_RFC3550_FULL, AUDIO_GENERIC_FULL, DTMF_PATH_FULL]
      - stage: ENHANCED
        auto_arm_actions: [CAPTURE_PRE_SNAPSHOT, START_VOICE_PCAP, START_PCM_RX, START_PCM_TX, ENABLE_BASIC_VOIP_DEBUG, ENABLE_DTMF_DEBUG, ENABLE_DSP_DEBUG]
        required_channels: [PCAP, PCM_RX, PCM_TX, DEBUG]
        live_analyzers: [SIP_CALL_LIVE, RTP_BASIC_LIVE, PCM_STREAM_HEALTH, DTMF_EVENT_LIVE]
        quick_analyzers: [SIP_CALL_FULL, RTP_RFC3550_FULL, AUDIO_GENERIC_FULL, DTMF_PATH_FULL]
    cleanup_actions: [STOP_PCM_RX, STOP_PCM_TX, DISABLE_DSP_DEBUG, DISABLE_DTMF_DEBUG, DISABLE_BASIC_VOIP_DEBUG, CAPTURE_POST_SNAPSHOT, STOP_VOICE_PCAP]
    sufficiency:
      question_key: GENERIC_SYMPTOM_CLASSIFICATION
      require_target_match: false
      must_channels: [PCAP]
      should_findings: [CALL_CLASSIFICATION]
