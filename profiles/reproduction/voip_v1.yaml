profiles:
  - id: REGISTER_FAILURE
    name: SIP注册失败自动复现
    version: "1.0.0"
    status: ACTIVE
    symptom_classes: [REGISTER_FAILURE, SIP_REGISTER_FAILURE]
    description: 注册类故障，不要求真实通话，优先捕获REGISTER发送与响应。
    primary_start_anchor: SIP_REGISTER_TX
    call_binding_event: SIP_REGISTER_TX
    media_binding_event: RTP_STREAM_START
    primary_end_anchor: SIP_REGISTER_TERMINAL
    secondary_end_anchor: REGISTER_TIMEOUT
    fallback_end_anchor: SESSION_WINDOW
    end_policy: EVIDENCE_SUFFICIENCY
    max_calls: 1
    target_count: 1
    stages:
      - stage: BASE
        auto_arm_actions: [CAPTURE_PRE_SNAPSHOT, START_VOICE_PCAP, ENABLE_BASIC_VOIP_DEBUG, ENABLE_SIP_PACKET_LOG]
        required_channels: [PCAP, DEBUG]
        live_analyzers: [SIP_REGISTER_LIVE]
        quick_analyzers: [SIP_REGISTER_FULL]
    cleanup_actions: [DISABLE_SIP_PACKET_LOG, DISABLE_BASIC_VOIP_DEBUG, CAPTURE_POST_SNAPSHOT, STOP_VOICE_PCAP]
    sufficiency:
      question_key: REGISTER_PATH_FAILURE_DOMAIN
      require_target_match: true
      must_channels: [PCAP, DEBUG]
      must_findings: [REGISTER_ATTEMPT]
    retry: {max_sessions: 2, interval_seconds: 30, retryable_reasons: [WATCH_TIMEOUT, TRANSIENT_DEVICE_LOST]}

