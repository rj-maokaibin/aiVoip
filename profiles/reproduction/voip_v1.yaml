    cleanup_actions: [STOP_PCM_RX, STOP_PCM_TX, DISABLE_SIP_PACKET_LOG, DISABLE_BASIC_VOIP_DEBUG, CAPTURE_POST_SNAPSHOT, STOP_VOICE_PCAP]
    sufficiency:
