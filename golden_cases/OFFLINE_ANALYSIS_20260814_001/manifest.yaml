notes:
  - 原始 SIP 协议层存在 2 个 Call-ID：DUT→PBX 主腿和 PBX→被叫的 B2BUA 内部腿。Golden 不删除第二条腿；raw_sip_leg_count 必须为 2。
  - 当前诊断对象只有 1 个 DUT-facing Call。PCM 40000/50000 的 UDP source IP 为 192.168.150.4，系统应使用这一原始 provenance 选择包含该设备 SDP/RTP endpoint 的主腿，而不是按“结束时间最新”选择 PBX 内部腿。
  - PCM DTMF 601 只能与选中的 DUT-facing SIP leg 形成 1 条 DTMF_SIP_DIAL_MATCH；同一 DTMF 不得复制到 PBX B2BUA 内部腿。
  - PCM 原始 UDP 人工复核为 40000/50000 各 6525 包，每包 payload 160 bytes；按已知 Profile 为 8kHz/16-bit little-endian，每包对应 10ms 音频。
  - RTP packet_count 口径已显式冻结：有效媒体包按唯一 RTP Sequence 计数；抓包观察 Datagram 单独记录 observed_packet_count；重复 Datagram 记录 duplicate_packets。下行观察 2427 包，其中唯一 Sequence 2425、重复 2、丢失 0；不得把 2427 写成 2427 个有效媒体包，也不得把 2 个重复包写成 Packet Loss。
  - 下行两个 duplicate 已做 Frame/Seq 级复核：Seq 14555 为 Frame 20413→20414，RTP timestamp 492033328；Seq 14556 为 Frame 20416→20417，RTP timestamp 492033488。两组均为相同 Sequence + 相同 RTP timestamp 的快速重复 Datagram。
  - 两个主上行 HIGH_DELTA 的边界 Frame/Seq 已人工复核：20272/46511→20285/46512，以及 20329/46519→20344/46520；Sequence 连续，因此不能写成 Packet Loss。high_delta_ms 是算法容差范围，high_delta_events 保存人工复核的精确 Frame/Seq Ground Truth。
  - 两次主上行 HIGH_DELTA 后均可见快速到包/补偿性 burst；Golden 只要求存在 catch-up 证据，不冻结具体 recovery ratio，避免把实现算法数值当成人工 Ground Truth。
  - HIGH_DELTA 表示到包/发送节奏间隔异常，不等同于 RTP Sequence Loss；Report 必须将 DUT 主上行 2 次事件聚合为同一 Stream Finding，并保留逐事件 Frame/Seq 下钻。
  - PR5 的 Evidence Card Golden 只检查生产 Analyzer 实际生成的 Artifact 是否按生产绑定语义落到正确 Finding，不把 manifest 的 expected 值注入生产分析链；Focused PNG 的 Renderer 语义由独立软件 Gate 校验。
  - DTMF 起始沿附近的 Click/Pop 候选必须被 Negative Control 拦截，不得作为独立爆音故障升级。
  - PCM_TX 静音只有在对应 RTP 同窗明确活跃时才允许升级为 CROSS_LAYER_SILENCE_MISMATCH；同窗 RTP 静音/低能量必须 Reject，证据不足必须 Inconclusive。
  - 周期干扰只能收敛到“本地上行采集路径已可观察”，不能越级确认电源/接地/电话机/FXS-SLIC 等物理根因。
